r, and helping more rain soak into the ground.","Groundwater may be invisible, but the story of Mexico City proves that what happens beneath our feet can shape everything above it."]]},"b":{"title":"Every Drop Counts: Why Our School Should Save Water","genre":"Opinion essay","gloss":{"convenient":["easy to use or do","conveniente / práctico"],"conserve":["to use carefully so it does not run out","conservar / ahorrar"],"fixture":["a sink, toilet, or faucet that is attached to a building","accesorio (de plomería)"],"reminders":["things that help you remember to do something","recordatorios"],"effortless":["very easy, needing no hard work","sin esfuerzo"],"habits":["things you do so often that you do them without thinking","hábitos"]},"paras":[["Every morning, I turn a handle and clean water pours out, as if by magic.","Because it is so convenient, most of us never stop to think about where that water comes from or how much of it we waste.","I believe that every family and every school, including ours, should make a real effort to conserve water."],["First, small leaks add up to enormous waste.","According to the U.S. Environmental Protection Agency, a faucet that drips just once per second can waste more than 3,000 gallons of water in a year.","That is enough to fill about forty bathtubs, all from a drip that is easy to ignore.","Our school has dozens of sinks, so even a few leaky ones could be wasting thousands of gallons.","Reporting a dripping fixture to the custodian takes about one minute, and it could save more water than any of us uses in a month."],["Second, simple habits make a big difference.","Turning off the tap while brushing your teeth can save up to eight gallons of water a day.","Taking a shorter shower, running the dishwasher only when it is full, and watering plants in the cool early morning all help, too.","None of these steps costs any money, and after a few weeks they become almost effortless."],["Finally, the water in our pipes is not unlimited, even in places with plenty of rain.","Cities like Mexico City have pumped so much water from underground that the ground itself is sinking.","We may not live there, but every community depends on water supplies that can run low if people are careless.","Learning to save water now prepares us to protect it for the future."],["Some people argue that one student’s actions are too small to matter.","It is true that a single person cannot solve a water shortage alone.","However, a school is not one person; it is hundreds of people making the same small choices every day.","If each of us saved even a few gallons, our school would save thousands of gallons every week."],["That is why I propose that our class put up reminders by every sink, report leaks right away, and keep a chart of how much water we save.","Water may seem as easy as turning a handle, but it is one of the most precious resources we have.","Let’s treat every drop like it counts, because it does."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"What is the central idea of Text 1?","o":["Pumping too much water from the aquifer under Mexico City has made the land sink and caused serious problems.","Mexico City was built on top of an ancient lake that the Aztecs used for farming, fishing, and travel by canoe.","About 30 percent of the fresh water on Earth is stored underground in soil, sand, gravel, and cracks in rock.","Satellites built by the United States and India are the best tools for measuring how cities change over time."],"k":0,"why":"Most of the text (paragraphs 3–8) explains how pumping groundwater makes Mexico City sink and what damage that causes. The other choices are smaller details or ideas the text does not focus on."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 5, what directly causes the land in Mexico City to sink?","o":["Clay layers squeeze together when water is pumped out of them.","Heavy rains wash away the soil that holds up the buildings.","Earthquakes shake the ground and crack the city’s streets and roads.","The weight of new buildings pushes the land into the lake."],"k":0,"why":"Paragraph 5 explains that when water is pumped out, clay particles “squeeze closer together,” and “as the clay layers compress, the land on top of them sinks.”","ev":["a5.1","a5.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the author says most of the damage is <b>irreversible</b>. The prefix <i>ir-</i> means “not,” and the suffix <i>-ible</i> means “able to be.” What does <b>irreversible</b> mean?","o":["not able to be undone","able to be repaired","not easy to notice","able to happen again later"],"k":0,"why":"Ir- (not) + reverse (turn back) + -ible (able to be) means “not able to be turned back.” Paragraph 5 says the clay “does not spring back,” so the damage cannot be undone."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer from the information about the Angel of Independence in paragraph 7?","o":["The ground around the monument has sunk a great deal since it was built.","Workers raised the monument so that more visitors could see it from far away.","The monument is sinking faster than any other building in the city.","The city added steps because the monument was in danger of falling over."],"k":0,"why":"Paragraph 7 says the street around the monument sank and workers had to add 14 steps so people could reach its base. The steps were needed because the land dropped, not to make the monument taller or safer.","ev":["a7.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 8, which TWO ways does the sinking make Mexico City’s water problems worse? Choose TWO answers.","o":["Cracked pipes leak clean water before it reaches homes.","Low areas flood more easily during heavy rainstorms.","Satellites cannot measure water levels in sinking areas.","The clay underground turns into solid rock over time.","Monuments must be raised with steps every few years."],"ks":[0,1],"why":"Paragraph 8 says cracked pipes leak and low spots flood more easily. The steps on the monument are in paragraph 7, and the text does not say clay turns into rock."},{"on":"a","t":"mc","skill":"text structure","q":"How do paragraphs 1 and 2 help prepare the reader for the rest of Text 1?","o":["They explain what groundwater and aquifers are before the text describes Mexico City’s problem.","They tell the history of Mexico City before explaining how the Aztecs built Tenochtitlan.","They describe the solutions to sinking before explaining what causes the problem.","They compare Mexico City with California and Jakarta before focusing on one city."],"k":0,"why":"Paragraphs 1 and 2 define groundwater, aquifers, and recharge. Readers need these ideas to understand why pumping makes the ground sink in paragraphs 3–8."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 2: “Aquifers <b>recharge</b> when rain and melting snow soak down through the soil and slowly refill the spaces below.” What does <b>recharge</b> mean?","o":["fill up again","dry out quickly","move to a new place","become dirty"],"k":0,"why":"The prefix re- means “again.” The same sentence says rain and snow “slowly refill the spaces below,” which shows the aquifer is filling up again."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: What is the author’s main purpose in paragraph 9?","o":["to show that the problem is found in many places and can be reduced","to argue that Mexico City should stop using its groundwater completely","to explain why California is sinking faster than Mexico City","to describe how Jakarta solved its problem with sinking land"],"k":0,"why":"Paragraph 9 names other places with sinking land and lists “helpful steps” scientists suggest. It never says to stop using groundwater completely or that any place has solved it.","ev":["a9.1","a9.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"word choice","q":"In paragraph 8, the author begins with the word “<b>Ironically</b>.” Why does the author use this word?","o":["to point out that the sinking makes a water problem worse, even though pumping water caused it","to show that the author thinks the people of Mexico City are being silly","to explain that the city’s pipes are made out of iron instead of plastic","to suggest that the flooding problem will be easy for engineers to solve"],"k":0,"why":"Something is ironic when the result is the opposite of what you would expect. The city pumped water to have more of it, but the sinking that followed causes leaks and wasted water, as paragraph 8 explains."},{"on":"b","t":"mc","skill":"main idea","q":"What is the author’s main claim in Text 2?","o":["Families and schools should make a real effort to save water.","The EPA should fix every leaky faucet in the United States.","Mexico City should stop pumping water from underground.","Students should take baths instead of long showers."],"k":0,"why":"The author states the claim at the end of paragraph 1: “every family and every school, including ours, should make a real effort to conserve water.” The rest of the essay gives reasons."},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the author respond to people who think one student’s actions are too small to matter?","o":["The author agrees one person cannot solve it alone but says many small actions add up.","The author says those people are wrong because one student can solve a water shortage.","The author admits that saving water at school is not worth the time it takes.","The author suggests that only adults can make a difference in saving water."],"k":0,"why":"In paragraph 5, the author admits “a single person cannot solve a water shortage alone,” but then explains that hundreds of students making the same choices would save thousands of gallons.","ev":["b5.3","b5.4"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 1, the author says water pours out “<b>as if by magic</b>.” What does this phrase suggest?","o":["People take water for granted because it seems to appear so easily.","Water in the pipes is created by a special machine hidden at the school.","Clean water is a mystery that scientists still do not understand.","The author believes that water will never run out in the future."],"k":0,"why":"The next sentence says that because water is “so convenient,” most people “never stop to think” about it. The phrase shows how easy getting water seems."},{"on":"b","t":"mc","skill":"author's purpose","q":"Why does the author include the fact from the Environmental Protection Agency in paragraph 2?","o":["to support the reason that small leaks waste a large amount of water","to prove that the school has more leaky sinks than other nearby schools","to explain how the government fixes faucets in public buildings","to show that the author once worked for a government agency"],"k":0,"why":"Paragraph 2 begins, “small leaks add up to enormous waste.” The EPA fact about 3,000 gallons a year is evidence that backs up that reason."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the purpose of Text 2 differ from the purpose of Text 1?","o":["Text 2 tries to persuade readers to act, while Text 1 mainly explains a problem.","Text 2 explains how aquifers form, while Text 1 tells readers how to save water.","Text 2 tells a story about a family, while Text 1 gives an opinion about a city.","Text 2 describes satellite studies, while Text 1 describes habits at a school."],"k":0,"why":"Text 1 is informational and explains why Mexico City sinks. Text 2 is an opinion essay that ends with a call to action: “Let’s treat every drop like it counts.”"},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: How does the author of Text 2 use the same example that Text 1 explains in detail?","o":["to show that water supplies can run low when people use too much","to prove that the author’s school is sinking into the ground","to explain how clay layers squeeze together under the city","to describe how satellites measure sinking from space"],"k":0,"why":"Text 1 explains Mexico City’s sinking in detail. Text 2, paragraph 4, mentions it briefly as proof that water “is not unlimited” and can run low if people are careless.","ev":["b4.2","b4.3"],"evq":"Part B: Click the sentence from either text that best supports your answer to Part A."}],"write":{"prompt":"Text 1 explains a problem with groundwater, and Text 2 argues for saving water. Explain how the information in Text 1 supports the author’s claim in Text 2. Use at least one detail from each text in your answer.","model":"The information in Text 1 gives strong support to the claim in Text 2 that people should save water. In Text 2, the author says “the water in our pipes is not unlimited” and asks everyone to make small changes, like turning off the tap while brushing. Text 1 shows what happens when people use more water than nature can replace. In Mexico City, so much groundwater has been pumped that parts of the city are sinking up to about 40 to 50 centimeters a year, and cracked pipes now waste even more water. This proves that water is precious and that using too much can cause damage that cannot be undone. Together, the texts show why every drop really does count.","need":["States how Text 1 supports the claim in Text 2","Uses a fact from Text 1 about Mexico City or aquifers","Uses a detail or reason from the opinion essay","Explains the connection between the two details"]}},{"id":"s09-wegener","theme":"Moving Continents","a":{"title":"Alfred Wegener and the Wandering Continents","genre":"Biography","topic":"History of Science","gloss":{"meteorologist":["a scientist who studies weather and the air","meteorólogo"],"supercontinent":["one giant landmass made of all the continents joined together","supercontinente"],"fossils":["the remains or prints of living things from long ago, preserved in rock","fósiles"],"skeptical":["doubting that something is true","escéptico"],"mechanism":["the way something works or the force that makes it happen","mecanismo"],"persistent":["continuing to try even when it is hard","persistente / constante"],"convection":["the movement of heated material rising and cooler material sinking in a circle","convección"]},"paras":[["Look at a map of the world, and you might notice something curious.","The eastern bulge of South America looks as though it could slide neatly into the curve of western Africa, like two pieces of a jigsaw puzzle.","Many people had noticed this before, but one German scientist, Alfred Wegener, decided that the fit was not an accident.","His bold idea would be laughed at for decades before it changed the way we understand our planet."],["Alfred Wegener was born in Berlin, Germany, on November 1, 1880.","He was trained as a meteorologist, a scientist who studies weather and the atmosphere, and he loved adventure as much as research.","In 1906, he and his brother Kurt floated in a balloon for more than 52 hours, setting a world record at the time.","That same year, he joined his first expedition to Greenland, where he studied the frozen air and ice of the far north."],["On January 6, 1912, Wegener stood before a group of scientists in Frankfurt and presented a startling idea.","The continents, he said, had not always been where they are now.","Long ago, they had been joined together, and over millions of years they had slowly drifted apart.","He described his idea in detail in a book published in 1915, The Origin of Continents and Oceans.","In later editions, he gave the ancient supercontinent the name Pangaea, from Greek words meaning “all lands.”"],["Wegener knew that a matching coastline alone would not convince anyone, so he gathered other kinds of evidence.","He pointed out that fossils of the same plants and animals had been found on continents now separated by wide oceans.","For example, fossils of Mesosaurus, a small reptile that lived in fresh water, appear in both South America and southern Africa.","Such a creature could not possibly have swum across thousands of kilometers of salty ocean.","Fossils of a seed fern called Glossopteris have been found in South America, Africa, India, Australia, and even Antarctica."],["The rocks told a similar story.","When Wegener fit the continents together on paper, mountain ranges and layers of coal lined up across the gaps, as if a torn newspaper had been placed back together so that the lines of print matched.","He also found signs that ancient glaciers had once covered parts of Africa and India, places that are now far too warm for sheets of ice.","To Wegener, the explanation was clear: these lands had once been connected, and they had once been located in very different places on the globe."],["Most geologists, however, were deeply skeptical.","Some dismissed Wegener as an outsider because he was a weather scientist, not a geologist.","Their biggest objection was that he could not explain what force could push something as enormous as a continent across the Earth.","Wegener suggested that Earth’s spin or tide-like forces might be responsible, but other scientists showed that these forces were far too weak.","Without a believable mechanism, many experts treated continental drift as little more than a fantasy."],["Wegener remained persistent, revising his book several times and continuing his research.","In 1930, he led an expedition across the Greenland ice sheet to bring supplies to scientists at a research station far inland.","On the return journey in November, in bitter cold, he died at the age of 50.","His body was not found until the following May, and at that time his theory was still widely rejected."],["Decades later, new technology began to prove him right.","In the 1950s and 1960s, scientists mapped the ocean floor and discovered long underwater mountain chains where new crust is constantly forming.","The rock of the seafloor is youngest near these ridges and older the farther away it is, which shows that the seafloor is slowly spreading apart.","These discoveries led to the theory of plate tectonics, which states that Earth’s outer shell is broken into giant plates that carry both continents and oceans.","Many scientists think slow convection, the rising and sinking of hot rock deep inside the Earth, helps move the plates."],["Today, plate tectonics is one of the most important ideas in Earth science, helping explain earthquakes, volcanoes, and the formation of mountains.","Alfred Wegener did not have every answer, but he asked the right question and supported it with careful evidence.","His story shows that a new idea can be right even when most experts reject it, and that science moves forward when people keep looking for proof."]]},"b":{"title":"Big Olaf and the Great Continental Stretch","genre":"Tall tale","gloss":{"colossal":["extremely large","colosal / enorme"],"glacier":["a huge, slow-moving river of ice","glaciar"],"hollered":["shouted loudly","gritó"],"crumpled":["crushed and bent into folds","se arrugó"],"ruckus":["a noisy, wild disturbance","alboroto / escándalo"]},"paras":[["Back when the whole world was just one lumpy continent, there lived a giant named Big Olaf.","Olaf was so tall that he combed his beard with a pine forest and used a glacier as an ice pack for his sore knees.","When he sneezed, it rained for a month in places that had never even seen a cloud."],["The trouble was that Olaf had nowhere to stretch.","Every time he lay down for a nap, his feet stuck out over one ocean and his head hung over the other.","One morning he woke with a terrible crick in his neck and hollered so loudly that every volcano on Earth popped its top in surprise."],["“This world is far too crowded,” Olaf grumbled.","“I need some elbow room!”"],["So he planted one colossal boot on the eastern half of the land and the other on the western half.","Then he grabbed the edges with both hands, took a breath so deep it gave the sky hiccups, and pulled.","The ground groaned.","The rocks squeaked like a rusty gate.","Slowly, slowly, the land began to tear right down the middle, leaving a jagged, zigzag edge."],["Ocean water came rushing into the gap, and Olaf had to hop from side to side to keep his socks dry.","A family of little freshwater reptiles was swimming happily in a pond when the split went right underneath them.","Half the family ended up on one side and half on the other, waving goodbye across the new sea.","Their great-great-great-grandchildren still argue about which side got the better beaches."],["Olaf was so pleased with the first rip that he kept going.","He tugged a chunk loose and sent it spinning south until it froze solid at the bottom of the world.","He nudged another piece, and it scooted north and bumped into its neighbor so hard that the ground crumpled up into the tallest mountains anyone had ever seen.","By lunchtime, the world had plenty of continents and more coastline than anyone could count."],["Now, scientists will tell you that continents move only a few centimeters each year, about as fast as your fingernails grow.","That is because Big Olaf finally got tired and fell asleep, and the pieces have been drifting along on their own ever since.","But if you ever look at a map and notice how South America and Africa still fit together like puzzle pieces, you will know exactly who made the ruckus.","And if the ground ever trembles a little beneath your feet, don’t worry.","That is just Big Olaf rolling over in his sleep, still looking for a comfortable spot."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Wegener used evidence to argue that the continents move, and although he was rejected, later discoveries proved his idea.","Wegener was a meteorologist who set a world record by floating in a gas balloon with his brother for more than 52 hours.","Scientists in the 1950s and 1960s mapped the ocean floor and found underwater mountains where new crust is forming.","Wegener died in Greenland because he was trying to prove that the continents were once joined in a supercontinent."],"k":0,"why":"The text follows Wegener’s idea from his evidence (paragraphs 3–5), to its rejection (paragraph 6), to later proof (paragraph 8). The balloon and seafloor details are true but too narrow, and his trip to Greenland was not to prove drift."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO pieces of evidence did Wegener use to support his idea of continental drift? Choose TWO answers.","o":["Fossils of the same freshwater reptile are found in South America and Africa.","Mountain ranges and coal layers line up when the continents are fit together.","Rock on the seafloor is youngest near underwater mountain ridges.","Earth’s spin is strong enough to push continents across the planet.","Hot rock deep inside Earth rises and sinks in slow circles."],"ks":[0,1],"why":"Paragraphs 4 and 5 describe the Mesosaurus fossils and the matching mountains and coal. The seafloor and convection discoveries came after Wegener died (paragraph 8), and the idea about Earth’s spin was shown to be too weak (paragraph 6)."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Why does the author explain that Mesosaurus lived in fresh water?","o":["to show it could not have crossed an ocean, so the lands must have been joined","to show that reptiles long ago preferred to live in lakes and ponds instead of oceans","to explain why its fossils are only found in a few small places today","to prove that the oceans were made of fresh water millions of years ago"],"k":0,"why":"Paragraph 4 says such a creature “could not possibly have swum across thousands of kilometers of salty ocean.” If it could not swim across, the two continents must once have been connected.","ev":["a4.4","a4.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 3, Wegener names the ancient <b>supercontinent</b> Pangaea. The prefix <i>super-</i> means “above” or “beyond.” What does <b>supercontinent</b> mean?","o":["a landmass much bigger than a normal continent","a continent that is hidden deep under the ocean floor","a continent that is the oldest on Earth","a continent that has many tall mountains"],"k":0,"why":"Super- means “beyond,” so a supercontinent goes beyond the size of a normal continent. Paragraph 3 explains that it was made of all the continents joined together, which is why it was called “all lands.”"},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 6: “Most geologists, however, were deeply <b>skeptical</b>.” What does <b>skeptical</b> mean?","o":["doubtful that something is true","excited and happy about a new discovery","confused by a difficult word","angry at a person who is rude"],"k":0,"why":"The rest of paragraph 6 explains that geologists dismissed his idea and treated it as “little more than a fantasy.” They doubted it was true."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 6, what was the main reason scientists rejected Wegener’s idea?","o":["He could not explain what force was strong enough to move continents.","He could not find even one fossil that matched on different continents.","He refused to share his evidence with geologists in other countries.","He made mistakes when fitting the coastlines together on his maps."],"k":0,"why":"Paragraph 6 says “their biggest objection” was that he could not explain the force, and that the forces he suggested “were far too weak.” He did find matching fossils (paragraph 4).","ev":["a6.3","a6.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 8 relate to paragraph 6?","o":["Paragraph 8 describes discoveries that answered the problem raised in paragraph 6.","Paragraph 8 gives more examples of the fossils described in paragraph 6.","Paragraph 8 explains why the geologists in paragraph 6 were correct.","Paragraph 8 tells what happened to Wegener in Greenland after the events of paragraph 6."],"k":0,"why":"Paragraph 6 explains that no one could find a force to move continents. Paragraph 8 describes seafloor spreading and plate tectonics, which helped explain how they move."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: What is the author’s main purpose in the last paragraph of Text 1?","o":["to share a lesson about how science moves forward","to describe how Wegener’s body was found in Greenland","to argue that geologists today still doubt plate tectonics","to explain how earthquakes and volcanoes are measured"],"k":0,"why":"Paragraph 9 ends with a lesson: a new idea can be right “even when most experts reject it,” and science moves forward when people keep looking for proof.","ev":["a9.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"word choice","q":"In paragraph 5, the author compares the lined-up mountains and coal to “a torn newspaper” placed back together. What does this comparison help the reader understand?","o":["The details matched across the gap so well that the pieces seemed to belong together.","The rocks Wegener studied were thin and easy to rip apart, like old paper.","Wegener first read about his discoveries in a German newspaper before he wrote his book.","The continents broke apart quickly and violently, the way paper tears."],"k":0,"why":"When torn paper is put back together, the lines of print match up. Paragraph 5 uses this to show that mountains and coal layers matched across the continents, proving they once fit together."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best describes the central idea of Text 2?","o":["A giant’s wild stretch is a funny, made-up way to explain why the continents look as they do.","Scientists finally proved that continents move about as fast as fingernails grow.","Freshwater reptiles were separated forever when an ocean formed between them.","Giants once lived on Earth and caused the volcanoes and earthquakes we have today."],"k":0,"why":"Text 2 is a tall tale: the whole story uses a giant’s exaggerated pulling to explain the shapes of the continents, and paragraph 7 ties it back to the puzzle-piece fit of South America and Africa. The reptiles and fingernail details are small parts, and the story is not meant to be believed."},{"on":"b","t":"ebsr","skill":"word choice","q":"Part A: How does the author mainly create humor in Text 2?","o":["by using huge exaggerations about Olaf’s size and strength","by describing real scientific measurements in great detail","by having Olaf speak in a serious, scientific way","by showing Olaf making careful plans before acting"],"k":0,"why":"Tall tales are funny because they stretch the truth. Paragraph 1 says Olaf combed his beard with a pine forest and that his sneezes caused month-long rains.","ev":["b1.2","b1.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 4, the author writes that “the rocks <b>squeaked like a rusty gate</b>.” What does this description suggest?","o":["The land was stiff and hard to pull apart.","The rocks were made of old, rusty metal.","Olaf was frightened by the strange noise.","The ground split apart quickly and easily."],"k":0,"why":"A rusty gate squeaks because it is stiff and hard to move. The same paragraph says the ground “groaned” and tore “slowly, slowly,” which shows it was hard work."},{"on":"b","t":"mc","skill":"character","q":"What causes Big Olaf to pull the land apart?","o":["He is uncomfortable because the world is too crowded for him to stretch out.","He wants to give the freshwater reptiles a bigger place to swim.","He is angry because the volcanoes woke him up from his nap.","He hopes to create mountains so he can climb to the sky."],"k":0,"why":"Paragraphs 2 and 3 say Olaf “had nowhere to stretch,” woke with a crick in his neck, and complained, “I need some elbow room!” The reptiles and mountains are results, not reasons."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which piece of evidence from Text 1 does the author of Text 2 turn into a joke?","o":["Fossils of a freshwater reptile appear on two continents now separated by an ocean.","Rocks on the seafloor are youngest near underwater mountain ridges.","Wegener’s balloon flight lasted more than 52 hours.","Signs of ancient glaciers are found in places that are warm today."],"k":0,"why":"Text 1, paragraph 4, describes Mesosaurus fossils found in both South America and Africa. Text 2, paragraph 5, jokes that a family of freshwater reptiles was split in half and waved goodbye across the new sea.","ev":["b5.2","b5.3","a4.3"],"evq":"Part B: Click the sentence from either text that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the explanation for moving continents in Text 2 different from the explanation in Text 1?","o":["Text 2 credits a giant’s pulling, while Text 1 describes evidence and slow natural forces.","Text 2 says continents move quickly today, while Text 1 says they do not move at all.","Text 2 uses fossils as proof, while Text 1 uses only the shapes of coastlines.","Text 2 agrees with the geologists who doubted Wegener, while Text 1 disagrees."],"k":0,"why":"Text 1 explains real evidence and plate tectonics. Text 2 jokes that Big Olaf tore the land apart, though it admits the pieces now drift only a few centimeters a year."}],"write":{"prompt":"Text 1 is a biography and Text 2 is a tall tale, but both describe how the continents came to be where they are. Explain how each text helps the reader understand that the continents were once joined. Use at least one detail from each text in your answer.","model":"Both texts show that the continents were once joined, but they do it in very different ways. Text 1 uses real evidence. For example, it explains that fossils of Mesosaurus, a freshwater reptile, are found in both South America and Africa, even though it “could not possibly have swum” across an ocean. Text 2 uses humor instead. Big Olaf tears the land “right down the middle,” and a family of reptiles ends up split between two sides of a new sea. This silly scene helps readers remember the same fossil clue that Wegener used. Together, the biography gives the facts and the tall tale makes the idea fun and easy to picture.","need":["States a claim about how both texts show the continents were joined","Uses evidence from Text 1, such as fossils or matching rocks","Uses a detail from the tall tale","Explains how each text helps the reader in its own way"]}},{"id":"s10-eclipse","theme":"When the Sun Goes Dark","a":{"title":"Four Minutes in the Moon’s Shadow","genre":"Informational","topic":"Earth and Space Science","gloss":{"totality":["the time during a total eclipse when the Moon completely covers the Sun","totalidad"],"alignment":["a lining up of objects in a straight row","alineación"],"corona":["the thin, glowing outer layer of the Sun’s atmosphere","corona solar"],"visible":["able to be seen","visible"],"partial":["not complete; only part of something","parcial"],"retina":["the thin layer at the back of the eye that senses light","retina"],"coincidence":["two things happening or matching by chance","coincidencia"]},"paras":[["Shortly after eleven o’clock on the morning of April 8, 2024, crowds on the beaches of Mazatlán, Mexico, watched something extraordinary happen.","The bright sky above the Pacific Ocean dimmed to a deep blue, the air grew cooler, and the Sun seemed to vanish, leaving a black circle surrounded by a pale, glowing halo.","Mazatlán was the first city on the North American mainland to experience a total solar eclipse that day.","In less than two hours, the Moon’s shadow would race across Mexico, the United States, and Canada, giving millions of people a view they would never forget."],["A solar eclipse happens when the Moon passes directly between the Sun and Earth.","The Moon does not make its own light, so when it blocks the Sun, it casts a shadow onto Earth’s surface.","Most months, the Moon passes a little above or below the Sun from our point of view, because its path is slightly tilted.","Only when the three bodies line up almost perfectly does an eclipse occur, and this exact alignment is fairly rare for any single place on Earth."],["Total eclipses are possible because of a remarkable coincidence.","The Sun is about 400 times wider than the Moon, but it is also about 400 times farther away.","As a result, the two appear almost exactly the same size in our sky, so the Moon can cover the Sun’s bright face completely.","If the Moon were a little smaller or farther away, total eclipses would never happen at all."],["The darkest part of the Moon’s shadow is quite small.","On April 8, 2024, this inner shadow traced a path more than 160 kilometers wide, called the path of totality.","Only people inside that narrow band saw a total eclipse, while people outside it saw a partial eclipse, in which the Moon covers just part of the Sun.","After crossing Mexico, the path entered the United States in Texas, curved northeast through more than a dozen states, and left the continent over eastern Canada."],["The length of totality depended on where people stood.","Viewers in Mazatlán enjoyed a little more than four minutes of darkness, and the longest totality, almost four and a half minutes, happened near the city of Torreón in northern Mexico.","Locations near the edges of the path had much shorter views.","As a result, many families traveled long distances to reach the center line, where the show lasted longest."],["During totality, the sky changes in surprising ways.","The corona, the Sun’s thin outer atmosphere, becomes visible as pale, wispy streamers stretching into space.","Bright planets such as Venus and Jupiter can appear, the temperature can drop several degrees, and birds sometimes go quiet as if night has fallen.","Just before and after totality, a single bright point of sunlight may shine at the edge of the Moon, creating an effect called the diamond ring."],["Watching an eclipse safely is extremely important.","Looking directly at the Sun, even when most of it is covered, can permanently damage the retina at the back of the eye, and this injury usually causes no pain to warn you.","Ordinary sunglasses are not nearly dark enough.","Instead, viewers must use special eclipse glasses that meet an international safety standard, or make a simple pinhole projector that shines an image of the Sun onto paper."],["There is only one exception to this rule.","During totality, when the Moon completely covers the Sun’s bright face, it is safe to remove eclipse glasses and look at the corona with your eyes.","However, the moment the first bright sliver of the Sun reappears, viewers must put their glasses back on right away.","People watching from outside the path of totality never reach this moment, so they must keep their glasses on the entire time."],["Total solar eclipses happen somewhere on Earth roughly every year or two, but they often cross oceans or remote areas.","For any particular town, a total eclipse may not return for hundreds of years.","That is why the eclipse of 2024 drew so much attention: for a few minutes, millions of people stood together in the Moon’s shadow and saw the sky transformed."]]},"b":{"title":"The Day the Birds Went Quiet","genre":"Realistic fiction","gloss":{"flimsy":["thin and easily bent or broken","endeble / frágil"],"skeptical":["doubting that something will be as good as people say","escéptico"],"eerie":["strange in a way that is a little scary","inquietante / misterioso"],"shimmering":["shining with a soft, wavering light","resplandeciente"],"dimmer":["less bright","más tenue"],"squinting":["looking with the eyes partly closed","entrecerrando los ojos"]},"paras":[["When my tía said we were driving six hours to Mazatlán just to watch the sky, I thought she was joking.","I had seen the Sun every day of my eleven years, and I was skeptical that a few minutes of shadow could be worth missing a whole weekend of soccer.","But Tía Marisol teaches science, and she said, “Lucía, some things you have to see with your own eyes.”"],["By eleven in the morning, the beach was packed with people sitting on towels and folding chairs.","Tía handed me a pair of flimsy cardboard glasses with dark silver lenses.","“Never look at the Sun without these until I say so,” she warned, tapping the frames.","When I put them on, everything went completely black except for one small orange circle floating in the darkness.","A tiny bite was already missing from its edge, as if someone had taken a nibble out of a cookie."],["For a long time, not much seemed to happen.","The bite grew bigger, and the Sun turned into a thinner and thinner crescent.","I was starting to get bored when I noticed that the light around me looked wrong.","The waves still sparkled, but everything seemed dimmer and sharper at the same time, like an old photograph.","The breeze off the ocean turned cool, and I rubbed the goosebumps on my arms."],["Then the gulls that had been squawking all morning suddenly went silent.","The quiet was eerie, and I grabbed Tía’s hand without even meaning to.","Through my glasses, the last thread of sunlight shrank to a single bright bead."],["“Now!” Tía said. “Glasses off!”"],["I pulled them away and gasped.","Where the Sun had been, there was a perfect black hole in the sky, surrounded by a shimmering white glow that stretched out like silky hair.","The sky had turned a deep twilight blue, and near the horizon, the edges glowed orange as if the sunset had come from every direction at once.","A bright dot appeared nearby, and Tía whispered that it was Venus.","All along the beach, strangers were cheering, crying, and hugging one another."],["It felt like we were standing there for an hour, but it was only about four minutes.","Then a brilliant flash burst from one side of the black circle, and Tía called, “Glasses on!”","I slapped them back over my eyes, squinting, my heart still pounding."],["On the long drive home, I stared out the window at the ordinary afternoon Sun.","I realized that I had seen it every day of my life without ever really looking at it.","I already knew I would never think of the sky the same way again."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["A total solar eclipse happens when the Moon blocks the Sun, and watching one is amazing but requires careful eye safety.","The city of Mazatlán, Mexico, was the first place on the mainland to see the total solar eclipse on April 8, 2024.","The Sun is about 400 times wider than the Moon, but it is also about 400 times farther away from Earth.","People should travel to Torreón for every eclipse because that is where totality always lasts the longest."],"k":0,"why":"The text explains how eclipses happen (paragraphs 2–4), what totality looks like (paragraph 6), and how to watch safely (paragraphs 7–8). The Mazatlán and 400-times facts are true details, but they are too narrow."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 3, why can the Moon completely cover the Sun during a total eclipse?","o":["The Sun and Moon look almost the same size because of their sizes and distances.","The Moon is actually larger than the Sun but appears smaller because it is farther.","The Moon makes its own dark light that blocks the bright light of the Sun.","The Sun shrinks for a few minutes whenever the Moon passes in front of it."],"k":0,"why":"Paragraph 3 explains that the Sun is about 400 times wider but also 400 times farther away, so the two “appear almost exactly the same size.” The Moon is smaller, and it does not make its own light (paragraph 2).","ev":["a3.2","a3.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, the corona “becomes <b>visible</b>” during totality. The Latin root <i>vis</i> means “see.” What does <b>visible</b> mean?","o":["able to be seen","very hot and bright","hidden from view","moving very quickly"],"k":0,"why":"Vis means “see,” and the suffix -ible means “able to be,” so visible means “able to be seen.” Paragraph 6 explains that the corona can only be seen once the bright Sun is covered."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 4: “Only people inside that narrow band saw a total eclipse, while people outside it saw a <b>partial</b> eclipse, in which the Moon covers just part of the Sun.” What does <b>partial</b> mean?","o":["not complete","very long","extra bright","happening twice"],"k":0,"why":"The sentence explains that in a partial eclipse, the Moon covers “just part of the Sun.” Partial comes from the word “part,” so it means not complete."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 6, which TWO changes can people notice during totality? Choose TWO answers.","o":["Pale, wispy streamers of the corona appear around the Moon.","The air can become several degrees cooler.","The ocean waves grow much taller and louder.","The Moon glows bright orange and lights the ground.","The Sun’s bright face becomes safe to look at for hours."],"ks":[0,1],"why":"Paragraph 6 says the corona becomes visible as “pale, wispy streamers” and that the temperature can drop several degrees. Totality lasts only minutes, and the text never says the Moon glows."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 7, why is looking at a partly covered Sun especially dangerous?","o":["The eye can be badly hurt without any pain to warn the viewer.","The Moon’s shadow makes the Sun’s light much hotter than it usually is.","Sunglasses make the Sun appear brighter than it really is.","The partly covered Sun is too dim to see without a telescope."],"k":0,"why":"Paragraph 7 says looking at the Sun “can permanently damage the retina” and that “this injury usually causes no pain to warn you.” A person might not know they are being hurt.","ev":["a7.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 8 relate to paragraph 7?","o":["It explains the one exception to the safety rule given in paragraph 7.","It describes the history of eclipse glasses mentioned in paragraph 7.","It gives a different cause for the eye damage described in paragraph 7.","It tells a story about a person who ignored the rules in paragraph 7."],"k":0,"why":"Paragraph 7 gives the rule: always use eclipse glasses. Paragraph 8 begins, “There is only one exception to this rule,” and explains that it is safe to look only during totality."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author begin Text 1 by describing the crowds on the beach in Mazatlán?","o":["to grab the reader’s interest with a real moment before explaining the science","to persuade readers that Mazatlán is the best place in Mexico for a vacation","to prove that eclipses in Mexico always last longer than eclipses in other countries","to explain why the Moon’s path is slightly tilted compared to the Sun’s path"],"k":0,"why":"Paragraph 1 paints a vivid scene of the sky dimming and the Sun vanishing. Then paragraph 2 starts explaining how eclipses work. The opening hooks the reader.","ev":["a1.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"inference","q":"Based on paragraphs 5 and 9, why did many families travel long distances to see the 2024 eclipse?","o":["Totality was longest near the center line and might not return to their towns for centuries.","Eclipse glasses could only be bought in the cities along the center of the path.","The eclipse could only be seen safely from beaches along the Pacific Ocean.","Total eclipses happen every year, so families travel to a new place each time."],"k":0,"why":"Paragraph 5 says the show “lasted longest” near the center line, and paragraph 9 says a total eclipse “may not return for hundreds of years” to a particular town."},{"on":"b","t":"mc","skill":"theme","q":"Which theme is best developed in Text 2?","o":["Experiencing something wonderful firsthand can change how we see ordinary things.","Children should always do what adults say, even if it seems boring.","It is more important to play sports than to learn about science.","Large crowds of strangers can make any event more stressful."],"k":0,"why":"At first Lucía is skeptical, but in the last paragraph she realizes she had never “really looked” at the Sun and “would never think of the sky the same way again.”"},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Lucía’s attitude toward the eclipse change during the story?","o":["She goes from doubting the trip is worth it to feeling amazed.","She goes from feeling excited to feeling let down and disappointed.","She goes from feeling scared to feeling bored and sleepy.","She goes from feeling amazed to feeling angry at her tía."],"k":0,"why":"In paragraph 1, Lucía is “skeptical” and would rather play soccer. By paragraph 6, she gasps at the sight, and in paragraph 8 she says she will never see the sky the same way.","ev":["b1.2","b8.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 4, Lucía says, “The quiet was <b>eerie</b>.” What does the word <b>eerie</b> suggest about the moment?","o":["It felt strange and a little frightening.","It felt calm, cozy, peaceful, and relaxing.","It felt funny and made her laugh.","It felt dull and made her sleepy."],"k":0,"why":"Eerie means strange in a slightly scary way. Right after, Lucía grabs Tía’s hand “without even meaning to,” which shows she felt uneasy."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 6, the corona is described as “a shimmering white glow that stretched out <b>like silky hair</b>.” What does this comparison help the reader picture?","o":["soft, thin strands of light spreading out from the dark circle","a thick white cloud covering the whole sky over the beach","a hard, sharp ring of light with smooth, even edges","a bright ball of light growing bigger every second"],"k":0,"why":"Silky hair is soft and spreads in thin strands. This matches Text 1’s description of the corona as “pale, wispy streamers stretching into space.”"},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which safety idea from Text 1 is shown through Lucía’s experience in Text 2?","o":["It is safe to remove eclipse glasses only during totality.","Ordinary sunglasses are dark enough to protect your eyes.","A pinhole projector is the safest way to see the corona.","People outside the path can take their glasses off at noon."],"k":0,"why":"Text 1, paragraph 8, explains that glasses can come off only during totality. In Text 2, Tía says “Glasses off!” at totality and “Glasses on!” as soon as the bright flash returns.","ev":["a8.2","b7.2","b5.1"],"evq":"Part B: Click the sentence from either text that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"What does Text 2 add to the reader’s understanding of eclipses that Text 1 does not?","o":["how it feels to experience totality from one person’s point of view","why the Moon is able to cover the Sun completely during a total eclipse","how wide the path of totality was on April 8, 2024","which cities had the longest view of totality in 2024"],"k":0,"why":"Text 1 explains the science and facts. Text 2 is told by Lucía, so it shows her goosebumps, her fear in the silence, and her amazement during totality."}],"write":{"prompt":"Text 1 and Text 2 both describe what happens during totality. Explain how the two texts show that totality is a powerful experience. Use at least one detail from each text in your answer.","model":"Both texts show that totality is a powerful experience that people do not forget. Text 1 explains the science behind the moment. It says that during totality the corona appears as “pale, wispy streamers,” the temperature can drop, and birds sometimes go quiet as if night has fallen. Text 2 shows how those same changes feel to a real person. When the gulls go silent, Lucía grabs her tía’s hand, and when she sees the corona, she gasps while strangers cheer and cry around her. These details prove that totality affects people’s feelings, not just the sky. Together, the texts show that a total eclipse is both a scientific event and an unforgettable experience.","need":["States a claim about why totality is powerful","Uses a fact from Text 1 about what happens during totality","Uses a detail from Lucía’s story","Explains how the details from both texts support the claim"]}},{"id":"s11-wright","theme":"Solving the Problem of Flight","a":{"title":"Two Brothers and the Puzzle of Flight","genre":"Biography","topic":"History of Science","gloss":{"controlled":["guided on purpose instead of drifting or tipping by accident","controlado"],"resistance":["a force that pushes back against something moving","resistencia"],"reasoned":["figured something out by thinking carefully, step by step","razonaron"],"warping":["bending or twisting something out of its flat shape","torsión (deformación)"],"discouraged":["feeling like giving up because things went badly","desanimado"],"reliable":["able to be trusted because it is correct again and again","confiable"],"propellers":["spinning blades that push an aircraft forward through the air","hélices"]},"paras":[["On the cold, windy morning of December 17, 1903, a strange machine made of wood and cloth rested on a wooden rail near Kitty Hawk, North Carolina.","Orville Wright lay flat on the lower wing while his brother Wilbur steadied one wingtip.","When the engine roared and the machine rose into the air, it stayed up for only about 12 seconds and traveled about 120 feet.","That short hop was the first controlled, powered flight of a heavier-than-air machine with a pilot on board.","Yet the most important part of the story happened years earlier, when two bicycle makers from Dayton, Ohio, set out to solve flight one problem at a time."],["To understand the Wrights’ achievement, it helps to know the four forces that act on anything that flies.","Weight is the pull of gravity, which drags an aircraft toward the ground.","Lift is the upward force created as air flows over and under the wings.","Thrust is the forward push, which can come from a propeller or a jet engine.","Drag is the resistance of the air, which pushes back against anything moving through it.","To take off and stay up, an aircraft needs enough lift to overcome its weight and enough thrust to overcome drag."],["Many inventors of the 1890s concentrated on building powerful engines, but the Wrights believed that was only part of the answer.","They noticed that a flying machine also had to be controlled, or it would tip over in the first strong gust of wind.","A bicycle rider constantly makes small adjustments to stay balanced, and the brothers reasoned that a pilot would need to do the same thing in the air.","In their view, balance and control were the real puzzle, and power could come later."],["Their solution came partly from watching birds, which tilt the tips of their wings to turn and to keep themselves level.","The Wrights designed a system called wing warping, in which cables twisted the ends of the wings in opposite directions.","When one wingtip angled up and the other angled down, one side produced more lift than the other, so the craft rolled, or banked, in a smooth and steady way.","They first tested the idea in 1899 on a large kite, and it worked."],["Next, the brothers built full-size gliders and carried them to Kitty Hawk, where steady winds and soft sand made testing safer.","Their gliders of 1900 and 1901, however, were disappointing because they produced much less lift than the brothers had expected.","The Wrights had based their wing designs on tables of numbers published by earlier researchers, including the German glider pioneer Otto Lilienthal.","On the trip home in 1901, a discouraged Wilbur reportedly said that people might not fly for a thousand years."],["Instead of quitting, the brothers went back to their bicycle shop and turned it into a laboratory.","In the fall of 1901, they built a wind tunnel, a long wooden box with a fan that pushed a steady stream of air past small model wings.","Inside the tunnel, delicate measuring devices showed how much lift and drag each model produced.","In the weeks that followed, they tested more than 200 wing shapes, comparing how curved, thick, or long each one was.","The results showed that the old tables were accurate only for the particular wing shape Lilienthal had used, not for the shapes the Wrights had tried.","With their own reliable data, the brothers could finally design wings that would perform the way they predicted."],["Their 1902 glider proved that the new numbers were correct.","It flew farther and more smoothly than either of the earlier gliders.","They also added a movable rudder at the back, which helped the craft turn without slipping sideways.","By the end of 1902, they had a glider that could be lifted and steered, and only one force remained to be solved."],["Only after solving lift and control did the Wrights turn their attention to thrust.","No company could sell them an engine that was both light and strong enough, so they built one with the help of their mechanic, Charles Taylor.","It produced only about 12 horsepower, but the Flyer was light enough that this was just barely enough.","The brothers also discovered that no one truly understood how to design propellers, so they treated each spinning blade as a kind of rotating wing and worked out its shape themselves.","Two propellers, connected to the engine by chains, pushed the 1903 Flyer forward."],["On December 17, the brothers took turns as pilot and made four flights.","The last and longest, with Wilbur at the controls, lasted 59 seconds and covered 852 feet.","Few people paid attention at first, but the Wrights kept improving their machines, and within a few years their flights lasted many minutes."],["The Wright brothers did not succeed because they were luckier or richer than other inventors.","They succeeded because they tested their ideas, admitted when results did not match their expectations, and gathered better evidence.","Engineers still follow the same cycle today: design, test, measure, and redesign."]]},"b":{"title":"The Notebook of Crashes","genre":"Realistic fiction","gloss":{"nosedived":["fell straight down, front end first","cayó en picada"],"stalled":["stopped moving forward and lost its lift in the air","se detuvo (perdió sustentación)"],"lopsided":["uneven, with one side lower or heavier than the other","chueco, desequilibrado"],"creased":["pressed a sharp fold into paper","doblaron (marcaron un pliegue)"],"leveled out":["stopped going up or down and flew flat","se niveló"],"bleachers":["rows of seats for people watching in a gym or field","gradas"]},"paras":[["The first glider Nadia folded nosedived straight into the gym floor.","The second one swooped up, stalled, and fluttered backward like a dead leaf.","By the third failure, the other teams at science club were already measuring flights of twenty feet, and Nadia's cheeks felt hot."],["\"Maybe paper just hates me,\" she muttered."],["Her partner, Leo, picked up the crumpled glider and smoothed it against his knee.","\"Ms. Okafor says every crash tells us something,\" he said.","\"So what did this one say?\""],["Nadia wanted to answer that it said she was terrible at this.","Instead, she made herself look at the glider more carefully.","The nose was thick with folds, but the wings were long and floppy, and one drooped lower than the other."],["\"It's lopsided,\" she admitted.","\"The left wing is bent down.\""],["They wrote that in their notebook, along with the distance: zero feet.","Then they made a rule.","They would change only one thing at a time, so they would know exactly what made a difference."],["First, they creased both wings so they matched, and the glider flew straight but dove too soon.","Next, Nadia slid a paper clip from the nose toward the middle, and that flight was even worse, wobbling wildly before it crashed.","They moved the clip back and wrote \"clip near nose = steadier\" in the notebook.","Finally, Leo suggested bending the back edges of the wings up just slightly, about the width of a fingernail."],["Nadia held her breath and launched the glider gently, the way Ms. Okafor had shown them, not like a fastball.","It sailed out over the painted basketball lines, dipped once, then leveled out and kept going.","It skidded to a stop near the bleachers."],["Leo sprinted for the tape measure.","\"Twenty-six feet!\""],["Nadia laughed, surprised at how loud she was.","She looked down at the notebook, crowded with arrows, numbers, and crossed-out guesses.","An hour ago, those pages had felt like a list of everything she had done wrong.","Now they looked like a map that had led her somewhere."],["\"Let's try one more change,\" she said, already reaching for a fresh sheet of paper."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["The Wright brothers achieved flight by solving control and lift through careful testing before adding power.","The Wright brothers' first flight in 1903 lasted only about 12 seconds and covered about 120 feet.","Weight, lift, thrust, and drag are the four forces that act on every machine that flies.","The Wright brothers succeeded mainly because they built a much stronger engine than other inventors of the time."],"k":0,"why":"Most of Text 1 explains how the brothers worked on control (paragraphs 3–4) and lift (paragraphs 5–7) before power (paragraph 8). The flight time and the four forces are true details, but they are not the main idea."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 3, what can the reader infer about how the Wrights' approach differed from that of many other inventors?","o":["They saw that controlling the aircraft mattered as much as giving it power.","They had much more money to spend on engines than other inventors did.","They believed birds were too different from machines to teach them anything.","They thought flying would be easier to learn than riding a bicycle."],"k":0,"why":"Paragraph 3 says other inventors focused on engines, but the Wrights noticed a machine also had to be controlled and called balance and control 'the real puzzle.'","ev":["a3.2","a3.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 2, drag is described as \"the <b>resistance</b> of the air.\" What does <b>resistance</b> mean, and what does the suffix -ance do?","o":["a pushing back; -ance turns the verb resist into a noun","a pushing forward; -ance turns the noun into a verb","a pulling down; -ance means \"not\" or \"opposite of\"","a lifting up; -ance means \"too much\" or \"beyond the limit\""],"k":0,"why":"Paragraph 2 says drag 'pushes back against anything moving through it.' The suffix -ance changes the action word resist into a thing: resistance."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, what does the word <b>warping</b> mean in the phrase \"wing warping\"?","o":["bending or twisting out of its flat shape","folding up completely so it can be stored","stretching to make it longer and wider","covering with a stronger kind of cloth"],"k":0,"why":"Paragraph 4 explains that cables 'twisted the ends of the wings,' so warping means twisting or bending the wing's shape."},{"on":"a","t":"mc","skill":"text structure","q":"How are paragraphs 5 and 6 mainly organized?","o":["Problem and solution: the gliders failed, so the brothers built a wind tunnel to get better data.","Compare and contrast: Lilienthal's gliders are compared, point by point, with the Wrights' gliders.","Sequence: the four flights of December 17, 1903, are described from first to last.","Cause and effect: strong winds at Kitty Hawk caused the brothers' gliders to crash."],"k":0,"why":"Paragraph 5 describes a problem (the gliders gave too little lift), and paragraph 6 describes the solution (testing wing shapes in a wind tunnel)."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO details from Text 1 show that the Wrights tested ideas before relying on them? Choose TWO answers.","o":["They tried wing warping on a kite in 1899 before using it on a glider.","They measured more than 200 wing shapes in a wind tunnel.","Orville lay flat on the lower wing during the first powered flight.","They chose Kitty Hawk because of its steady winds and soft sand.","Few people paid attention to the brothers' first flights."],"ks":[0,1],"why":"Paragraph 4 says they tested warping on a kite first, and paragraph 6 says they tested over 200 wing shapes. The other choices are true details, but they are not examples of testing an idea."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 6, why did the Wrights' 1900 and 1901 gliders produce less lift than expected?","o":["The published data they used fit only one wing shape, not theirs.","Their gliders were too heavy because the engine weighed too much.","The winds at Kitty Hawk were too weak to lift the wings.","They had not yet added propellers to push the gliders forward."],"k":0,"why":"Paragraph 6 says the old tables were 'accurate only for the particular wing shape Lilienthal had used,' so the Wrights' different wings did not match the numbers.","ev":["a6.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author open Text 1 with the first flight and then say \"the most important part of the story happened years earlier\" (paragraph 1)?","o":["to grab attention with a famous moment, then shift the focus to the work that made it possible","to show readers that the first flight was not really an important event in history","to explain that the brothers had lived in Kitty Hawk for many years before 1903","to suggest that Orville was a more skilled and careful pilot than his older brother, Wilbur"],"k":0,"why":"Paragraph 1 starts with an exciting scene, then turns to the years of problem solving that the rest of the text explains."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: What is the author's point of view about why the Wright brothers succeeded?","o":["Their careful process of testing and improving mattered more than luck.","Their success came mostly from copying the designs of earlier researchers.","They succeeded because the weather at Kitty Hawk was perfect for flying.","They were mainly lucky to finish before other inventors did."],"k":0,"why":"In paragraph 10 the author says they did not succeed because they were luckier, but because they tested ideas and gathered better evidence.","ev":["a10.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"theme","q":"Which theme is best supported by Text 2?","o":["Mistakes can become useful information when you study them carefully.","Working with a partner is always easier than working alone.","Winning a contest is the most important part of any project.","Some things, like paper gliders, are too unpredictable to improve."],"k":0,"why":"Nadia learns from each crash (paragraphs 4–7), and by paragraph 10 her notebook of failures has become 'a map that had led her somewhere.'"},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 1, the glider \"fluttered backward like a dead leaf.\" What does this comparison suggest?","o":["The glider fell weakly and helplessly instead of flying.","The glider was made from old paper that had turned brown.","The glider moved gracefully, the way autumn leaves do.","The glider was blown off course by a wind outside."],"k":0,"why":"A dead leaf drifts down with no power or direction, so the comparison shows the glider failing to fly."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Nadia's view of her notebook change by the end of the story?","o":["At first it seems like a record of failure, but later it seems like a guide to success.","At first it seems useless, but later she decides Leo should keep it for the club.","At first she is proud of it, but later she wants to throw it away and start over again.","At first she ignores it, but later she copies it neatly to show Ms. Okafor."],"k":0,"why":"Paragraph 10 says the pages first 'felt like a list of everything she had done wrong' but 'now they looked like a map.'","ev":["b10.3","b10.4"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"Why do Nadia and Leo decide to change \"only one thing at a time\" (paragraph 6)?","o":["so they can tell which change made the glider fly better or worse","because Ms. Okafor would only give them a few sheets of paper","so they can finish their glider before the other teams at science club do","because changing the wings is against the science club rules"],"k":0,"why":"Paragraph 6 says they made the rule 'so they would know exactly what made a difference.' Changing many things at once would hide the cause."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the way Nadia improves her glider similar to the way the Wright brothers improved their aircraft?","o":["Both test designs, record the results, and make changes based on evidence.","Both build their own engines to give their aircraft more thrust.","Both give up after early failures and then begin a different project.","Both depend on numbers that earlier researchers had published."],"k":0,"why":"Text 1 shows the Wrights testing wing shapes and gathering data, and Text 2 shows Nadia writing results in a notebook and changing one thing at a time."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: What does Text 2 add to the topic of solving flight problems that Text 1 does not?","o":["It shows the feelings of a person who struggles through testing.","It gives exact dates and measurements from a real event in history.","It explains the four forces that act on objects that fly.","It describes how a wind tunnel measures lift and drag."],"k":0,"why":"Text 1 gives facts and history, while Text 2 lets readers feel Nadia's embarrassment and later her joy as she tests her glider.","ev":["b1.3","b10.1"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Explain how Text 1 and Text 2 each show that failure can lead to success. Use at least one detail from each text.","model":"Both texts show that failure can lead to success when people learn from what went wrong. In Text 1, the Wright brothers' gliders of 1900 and 1901 gave much less lift than they expected. Instead of quitting, they built a wind tunnel and tested more than 200 wing shapes until they had reliable data. Their failure pushed them to find better evidence, which led to the 1903 flight. In Text 2, Nadia's first gliders nosedive and stall, but she studies the crashes and notices that one wing is lopsided. By changing one thing at a time, she gets her glider to fly twenty-six feet. In both texts, a failure becomes useful information that points toward a better design.","need":["States a clear claim about how failure leads to success","Uses a detail from Text 1 (such as the wind tunnel or the failed gliders)","Uses a detail from Text 2 (such as Nadia's notebook or the lopsided wing)","Explains how each detail shows learning from failure"]}},{"id":"s12-batteries","theme":"Storing Energy in Batteries","a":{"title":"Energy in a Can: How Batteries Work","genre":"Informational","topic":"Physical Science","gloss":{"portable":["easy to carry from place to place","portátil"],"electrodes":["the two ends of a battery where electrons leave or arrive","electrodos"],"electrolyte":["the material inside a battery that lets charged particles move between the two ends","electrolito"],"circuit":["a complete loop that electricity can flow through","circuito"],"ions":["atoms that carry an electric charge because they have gained or lost electrons","iones"],"rechargeable":["able to be filled with energy again after it runs out","recargable"],"convenient":["easy to use and saving time or effort","práctico, conveniente"],"dependent":["needing something in order to work","dependiente"]},"paras":[["Think about how many objects you used today that had no cord plugged into the wall.","A phone, a tablet, a TV remote, a smoke alarm, maybe a wristwatch or an electric toothbrush.","Every one of them depends on a battery, a small container that holds energy until you need it.","Batteries are so common that most people never think about them, yet the science inside them took more than two hundred years to develop."],["A battery does not actually store electricity the way a bucket stores water.","Instead, it stores chemical energy, the energy held in the bonds between atoms.","When the battery is used, chemical reactions inside it release that energy as electrical energy, which can power a light, a speaker, or a motor.","In other words, a battery is a device that changes energy from one form into another."],["Every battery has three main parts.","There are two electrodes, made of different materials: a negative end called the anode and a positive end called the cathode.","Between them sits the electrolyte, a substance that allows charged particles to travel from one side to the other.","The materials are chosen carefully, because some substances give up electrons easily while others tend to grab them."],["Nothing happens until the battery is connected to a circuit, a complete path such as a wire running through a flashlight bulb.","Then a chemical reaction at the anode releases tiny particles called electrons.","The electrons cannot pass through the electrolyte, so they travel the long way, through the wire and the bulb, toward the cathode.","That flow of electrons is an electric current, and it is what makes the bulb glow.","Meanwhile, inside the battery, charged atoms called ions move through the electrolyte to keep the two sides balanced.","When the materials at the electrodes are used up, the reaction slows and the battery is \"dead.\""],["The first true battery was built by the Italian scientist Alessandro Volta.","In 1800, he described a tall stack of alternating zinc and copper discs, with pieces of cloth or cardboard soaked in salt water placed between them.","When the top and bottom of the stack were connected by a wire, a steady electric current flowed.","Earlier experimenters could produce only quick sparks, so Volta's \"pile\" amazed scientists across Europe.","For the first time, they had a reliable, continuous source of electricity to study.","Today, the unit used to measure the push of a battery, the volt, is named in his honor."],["Volta's pile was heavy and messy, and it could not be refilled once its materials were used up.","Over the next two centuries, inventors developed many new designs.","Some, like the familiar AA batteries in a remote, are meant to be used once and thrown away or recycled.","Others are rechargeable, which means the chemical reaction can be run backward by pushing electricity into the battery from a charger."],["The most important rechargeable battery today is the lithium-ion battery.","Lithium is the lightest of all metals, so it can hold a large amount of energy without adding much weight.","In a lithium-ion battery, lithium ions travel through the electrolyte from one electrode to the other as the battery powers a device.","When you plug the device in, the charger forces the ions back to where they started, so the battery is ready to be used again.","This back-and-forth movement can be repeated hundreds of times, although each cycle wears the materials down a little."],["The first lithium-ion batteries went on sale in 1991, and they quickly changed daily life.","Because they are light and powerful, they made laptops, cell phones, and other portable devices practical.","They also power electric cars, electric bikes, and even large banks of batteries that store energy from solar panels for use at night.","In 2019, three scientists, John Goodenough, Stanley Whittingham, and Akira Yoshino, shared the Nobel Prize in Chemistry for developing this technology."],["Batteries still have drawbacks.","They lose their ability to hold a full charge as they age, and some contain materials that can be harmful if they are thrown into regular trash.","Damaged lithium-ion batteries can even overheat, which is why they should never be punctured or crushed.","For these reasons, engineers are searching for batteries that are safer, last longer, and use materials that are easier to find and recycle."],["The next time you pick up your phone, remember that a tiny chemical reaction is happening inside it.","From Volta's stack of metal discs to the slim battery in your pocket, scientists have spent more than two centuries learning to capture energy and release it exactly when we need it.","Our world has become dependent on that small, convenient package."]]},"b":{"title":"It's Time for Electric School Buses","genre":"Opinion essay","gloss":{"exhaust":["the dirty gas that comes out of an engine","gases de escape"],"pollution":["harmful materials that make air, water, or land dirty","contaminación"],"investment":["money spent now in order to gain something good later","inversión"],"maintenance":["the work of keeping a machine in good condition","mantenimiento"],"idling":["running the engine while the vehicle is not moving","con el motor encendido sin moverse"],"expensive":["costing a lot of money","caro"]},"paras":[["Every school morning, millions of students across the country climb aboard yellow buses.","Most of those buses run on diesel fuel, and as they rumble down the street, they release a cloud of exhaust.","Students breathe that exhaust at the bus stop, in the parking lot, and even inside the bus.","School districts should replace their diesel buses with electric buses as soon as they are able."],["The strongest reason is our health.","Diesel exhaust contains tiny particles and gases that can irritate the lungs and make asthma worse.","Children are especially affected because their lungs are still growing and they breathe faster than adults.","Electric buses produce no exhaust at all, so the air around a school would be cleaner every single day.","No more idling engines puffing smoke outside the front doors while students wait."],["Electric buses are also better for the planet because they cut down on pollution.","Burning diesel releases carbon dioxide, a gas that traps heat in the atmosphere.","Electric buses still need electricity, and some of it may come from power plants, but as more electricity comes from sources like wind and solar, these buses will become cleaner over time."],["Some people argue that electric buses are simply too expensive.","They have a point: an electric school bus can cost three times as much as a diesel bus, or even more.","For a school district with a tight budget, that is a serious concern, and it would not make sense to throw away buses that still run well."],["However, the purchase price is not the whole story.","Electricity usually costs much less per mile than diesel fuel.","Electric motors also have far fewer moving parts than diesel engines, so they need no oil changes and less maintenance.","Over the many years a bus stays in service, these savings help make up for the higher price.","Some districts have also used grants to cover part of the cost.","Districts do not need to switch all at once; they can replace each old diesel bus with an electric one when it wears out."],["Buying an electric bus is an investment in cleaner air and healthier students.","A school's most important job is to take care of the kids inside it, and that care should start before the first bell rings.","It is time to let the diesel bus retire."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Batteries change stored chemical energy into electrical energy, and scientists have improved them over two centuries.","Alessandro Volta built the first true battery in 1800 using a stack of zinc and copper discs.","Lithium-ion batteries are dangerous and should quickly be replaced by safer kinds of batteries that last longer.","Electrons travel through a wire from the anode to the cathode, creating an electric current."],"k":0,"why":"Text 1 explains how batteries turn chemical energy into electrical energy (paragraphs 2–4) and traces their history from Volta to lithium-ion (paragraphs 5–8). The other choices are details or are not what the text says."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A
