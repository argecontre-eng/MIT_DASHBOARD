called ventricles, do most of the hard pumping.","Regular exercise is the best way for a person to lower a resting heart rate.","The blood vessels in one adult body could circle Earth more than two times."],"k":0,"why":"The whole article explains how the heart's chambers, valves, circuits, and vessels work together to move blood. The other choices are single details from one paragraph."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraphs 5 and 6, what can the reader infer about the wall of the right ventricle?","o":["It is thinner than the left ventricle's wall because its trip is shorter.","It is thicker than the left ventricle's wall because it holds more blood.","It is the same as the left ventricle's wall because both sides mix blood.","It is the strongest wall because it pumps blood to the fingertips and toes."],"k":0,"why":"Paragraph 5 says the right side only sends blood on a short trip to the lungs, and paragraph 6 says the left ventricle has the thickest wall because its trip is long. So the right ventricle's wall must be thinner.","ev":["a5.3","a6.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 2, the word <b>transport</b> contains the root <i>port</i>. Based on this root and the paragraph, what does transport mean?","o":["to carry something from one place to another","to make something stronger, healthier, and more useful","to clean something by washing it out","to keep something resting in one place"],"k":0,"why":"The root port means \"carry\" and the prefix trans- means \"across.\" Paragraph 2 says blood carries supplies to the cells, so transport means to carry from place to place."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraphs 4 and 7, which statements about valves are true? Choose TWO answers.","o":["Valves work like one-way doors that keep blood from moving backward.","Some veins have small valves that help blood return to the heart.","All four heart valves close at exactly the same moment.","Valves are thick walls that keep the two sides of the heart apart.","Valves open only when a doctor listens with a stethoscope."],"ks":[0,1],"why":"Paragraph 4 compares a valve to a one-way door, and paragraph 7 says many veins have small valves. The wall between the two sides is the septum, and the valves close in two pairs, \"lub\" then \"dub.\""},{"on":"a","t":"mc","skill":"text structure","q":"How does the author organize the information in paragraphs 5 and 6?","o":["by comparing the two loops of blood, one run by each side of the heart","by telling how scientists first discovered the way that blood circulates in the body","by listing problems that can happen to the heart and their solutions","by explaining the steps for measuring heart rate at the wrist"],"k":0,"why":"Paragraph 5 describes the short loop to the lungs run by the right side, and paragraph 6 describes the long loop to the body run by the left side. The author is comparing the two circuits."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 5: \"The right side runs the <b>pulmonary</b> circuit, a short trip to the lungs and back.\" What does the word pulmonary mean?","o":["having to do with the lungs","having to do with the brain","moving very slowly and gently","belonging to the left side"],"k":0,"why":"In paragraph 5, the phrase right after pulmonary circuit explains it: \"a short trip to the lungs and back.\" So pulmonary means having to do with the lungs."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author begin paragraph 1 by asking the reader to put a hand on his or her chest?","o":["to connect the topic to something readers can feel in their own bodies","to teach readers the correct way to check their own hearts for any problem","to prove that the heart sits exactly in the middle of the chest","to show readers how to count their heartbeats for fifteen seconds"],"k":0,"why":"In paragraph 1, the author asks readers to feel their own heartbeat so the topic feels personal and interesting before the facts begin. The paragraph does not teach how to check for problems or count beats."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 8, why do well-trained athletes often have a low resting heart rate?","o":["Their stronger hearts move more blood with each beat.","Their hearts have more chambers than other people's hearts.","Their muscles need much less oxygen than other people's muscles.","Their valves stay open longer, so blood flows backward less."],"k":0,"why":"Paragraph 8 explains that a stronger heart pushes out more blood with each squeeze, so it does not have to beat as often.","ev":["a8.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 7, what is the most important job of the capillaries?","o":["They are where oxygen and wastes are traded with the cells.","They carry blood straight back to the right side of the heart.","They handle the strongest pressure from each heartbeat.","They connect the left ventricle directly to the lungs."],"k":0,"why":"Paragraph 7 says the real exchange happens in the capillaries, where oxygen and nutrients pass to the cells and wastes pass in. Arteries, not capillaries, handle the strongest pressure.","ev":["a7.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of the poem?","o":["Something we rarely notice can be faithfully working for us all the time.","Exercise is the most important way for people to keep a heart healthy and strong.","Feeling nervous before a big event means that something is wrong.","Music is the best way to calm down when a day feels stressful."],"k":0,"why":"The speaker says the drummer has been there since before they knew their name and keeps beating, and in stanza 6 admits they hardly ever thank it. The poem is about a loyal helper we take for granted."},{"on":"b","t":"mc","skill":"word choice","q":"In stanza 6, the speaker calls each heartbeat <b>a promise kept to me</b>. What does this phrase suggest about the heart?","o":["It is loyal and can be counted on.","It is secretive and hard to understand.","It is tired and ready to stop working.","It is strict and makes the speaker obey."],"k":0,"why":"A promise that is kept is one you can trust. Calling each beat a kept promise in stanza 6 suggests the heart is dependable and faithful."},{"on":"b","t":"ebsr","skill":"inference","q":"Part A: What does stanza 4 suggest about how the speaker's heart responds to feelings?","o":["It races when the speaker is nervous but slows when the speaker calms down.","It stops beating for a moment whenever the speaker feels afraid.","It stays at the same steady speed no matter how the speaker feels.","It beats slowly before the spelling bee and quickly afterward."],"k":0,"why":"In stanza 4, the heart \"galloped like a horse\" on the nervous morning of the spelling bee, but it \"settled on its course\" after the speaker breathed slowly.","ev":["b4.2","b4.4"],"evq":"Part B: Click the line in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"point of view","q":"How does the speaker feel about the heart at the end of the poem?","o":["thankful, and a little sorry for not noticing it more often","worried that it might suddenly stop working on some ordinary day","annoyed that its loud thumping keeps them awake at night","proud of training it to beat more slowly during races"],"k":0,"why":"In stanza 6, the speaker admits \"I hardly ever thank it\" and then calls each beat a promise kept. This shows gratitude mixed with a little guilt."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the way the poem presents the heart different from the way the article presents it?","o":["The poem shows how the heartbeat feels to one person, while the article explains how the heart works.","The poem gives exact heart rates for children, while the article uses only comparisons and images.","The poem explains how the four valves close, while the article describes only the four chambers.","The poem argues that people must exercise daily, while the article tells one person's life story."],"k":0,"why":"The poem uses a first-person speaker and an imaginary drummer to show feelings about the heartbeat. The article gives facts about chambers, valves, circuits, and heart rates."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In stanza 3 of the poem, the drummer \"hammers wildly\" when the speaker races up the hill. Which idea from the article best explains why?","o":["Working muscles need more oxygen, so the heart speeds up.","Valves close more loudly when a person is outdoors.","The septum stops blood from mixing during a race.","Athletes have resting heart rates as low as 40."],"k":0,"why":"Paragraph 8 of the article says that during exercise, muscles demand extra oxygen and the heart speeds up to deliver it. That explains the pounding heartbeat in stanza 3.","ev":["a8.3"],"evq":"Part B: Click the sentence in Text 1 (the article) that best supports your answer to Part A."}],"write":{"prompt":"Both texts show that the heart changes what it does depending on what the body needs. Explain how Text 1 and Text 2 each show this idea. Use at least one detail from each text.","model":"Both texts show that the heart is always adjusting to what the body is doing. In Text 1, the article explains that \"when you exercise, your muscles demand extra oxygen, so your heart speeds up to deliver it.\" This shows that the heart works harder when the body needs more. In Text 2, the poem shows the same idea through the speaker's experience. When the speaker races up the hill, \"the drummer hammers wildly,\" but at night it is only \"a soft and patient knocking.\" The poem shows the heart speeding up and slowing down, just like the article describes. Together, the texts show that the heart is not a simple machine that always runs at one speed but a pump that responds to the body's needs.","need":["States a clear claim about how the heart responds to the body's needs","Uses a detail from the article, such as the heart speeding up during exercise","Uses a detail from the poem, such as the drummer hammering on the hill","Explains how both details prove the claim"]}},{"id":"s22-curie","theme":"Who Gets the Credit in Science?","a":{"title":"Marie Curie: A Light in the Shed","genre":"Biography","topic":"History of Science","gloss":{"determined":["having made a firm decision and refusing to give up","decidida"],"governess":["a woman hired to teach children in their family's home","institutriz"],"radioactivity":["the giving off of invisible energy by certain unstable elements","radiactividad"],"element":["a basic substance that cannot be broken down into simpler substances","elemento"],"persistence":["the quality of continuing to try even when something is hard","perseverancia"],"radiation":["energy that travels outward from a source as invisible rays or particles","radiación"],"brilliance":["great intelligence or talent","brillantez"],"exposure":["the state of being in contact with something harmful","exposición"]},"paras":[["In the 1890s, if you had walked into a drafty wooden shed in Paris, you might have found a slim woman stirring a boiling pot of rock dust with an iron rod nearly as tall as she was.","The work was hot, smelly, and exhausting, and it went on for years.","Yet on some evenings, the bottles and jars on the shelves gave off a faint, ghostly glow.","That woman was Marie Curie, and the glowing substances were proof of a discovery that would change science forever."],["Marie was born Maria Skłodowska on November 7, 1867, in Warsaw, which was then controlled by the Russian Empire.","Her parents were both teachers, and Maria was a brilliant student who finished high school at the top of her class.","However, the University of Warsaw did not admit women, so there was no obvious path for a young woman who wanted to study science."],["Maria was determined, and she made a clever deal with her older sister, Bronisława.","For several years, Maria worked as a governess, teaching other families' children and sending money to support her sister's medical studies in Paris.","Once Bronisława was settled, she would help Maria in return.","In 1891, Maria finally traveled to Paris and enrolled at the Sorbonne, one of the most respected universities in Europe.","She began calling herself Marie, the French form of her name, and she studied so hard that she sometimes forgot to eat.","Within a few years, she had earned degrees in both physics and mathematics."],["In Paris, Marie met Pierre Curie, a quiet physicist who shared her love of research, and they married in 1895.","Soon after, Marie chose an unusual topic for her research.","A French scientist named Henri Becquerel had noticed that the element uranium gave off mysterious rays that could pass through solid objects.","Marie wanted to know why.","She tested many minerals and found that a dark ore called pitchblende gave off even more of these rays than pure uranium did.","This made her suspect that pitchblende contained something new, something no one had ever identified."],["Marie and Pierre set out to find the hidden substance, and in 1898 they announced not one but two new elements.","They named the first one polonium, after Marie's homeland, Poland, which at the time did not exist as an independent country on the map.","They named the second radium, from the Latin word for \"ray,\" because it glowed so strongly.","Marie also gave the strange behavior a name, radioactivity, a word scientists still use today.","Proving that radium was real, however, required a tiny sample of the pure substance, so for years the couple boiled, stirred, and separated tons of pitchblende in their leaky shed.","Their persistence finally paid off when they produced a small amount of radium, less than the weight of a paper clip."],["In 1903, the Nobel Prize in Physics was awarded to Henri Becquerel, Pierre Curie, and Marie Curie for their research on radiation.","Interestingly, Marie had almost been left out.","The original nomination listed only the two men, and when Pierre learned this, he insisted that Marie's central role be recognized.","Marie became the first woman ever to win a Nobel Prize."],["Tragedy struck in 1906, when Pierre was killed in a street accident involving a horse-drawn wagon.","Marie was heartbroken, but she continued their work and took over his teaching position, becoming the first woman to teach at the Sorbonne.","In 1911, she received a second Nobel Prize, this time in Chemistry, for her discovery of polonium and radium.","She was the first person to win Nobel Prizes in two different sciences, a record no one else has matched.","During World War I, she helped equip vehicles with X-ray machines so that doctors near the battlefields could find bullets and broken bones in wounded soldiers."],["Unfortunately, the same rays that fascinated Marie were also harming her.","In those early days, no one understood how dangerous radiation could be, and Marie often carried test tubes of radioactive material in her pockets.","Over time, she suffered from illnesses that were most likely caused by years of exposure.","She died on July 4, 1934, from a blood disease that doctors believe was linked to her work.","Even today, many of her papers and belongings are still radioactive, so visitors who wish to study them must take special precautions."],["Marie Curie's story is about more than brilliance.","It is about a young woman who was told no and kept looking for another way, and about a scientist who spent years doing hard, dull work to prove what she believed.","Her discoveries helped launch new fields, including medical treatments that use radiation to fight cancer, and they continue to light the way for scientists around the world."]]},"b":{"title":"Science Is a Team Sport","genre":"Opinion essay","gloss":{"collaboration":["people working together to do something","colaboración"],"overlooked":["not noticed or given attention","ignorado"],"essential":["very important and necessary","esencial"],"contributions":["the parts a person adds to help something succeed","contribuciones"],"inspire":["to make someone want to do something great","inspirar"],"accurate":["correct and true in every detail","preciso"]},"paras":[["Every October, newspapers announce the winners of the Nobel Prizes, and the world celebrates a handful of brilliant scientists.","The Nobel Prizes in science can be shared by no more than three people.","That rule might have made sense more than a century ago, but it no longer fits the way science works.","Science prizes should recognize entire teams, not just a few famous individuals."],["Modern discoveries almost always depend on collaboration.","In 2015, scientists first detected gravitational waves, tiny ripples in space that Albert Einstein had predicted a hundred years earlier.","The project behind this discovery, called LIGO, involved more than a thousand researchers, engineers, and technicians from many countries.","Yet when the Nobel Prize in Physics was awarded for this work in 2017, only three people received it.","The three winners themselves thanked the huge team that made the discovery possible."],["When prizes ignore teams, talented people get overlooked.","Students, lab assistants, and engineers who build the equipment often do essential work, yet the public never hears their names.","Even Marie Curie was almost left off the 1903 Nobel Prize, and only her husband's protest made sure her contributions were counted.","How many other important scientists have been forgotten because no one spoke up for them?"],["Some people argue that giving prizes to individuals is worthwhile because a famous winner can inspire young people.","A girl who reads about Marie Curie might decide to become a chemist herself, and that is a powerful thing.","They also point out that a team of a thousand people is hard to put on a magazine cover.","These points are fair, but a prize for a team could still name its leaders while honoring everyone who helped.","In fact, showing that science is a group effort might inspire even more students, because it tells them there is a place for every kind of talent, not only for geniuses."],["Prizes send a message about what society values.","If we want the next generation to understand how discoveries really happen, our prizes should give an accurate picture.","Science is a team sport, and it is time for its trophies to say so."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of the biography?","o":["Through persistence and hard work, Marie Curie made discoveries that changed science.","Marie Curie was born in Warsaw at a time when Poland was controlled by Russia.","Marie Curie's papers are still radioactive and must be studied by visitors with great care.","Marie Curie and her sister made a deal to help each other pay for school."],"k":0,"why":"The biography follows Marie's life from her struggle to get an education to her discoveries and prizes, and paragraph 9 sums up that her story is about determination. The other choices are single details."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: What does paragraph 3 reveal about Marie as a young woman?","o":["She was willing to wait and sacrifice in order to reach her goal.","She preferred teaching children to studying science herself.","She wanted her sister to stay in Poland and work as a governess.","She moved to Paris mostly because she wanted to change her own name."],"k":0,"why":"In paragraph 3, Maria spends years working as a governess to pay for her sister's studies first, trusting that her own turn would come. This shows patience and sacrifice.","ev":["a3.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the author explains that Marie named the strange behavior <b>radioactivity</b>. The word radium comes from the Latin word for \"ray.\" Based on this word part and the paragraph, what does radioactivity most likely mean?","o":["the giving off of rays of energy by certain elements","the process of boiling and stirring rock dust in a shed","the study of how radios send sounds","the act of naming a new country on a map"],"k":0,"why":"Paragraph 5 says radium is named for the Latin word for ray because it glowed. The word part radi- (ray) plus active tells you radioactivity means actively giving off rays."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the author says \"Their <b>persistence</b> finally paid off.\" The suffix <i>-ence</i> turns a verb into a noun. What does persistence mean?","o":["the quality of continuing to try even when work is hard","the act of making a lucky guess about something difficult","the feeling of sadness after losing something","the skill of naming things in another language"],"k":0,"why":"The suffix -ence turns persist (to keep going) into a noun. Paragraph 5 says the Curies boiled and stirred pitchblende for years before succeeding, which shows persistence means not giving up."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO details from the biography show that Marie Curie was a scientific pioneer? Choose TWO answers.","o":["She was the first woman to win a Nobel Prize.","She was the first person to win Nobel Prizes in two different sciences.","She was the first scientist to notice that uranium gave off rays.","She was the first woman to be admitted to the University of Warsaw.","She was the first person to invent an X-ray machine for doctors."],"ks":[0,1],"why":"Paragraphs 6 and 7 say she was the first woman to win a Nobel Prize and the first person to win in two sciences. Becquerel noticed uranium's rays first (paragraph 4), and the University of Warsaw did not admit women (paragraph 2)."},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author begin the biography with the scene in the shed instead of with Marie's birth?","o":["to catch the reader's interest with a mysterious moment before telling her life in order","to show that Marie spent her whole childhood working in a laboratory in Paris","to explain step by step how scientists separate radium from pitchblende","to compare the shed where Marie worked with the classrooms at the Sorbonne"],"k":0,"why":"Paragraph 1 describes a woman stirring a pot and jars that glow, which makes the reader curious. Then paragraph 2 jumps back to her birth and tells the story in time order."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer from paragraph 6 about the scientists who first nominated Becquerel and Pierre Curie?","o":["They did not give Marie full credit for her share of the work.","They believed that Marie had discovered radium all by herself.","They thought radiation was too dangerous to win a prize.","They wanted the prize to go to Marie instead of Pierre."],"k":0,"why":"Paragraph 6 says the original nomination listed only the two men, and Pierre had to insist that Marie's central role be recognized. This shows the nominators had not credited her fairly.","ev":["a6.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 8, why did Marie Curie handle radioactive materials so carelessly?","o":["Scientists at the time did not yet know that radiation was dangerous.","She believed radium would cure her illnesses if she stayed close to it.","She had no money to buy containers for her test tubes and jars.","Her doctors told her the glowing substances were completely safe."],"k":0,"why":"Paragraph 8 explains that in those early days, no one understood how dangerous radiation could be. That is why she carried test tubes in her pockets.","ev":["a8.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"What is the author's main purpose in paragraph 9?","o":["to explain why Marie Curie's life still matters today","to describe the illness that caused Marie Curie's death","to argue that radiation should never be used in medicine","to compare Marie Curie with other famous scientists"],"k":0,"why":"Paragraph 9 steps back to sum up the lessons of her life and says her discoveries \"continue to light the way\" for scientists. It explains why she still matters."},{"on":"b","t":"mc","skill":"main idea","q":"What is the author's main claim in the opinion essay?","o":["Science prizes should honor the whole team behind a discovery.","Marie Curie should have received a third Nobel Prize for her work.","Famous scientists are the best way to inspire young students.","Gravitational waves are the most important discovery of the century."],"k":0,"why":"In paragraph 1, the author states, \"Science prizes should recognize entire teams, not just a few famous individuals,\" and repeats this idea in the last paragraph."},{"on":"b","t":"ebsr","skill":"key details","q":"Part A: How does the author support the claim that modern discoveries depend on teams?","o":["by describing a discovery that involved more than a thousand workers","by quoting Albert Einstein's opinion about the way Nobel Prizes are given","by listing every scientist who has ever been overlooked","by explaining how magazines choose their cover stories"],"k":0,"why":"Paragraph 2 gives the example of LIGO, the project that detected gravitational waves with more than a thousand researchers, engineers, and technicians.","ev":["b2.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"point of view","q":"How does the author respond to the counterargument in paragraph 4?","o":["The author agrees the points are fair but explains that team prizes could still name leaders.","The author says the counterargument is completely wrong and not worth discussing.","The author changes position and decides individual prizes are better after all.","The author ignores the counterargument and moves on to a new example."],"k":0,"why":"In paragraph 4, the author says \"These points are fair\" but then explains that a team prize could still name its leaders while honoring everyone who helped."},{"on":"b","t":"mc","skill":"word choice","q":"In the last paragraph, the author writes, \"Science is a team sport.\" Why does the author use this comparison?","o":["to suggest that, like a game, a discovery needs every player to succeed","to suggest that scientists should compete against each other to win the most prizes","to suggest that science is mainly a fun activity for free time","to suggest that only the best player deserves the trophy"],"k":0,"why":"In a team sport, everyone on the team helps win the game. By comparing science to a team sport, the author suggests that every helper deserves credit, which supports the essay's claim."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the opinion essay use Marie Curie's story differently from the way the biography uses it?","o":["The essay uses one event from her life as evidence for an argument, while the biography tells her whole life story.","The essay describes her childhood in detail, while the biography focuses only on her Nobel Prizes.","The essay says she never deserved the 1903 prize, while the biography says she deserved it alone.","The essay explains how she discovered radium, while the biography argues about how prizes should work."],"k":0,"why":"Paragraph 3 of the essay mentions only the 1903 nomination to support its claim that people get overlooked. The biography tells her life from birth to death."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from the essay is best supported by the biography's description of the Curies' work together?","o":["Important discoveries often depend on more than one person.","Famous winners are always the people who did the most work.","Prizes should never be given to husbands and wives together.","Old discoveries are less important than modern discoveries."],"k":0,"why":"Paragraph 5 of the biography says Marie and Pierre set out together to find the hidden substance and announced two new elements. This supports the essay's idea that discoveries depend on teamwork.","ev":["a5.1"],"evq":"Part B: Click the sentence in Text 1 (the biography) that best supports your answer to Part A."}],"write":{"prompt":"The opinion essay claims that science prizes should recognize teams. Explain how the biography of Marie Curie could be used to support this claim. Use at least one detail from each text.","model":"The biography of Marie Curie gives strong support to the essay's claim that prizes should recognize teams. In Text 2, the author argues that \"talented people get overlooked\" when only a few individuals receive awards. Text 1 shows this almost happened to Marie. The biography explains that \"the original nomination listed only the two men,\" even though Marie had done central work, and only Pierre's protest got her included. The biography also shows that Marie and Pierre worked together for years to find polonium and radium in their shed. This shows that even a famous discovery was the work of a team. Marie's story proves that if no one speaks up, important contributors can be left out, which is exactly the essay's point.","need":["States how the biography supports the essay's claim","Uses a detail from the essay about people being overlooked or teams","Uses a detail from the biography, such as the 1903 nomination or the Curies working together","Explains how the biography detail proves the essay's point"]}},{"id":"s23-semmelweis","theme":"Invisible Germs","a":{"title":"The Doctor Who Said, \"Wash Your Hands\"","genre":"Biography","topic":"History of Science","gloss":{"maternity":["having to do with mothers and giving birth","maternidad"],"puzzling":["hard to understand or explain","desconcertante"],"contaminated":["made dirty or unsafe by something harmful","contaminado"],"disinfect":["to clean something in order to kill germs","desinfectar"],"dramatically":["by a very large amount","drásticamente"],"resistance":["refusal to accept or go along with something","resistencia"],"microorganisms":["living things too small to see without a microscope","microorganismos"],"evidence":["facts or information that show something is true","evidencia"]},"paras":[["Today, washing your hands before you eat seems like the most ordinary habit in the world.","Signs in school bathrooms remind you to scrub for twenty seconds, and hospitals place soap and sanitizer by every door.","Yet less than two hundred years ago, even many highly trained doctors did not believe that clean hands mattered.","The story of how that changed begins with a young Hungarian doctor named Ignaz Semmelweis."],["Semmelweis was born in 1818 in Buda, a city that is now part of Budapest, Hungary.","He studied medicine in Vienna, Austria, and in 1846 he took a job as an assistant in the maternity section of the Vienna General Hospital, one of the largest hospitals in Europe.","The hospital had two separate maternity clinics where women came to give birth.","The First Clinic was used to train doctors and medical students, while the Second Clinic was used to train midwives, who are specially trained to help women during childbirth."],["Semmelweis soon noticed something puzzling and deeply troubling.","Many new mothers were becoming sick with a dangerous illness called childbed fever, and far more of them were dying in the First Clinic than in the Second.","In some years, the death rate in the doctors' clinic was several times higher than in the midwives' clinic.","The difference was so well known that some women begged not to be sent to the First Clinic."],["Semmelweis was determined to find out why.","He checked one possible cause after another, comparing everything from the way patients were positioned to the routines of the hospital priest.","Each time, he found that the change made no difference.","The two clinics shared the same building and the same air, so bad air could not explain why one was so much more dangerous."],["Then, in 1847, a sad event gave him an important clue.","A fellow doctor and friend, Jakob Kolletschka, was accidentally cut by a student's tool while examining the body of a person who had died.","Kolletschka soon became very ill and died, and Semmelweis noticed that his symptoms looked a lot like those of the mothers with childbed fever.","This led him to an important idea.","The doctors and students in the First Clinic often went straight from studying the bodies of people who had died to examining patients, while the midwives did no such work.","Perhaps, Semmelweis reasoned, the doctors' hands were carrying something harmful, invisible \"particles,\" from one room to the next."],["In May 1847, Semmelweis made a new rule.","Everyone working in the First Clinic had to wash their hands in a solution of chlorinated lime before examining a patient.","He chose chlorinated lime because it removed the bad smell from contaminated hands better than plain soap, and he believed that anything strong enough to remove the smell might also remove whatever was causing the disease.","Today, we know that chlorine compounds disinfect surfaces by killing germs, so his choice turned out to be a good one."],["The results were remarkable.","In April 1847, before the rule began, about 18 out of every 100 mothers in the First Clinic had died.","Within a few months of handwashing, the death rate fell dramatically, to roughly 2 out of every 100.","For the first time, the doctors' clinic was nearly as safe as the midwives' clinic."],["You might expect that other doctors would have celebrated, but many did the opposite.","Some were insulted by the suggestion that their own hands could be making patients sick.","Others pointed out that Semmelweis could not explain exactly what the invisible particles were, and without an explanation, they refused to change their habits.","His boss did not renew his position, and Semmelweis eventually returned to Hungary, where he kept arguing for handwashing.","He grew more and more frustrated by the resistance to his ideas, and he died in 1865, before most of the medical world accepted them."],["The explanation Semmelweis lacked arrived soon afterward.","In the 1860s, the French scientist Louis Pasteur showed that tiny living microorganisms, or germs, can cause disease.","Around the same time, the British surgeon Joseph Lister began using chemicals to clean wounds and surgical tools, and far fewer of his patients developed infections.","Together, their work helped build what is now called germ theory, and it proved that Semmelweis had been right all along."],["Today, Semmelweis is sometimes called the \"savior of mothers.\"","His story shows that good science depends on careful observation and evidence, even when the evidence goes against what everyone believes.","The next time you wash your hands, you will be following the advice of a doctor who was ignored in his own lifetime but who helped save countless lives."]]},"b":{"title":"The Doorknob Experiment","genre":"Realistic fiction","gloss":{"agar":["a jelly-like food that scientists use to grow bacteria","agar"],"sterile":["completely free of germs","estéril"],"incubator":["a warm box that helps living things grow","incubadora"],"colonies":["groups of bacteria growing together in one spot","colonias"],"hypothesis":["a guess that a scientist can test","hipótesis"],"smirked":["smiled in a proud or teasing way","sonrió con aire de superioridad"]},"paras":[["\"The cleanest place in this school,\" Diego announced, \"is the lunch table.","They wipe it down every single day.\"","Priya shook her head.","\"I bet the lunch table is dirtier than the bathroom doorknob.\"","Ms. Okafor, their science teacher, smiled and handed each of them a sterile cotton swab.","\"Then let's stop guessing,\" she said.","\"Write your hypothesis, and let's test it.\""],["Their class was studying microorganisms, and today every pair of students would collect samples from around the school.","Diego and Priya swabbed the lunch table, the bathroom doorknob, a computer keyboard, and, after some arguing, the bottom of Diego's sneaker.","For the last sample, Priya washed her hands with soap for twenty seconds and then pressed her fingertips gently onto a clean dish.","Ms. Okafor showed them how to rub each swab across a shallow dish of agar, a golden jelly that bacteria love to eat.","They sealed and labeled the dishes and placed them in the warm incubator at the back of the room."],["For two days, Diego checked the incubator every chance he got, and every time, the dishes looked exactly the same.","\"Nothing's happening,\" he complained.","\"Bacteria are too small to see one at a time,\" Ms. Okafor reminded him.","\"Be patient.","You'll only see them when there are millions in one place.\""],["On the third morning, Priya gasped.","The agar was covered with spots: tiny white dots, fuzzy yellow circles, and one orange blob that looked like spilled paint.","Each spot was a colony, a crowd of bacteria grown from just a few that had landed on the jelly.","The keyboard dish was speckled, and the sneaker dish was so crowded that the spots were running into each other."],["Diego stared at the lunch table dish.","It had more colonies than the doorknob dish.","\"But they clean it every day,\" he said quietly.","\"Maybe they clean it with a dirty cloth,\" Priya suggested, and for once she didn't sound like she was trying to win.","Then they looked at the washed-hands dish.","It had only a few small dots."],["\"So I was wrong,\" Diego admitted.","Priya smirked, but only for a second.","\"We were both a little wrong,\" she said.","\"I thought the doorknob would be the worst, and it wasn't even close to the sneaker.\"","Ms. Okafor nodded.","\"That's the whole point of an experiment,\" she said.","\"You don't do it to prove you're right.","You do it to find out what's true.\""],["At lunch that day, Diego walked to the sink before he sat down.","Priya raised an eyebrow, and he shrugged.","\"I've seen the evidence,\" he said."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of the biography?","o":["Semmelweis used careful observation to show that handwashing saved lives, though many ignored him.","Semmelweis was born in Buda and studied medicine at a university in Vienna, Austria.","Louis Pasteur and Joseph Lister were the first scientists to discover that germs exist and cause disease.","Hospitals in the 1800s had two separate clinics where women came to give birth."],"k":0,"why":"The biography explains how Semmelweis studied the problem, discovered that handwashing lowered deaths, and was rejected by other doctors. The other choices are smaller details or not what the text says."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 3, what can the reader infer about the women who came to the hospital?","o":["They knew that the First Clinic was more dangerous.","They preferred to be treated by doctors than by midwives.","They did not know that there were two different clinics.","They believed that bad air caused childbed fever."],"k":0,"why":"Paragraph 3 says the difference was so well known that some women begged not to be sent to the First Clinic. This shows they understood it was more dangerous.","ev":["a3.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 5, what event led Semmelweis to his idea about the doctors' hands?","o":["His friend became sick and died after a cut, with symptoms like the mothers'.","He noticed that the midwives always used a stronger soap than the doctors used.","He learned from Louis Pasteur that tiny germs can cause disease.","He saw that the First Clinic had less fresh air than the Second Clinic."],"k":0,"why":"Paragraph 5 explains that Kolletschka died after being cut, and his symptoms looked like childbed fever. This clue made Semmelweis think the doctors' hands carried something harmful.","ev":["a5.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 9, the author uses the word <b>microorganisms</b>. The Greek root <i>micro</i> means \"small.\" What does microorganisms mean?","o":["living things too small to see without a microscope","chemicals used to clean wounds and surgical tools","large animals that carry diseases from place to place","doctors who study very small parts of the body"],"k":0,"why":"The root micro means small, and an organism is a living thing. Paragraph 9 also calls them \"tiny living microorganisms, or germs.\""},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 8, the author says Semmelweis \"grew more and more frustrated by the <b>resistance</b> to his ideas.\" The suffix <i>-ance</i> turns the verb resist into a noun. What does resistance mean in this sentence?","o":["a refusal to accept something","a strong wish to learn much more","a quick change of opinion","a type of cleaning chemical"],"k":0,"why":"To resist is to fight against something, and -ance makes it a noun. Paragraph 8 describes doctors who were insulted and refused to change, so resistance means refusing to accept his ideas."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 8, which TWO reasons explain why many doctors rejected Semmelweis's idea? Choose TWO answers.","o":["They were offended that their own hands might be harming patients.","He could not explain what the invisible particles actually were.","They had proof that bad air was the real cause of the illness.","Chlorinated lime was too expensive for the hospital to buy.","The death rate did not change after handwashing began."],"ks":[0,1],"why":"Paragraph 8 says some doctors were insulted by the suggestion, and others refused to change because he could not explain what the particles were. Paragraph 7 shows the death rate did fall."},{"on":"a","t":"mc","skill":"text structure","q":"How is paragraph 4 mainly organized?","o":["It describes possible causes that Semmelweis tested and ruled out.","It compares the training of doctors with the training of midwives.","It tells the events of Semmelweis's childhood in time order.","It lists the steps for mixing a chlorinated lime solution."],"k":0,"why":"In paragraph 4, Semmelweis \"checked one possible cause after another\" and found that each change \"made no difference.\" The paragraph is about ruling out causes."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: What evidence in paragraph 7 shows that Semmelweis's handwashing rule worked?","o":["The death rate in the First Clinic dropped from about 18 to about 2 in 100.","The doctors in the First Clinic said that they felt much cleaner and healthier.","The midwives in the Second Clinic also began washing in chlorinated lime.","The hospital gave Semmelweis a new job and a higher position."],"k":0,"why":"Paragraph 7 compares the death rate in April 1847 (about 18 in 100) with the rate a few months after handwashing began (about 2 in 100).","ev":["a7.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"What is the author's main purpose in paragraph 10?","o":["to explain the lesson that Semmelweis's story teaches about science","to describe the steps for washing hands for twenty seconds","to argue that many hospitals today still ignore the importance of germs","to compare Semmelweis with Louis Pasteur and Joseph Lister"],"k":0,"why":"Paragraph 10 says his story \"shows that good science depends on careful observation and evidence.\" The author is explaining the lesson of the story."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of the story?","o":["Experiments help us discover the truth, even when it proves us wrong.","Students should never argue with their friends about science projects at school.","The bottom of a shoe is the dirtiest place in any school.","Teachers always know the answer before an experiment begins."],"k":0,"why":"In paragraph 6, Ms. Okafor says, \"You don't do it to prove you're right. You do it to find out what's true.\" Both students learn they were partly wrong."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Diego change by the end of the story?","o":["He changes his behavior because of what the experiment showed.","He becomes more stubborn and refuses to believe the results.","He decides he wants to become a science teacher like Ms. Okafor.","He stops being friends with Priya because she won the argument."],"k":0,"why":"At the start, Diego is sure the lunch table is clean. At the end, in paragraph 7, he washes his hands before lunch and says he has seen the evidence.","ev":["b7.1","b7.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 6, the author writes that \"Priya <b>smirked</b>, but only for a second.\" What does this word choice suggest about Priya?","o":["She felt a quick moment of pride in being right but did not want to tease Diego.","She was confused by the results and did not understand what they meant.","She was angry that the doorknob was not the dirtiest place in the school.","She was nervous that Ms. Okafor would give her a low grade."],"k":0,"why":"A smirk is a proud, teasing smile. Because it lasted \"only for a second\" and she then says they were both wrong, it suggests she chose to be kind instead of gloating."},{"on":"b","t":"mc","skill":"inference","q":"In paragraph 5, Priya suggests the lunch table is cleaned \"with a dirty cloth.\" What can the reader infer from this idea?","o":["Cleaning only works if the tools used for cleaning are free of germs.","The lunch table is never cleaned by anyone at the school.","Priya thinks the cafeteria workers are lazy and careless.","Cloths are cleaner than cotton swabs for collecting bacteria."],"k":0,"why":"Paragraph 5 shows the table had many colonies even though it is wiped every day. Priya's idea suggests that a dirty cloth could spread germs instead of removing them."},{"on":"ab","t":"mc","skill":"compare texts","q":"How are Diego in the story and the doctors in paragraph 8 of the biography different?","o":["Diego changes his habits after seeing evidence, but the doctors refused to change.","Diego refuses to wash his hands, but the doctors began washing right away.","Diego discovers germ theory, but the doctors never learned about germs.","Diego is insulted by the results, but the doctors were thankful for them."],"k":0,"why":"In the story, Diego washes his hands after seeing the results. In paragraph 8 of the biography, many doctors refused to change their habits even after the death rate fell."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: The washed-hands dish in the story had \"only a few small dots.\" Which idea from the biography does this result support?","o":["Washing hands removes much of what can make people sick.","Bad air is the main way that illness spreads in hospitals.","Midwives' hands are naturally cleaner than doctors' hands.","Germs can only be seen when a microscope is used."],"k":0,"why":"In the biography, handwashing made the death rate fall dramatically. In the story, the washed-hands dish grew very few colonies. Both show that washing removes harmful germs.","ev":["b5.6"],"evq":"Part B: Click the sentence in Text 2 (the story) that best supports your answer to Part A."}],"write":{"prompt":"Both texts show people learning from evidence. Explain how Semmelweis in Text 1 and Diego in Text 2 each use evidence to reach a conclusion. Use at least one detail from each text.","model":"Both Semmelweis and Diego change their thinking because of evidence instead of opinions. In Text 1, Semmelweis noticed that far more mothers died in the doctors' clinic. After he made everyone wash with chlorinated lime, the death rate fell from about 18 to about 2 out of every 100. This evidence showed him that clean hands save lives. In Text 2, Diego believes the lunch table is the cleanest place in school, but the agar dish from the table grows more colonies than the doorknob. Seeing this, he admits he was wrong and washes his hands before lunch. Both characters trust what the results show. The difference is that Diego's classmates accept the evidence, while many of Semmelweis's fellow doctors refused to.","need":["States a claim about how both people use evidence","Uses a detail from the biography, such as the falling death rate","Uses a detail from the story, such as the lunch table dish or the washed-hands dish","Explains how each detail leads to a conclusion"]}},{"id":"s24-spacebones","theme":"Bodies in Space","a":{"title":"Why Astronauts Lift Weights in Space","genre":"Informational","topic":"Human Body","gloss":{"microgravity":["a condition where things feel almost weightless, as in orbit","microgravedad"],"density":["how tightly packed something is","densidad"],"deteriorate":["to become weaker or worse over time","deteriorarse"],"resistance":["a force that pushes back against movement","resistencia"],"underused":["not used enough","poco usado"],"permanent":["lasting forever or for a very long time","permanente"],"constructive":["helpful and leading to improvement","constructivo"],"endurance":["the ability to keep going for a long time","resistencia física"]},"paras":[["Floating in space looks like the most relaxing thing in the world.","Astronauts on the International Space Station drift from one end of a module to the other with a gentle push, and a heavy toolbox can be moved with a single finger.","But this weightless life comes with a hidden cost.","Without the steady pull of gravity, the human body begins to change in ways that can make returning to Earth surprisingly difficult."],["Astronauts on the station are not actually beyond the reach of gravity.","The station is constantly falling around Earth as it orbits, and everything inside it falls along with it, so objects and people seem to float.","Scientists call this condition microgravity.","The prefix micro- means \"very small,\" and in microgravity, the body feels almost none of the force it is used to."],["On Earth, your bones and muscles work against gravity all day long.","Every time you stand, walk, or climb stairs, your leg bones support your weight, and your muscles pull to hold you upright.","This constant workload sends a signal to the body: these bones and muscles are needed, so keep them strong.","Bone is living tissue that is always being broken down and rebuilt, and the stress of carrying your weight keeps the rebuilding side of the process busy."],["In microgravity, that signal fades.","Because the legs, hips, and spine no longer carry the body's weight, the body begins treating them as underused.","Old bone continues to be broken down, but less new bone is built to replace it.","As a result, astronauts can lose about 1 percent of their bone density each month in space, mostly in weight-bearing bones like the hips and legs.","For comparison, an older adult on Earth might lose about 1 percent in an entire year."],["Muscles deteriorate in a similar way.","Muscles that work against gravity, such as those in the calves, thighs, and back, can shrink and weaken quickly when they no longer have to hold the body up.","On long missions without enough exercise, astronauts could lose a large share of their lower-body muscle.","The heart, which is also a muscle, adjusts too, because it no longer has to pump blood uphill against gravity."],["To fight these changes, astronauts on long missions exercise about two hours every day.","The station has a treadmill, where astronauts wear a harness with straps that pull them down toward the running surface so they do not float away.","It also has a stationary bike, which builds endurance in the heart and lungs.","The most important machine for bones, however, is the Advanced Resistive Exercise Device, or ARED."],["Since weights are useless when everything is weightless, ARED uses a clever trick.","Instead of iron plates, it relies on vacuum cylinders, which create a powerful pulling force when a bar or cable is moved.","This resistance allows astronauts to do squats, deadlifts, and other exercises that put heavy stress on their legs and hips.","At its highest setting, ARED can provide up to about 600 pounds of resistance on its bar.","Researchers have found that astronauts who train hard on ARED lose less bone than astronauts who used older equipment."],["Even with exercise, coming home is not easy.","After landing, many astronauts feel dizzy and wobbly, and some need help walking for the first few days.","One study of astronauts who spent months on the station found that about a year after returning, they had recovered only about half of the bone they had lost.","For some, part of the loss may be permanent."],["Studying astronauts' bodies is not only about space travel.","Doctors hope that what they learn from astronauts can help people on Earth with osteoporosis, a disease that makes bones weak and fragile.","The research also matters for the future: a trip to Mars could take about seven months each way, which is a long time for bones to weaken.","Scientists are still searching for constructive solutions, from better exercise machines to medicines, so that future explorers can arrive on another world strong enough to walk on it."]]},"b":{"title":"Should Humans Live on Mars?","genre":"Opinion essay","gloss":{"settlement":["a place where people move to live permanently","asentamiento"],"frontier":["the edge of what has been explored","frontera"],"inhospitable":["very difficult or harsh to live in","inhóspito"],"foresight":["the ability to plan for what might happen in the future","previsión"],"innovations":["new inventions or ways of doing things","innovaciones"],"pioneers":["the first people to explore or settle a new place","pioneros"]},"paras":[["Some of the world's space agencies and companies dream of building a human settlement on Mars.","It sounds exciting, but is it a good idea?","I believe that humans should work toward living on Mars, as long as we take the time to do it safely."],["First, exploring new frontiers has always pushed humans to learn and invent.","The race to reach the Moon in the 1960s led to advances in computers, materials, and medicine.","Solving the problems of living on Mars, like growing food in poor soil and recycling every drop of water, could lead to innovations that help people on Earth, especially in places where food and water are scarce."],["Second, a settlement on Mars would show foresight.","Earth is our only home, and a disaster such as a giant asteroid strike could threaten all life here.","Having humans on more than one planet would give our species a backup plan."],["Of course, there are serious reasons to be cautious.","Mars is an inhospitable place.","Its average temperature is about 80 degrees below zero Fahrenheit, and its thin air is made mostly of carbon dioxide, which humans cannot breathe.","Its weak gravity, a little more than one-third of Earth's, could slowly weaken settlers' bones and muscles.","Many people also argue that the money spent on Mars would be better used to solve problems here at home, like hunger and climate change."],["These concerns are real, and they are exactly why we should move carefully, not stop altogether.","Scientists are already studying how to protect astronauts' bodies on long missions, and every mission teaches them more.","In addition, money spent on space does not vanish into the sky; it pays scientists and engineers on Earth, and their discoveries often help everyone."],["Humans have always been explorers.","Long ago, pioneers crossed oceans without knowing exactly what they would find.","Mars is the next great frontier, and if we are patient and careful, we can meet the challenge."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of the article?","o":["Microgravity weakens bones and muscles, so astronauts must work hard to stay strong.","The International Space Station has a treadmill, a stationary bike, and a machine called ARED.","Astronauts float in the space station because the station is falling around Earth.","A trip from Earth to Mars could take about seven months in each direction."],"k":0,"why":"The article explains how microgravity changes bones and muscles and how astronauts fight those changes with exercise. The other choices are true details, but each comes from only one paragraph."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 2, the author explains that the prefix <i>micro-</i> means \"very small.\" Based on this, what does <b>microgravity</b> mean?","o":["a condition where people feel almost no pull of gravity","a condition where gravity becomes much stronger than on Earth","a tiny machine used to measure how much things weigh","a type of exercise that builds very small muscles"],"k":0,"why":"Paragraph 2 says micro- means very small and that in microgravity the body feels almost none of the force it is used to. So microgravity means very little felt gravity."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraphs 3 and 4, why do astronauts lose bone in space?","o":["Their bones no longer carry weight, so the body builds less new bone.","The vacuum of space pulls minerals out of their bones through the skin.","They eat less food in space, so their bones do not get enough nutrients.","Their bones are broken down faster because they exercise for two hours."],"k":0,"why":"Paragraph 3 explains that carrying weight tells the body to keep bones strong. Paragraph 4 says that in space, old bone is still broken down, but less new bone is built.","ev":["a4.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author compare astronauts with older adults on Earth in paragraph 4?","o":["to help readers understand how fast bone loss happens in space","to show that astronauts are usually older than most adults","to explain why older adults should not travel into space","to prove that bone loss on Earth is more dangerous than in space"],"k":0,"why":"Paragraph 4 says astronauts can lose about 1 percent a month, while an older adult loses about 1 percent a year. The comparison shows that loss in space is about twelve times faster."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraphs 6 and 7, which TWO statements about exercise on the space station are true? Choose TWO answers.","o":["Astronauts on long missions exercise for about two hours each day.","ARED uses vacuum cylinders instead of iron weights to create resistance.","Astronauts run on the treadmill without anything holding them in place.","The stationary bike is the most important machine for protecting bones.","ARED was designed mainly to strengthen the arms and shoulders."],"ks":[0,1],"why":"Paragraph 6 says astronauts exercise about two hours a day, and paragraph 7 explains that ARED uses vacuum cylinders. The treadmill uses a harness, and ARED, not the bike, is most important for bones."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 7, what can the reader infer about the older exercise equipment on the station?","o":["It did not put as much stress on bones as ARED does.","It was heavier and harder to fit inside the station.","It was more fun for astronauts to use than ARED.","It used iron plates that floated away during workouts."],"k":0,"why":"Paragraph 7 says astronauts who train on ARED lose less bone than those who used older equipment. Since heavy stress keeps bones strong, the older machines must not have provided as much.","ev":["a7.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the author writes that the body begins treating the legs, hips, and spine as <b>underused</b>. What does the prefix <i>under-</i> tell you about this word?","o":["It means used too little.","It means used too much.","It means used in the wrong way.","It means used underneath something."],"k":0,"why":"The prefix under- can mean \"not enough,\" as in underpaid. Paragraph 4 explains that in space these bones no longer carry weight, so they are used too little."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: What does paragraph 8 suggest about the effects of a long stay in space?","o":["Some of the damage to bones may last long after astronauts return.","All of the bone that astronauts lose returns within a few days.","Astronauts never feel any effects once they are back on Earth.","Bone loss only happens after astronauts return to Earth's gravity."],"k":0,"why":"Paragraph 8 says astronauts had regained only about half of their lost bone a year later, and that part of the loss may be permanent.","ev":["a8.3","a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author include paragraph 9?","o":["to show that this research matters for people on Earth and for future missions","to explain how the space station falls around Earth as it orbits","to argue that astronauts should stop spending months in space","to describe what astronauts eat to keep their bones strong"],"k":0,"why":"Paragraph 9 connects the research to people with osteoporosis on Earth and to future trips to Mars, showing why it is important beyond the space station."},{"on":"b","t":"mc","skill":"main idea","q":"What is the author's main claim in the opinion essay?","o":["Humans should work toward living on Mars, but carefully and safely.","Humans should never try to live on Mars because it is too dangerous.","Money for space should be used to end hunger on Earth instead.","Mars is a better place to live than Earth for future generations."],"k":0,"why":"At the end of paragraph 1, the author says, \"humans should work toward living on Mars, as long as we take the time to do it safely.\""},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the author respond to people who think living on Mars is too risky?","o":["The author agrees the risks are real but says they are a reason to go slowly.","The author says the risks are made up and not worth worrying about.","The author agrees with them and decides that humans should stay on Earth.","The author says only robots should be sent until the risks disappear."],"k":0,"why":"In paragraph 5, the author admits the concerns are real but says they are a reason to \"move carefully, not stop altogether.\"","ev":["b5.1"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 4, the author calls Mars an <b>inhospitable</b> place. The prefix <i>in-</i> means \"not.\" What feeling does this word create?","o":["that Mars is harsh and unwelcoming to people","that Mars is peaceful and easy to explore","that Mars is crowded with too many visitors","that Mars is mysterious and full of hidden life"],"k":0,"why":"Hospitable means welcoming, and in- means not. The details that follow in paragraph 4, such as freezing temperatures and air humans cannot breathe, show Mars is harsh and unwelcoming."},{"on":"b","t":"mc","skill":"author's purpose","q":"Why does the author mention pioneers who \"crossed oceans\" in the last paragraph?","o":["to suggest that going to Mars continues a long human tradition of exploring","to show that traveling by ship is safer than traveling by rocket","to explain how pioneers solved the problem of growing food in poor soil","to argue that people should explore Earth's oceans before going to Mars"],"k":0,"why":"Paragraph 6 begins \"Humans have always been explorers\" and compares Mars to earlier journeys into the unknown, so the author is linking Mars to a long history of exploration."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the article add to the reader's understanding of the essay's concern about weak gravity on Mars?","o":["The article explains in detail how low gravity causes bone and muscle loss.","The article proves that the gravity on Mars is stronger than the gravity on Earth.","The article argues that humans should never travel to Mars at all.","The article describes the money that has been spent on Mars missions."],"k":0,"why":"The essay mentions in one sentence that weak gravity could weaken bones. The article explains how it happens, how fast, and how astronauts fight it."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: The essay says scientists are \"already studying how to protect astronauts' bodies on long missions.\" Which detail from the article best supports this statement?","o":["Scientists are testing new machines and medicines to protect explorers.","Astronauts can move a heavy toolbox with just one finger.","Many astronauts feel dizzy and wobbly after landing.","The station is constantly falling around Earth as it orbits."],"k":0,"why":"Paragraph 9 of the article says scientists are searching for better exercise machines and medicines so future explorers stay strong, which supports the essay's statement.","ev":["a9.4"],"evq":"Part B: Click the sentence in Text 1 (the article) that best supports your answer to Part A."}],"write":{"prompt":"The essay argues that humans should go to Mars carefully. Use information from both texts to explain one challenge a Mars settler's body would face and how it could be handled. Use at least one detail from each text.","model":"One major challenge for Mars settlers would be keeping their bones and muscles strong. Text 2 explains that Mars's gravity is only \"a little more than one-third of Earth's,\" which could weaken settlers' bodies. Text 1 shows why this is a problem. In microgravity, astronauts can lose about 1 percent of their bone density every month because their bones no longer carry their weight. Text 1 also shows how the problem can be handled. Astronauts exercise about two hours a day and use ARED, a machine with vacuum cylinders, to do squats and deadlifts. Settlers on Mars could follow a similar routine. Together, the texts show that the challenge is serious, but careful planning and daily exercise could help settlers stay strong.","need":["Names one challenge to the body, such as bone or muscle loss","Uses a detail from the essay about conditions on Mars","Uses a detail from the article about bone loss or exercise","Explains how the challenge could be handled"]}},{"id":"s25-molina","theme":"Protecting the Sky","a":{"title":"Mario Molina and the Hole in the Sky","genre":"Biography","topic":"History of Science","gloss":{"stratosphere":["the layer of air high above the clouds where the ozone layer is found","estratosfera"],"ultraviolet":["a kind of invisible sunlight that can burn skin and harm living things","ultravioleta"],"molecules":["the tiny particles that a substance is made of","moléculas"],"catalyst":["something that speeds up a chemical change without being used up","catalizador"],"skeptical":["doubting that something is true","escéptico"],"destructive":["causing a lot of damage","destructivo"],"testified":["spoke officially in front of a group, such as lawmakers, to give information","testificó"],"treaty":["a formal agreement between countries","tratado"],"phase out":["to stop using something a little at a time","eliminar gradualmente"]},"paras":[["When Mario Molina was a boy in Mexico City, one of the bathrooms in his family's house was hardly ever used.","So Mario turned it into a laboratory.","He filled it with chemistry sets and spent hours mixing solutions and peering through a toy microscope at tiny creatures swimming in drops of water.","His aunt, Esther Molina, was a chemist, and she helped him try experiments that were more advanced than anything in his kits.","By the time he was a teenager, Mario had already decided that he wanted to be a research chemist."],["Molina was born on March 19, 1943.","When he was eleven, his parents sent him to a boarding school in Switzerland, partly so that he could learn German, a language many chemists used at the time.","He later earned a degree in chemical engineering from the National Autonomous University of Mexico (UNAM) in 1965, studied further in Germany, and then completed his doctorate at the University of California, Berkeley, in 1972."],["In 1973, Molina joined the laboratory of F. Sherwood Rowland, a chemistry professor at the University of California, Irvine.","Rowland gave him a choice of projects, and Molina picked a question that seemed simple: what happens to chlorofluorocarbons, or CFCs, once they are released into the air?","At the time, CFCs were everywhere.","They were used to cool refrigerators and air conditioners and to push the spray out of aerosol cans.","Because CFCs do not easily react with other substances, most people thought they were perfectly safe."],["Molina discovered that this stability was exactly the problem.","Since nothing in the lower air breaks CFCs down, they slowly drift upward for years until they reach the stratosphere, a layer of the atmosphere high above the clouds.","There, strong ultraviolet light from the Sun finally splits the CFC molecules apart and releases chlorine atoms.","Each chlorine atom acts as a catalyst, destroying an ozone molecule and then moving on to destroy another, and another.","A single chlorine atom can destroy about 100,000 ozone molecules before it is finally removed."],["This mattered because the ozone layer protects life on Earth.","Ozone in the stratosphere absorbs much of the Sun's harmful ultraviolet radiation, which can cause sunburn and skin cancer in people and damage plants and ocean life.","If CFCs kept building up, Molina and Rowland realized, the ozone layer could grow dangerously thin.","In June 1974, they published their findings in the scientific journal <i>Nature</i>."],["Many people did not want to believe them.","Companies that made CFCs earned large amounts of money, and some industry leaders were skeptical, calling the idea unproven.","Molina and Rowland knew that publishing a paper was not enough.","They decided to share their findings not only with other scientists but also with lawmakers and reporters, because they believed that was the only way to get society to act.","They spoke at scientific meetings, and they testified before government committees about the dangers of CFCs."],["Over the next decade, evidence piled up.","In 1985, scientists reported a startling discovery: every spring, a huge \"hole\" in the ozone layer was forming over Antarctica.","Molina, who was then working at the Jet Propulsion Laboratory in California, helped show how chemical reactions on icy clouds high above the South Pole made chlorine even more destructive there."],["The discovery of the ozone hole helped convince world leaders to take action.","In 1987, countries signed the Montreal Protocol, a treaty to phase out CFCs and other chemicals that harm the ozone layer.","Over time, every country in the United Nations agreed to it.","Scientists now expect the ozone layer to recover to its 1980 condition over most of the world by around 2040, and over Antarctica by around 2066."],["In 1995, Molina shared the Nobel Prize in Chemistry with Rowland and the Dutch scientist Paul Crutzen for their research on the ozone layer.","He was the first person born in Mexico to win a Nobel Prize in a science.","Molina went on to teach at the Massachusetts Institute of Technology and later at the University of California, San Diego, and he spent the rest of his life working on air pollution and climate change.","He died in Mexico City in 2020."],["Mario Molina's story shows that a curious question, asked carefully, can protect the entire planet.","The boy who once experimented in a spare bathroom grew up to help save the invisible shield that makes life on Earth possible."]]},"b":{"title":"The Invisible Umbrella","genre":"Poem","poem":true,"gloss":{"fragile":["easily broken or damaged","frágil"],"unseen":["not able to be seen","invisible"],"fray":["to wear thin and start to come apart","deshilacharse"],"mended":["fixed or repaired","remendado"],"slender":["thin","delgado"],"glare":["a very strong, harsh light","resplandor"]},"paras":[["High above the highest cloud,","beyond where eagles fly,","a slender, unseen umbrella","is open in the sky."],["It catches arrows from the Sun","too sharp for us to bear,","and lets the gentle sunlight through","to warm the summer air."],["We never thought to thank it;","we sprayed our clouds of haze,","until its silver fabric","began to fray and fade."],["Then someone looked up closely","and saw the thinning seam,","and the whole world stopped to listen","and mended it as a team."],["So when you squint against the glare","on a bright and cloudless day,","remember the fragile shield up there","that keeps the sharpest rays away."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of the biography?","o":["Mario Molina's research on CFCs helped lead the world to protect the ozone layer.","Mario Molina turned an unused bathroom in his family's house into a chemistry lab.","CFCs were once used in refrigerators, air conditioners, and spray cans.","The ozone layer over Antarctica is expected to recover by around 2066."],"k":0,"why":"The biography explains Molina's discovery about CFCs, how he warned the world, and how countries acted to protect the ozone layer. The other choices are single details from one paragraph."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: What does paragraph 1 suggest about Mario Molina as a child?","o":["He was so curious about science that he created his own place to explore it.","He was lonely and spent time in the bathroom to avoid his family.","He was much more interested in learning German than he was in learning chemistry.","He was told by his aunt that he had to become a research chemist."],"k":0,"why":"Paragraph 1 says Mario turned an unused bathroom into a laboratory and spent hours experimenting. This shows a curious child who made his own space for science.","ev":["a1.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 4, why are CFCs able to reach the stratosphere?","o":["Nothing in the lower air breaks them down, so they slowly rise.","Strong ultraviolet light pulls them upward from Earth's surface.","Spray cans shoot them high into the sky with great force.","Chlorine atoms carry them up into the ozone layer."],"k":0,"why":"Paragraph 4 explains that because nothing in the lower air breaks CFCs down, they drift upward for years until they reach the stratosphere.","ev":["a4.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the author says each chlorine atom \"acts as a <b>catalyst</b>, destroying an ozone molecule and then moving on to destroy another.\" What does catalyst mean?","o":["something that causes a chemical change over and over without being used up","something that blocks the Sun's harmful light from ever reaching the ground below","something that is destroyed the first time it touches ozone","something that cools the air inside a refrigerator"],"k":0,"why":"Paragraph 4 explains that a chlorine atom destroys one ozone molecule and then moves on to another. That shows a catalyst keeps causing a change without being used up."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 7, the author says icy clouds made chlorine \"even more <b>destructive</b>.\" The root <i>struct</i> means \"build,\" the prefix <i>de-</i> means \"undo\" or \"down,\" and the suffix <i>-ive</i> means \"tending to.\" What does destructive mean?","o":["tending to cause damage or tear things down","tending to build new and stronger things","tending to freeze into hard pieces of ice","tending to rise slowly high into the sky"],"k":0,"why":"De- (undo) plus struct (build) plus -ive (tending to) means tending to un-build, or tear down. In paragraph 7, chlorine destroys ozone, so destructive means causing damage."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 6, which TWO actions did Molina and Rowland take to make sure people acted on their findings? Choose TWO answers.","o":["They testified before government committees.","They shared their findings with lawmakers and reporters.","They started a company that sold safer spray cans.","They traveled to Antarctica to measure the ozone hole.","They kept their work secret until they had more proof."],"ks":[0,1],"why":"Paragraph 6 says they shared their findings with lawmakers and reporters and testified before government committees. They did not keep their work secret, and the text never says they went to Antarctica."},{"on":"a","t":"mc","skill":"text structure","q":"How are paragraphs 7 and 8 mainly organized?","o":["as a cause and effect: the ozone hole discovery led countries to sign a treaty","as a comparison between the ozone layer over Antarctica and over Mexico","as a list of the steps Molina followed to earn his doctorate","as a problem with no solution, since the ozone hole keeps growing"],"k":0,"why":"Paragraph 7 describes the discovery of the ozone hole, and paragraph 8 begins, \"The discovery of the ozone hole helped convince world leaders to take action.\" One event caused the other."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer from paragraph 8 about the Montreal Protocol?","o":["It has worked, because the ozone layer is expected to heal.","It failed, because most countries never stopped using CFCs.","It was signed only by Mexico and the United States.","It was written by Molina and Rowland in 1974."],"k":0,"why":"Paragraph 8 says every country agreed to the treaty and that scientists now expect the ozone layer to recover. This suggests the treaty is working.","ev":["a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author end the biography by mentioning \"the boy who once experimented in a spare bathroom\"?","o":["to connect Molina's childhood curiosity to his great achievement","to explain that most famous scientists got their start in bathrooms","to show that Molina never had a real laboratory as an adult","to suggest that children should not do experiments at home"],"k":0,"why":"Paragraph 10 links back to the bathroom lab in paragraph 1 to show how the curiosity he had as a boy grew into work that protected the planet."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of the poem?","o":["We should value and protect the things that quietly keep us safe.","Bright, sunny days are the very best time to look up at the sky above.","Umbrellas are u
