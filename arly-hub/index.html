eaders, while Text 1 mainly informs them about a person's life.","Text 2 tells about a person's life, while Text 1 tries to persuade readers to learn to code.","Text 2 explains how the Analytical Engine worked, while Text 1 explains debugging.","Both texts try to convince readers that computers can think on their own."],"why":"Text 1 is a biography that tells the events of Lovelace's life. Text 2 is an opinion essay that states a claim (“I believe every student should learn…”) and gives reasons.","k":0},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 would best support the claim in Text 2, paragraph 3, that coding is creative?","o":["Lovelace saw that a machine could work with music and patterns, not only numbers.","Lovelace's notes grew to be about three times as long as Menabrea's article.","Babbage could not raise enough money to finish the Analytical Engine.","Lovelace warned that the engine could not create original ideas on its own."],"why":"Paragraph 6 of Text 1 says the engine “might act upon other things besides number,” such as music. That matches Text 2's point that students use code to compose music and design animations.","ev":["a6.3","a6.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0}],"write":{"prompt":"Both texts suggest that working with computers is about more than doing arithmetic. Explain how Text 1 and Text 2 each show this idea. Use at least one detail from each text.","model":"Both texts show that computers are about much more than arithmetic. In Text 1, Ada Lovelace realized that the Analytical Engine “might act upon other things besides number,” such as music. She understood that anything turned into symbols could be processed by a machine. In Text 2, the author explains that coding is creative because students use it to design animations, compose music, and build games. The author also says debugging taught patience and a strategy for solving hard problems. Together, these details prove that working with computers takes imagination and problem-solving, not just calculating. Lovelace saw this possibility in 1843, and today students can experience it for themselves.","need":["States a clear claim that computers or coding involve more than arithmetic","Uses a detail from Text 1 about Lovelace's ideas","Uses a detail from Text 2 about what coding teaches or creates","Explains how the details support the claim"]}},{"id":"s17-gps","theme":"Finding Your Way","a":{"title":"Finding Your Place from Space","genre":"Informational","topic":"Technology and Engineering","gloss":{"precise":["exact and correct down to tiny details","preciso"],"broadcasts":["sends out a signal for many receivers to pick up","transmite"],"receiver":["a device that picks up signals","receptor"],"trilateration":["finding a location by measuring distances from known points","trilateración"],"altitude":["height above sea level or the ground","altitud"],"relativity":["Einstein's ideas about how time and space change with speed and gravity","relatividad"],"drift":["to slowly move away from the right place","desviarse"]},"paras":[["Open a map app on a phone, and a small blue dot appears almost instantly, showing where you are standing.","It feels like magic, but that dot is the result of precise engineering, careful timing, and a little geometry.","It depends on the Global Positioning System, or GPS, a network of satellites circling high above Earth."],["The United States Department of Defense developed GPS for military navigation, and it was later opened up for anyone to use for free.","Today the system is operated by the U.S. Space Force.","The satellites fly about 20,200 kilometers (roughly 12,550 miles) above the surface, and each one circles the planet twice a day.","They travel along six orbital paths, like invisible hoops arranged at different positions around Earth.","The system is designed around 24 main positions, but about 30 working satellites are usually in orbit, so spares can take over if one fails.","This arrangement means that from almost anywhere on Earth, a receiver can pick up signals from several satellites at once."],["Each satellite constantly broadcasts a radio signal that carries information about the satellite's position and the exact time the signal left it.","To keep that time accurate, every GPS satellite carries atomic clocks, which keep time by tracking the extremely regular behavior of atoms.","A phone, a car's navigation system, or a hiker's handheld unit is a GPS receiver.","It only listens; it does not send any signal back up to the satellites."],["When a receiver picks up a signal, it compares the time the signal was sent with the time it arrived.","Radio waves travel at the speed of light, about 300,000 kilometers per second.","By multiplying that speed by the travel time, the receiver calculates its distance from the satellite.","Because light moves so fast, the timing must be incredibly exact: an error of just one millionth of a second would throw the distance off by about 300 meters, roughly the length of three football fields."],["Knowing your distance from one satellite is not enough to find your location.","To see why, imagine a simpler problem on a flat map.","If you know you are exactly 10 miles from a town, you could be anywhere on a circle around that town.","If you also know you are 15 miles from a second town, the two circles cross at only two points.","A distance from a third town tells you which of those two points is correct.","This method of finding a position from distances is called trilateration."],["In space, the same idea works in three dimensions.","Each distance creates an imaginary sphere around a satellite, and the receiver must be somewhere on the surface of that sphere.","Two spheres overlap in a circle, and a third sphere narrows the possibilities to two points.","One of those points is usually far out in space or deep underground, so it can be ruled out.","So why does a receiver need a fourth satellite?"],["The answer is the clock inside your phone.","Atomic clocks are too large and expensive to put in everyday devices, so a phone uses an ordinary clock that is slightly off.","Even that tiny error would ruin every distance calculation.","By using signals from at least four satellites, the receiver can solve for four unknowns at once: latitude, longitude, altitude, and the exact amount its own clock is wrong.","In effect, the satellites lend their precise timing to the device in your pocket."],["Engineers must even account for Albert Einstein's theories of relativity.","Because the satellites move fast and feel weaker gravity far above Earth, their clocks run about 38 millionths of a second per day faster than clocks on the ground.","That sounds tiny, but if engineers did not correct for it, GPS positions would drift by roughly 10 kilometers every day."],["GPS is impressive, but it is not perfect.","Under open sky, a smartphone is typically accurate to within about 5 meters (16 feet).","Tall buildings, bridges, and thick trees can block signals, and signals that bounce off walls can confuse a receiver.","Indoors or underground, GPS often struggles to work at all.","Phones also need power, so a dead battery means no blue dot.","That is why hikers, sailors, and pilots still learn to read paper maps and use a compass: a skilled navigator always has a backup plan."]]},"b":{"title":"Follow Your Shadow","genre":"Realistic fiction","gloss":{"trailhead":["the place where a hiking trail begins","inicio del sendero"],"tangle":["a messy, twisted mass of things","maraña"],"echoed":["was repeated, like a sound bouncing back","resonó"],"downstream":["in the direction a river or creek flows","río abajo"],"current":["the flowing movement of water","corriente"],"glittered":["sparkled with tiny flashes of light","brillaba / centelleaba"]},"paras":[["The trail had looked simple on Marco's phone that morning: a loop through the pines, down to Cedar Creek, and back to the parking lot.","Now, at two o'clock in the afternoon, Lena stared at the black screen in her cousin's hand.","“It just died,” Marco said, pressing the button again and again.","“It was at twelve percent an hour ago.”"],["Lena felt her stomach tighten.","The trees all looked the same, and the path they had followed had faded into a tangle of fallen branches and ferns.","She wanted to run in any direction, but her grandfather's voice echoed in her head: When you're lost, stop first, think second, and move last."],["She sat down on a log and unzipped the side pocket of her backpack.","Inside, folded into a soft square, was the paper trail map the ranger had handed them at the trailhead.","Marco had laughed at it that morning.","“Who uses paper anymore?” he had asked.","He wasn't laughing now."],["Lena spread the map across her knees.","The parking lot sat on the eastern edge of the park, and Cedar Creek flowed east right past it.","“If we find the creek and follow it downstream, it should lead us back,” she said.","“But which way is east?” Marco asked.","“Everything here looks the same.”"],["Lena looked up through the branches.","The sun was still bright, but it had slid partway down from the top of the sky.","“The sun rises in the east and sets in the west,” she said slowly.","“It's afternoon, so it's already moving toward the west.”","She pointed at her shadow, which stretched across the dirt in front of her.","“Shadows point away from the sun, so in the afternoon, our shadows point roughly east.”"],["Marco stood beside her and studied his own shadow, a long, thin shape reaching between the pines.","“So we follow our shadows,” he said.","“Exactly.”"],["They walked with the warm sun on their backs, checking their shadows every few minutes.","Twenty minutes later, Lena heard it before she saw it: the rush of water over rocks.","Cedar Creek glittered through the trees.","They followed the current, and soon the gravel parking lot appeared, with Aunt Rosa's blue car waiting at the far end."],["Marco let out a long breath.","“I'm keeping a paper map in my backpack from now on,” he said.","Lena smiled and tucked the map back into its pocket.","“And maybe a charger, too.”"]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["GPS finds a location by timing signals from several satellites and using geometry.","GPS was first built for the military and is now run by the U.S. Space Force.","GPS satellites carry atomic clocks that run faster than clocks on Earth.","GPS works perfectly anywhere on Earth, indoors or outdoors, as long as the phone has power."],"why":"Most of the text, especially paragraphs 3 through 7, explains how timed signals and distances from several satellites reveal a location. The other choices are small details or, in the last case, contradicted by paragraph 9.","k":0},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 7, why does a GPS receiver need signals from at least four satellites instead of three?","o":["The fourth signal lets the receiver figure out the error in its own clock.","The fourth satellite sends a stronger signal that passes through buildings.","The fourth signal tells the receiver which satellites are only spares.","The fourth satellite carries the only atomic clock in the whole system."],"why":"Paragraph 7 explains that a phone's ordinary clock is slightly off, and the fourth signal lets the receiver solve for “the exact amount its own clock is wrong.”","ev":["a7.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the author names a method called <b>trilateration</b>. The word begins with the Latin prefix <i>tri-</i>. What does <b>trilateration</b> mean?","o":["finding a spot using distances from three known points","measuring time by tracking the regular behavior of atoms","sending a radio signal from one satellite to another","drawing circles on a paper map to show nearby towns"],"why":"The prefix tri- means “three.” Paragraph 5 shows that distances from three towns pin down a position, and then calls this method trilateration.","k":0},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraphs 3 and 4, why do GPS satellites need atomic clocks instead of ordinary ones?","o":["Even a tiny timing mistake would cause a large error in distance.","Atomic clocks are cheaper and lighter than ordinary clocks.","Radio signals travel slowly, so the clocks must wait a long time.","Atomic clocks let the satellites receive signals sent from phones."],"why":"Paragraph 4 says an error of one millionth of a second would throw the distance off by about 300 meters. Clocks that exact are needed, so satellites carry atomic clocks.","ev":["a4.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 9, which TWO things can make GPS less accurate? Choose TWO answers.","o":["tall buildings or thick trees that block the signals","signals that bounce off walls before reaching the receiver","satellites that move too slowly in their orbits","phones that send too many signals up to space","clouds that hide the sun in the middle of the day"],"why":"Paragraph 9 names buildings, bridges, and trees that block signals, and signals that bounce off walls. Paragraph 3 says phones do not send signals to satellites at all.","ks":[0,1]},{"on":"a","t":"mc","skill":"text structure","q":"How does the author help readers understand trilateration in paragraphs 5 and 6?","o":["By explaining a simple example on a flat map before applying it to space","By listing the steps engineers followed when they launched each satellite","By comparing GPS to older tools such as the compass and paper map","By describing a problem and then explaining why it cannot be solved"],"why":"Paragraph 5 starts with an easy example about distances from towns on a flat map. Paragraph 6 then says “in space, the same idea works in three dimensions.”","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 8, the author says GPS positions would <b>drift</b> by roughly 10 kilometers every day. What does <b>drift</b> mean here?","o":["slowly move away from the correct spot","suddenly vanish from the phone's screen","float gently along on moving water","speed up as the satellites travel"],"why":"Paragraph 8 explains that small clock differences would add up each day, so the position shown would slowly move away from the true location. “Float on water” is a different meaning of drift.","k":0},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author include paragraph 9?","o":["To explain the limits of GPS and why backup skills still matter","To persuade readers to stop using map apps on their phones","To describe how engineers solved the problem of tall buildings","To show that paper maps are always more accurate than GPS"],"why":"Paragraph 9 begins by saying GPS “is not perfect,” lists what can go wrong, and ends by explaining that navigators still learn maps and compasses as a backup plan.","ev":["a9.1","a9.6"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"key details","q":"According to paragraph 2, why are there usually more working satellites than the 24 main positions?","o":["So spare satellites can take over if one stops working","So each satellite only has to circle Earth once a day","So the military and the public can each have their own","So the satellites can carry larger atomic clocks"],"why":"Paragraph 2 says about 30 satellites are usually in orbit “so spares can take over if one fails.”","k":0},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of Text 2?","o":["Staying calm and using what you know can solve a problem when technology fails.","Paper maps are always better than phones, so people should stop using technology.","Younger cousins should always obey older cousins when they go hiking.","Hiking in the woods is too dangerous for kids to try without adults."],"why":"Lena stops, thinks, and uses the map and the sun instead of panicking (paragraphs 2 through 6). Their calm thinking gets them back after the phone dies.","k":0},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Marco's attitude toward the paper map change during the story?","o":["He goes from laughing at it to planning to always carry one.","He goes from trusting it to deciding that it is useless.","He goes from ignoring it to being angry that Lena packed it.","He goes from being curious about it to forgetting about it."],"why":"In paragraph 3 Marco had laughed at the map, but in paragraph 8 he says he will keep one in his backpack from now on.","ev":["b3.3","b8.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A.","k":0},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 2, Lena “felt her stomach <b>tighten</b>.” What does this phrase suggest?","o":["She is starting to feel nervous and afraid.","She is hungry because they skipped lunch.","She is excited to explore a new trail.","She is tired from climbing up a hill."],"why":"Paragraph 2 describes the moment Lena realizes they are lost. A tightening stomach is a physical sign of worry or fear.","k":0},{"on":"b","t":"mc","skill":"inference","q":"Based on paragraph 2, why does Lena sit down instead of running?","o":["She remembers advice to stay calm and think before moving.","She is too tired to walk any farther on the trail.","She wants to wait for Aunt Rosa to come and find them.","She hopes the phone will turn back on if they rest."],"why":"Paragraph 2 says she wanted to run, but she remembered her grandfather's rule: stop first, think second, and move last. Sitting down shows she follows that advice.","k":0},{"on":"ab","t":"mc","skill":"compare texts","q":"Text 1 ends by saying a skilled navigator “always has a backup plan.” How does Text 2 add to this idea?","o":["It shows characters using a backup plan after their phone stops working.","It explains the science of how satellites send their timing signals.","It argues that GPS should be replaced by paper maps everywhere.","It proves that atomic clocks are needed to find directions."],"why":"Text 1 states the idea in paragraph 9. Text 2 shows it in action when Lena and Marco use a paper map and the sun to find their way.","k":0},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which detail from Text 1 best explains the cousins' problem at the start of Text 2?","o":["Phones need power, so a dead battery means no location.","Tall buildings and thick trees can block the signals.","Satellite clocks run faster than clocks on the ground.","A receiver needs signals from at least four satellites."],"why":"In Text 2, paragraph 1, Marco's phone dies. Text 1, paragraph 9, explains that a dead battery means no blue dot at all.","ev":["a9.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0}],"write":{"prompt":"Text 1 and Text 2 both deal with finding your way. Explain what each text shows about the tools people use to navigate. Use at least one detail from each text.","model":"Both texts show that modern tools are helpful, but people still need basic navigation skills. Text 1 explains that GPS uses signals from at least four satellites to find a location within about 5 meters. However, it also warns that a dead battery means “no blue dot,” so navigators keep paper maps as a backup. Text 2 shows this warning coming true. When Marco's phone dies, Lena uses the ranger's paper map and the afternoon sun to figure out that their shadows point east. Following their shadows leads them to the creek and back to the car. Together, the texts prove that technology is powerful, but knowing simple skills can save you when technology fails.","need":["States what both texts show about navigation tools","Uses a detail from Text 1 about how GPS works or its limits","Uses a detail from Text 2 about the map or the sun","Explains how the details connect to the claim"]}},{"id":"s18-plastic","theme":"There Is No Away","a":{"title":"The Long Journey of Plastic","genre":"Informational","topic":"Earth and Space Science","gloss":{"mismanaged":["handled badly or carelessly","mal gestionado"],"contaminate":["to make dirty or impure","contaminar"],"decline":["to become worse or lower","disminuir / empeorar"],"transport":["to carry from one place to another","transportar"],"gyres":["huge, slowly circling systems of ocean currents","giros oceánicos"],"debris":["scattered pieces of trash or broken things","desechos / escombros"],"effective":["working well to get the result you want","eficaz"]},"paras":[["When you toss an empty water bottle into a bin, it disappears from your life in seconds.","But the bottle does not disappear from the planet.","Plastic is designed to be strong, light, and long-lasting, which makes it useful for packaging food and medicine.","Those same qualities create a problem once we are finished with it, because many plastics can last for decades, and scientists think some may last for centuries."],["The amount of plastic waste is enormous.","According to a 2022 report from the Organisation for Economic Co-operation and Development (OECD), the world produced about 353 million metric tons of plastic waste in 2019, more than double the amount in 2000.","The report estimated that only about 9 percent of that waste was recycled.","About 19 percent was burned, and roughly half was buried in landfills.","The remaining 22 percent was mismanaged, meaning it was dumped in open areas, burned in uncontrolled fires, or ended up in rivers, soil, and oceans."],["Many plastic items are stamped with a small number from 1 to 7, often inside a triangle.","These numbers, called resin identification codes, were introduced in 1988 by a plastics industry group to show what kind of plastic an item is made of.","For example, number 1 marks the clear plastic used in most water and soda bottles, and number 2 marks the sturdy plastic in milk jugs.","Here is the surprising part: the code does not mean an item can be recycled.","Many curbside recycling programs accept numbers 1 and 2 but rarely take items like plastic bags and foam takeout boxes."],["Why is so little plastic recycled?","One reason is that recycling is complicated.","Different types of plastic must be separated before they can be melted down, and an item made of several layers or materials can be nearly impossible to sort.","Food scraps and grease can contaminate a load of recyclables.","The OECD found that only about 15 percent of plastic waste is even collected for recycling, and a large share of that is later thrown away as leftover material.","Recycling can also be expensive, and brand-new plastic is often cheaper to make than recycled plastic."],["Even when plastic is recycled, it usually cannot be recycled forever.","Each time it is melted and reshaped, its quality tends to decline.","A bottle might become carpet fibers or the fleece in a jacket, but those products are much harder to recycle again."],["Plastic that escapes into nature does not rot the way a banana peel does.","Instead, sunlight, waves, and wind slowly break it into smaller and smaller pieces.","Pieces smaller than 5 millimeters, about the size of a sesame seed, are called microplastics.","Some microplastics start out tiny, such as fibers that shed from synthetic clothing in the wash and bits worn off car tires.","Scientists have found microplastics in oceans, rivers, soil, and the bodies of fish and other animals."],["Rivers and wind transport plastic waste from land to the sea.","There, currents carry much of it into gyres, which are enormous, slowly rotating systems of ocean currents.","Over time, debris collects in certain areas of these gyres, forming what are known as garbage patches.","The best known, the Great Pacific Garbage Patch, lies in the North Pacific Ocean between Hawaii and California.","Despite its name, it is not a floating island of trash that a person could walk on.","Most of its pieces are microplastics scattered through the water, which scientists at the National Oceanic and Atmospheric Administration compare to pepper flakes swirling in soup.","Because the pieces are so small and spread out, the patch cannot be seen from space, and it is extremely hard to clean up."],["Ocean plastic harms wildlife.","Sea turtles can mistake floating bags for jellyfish, and seabirds may swallow bright fragments that look like food.","Animals can also become tangled in abandoned fishing nets and other large debris."],["Because cleaning up the ocean is so difficult, many scientists say the most effective solution is to stop plastic from getting there in the first place.","Communities can improve waste collection, companies can design packaging that is easier to recycle or reuse, and individuals can choose reusable bottles and bags.","Learning what the numbers on plastic really mean is a good first step.","After all, when we throw something away, there is no such place as “away.”"]]},"b":{"title":"The Raccoon and the River","genre":"Fable","gloss":{"flung":["threw hard and carelessly","arrojó"],"delighted":["very pleased","encantado"],"servant":["someone who does work for another","sirviente"],"snagged":["got caught on something","se enganchó"],"politely":["in a kind and respectful way","cortésmente"],"lapping":["gently splashing against something","lamiendo / chapoteando suavemente"],"soggy":["soaked and soft from water","empapado"],"scrambled":["climbed quickly and clumsily","trepó a toda prisa"]},"paras":[["Beside a quick, clear river there once lived a raccoon who hated chores.","Each evening he feasted on berries, nuts, and whatever treasures he could find, and each evening he flung the shells, husks, and scraps into the water.","The river swept them out of sight, and Raccoon was delighted.","“What a fine servant the river is,” he said.","“It carries everything away.”"],["Downstream, Beaver was patching her dam when a clump of husks and shells snagged against the sticks.","She pulled it loose, but the next night there was more, and the night after that, more still.","At last she swam upstream to the raccoon's den.","“Friend,” she said politely, “the things you throw into the river are piling up against my dam.”","Raccoon waved a paw.","“Nonsense. I throw them away, and away is very far from here.”"],["“There is no such place as away,” said Beaver.","“There is only somewhere else.”","But Raccoon just laughed and tossed an apple core over her head."],["Weeks passed.","The pile against the dam grew higher and wider until the water could no longer slip between the sticks.","The pond behind the dam began to rise.","It crept over its banks, through the reeds, across the meadow, and up the slope where Raccoon slept.","One morning he awoke to cold water lapping at his tail.","Floating all around him, soggy and familiar, were the very shells, husks, and scraps he had thrown away."],["Raccoon scrambled onto a high branch, dripping and embarrassed.","Below him, Beaver paddled by.","“It seems your things have come home,” she said.","That afternoon, Raccoon helped Beaver clear her dam, one soggy shell at a time.","From then on, he buried his scraps beneath the old oak, where they slowly turned back into soil."],["Moral: What we throw away does not vanish; it only goes somewhere else, and sooner or later it may find its way back to us."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Most plastic waste is not recycled, so it builds up on land and in the ocean.","The numbers stamped on plastic items show which ones go in recycling bins.","The Great Pacific Garbage Patch is a floating island of trash near Hawaii.","Plastic is useful for packaging because it is strong, light, and long-lasting."],"why":"Paragraphs 2 through 8 explain that little plastic is recycled and that the rest piles up in landfills, nature, and the ocean. Two of the wrong choices are actually corrected in paragraphs 3 and 7.","k":0},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 3, what is a common misunderstanding about the numbers stamped on plastic items?","o":["People think the number means an item is recyclable, but it only names the plastic type.","People think the number shows the year the item was made, but it actually tells the store price.","People think only bottles have numbers, but every kind of product has one.","People think number 1 is the best plastic, but it is really the weakest one."],"why":"Paragraph 3 explains the codes “show what kind of plastic an item is made of” and then says the surprising part: the code “does not mean an item can be recycled.”","ev":["a3.4","a3.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 7, rivers and wind <b>transport</b> plastic waste from land to the sea. The word is built from the prefix <i>trans-</i> and the root <i>port</i>. What does <b>transport</b> mean?","o":["carry from one place to another","break into very small pieces","hide from view under water","stop from moving any farther"],"why":"Trans- means “across” and the root port means “carry.” Paragraph 7 describes rivers and wind carrying plastic across from land to the sea.","k":0},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: Based on paragraph 4, why is so little plastic recycled?","o":["Plastic must be sorted and kept clean, which is hard and costly.","Most plastic is too heavy for recycling trucks to carry away.","People are not allowed to put bottles in their recycling bins.","Recycled plastic is always much stronger than brand-new plastic."],"why":"Paragraph 4 explains that plastics must be separated, that food can contaminate a load, and that recycling can be expensive.","ev":["a4.3","a4.6"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 6, which TWO are sources of microplastics? Choose TWO answers.","o":["larger plastic pieces broken down by sunlight and waves","fibers that shed from synthetic clothing in the wash","banana peels that slowly rot away in the soil","fishing nets that are left behind in the ocean","foam boxes that are recycled into new boxes"],"why":"Paragraph 6 says sunlight, waves, and wind break plastic into smaller pieces, and that some microplastics start as clothing fibers or tire bits. Fishing nets appear in paragraph 8 as large debris, not microplastics.","ks":[0,1]},{"on":"a","t":"mc","skill":"text structure","q":"How is paragraph 4 mainly organized?","o":["It asks a question and then gives several reasons that answer it.","It tells events in the order they happened over many years.","It compares two kinds of plastic and explains which one is better to use.","It describes a problem and then explains how it was solved."],"why":"Paragraph 4 opens with “Why is so little plastic recycled?” and then lists reasons: sorting is hard, food contaminates loads, little is collected, and recycling costs money.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the quality of plastic “tends to <b>decline</b>” each time it is melted. What does <b>decline</b> mean here?","o":["get worse over time","get clearer over time","stay exactly the same","politely say no"],"why":"Paragraph 5 says a bottle may become carpet fibers that are harder to recycle, so its quality gets worse. “Say no” is a different meaning of decline that does not fit here.","k":0},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author compare the garbage patch to “pepper flakes swirling in soup” in paragraph 7?","o":["To help readers picture tiny pieces spread through water, not a solid island","To show that the garbage patch is mostly made of food waste from ships","To explain that the plastic in the patch is easy for ships to scoop out with nets","To suggest that the ocean water in the patch is unusually warm"],"why":"Paragraph 7 says the patch is “not a floating island” and that its tiny pieces are scattered and hard to see. Pepper flakes in soup are small and spread out in the same way.","ev":["a7.5","a7.7"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"inference","q":"Based on paragraphs 2 and 8, which plastic is most likely to harm sea turtles and seabirds?","o":["the 22 percent that is mismanaged and ends up in nature","the 9 percent that is recycled into carpet and fleece","the 19 percent that is burned in waste facilities","the half that is buried in landfills on land"],"why":"Paragraph 2 says mismanaged plastic ends up in rivers, soil, and oceans. Paragraph 8 explains that ocean plastic harms wildlife, so that is the plastic most likely to reach animals.","k":0},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses the theme of the fable?","o":["Things we throw away do not disappear, and they can come back to affect us.","Beavers are better builders than raccoons because they always work much harder.","Rivers are useful because they carry unwanted things far away from us.","It is important to eat healthy foods like berries, nuts, and apples."],"why":"Raccoon's scraps travel to Beaver's dam and then float back to his own den (paragraph 4). The moral in paragraph 6 states this lesson directly.","k":0},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 1, Raccoon calls the river “a fine <b>servant</b>.” What does this word choice suggest about Raccoon?","o":["He thinks the river exists to do his work for him.","He thinks the river is a dangerous enemy to avoid.","He thinks the river is a close friend who needs help.","He thinks the river belongs to Beaver instead of him."],"why":"A servant does chores for someone else. Calling the river a servant shows Raccoon expects it to clean up after him so he never has to (paragraph 1).","k":0},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Raccoon change by the end of the fable?","o":["He learns to take responsibility for his own waste.","He learns how to build strong dams like Beaver.","He decides to move far away from the river.","He becomes angry at Beaver for causing the flood."],"why":"In paragraph 5, Raccoon helps clear the dam and starts burying his scraps instead of throwing them in the river.","ev":["b5.4","b5.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A.","k":0},{"on":"b","t":"mc","skill":"inference","q":"What does Beaver mean when she says, “There is only somewhere else” (paragraph 3)?","o":["Trash that is thrown away still ends up in some other place.","Raccoon should move his den somewhere else on the river.","Beaver plans to build a new dam somewhere else soon.","The river flows to a faraway place where nobody lives."],"why":"Beaver is answering Raccoon's claim that “away is very far from here.” She means thrown-away things do not vanish; they just land somewhere else, like her dam.","k":0},{"on":"ab","t":"mc","skill":"compare texts","q":"How do the two texts present the idea that thrown-away things do not disappear?","o":["Text 1 uses facts and numbers, while Text 2 teaches it through a story with a moral.","Text 1 tells a story with talking animals, while Text 2 uses facts and statistics.","Both texts argue that throwing things away is never really a problem.","Text 1 says plastic vanishes, while Text 2 says only nutshells vanish."],"why":"Text 1 is informational and uses data such as “only about 9 percent” (paragraph 2). Text 2 is a fable with talking animals and a moral at the end.","k":0},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: How does the ending of Text 1 connect to the fable in Text 2?","o":["Both say that thrown-away things do not truly vanish.","Both say that rivers are the main cause of pollution.","Both say that animals should help clean the ocean.","Both say that recycling solves the waste problem."],"why":"Text 1 ends by saying there is “no such place as ‘away,’” and Beaver says the same words in paragraph 3 of the fable.","ev":["a9.4","b3.1"],"evq":"Part B: Click the sentence from either text that best supports your answer to Part A.","k":0}],"write":{"prompt":"Both texts develop the idea that there is no such place as “away.” Explain how Text 1 and Text 2 each show this idea. Use at least one detail from each text.","model":"Both texts show that things we throw away do not really disappear. In Text 1, the author explains that only about 9 percent of plastic waste is recycled, and 22 percent ends up in rivers, soil, and oceans. That plastic breaks into microplastics that collect in garbage patches and harm animals. In Text 2, Raccoon throws his scraps into the river and thinks they are gone, but they pile up at Beaver's dam. When the pond floods, the same scraps float back to his den. Both texts prove that trash only moves somewhere else. Text 1 uses facts and Text 2 uses a fable, but they teach the same lesson.","need":["States the shared idea that thrown-away things do not disappear","Uses a fact or detail from Text 1","Uses an event from the fable in Text 2","Explains how each detail shows the idea"]}},{"id":"s19-prosthetic","theme":"Printing a Helping Hand","a":{"title":"Building a Hand, Layer by Layer","genre":"Informational","topic":"Technology and Engineering","gloss":{"additive":["made by adding material bit by bit","aditiva"],"filament":["a long, thin strand of material","filamento"],"nozzle":["a narrow tip that liquid or melted material comes out of","boquilla"],"customized":["changed or built to fit one person","personalizado"],"prosthetic":["an artificial body part","prótesis / protésico"],"tendons":["strong cords in the body that connect muscles to bones","tendones"],"volunteers":["people who work to help others without being paid","voluntarios"]},"paras":[["Most factories make objects by cutting, drilling, or carving material away from a larger block, or by pouring liquid material into molds.","A 3D printer works in the opposite way.","Starting with an empty platform, it builds an object by adding material one thin layer at a time.","Engineers call this process additive manufacturing, because the object is made by adding material rather than removing it."],["The process begins on a computer.","A designer creates a three-dimensional digital model of the object, and a program called a slicer divides that model into hundreds of thin layers, like the slices in a loaf of bread.","The slicer then sends the printer instructions for building each layer."],["The most common type of 3D printer in homes and schools feeds a long strand of plastic, called filament, into a heated metal nozzle.","One popular filament, called PLA, is made from plants such as corn and becomes soft at about 185 degrees Celsius.","The nozzle moves back and forth, laying down a thin line of melted plastic in the exact pattern of the first layer.","The plastic cools and hardens almost immediately.","Then the platform moves down by a fraction of a millimeter, and the printer begins the next layer on top.","Layer by layer, a solid object slowly rises."],["Because a 3D printer can make complicated shapes without special molds, it is ideal for objects that need to be customized, or built to fit one specific person.","Prosthetic hands are a perfect example.","Traditional prosthetic devices can be very expensive; one man discovered that a single replacement finger could cost about $10,000.","Children face an extra challenge: they grow quickly, so a device that fits at age six may be far too small by age eight."],["The story of printed hands began with a costume.","In 2011, an American designer named Ivan Owen built a large mechanical hand for a costume and posted a video of it online.","A carpenter in South Africa who had lost fingers in a woodworking accident saw the video and asked for help, and the two began designing a mechanical replacement together.","In late 2012, they also built a hand for a five-year-old boy who had been born missing fingers.","Owen began using a 3D printer to make the parts, and in early 2013 the design was shared online for free so that anyone could print it."],["People who saw the free design wanted to help.","In 2013, Jon Schull, a professor at the Rochester Institute of Technology, created an online community where volunteers with 3D printers could connect with families who needed hands.","The group, which became known as e-NABLE, grew from about 70 volunteers in its first month to thousands of members around the world.","By 2019, e-NABLE estimated that its volunteers had made and given away about 7,000 hands and arms in more than 100 countries.","The devices are free to the people who receive them, and the plastic for one popular design costs only about $35."],["Many e-NABLE hands are powered by the wearer's own wrist.","The device straps onto the forearm and palm, and cords run from the wrist through each finger, much like tendons in a real hand.","When the wearer bends the wrist downward, the cords tighten and the fingers curl closed to grip an object.","When the wrist straightens, the fingers open again.","Because the design depends on wrist movement, these hands work best for people who can bend their wrist and still have most of their palm."],["These printed hands are not perfect replacements for human hands.","The fingers move together rather than one at a time, and they can hold only a few pounds.","e-NABLE describes its devices as helpful tools rather than complete medical prosthetics, and it warns users not to rely on them for risky activities such as hanging from monkey bars."],["Printed hands offer one more advantage that surprises many people: they can be fun.","Because each part is printed separately, a child can choose the colors, and some volunteers have designed hands that look like superhero gear.","When a child outgrows a hand, a volunteer can enlarge the digital model and print a new one.","A technology that builds objects one layer at a time is helping people build confidence, too."]]},"b":{"title":"Electric Blue","genre":"Realistic fiction","gloss":{"filament":["a long, thin strand of plastic used by 3D printers","filamento"],"rotating":["turning in a circle","girando"],"welding":["joining pieces of metal with great heat","soldadura"],"gliding":["moving smoothly and easily","deslizándose"],"fastened":["attached firmly","abrochó / sujetó"],"bold":["bright, strong, and easy to notice","atrevido / llamativo"]},"paras":[["By Saturday, Mateo was sitting at a long table in the library's maker lab, surrounded by tools, rolls of filament, and a humming 3D printer.","Across from him sat Jasmine, a high school volunteer with a pencil tucked behind her ear.","“Okay,” she said, turning her laptop toward him.","“The measurements are done. Now comes the important part.”"],["On the screen, a gray model of a hand was slowly rotating.","Mateo had been born without fingers on his left hand.","He could do almost everything his friends could do, but he was tired of the way strangers stared at his hand and then quickly looked away."],["“What important part?” he asked.","Jasmine grinned.","“Colors. Every piece prints separately, so you're the designer.”"],["Mateo blinked at the gray hand.","He had expected to be told what it would look like, the way doctors usually told him things.","Slowly, he reached for the mouse.","He clicked the palm and chose deep black, like the night sky over his grandmother's ranch.","He made the fingers electric blue and the joints bright orange, the color of the sparks that flew from his dad's welding torch.","Then he added a tiny lightning bolt on the back."],["“Bold,” Jasmine said, nodding.","“I like it.”"],["The printer hummed for hours, its nozzle gliding back and forth, laying down thin lines of plastic one layer at a time.","Mateo watched the first blue finger rise from the platform like a building going up in fast motion."],["A week later, Jasmine fastened the straps around his forearm.","“Bend your wrist down,” she said.","Mateo bent it, and the cords tightened as the blue fingers curled toward his palm.","He reached for a water bottle on the table, bent his wrist again, and lifted the bottle into the air.","For a moment, nobody said anything.","Then his mom started laughing and crying at the same time."],["On Monday, Mateo wore the hand to school.","At recess, a crowd of kids gathered around him, and for the first time, he didn't mind.","“Whoa,” said a boy from the other fourth-grade class.","“Is that a lightning bolt? Where can I get one?”","Mateo held up his hand so the sun caught the blue.","“You can't,” he said with a grin.","“I designed it.”"]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["3D printing builds objects layer by layer, letting volunteers make low-cost, custom hands.","3D printers melt plastic filament in a heated nozzle at about 185 degrees Celsius.","Printed hands can now fully replace professional prosthetics for every person and every activity.","Jon Schull started an online group so that volunteers could trade their 3D printers."],"why":"Text 1 explains how 3D printing works (paragraphs 1–3) and how volunteers use it to make free, custom hands (paragraphs 4–9). Paragraph 8 shows the hands do not replace everything.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 1, engineers call 3D printing <b>additive</b> manufacturing. The word is made of the base word <i>add</i> and the suffix <i>-ive</i>. What does <b>additive</b> mean here?","o":["having to do with adding material","having to do with cutting material away","having to do with pouring liquid into molds","having to do with drawing designs on paper"],"why":"The suffix -ive means “having the quality of,” so additive means “having to do with adding.” Paragraph 1 says the object is made “by adding material rather than removing it.”","k":0},{"on":"a","t":"ebsr","skill":"sequence","q":"Part A: According to paragraph 2, what happens right after the slicer divides a digital model into thin layers?","o":["The printer receives instructions for building each layer.","The designer creates a three-dimensional digital model.","The platform moves down to begin the second layer.","The finished object is carefully lifted off the printer's platform."],"why":"Paragraph 2 says that after dividing the model into layers, the slicer “then sends the printer instructions for building each layer.”","ev":["a2.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: Based on paragraphs 4 and 9, why are 3D-printed hands especially helpful for children?","o":["Children grow quickly, so they need devices that are cheap and easy to remake.","Children like plastic toys, so they enjoy wearing plastic hands more than adults.","Children cannot use their wrists, so they need hands that work without wrists.","Children's hands are smaller, so printers can make them faster than adult hands."],"why":"Paragraph 4 says children grow quickly and outgrow devices, and paragraph 9 says a volunteer can simply enlarge the model and print a new hand.","ev":["a4.4","a9.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 7, which TWO statements describe how a wrist-powered hand works? Choose TWO answers.","o":["Bending the wrist downward tightens cords that close the fingers.","Straightening the wrist allows the fingers to open again.","A small battery moves each finger one at a time.","The wearer presses a button to make the hand grip.","Signals from the brain travel through wires to the hand."],"why":"Paragraph 7 explains that bending the wrist tightens the cords to close the fingers, and straightening it lets them open. Paragraph 8 adds that the fingers move together, not one at a time.","ks":[0,1]},{"on":"a","t":"mc","skill":"text structure","q":"How does the author organize paragraphs 5 and 6?","o":["In time order, showing how a costume project grew into a worldwide group","By comparing printed hands with traditional prosthetics made in factories","By stating a problem with 3D printers and then explaining a solution","By listing the steps a printer follows to build each layer of an object"],"why":"Paragraphs 5 and 6 move through dates, from 2011 to 2012, 2013, and 2019, to tell how the costume hand led to e-NABLE.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, a 3D printer is “ideal for objects that need to be <b>customized</b>.” Which phrase from the paragraph helps the reader understand <b>customized</b>?","o":["“built to fit one specific person”","“can make complicated shapes without special molds”","“Traditional prosthetic devices can be very expensive”","“they grow quickly”"],"why":"Paragraph 4 explains the word right after using it: customized means “built to fit one specific person.”","k":0},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author include paragraph 8?","o":["To give a balanced view by explaining what printed hands cannot do","To argue that families should always buy expensive prosthetics instead","To describe the steps volunteers follow when fitting a new hand","To show that printed hands are stronger than human hands"],"why":"After describing many benefits, paragraph 8 explains the limits: the hands are “not perfect replacements,” the fingers move together, and they hold only a few pounds.","ev":["a8.1","a8.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"inference","q":"Based on paragraphs 5 and 6, what most likely helped e-NABLE grow so quickly?","o":["The free online design let people anywhere print hands for others.","Stores sold the hands, so many companies wanted to make them.","Doctors required families to join the group before getting care.","The first hand was so costly that thousands of volunteers raised money for it."],"why":"Paragraph 5 says the design was shared online for free so anyone could print it, and paragraph 6 says people who saw it wanted to help. Free sharing made it easy for volunteers everywhere to join.","k":0},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of Text 2?","o":["Having a say in how you are seen can build pride and confidence.","Libraries are the very best place for kids to learn about computers.","It is rude to stare at people who look different from you.","Waiting patiently is the hardest part of building anything."],"why":"Mateo designs his own hand (paragraph 4) and ends by proudly saying, “I designed it” (paragraph 8). Choosing how the hand looks changes how he feels about being noticed.","k":0},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 4, Mateo makes the fingers “<b>electric</b> blue.” What does the word <b>electric</b> suggest about the color?","o":["It is bright, bold, and full of energy.","It is dark, quiet, and very calm.","It is dull and easy to ignore.","It is dangerous to touch."],"why":"Electric suggests energy and brightness. Together with the orange joints and lightning bolt in paragraph 4, it shows Mateo wants his hand to stand out.","k":0},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How do Mateo's feelings about people noticing his hand change from the beginning to the end of the story?","o":["He goes from being tired of stares to welcoming attention.","He goes from enjoying attention to wanting to hide his hand.","He goes from feeling proud to feeling embarrassed at school.","He goes from not caring at all to becoming angry with others."],"why":"In paragraph 2 Mateo is tired of strangers staring. In paragraph 8, when kids gather around, “for the first time, he didn't mind.”","ev":["b2.3","b8.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A.","k":0},{"on":"b","t":"mc","skill":"inference","q":"Why does Mateo seem surprised when Jasmine says he is the designer (paragraph 4)?","o":["He expected adults to decide how things would look for him.","He did not know that 3D printers could make hands at all.","He thought Jasmine had already picked an all-gray design.","He believed he would have to pay extra for every color."],"why":"Paragraph 4 says he “had expected to be told what it would look like, the way doctors usually told him things.” Being asked to choose was new to him.","k":0},{"on":"ab","t":"mc","skill":"compare texts","q":"How does Text 2 add to the information in Text 1?","o":["It shows how it might feel for a child to design and use a printed hand.","It gives exact numbers about how many hands volunteers have made.","It explains the history of how the e-NABLE group was started.","It argues that printed hands are better than any other kind of prosthetic."],"why":"Text 1 gives facts about printing and e-NABLE. Text 2 is a story that shows a character's feelings, such as Mateo's pride when he says “I designed it.”","k":0},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 2, Mateo bends his wrist and lifts a water bottle. Which detail from Text 1 explains how this works?","o":["Bending the wrist tightens cords that make the fingers grip.","A slicer divides the digital model into thin layers.","PLA filament softens at about 185 degrees Celsius.","The fingers can hold only a few pounds at a time."],"why":"Text 1, paragraph 7, explains that bending the wrist downward tightens the cords so the fingers curl closed. That is exactly what happens in Text 2, paragraph 7.","ev":["a7.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0}],"write":{"prompt":"Explain how Text 1 and Text 2 each show that 3D-printed hands can help people in more than one way. Use at least one detail from each text.","model":"Both texts show that 3D-printed hands help people do everyday tasks and also feel more confident. Text 1 explains that when a wearer bends the wrist, cords tighten and the fingers curl closed to grip an object. It also says children can choose their colors, which helps them “build confidence, too.” Text 2 shows both kinds of help in Mateo's story. He uses his new hand to lift a water bottle, and he designs it with electric blue fingers and a lightning bolt. At school he proudly says, “I designed it.” These details prove that printed hands are useful tools and a way for kids to express who they are.","need":["States at least two ways printed hands help people","Uses a detail from Text 1","Uses a detail from Mateo's story in Text 2","Explains how the details support the claim"]}},{"id":"s20-codetalkers","theme":"Words as Protection","a":{"title":"The Navajo Code Talkers","genre":"Informational","topic":"History of Science","gloss":{"decode":["to change a coded message back into plain words","descifrar"],"complex":["having many parts; not simple","complejo"],"veteran":["a person who served in the military","veterano"],"equivalent":["a word or thing that means the same","equivalente"],"descriptive":["describing what something is like","descriptivo"],"classified":["officially kept secret by the government","clasificado / secreto"],"declassified":["no longer kept officially secret","desclasificado"]},"paras":[["During World War II, military commanders faced a dangerous problem.","Orders, warnings, and requests for supplies had to travel quickly by radio, but enemy forces could listen to radio messages too.","Codes could hide a message's meaning, yet many took a long time to encode and decode, and skilled enemy experts could sometimes crack them.","In the Pacific, the United States Marine Corps found a remarkable solution in the language of the Navajo people."],["Navajo, called Diné bizaad by its speakers, is the language of the Navajo Nation, whose homeland covers parts of Arizona, New Mexico, and Utah.","In the early 1940s, it was spoken by many thousands of people but rarely written down.","Its grammar is very complex, and the meaning of a word can change with the tone of the speaker's voice.","At the start of the war, very few outsiders could understand it; by one estimate, fewer than 30 people who were not Navajo could, and none of them were Japanese."],["The idea came from Philip Johnston, the son of a missionary, who had grown up on the Navajo reservation and spoke the language.","Johnston, a veteran of World War I, suggested the plan to the Marine Corps in early 1942.","The Marines then recruited 29 young Navajo men, some of them still teenagers.","This group, later known as the Original 29, created the code themselves at a Marine base in California."],["The code had two main parts.","First, each letter of the English alphabet was matched with a Navajo word for an animal or object; for example, the Navajo word for “ant” stood for the letter A.","Second, military terms that had no Navajo equivalent were given descriptive code names.","A submarine became an “iron fish,” a dive bomber became a “chicken hawk,” and a tank became a “tortoise.”","The first version contained 211 terms, and it grew to more than 400 as the war went on."],["Several features made the code extremely hard to crack.","Even a Navajo speaker who had not been trained would hear only a strange list of animals and objects.","To an enemy listener who did not know Navajo at all, the messages were impossible to understand.","The code talkers memorized every term, so they did not need to carry codebooks that could be captured.","They could also send messages much faster than many coding machines of the time.","As far as historians know, the Japanese military never broke the code."],["As the program grew, an estimated 375 to 420 Navajo men served as code talkers.","They took part in Marine operations across the Pacific, including battles on Guam, Okinawa, and Iwo Jima.","Their most famous work came at Iwo Jima in 1945.","During the first two days of that battle, six code talkers worked around the clock, sending and receiving more than 800 messages without a single error.","A Marine signal officer, Major Howard Connor, later said that without the Navajos, the Marines would never have taken Iwo Jima."],["When the war ended, the code talkers returned home, but they could not share their story.","The code remained classified, or officially secret, in case it was needed again.","Many of these men had attended government boarding schools as children, and some, including Original 29 member Chester Nez, had been punished there for speaking Navajo.","The language they had been told to give up had helped protect their country, yet for more than twenty years they could not tell even their families what they had done."],["The code was finally declassified in 1968.","In 1982, President Ronald Reagan named August 14 National Navajo Code Talkers Day.","In 2001, at a ceremony in the U.S. Capitol, President George W. Bush presented the Congressional Gold Medal, one of the nation's highest honors, to the Original 29.","Only five of those men were still living, and four attended; families accepted medals for the others.","Navajo men who became code talkers later in the war received the Congressional Silver Medal."],["Today, the Navajo Code Talkers are remembered as heroes whose language became one of the most successful codes in military history.","Their story is also a reminder that a language is far more than a way to communicate.","It carries a people's history and knowledge, and keeping it alive can matter in ways no one can predict."]]},"b":{"title":"A Letter in March","genre":"Historical fiction","gloss":{"trading post":["a store where people traded goods and picked up mail","puesto comercial"],"creased":["folded so that it has lines in it","arrugado / doblado"],"censor":["an official who reads mail and removes secret information","censor"],"thoughtful":["quietly thinking hard about something","pensativa"],"rectangular":["shaped like a rectangle","rectangular"],"precious":["very valuable and special","valioso / precioso"]},"paras":[["The letter arrived at the trading post on a windy afternoon in March 1944, and Ruth ran the whole two miles home with it pressed against her coat.","She was eleven, and she had never run so fast."],["Mother dried her hands and sat down at the table.","Grandmother set aside her weaving.","Even Ruth's little brother, Joe, stopped teasing the dog.","The envelope was thin and creased, and a stamp on the front showed that a military censor had read it first."],["Mother opened it carefully and began to read aloud.","“Dear Family, I am well and safe, so please do not worry.”","Ruth let out a breath she had not known she was holding."],["“I cannot tell you where I am or what my work is,” the letter continued.","“But Grandmother, I think of the words you taught me every single day.","They are with me more than you could ever guess.","Please tell Joe the Coyote stories this winter, so he will know them when I come home.”"],["Grandmother smiled and touched the edge of the page.","Ruth frowned.","“What does he mean, the words are with him?”","“He misses home,” Mother said, but she looked thoughtful, as if she suspected something she could not name."],["Near the bottom, a few words had been cut out of the paper, leaving a neat rectangular hole.","Joe poked his finger through it.","“Someone stole part of the letter!”","“The censor,” Mother said gently.","“They remove anything that might help the enemy.”"],["The last lines were written in Samuel's careful handwriting.","“Ruth, keep studying hard. Words are more powerful than you know.","With love, your son and brother, Samuel.”"],["That night, Ruth read the letter three more times by the light of the lamp.","She could not guess what her brother's secret work was.","But she whispered the words Grandmother had taught her, slowly and carefully, as though they were something precious she had been asked to protect.","Many years later, when the world finally learned about the code talkers, she would understand."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Navajo Marines turned their language into an unbroken code, and they were honored years later.","Philip Johnston grew up on the Navajo reservation and suggested a brand-new code to the Marine Corps.","Six code talkers sent more than 800 messages during the first two days at Iwo Jima.","Most radio messages in World War II were sent in plain English without any codes."],"why":"The text explains how the code was built and why it worked (paragraphs 3–6), then how the code talkers were finally honored (paragraphs 7–9). The other choices are single details or not in the text.","k":0},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 5, why was the Navajo code so hard for the enemy to break?","o":["It turned a language few outsiders knew into code words only trained speakers understood.","It was sent on special radios that enemy forces were never able to pick up anywhere in the war.","It was changed every single day so that no one could learn any of the words.","It was written in invisible ink on letters that soldiers carried by hand."],"why":"Paragraph 5 says untrained Navajo speakers heard only “a strange list of animals and objects,” and to enemy listeners the messages were impossible to understand.","ev":["a5.2","a5.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 8, the code was finally <b>declassified</b>. Paragraph 7 explains that <i>classified</i> means “officially secret.” Using the prefix <i>de-</i>, what does <b>declassified</b> mean?","o":["no longer kept officially secret","made even more secret than before","sorted into new groups or classes","used again during a different war"],"why":"The prefix de- means “remove” or “undo.” Since classified means officially secret (paragraph 7), declassified means the secret label was removed.","k":0},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 4, which TWO describe how the code worked? Choose TWO answers.","o":["Navajo words for animals or objects stood for English letters.","Military terms were given descriptive names such as “iron fish.”","Each message was spelled backward in English before sending.","Numbers replaced every word so messages looked like math.","The code words changed depending on the day of the week."],"why":"Paragraph 4 describes the two main parts: Navajo words standing for letters, and descriptive code names for military terms.","ks":[0,1]},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 7, how might the code talkers have felt after the war?","o":["It was likely hard for them to keep such an important part of their lives secret.","They were likely relieved that no one would ever ask them any questions about the war.","They likely felt that their work during the war had not really mattered.","They were likely angry that the code had been shared with the public."],"why":"Paragraph 7 says they could not share their story and could not tell even their families for more than twenty years. Keeping something that important secret for so long would be difficult.","ev":["a7.1","a7.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 1 connect to the rest of Text 1?","o":["It presents a problem, and later paragraphs explain how the code solved it.","It compares two languages, and later paragraphs choose the better one.","It lists events in order, and later paragraphs repeat them in much more detail.","It gives an opinion, and later paragraphs argue against that opinion."],"why":"Paragraph 1 describes the problem of enemies listening to radio messages. Paragraphs 2 through 6 explain how the Navajo code solved it.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, military terms that had no Navajo <b>equivalent</b> were given code names. The root <i>equi-</i> is a clue. What does <b>equivalent</b> mean?","o":["a word with the same meaning","a sound that is very loud","a weapon used in battle","a person who speaks two languages"],"why":"The Latin root equi- means “equal.” Paragraph 4 says Navajo had no equal word for terms like “submarine,” so the code talkers made up descriptive names.","k":0},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: What is the author's point of view about the Navajo language, as shown in paragraph 9?","o":["It is valuable for its history and knowledge, not only for talking.","It is mainly useful today as a secret code for the United States military.","It is too complex for most people to learn in modern times.","It became less important once the war was finally over."],"why":"In paragraph 9 the author says a language is “far more than a way to communicate” because it carries a people's history and knowledge.","ev":["a9.2","a9.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author include Major Howard Connor's statement in paragraph 6?","o":["To show how important the code talkers were to the victory at Iwo Jima","To explain how the code talkers were first recruited by the Marines in early 1942","To describe what daily life was like for Marines on a Pacific island","To prove that the code was used during only one battle of the war"],"why":"Connor says the Marines would never have taken Iwo Jima without the Navajos. His words, from an officer who was there, show how much the code talkers mattered (paragraph 6).","k":0},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of Text 2?","o":["The words a family passes down can give strength, even from far away.","Soldiers should always tell their families exactly where they are stationed.","Letters are the fastest and safest way to share important news.","Younger children usually misunderstand what adults are saying."],"why":"Samuel says Grandmother's words are with him every day (paragraph 4), and Ruth ends by treating those words as something precious to protect (paragraph 8).","k":0},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 8, Ruth whispers Grandmother's words “as though they were something <b>precious</b> she had been asked to protect.” What does this comparison suggest?","o":["Ruth now sees her language as valuable and worth keeping safe.","Ruth is afraid that someone will steal the letter from her.","Ruth thinks the words are too difficult to say out loud.","Ruth wants to keep her brother's letter hidden from Joe."],"why":"Precious means very valuable. Comparing the words to a treasure she must protect shows that, after the letter, Ruth sees her language as important (paragraph 8).","k":0},{"on":"b","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer from Samuel's line “Words are more powerful than you know” (paragraph 7)?","o":["He is hinting that language is part of his secret work.","He is warning Ruth not to say unkind things to Joe.","He is telling Ruth that he wants to become a teacher.","He is complaining that the censor cut up his letter."],"why":"Samuel cannot say what his work is, but in paragraph 4 he says Grandmother's words are with him “more than you could ever guess.” Both lines hint that language matters in his secret job.","ev":["b4.3","b7.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A.","k":0},{"on":"b","t":"mc","skill":"character","q":"How does Mother react to Samuel's line about Grandmother's words (paragraph 5)?","o":["She gives a simple answer but seems to wonder if there is more to it.","She laughs because she believes Samuel is only joking with them.","She becomes upset that Samuel wrote mostly about Grandmother and not about her.","She tells Ruth the exact meaning of Samuel's secret message."],"why":"In paragraph 5 Mother says, “He misses home,” but she “looked thoughtful, as if she suspected something she could not name.”","k":0},{"on":"ab","t":"mc","skill":"compare texts","q":"How does Text 2 add to the reader's understanding of Text 1?","o":["It imagines how the secrecy may have felt for a soldier's family.","It gives the exact number of code talkers who served in the war.","It explains how the code talkers' alphabet was first created.","It describes the ceremony where the medals were presented."],"why":"Text 1 states facts about the secret code. Text 2 is historical fiction that shows a family wondering about a soldier's work they are not allowed to know.","k":0},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: At the end of Text 2, Ruth “would understand” only many years later. Which fact from Text 1 explains why she had to wait so long?","o":["The code stayed secret until it was declassified in 1968.","The first version of the code contained 211 terms.","Six code talkers worked around the clock at Iwo Jima.","Philip Johnston suggested the plan in early 1942."],"why":"Text 1, paragraph 8, says the code was not declassified until 1968, more than twenty years after the war. Until then, families like Ruth's could not learn what the code talkers did.","ev":["a8.1"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0}],"write":{"prompt":"Explain how Text 1 and Text 2 each show the importance of the Navajo language. Use at least one detail from each text.","model":"Both texts show that the Navajo language was powerful and worth protecting. Text 1 explains that Navajo Marines used their language to create a code the enemy never broke. At Iwo Jima, six code talkers sent more than 800 messages without a single error. Text 2 shows the same idea in a family's story. Samuel writes that Grandmother's words are with him every day and that “words are more powerful than you know.” By the end, Ruth whispers the words as if they were something precious to protect. Together, these details show that the Navajo language helped protect a country and also kept a family connected.","need":["States why the Navajo language was important","Uses a fact from Text 1 about the code talkers","Uses a detail from the letter or Ruth's family in Text 2","Explains how the details support the claim"]}},{"id":"s21-heart","theme":"The Beating Heart","a":{"title":"The Body's Tireless Pump","genre":"Informational","topic":"Human Body","gloss":{"chambers":["the four hollow spaces inside the heart that hold blood","cámaras"],"ventricles":["the two lower chambers of the heart that pump blood out","ventrículos"],"valves":["flaps that open to let blood through and close to stop it from flowing backward","válvulas"],"circuit":["a path that loops around and comes back to where it started","circuito"],"pulmonary":["having to do with the lungs","pulmonar"],"capillaries":["the tiniest blood vessels, where oxygen passes into the cells","capilares"],"audible":["loud enough to be heard","audible"],"transport":["to carry something from one place to another","transportar"]},"paras":[["Put your hand on the center of your chest, just a little to the left, and hold still.","That steady thump is your heart, a muscle about the size of your fist that has been working every second of your life.","It never takes a vacation, and it never asks for a day off.","In an average day, it beats about 100,000 times, pushing blood through a vast network of tubes that reaches every part of your body."],["The heart's main job is to transport blood, and blood carries the supplies your cells need to survive.","Every cell, from the ones in your toes to the ones in your brain, needs a constant supply of oxygen and nutrients.","Cells also produce wastes, such as carbon dioxide, that must be carried away before they build up.","Without a pump to keep it moving, however, blood would simply sit still, and the cells would quickly run out of oxygen."],["If you could look inside the heart, you would find four hollow rooms called chambers.","The two upper chambers, called atria, act like waiting rooms that collect blood as it arrives.","The two lower chambers, called ventricles, are the real powerhouses, and when a ventricle squeezes, it forces blood out with great pressure.","A wall of muscle called the septum runs down the middle, separating the right side of the heart from the left so that the blood on each side never mixes."],["To keep blood flowing in the correct direction, the heart relies on four valves.","A valve is a set of thin, sturdy flaps that works like a one-way door: it swings open to let blood through, then snaps shut so the blood cannot slide backward.","When a doctor listens to your chest with a stethoscope, the familiar \"lub-dub\" sound is actually the noise of these valves closing.","The \"lub\" comes from one pair of valves shutting, and the \"dub\" follows a split second later when the other pair closes.","Because these sounds are audible through a stethoscope, doctors can listen for unusual noises that might signal a problem."],["One surprising fact is that the heart is really two pumps working side by side.","Blood travels in two separate loops, and each side of the heart is in charge of one of them.","The right side runs the pulmonary circuit, a short trip to the lungs and back.","There, the blood drops off carbon dioxide, which you breathe out, and picks up fresh oxygen from the air you just inhaled.","The oxygen-rich blood then flows back to the left side of the heart, ready for its next journey."],["The left side of the heart runs the systemic circuit, a much longer trip that reaches the entire body.","The left ventricle pumps oxygen-rich blood into the aorta, the largest artery in the body, and from there it branches into smaller and smaller vessels.","Because it must push blood all the way to your fingertips and toes, the left ventricle has the thickest, strongest wall of all four chambers.","After the blood delivers its oxygen, it returns to the right side of the heart, and the whole cycle begins again."],["The tubes that carry blood are called blood vessels, and they come in three main types.","Arteries carry blood away from the heart, and their thick, stretchy walls can handle the strong pressure of each heartbeat.","Veins carry blood back toward the heart, and many of them contain small valves of their own to keep blood from sinking backward.","Between the two are capillaries, vessels so narrow that blood cells must squeeze through in single file.","It is in the capillaries that the real exchange happens, as oxygen and nutrients pass out to the cells and wastes pass in.","Laid end to end, the blood vessels in one adult would stretch roughly 60,000 miles, enough to circle Earth more than twice."],["Doctors measure how hard the heart is working by counting its beats per minute, a number called the heart rate.","For most adults, a normal resting heart rate falls between 60 and 100 beats per minute, while children between about 6 and 12 usually rest at roughly 70 to 110.","When you exercise, your muscles demand extra oxygen, so your heart speeds up to deliver it.","Well-trained athletes, on the other hand, often have resting rates as low as 40 to 60 beats per minute.","That may seem strange, but it makes sense: a stronger heart pushes out more blood with each squeeze, so it does not need to beat as often."],["Like any muscle, the heart grows stronger when it is challenged.","Activities that get you breathing hard, such as running, swimming, biking, or dancing, give it a valuable workout.","Your heart will beat billions of times over your lifetime, so caring for it now is an investment that pays off for decades."]]},"b":{"title":"The Drummer in My Chest","genre":"Poem","poem":true,"gloss":{"musician":["a person who plays music","músico"],"patient":["calm and willing to wait without complaining","paciente"],"sill":["the flat ledge at the bottom of a window","alféizar"],"hammers":["hits again and again with great force","martillea"],"galloped":["ran very fast, like a horse","galopó"],"syllables":["the separate sound parts of a word","sílabas"]},"paras":[["Before I knew my own name,","a drummer moved into my chest,","a small and hidden musician","who never stops to rest."],["It thumps beneath my pillow","when the house is dark and still,","a soft and patient knocking","like a friend upon the sill."],["But when I sprint to catch the bus","or race my brother up the hill,","the drummer hammers wildly,","pounding faster, faster still."],["The morning of the spelling bee","it galloped like a horse,","until I breathed in slow and deep","and it settled on its course."],["Lub-dub, it answers softly,","lub-dub, through sun and rain,","a song of just two syllables","it sings and sings again."],["I hardly ever thank it,","this drummer I can't see,","yet every beat it plays tonight","is a promise kept to me."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of the article?","o":["The heart is a hardworking pump whose parts and two loops keep blood moving to every cell.","The heart has four chambers, and the two lower ones,
