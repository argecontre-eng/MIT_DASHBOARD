 winter."],["Above the trail, perched on a tall stalk of clover, lived a grasshopper named Rollo.","Rollo had never gathered a seed in his life.","He spent his days rubbing his long legs against his wings to make music, and the music was extraordinary: bright, rippling songs that seemed to make the grass sway in time.","\"Tessa!\" he called one afternoon as she staggered past beneath a fat sunflower seed.","\"Put that down and listen to my new song.","I wrote it about the clouds.\""],["\"I don't have time for clouds,\" Tessa said without slowing down.","\"Winter is coming, and you should be getting ready for it too.\"","Rollo laughed, a lazy, careless sound.","\"Winter is months away, and look how much food there is!","Besides, someone has to make the summer beautiful.\"","Tessa shook her head and trudged on, but she noticed, a little guiltily, that her steps seemed lighter while his song played.","For the rest of the summer, she found herself choosing the trail beneath his clover stalk, even though it was slightly longer."],["Then the frost came.","The meadow turned brown and brittle, and the grasshopper's songs grew thin and shaky before stopping altogether.","One gray morning, a knock sounded at the door of the anthill.","There stood Rollo, shivering, his green body faded to the color of dry straw.","\"Please,\" he whispered.","\"I haven't eaten in four days.","Could you spare a few seeds?\""],["The ants gathered at the entrance, and an old forager named Grist pushed to the front.","\"What were you doing all summer while we worked?\" he demanded.","\"I was singing,\" Rollo admitted.","\"Singing!\" Grist sneered.","\"Then you can dance all winter, too.\"","Several ants laughed, and Grist began to close the door.","Tessa felt her face grow hot.","The old story her grandmother had told her, the one where the ant refuses the lazy grasshopper, had always seemed perfectly fair.","Now, looking at Rollo's trembling legs, it did not seem fair at all."],["\"Wait,\" Tessa said.","Every antenna in the tunnel turned toward her.","\"He's right that he didn't gather food.","But he wasn't doing nothing.","Didn't any of you notice that we worked faster when he played?","I carried more seeds on the days I walked under his clover than on any other days.\"","A young ant near the back said quietly, \"I noticed that too.\"","Then another ant agreed, and another."],["Grist frowned.","\"So we should feed anyone who sings?\"","\"No,\" said Tessa.","\"We should feed him because he's starving, and because we have more than enough.","But we could also ask him to stay and give us something in return.\""],["So Rollo stayed.","The ants made him a bed of dry leaves in a warm chamber near the queen's room, and each evening, after the colony finished its work, he played.","The winter was the longest anyone could remember, and many nights the tunnels felt dark and close and frightening.","But when Rollo's music drifted through them, the young ants stopped crying and the tired ants fell asleep smiling.","Even Grist was caught tapping one leg in time."],["When spring came at last, Rollo climbed back up to his clover stalk.","This time, though, he spent his mornings carrying seeds alongside the ants, clumsy and slow but cheerful, before he picked up his music in the afternoons.","\"I learned something this winter,\" he told Tessa.","\"A song won't fill an empty stomach.\"","Tessa smiled and hoisted a seed onto her back.","\"I learned something too,\" she said.","\"A full stomach isn't the only thing that gets you through the winter.\""]]},"b":{"title":"The Super Teamwork of Ants","genre":"Informational","gloss":{"colony":["a large group of animals living together","colonia"],"superorganism":["a group that acts like one big living thing","superorganismo"],"division of labor":["splitting up work so each member has a job","división del trabajo"],"larvae":["young insects that have just hatched from eggs","larvas"],"foraging":["searching for food","búsqueda de alimento"],"pheromones":["chemicals that animals use to send messages by smell","feromonas"],"coordinate":["organize so that parts work well together","coordinan"],"thrives":["grows strong and does well","prospera"]},"paras":[["A single ant is not very powerful.","It has a brain smaller than the head of a pin and can live only a short time on its own.","Yet an ant colony, made up of thousands or even millions of ants working together, can build huge underground cities, defend itself against enemies, and gather enormous amounts of food.","Scientists sometimes call a colony a \"superorganism,\" because it behaves like one giant living thing."],["The secret is division of labor.","In most colonies, only one ant, the queen, lays eggs.","The workers, all female, divide up every other job.","Some care for the eggs and young larvae, some clean the nest, some guard the entrance, and some leave the nest to search for food.","In many species, younger workers tend to stay inside the safe nest, while older workers take on the riskier job of foraging outside."],["Ants coordinate this work mainly through smell.","They communicate using chemicals called pheromones.","When a foraging ant finds food, it lays down a pheromone trail on its way back to the nest.","Other ants follow the scent to the food, and as they return, they add more pheromone, making the trail stronger.","When the food runs out, ants stop marking the trail, and the scent slowly fades away.","Without any leader giving orders, the colony quickly sends more workers to good food sources and fewer to poor ones."],["Leafcutter ants of Central and South America take teamwork even further: they are farmers.","Columns of workers slice pieces from leaves and carry them home, often holding loads much heavier than their own bodies.","Surprisingly, the ants do not eat the leaves.","Inside the nest, smaller workers chew the leaves into a pulp and use it to feed a fungus that grows in special underground gardens.","The fungus is the colony's food.","The tiniest workers tend the gardens and weed out harmful molds, and many workers carry helpful bacteria on their bodies that protect the fungus from disease.","Scientists believe ants began farming fungus about 50 million years ago, long before humans planted their first crops."],["From the trails of ordinary sidewalk ants to the fungus farms of the rainforest, ant colonies show how much small creatures can accomplish together.","No single ant understands the whole plan, yet by each doing a small part, the colony thrives."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes what the story is mostly about?","o":["An ant convinces her colony to help a grasshopper whose music turns out to matter.","A grasshopper refuses to gather any food and is turned away by the hungry ants in winter.","An old ant named Grist teaches young ants the rule about gathering food.","A colony of ants survives a long winter because they gathered plenty of seeds."],"k":0,"why":"The story is about Tessa speaking up for Rollo in paragraphs 6 and 7, and how his music helps the colony through winter. Choice B is the old fable, which this story changes."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: Which word best describes Tessa in paragraph 6?","o":["courageous","selfish","lazy","embarrassed"],"k":0,"why":"In paragraph 6, Tessa speaks up against the whole colony even though 'every antenna in the tunnel turned toward her.' It takes courage to disagree with everyone.","ev":["a6.1","a6.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"word choice","q":"In paragraph 5, the author writes that Grist <b>sneered</b> instead of simply \"said.\" What does the word <b>sneered</b> suggest about Grist?","o":["He feels scornful of Rollo and is mocking him.","He feels sorry for Rollo and wants to help him.","He is afraid that Rollo will hurt the other ants.","He is confused and does not understand Rollo."],"k":0,"why":"To sneer is to speak in a mean, mocking way. The word shows that Grist looks down on Rollo for singing all summer."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 2, Rollo's music is described as <b>extraordinary</b>. The prefix <i>extra-</i> means \"beyond\" or \"outside of.\" What does <b>extraordinary</b> mean?","o":["far beyond what is usual","exactly like everything else","too quiet to be heard","easy to forget quickly"],"k":0,"why":"Extra- means 'beyond,' so extraordinary means beyond ordinary. The music is so amazing it seems to make the grass sway."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the meadow turns \"brown and <b>brittle</b>.\" What does <b>brittle</b> mean?","o":["dry and easy to break","wet and soft like mud","green and full of life","warm and bright with sun"],"k":0,"why":"After the frost, the plants dry out and die, so they become brittle, meaning stiff and easy to snap. The word fits with the 'brown' meadow in paragraph 4."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: How does Tessa's view of the old ant-and-grasshopper story change in paragraph 5?","o":["She once thought it was fair, but seeing Rollo suffer makes her doubt it.","She once thought it was unfair, but Grist convinces her it is correct.","She has never heard the story before and learns it for the very first time.","She always believed it, and seeing Rollo makes her believe it even more."],"k":0,"why":"Paragraph 5 says the story 'had always seemed perfectly fair,' but looking at Rollo's trembling legs, 'it did not seem fair at all.'","ev":["a5.8","a5.9"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"theme","q":"This story retells an old fable but changes the lesson. Which TWO statements express themes of THIS version? Choose TWO answers.","o":["Hard work and art can both help a community survive.","Kindness to someone in need can benefit everyone.","Anyone who does not work deserves to go hungry.","Music is more important than gathering food.","Old ants are always wiser than young ants."],"ks":[0,1],"why":"The colony needs both Rollo's songs and the stored seeds to get through winter, and helping Rollo ends up helping all the ants. The story does not say music matters MORE than food; Rollo even learns 'a song won't fill an empty stomach.'"},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 3 prepare the reader for the twist later in the story?","o":["It shows that Rollo's music made Tessa's work feel easier.","It shows that Rollo has secretly been storing food for winter.","It shows that Tessa dislikes Rollo and wants him to leave.","It shows that the meadow will run out of food by summer's end."],"k":0,"why":"In paragraph 3, Tessa notices her 'steps seemed lighter while his song played.' This small clue sets up her argument in paragraph 6 that the ants worked faster when he played."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer about Rollo from the final paragraph?","o":["He has learned that he needs to work as well as make music.","He has decided to give up his music completely and only work.","He plans to leave the meadow and never return.","He still believes winter will never come again."],"k":0,"why":"In the final paragraph, Rollo spends his mornings carrying seeds and his afternoons playing music, and he admits 'a song won't fill an empty stomach.'","ev":["a9.2","a9.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["Ants accomplish great things by dividing up work and communicating as a team.","Leafcutter ants grow fungus in underground gardens instead of eating the leaves they cut.","The queen ant is the leader who gives orders to every worker in the colony.","A single ant has a tiny brain and can only live for a short time on its own."],"k":0,"why":"Text 2 explains division of labor in paragraph 2, communication in paragraph 3, and farming in paragraph 4, all showing teamwork. Paragraph 3 says there is no leader giving orders."},{"on":"b","t":"ebsr","skill":"key details","q":"Part A: According to Text 2, how does a pheromone trail help a colony?","o":["It guides more workers to food and fades when the food is gone.","It warns other ants to stay away from a dangerous enemy.","It shows the queen exactly where to lay her next eggs.","It helps the young ants find their way back to the nursery deep inside the nest."],"k":0,"why":"Paragraph 3 explains that other ants follow the scent to the food, making the trail stronger, and that the scent fades when the food runs out.","ev":["b3.4","b3.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 4, the author says leafcutter ants \"take teamwork even further: they are <b>farmers</b>.\" What does calling the ants <b>farmers</b> suggest?","o":["They grow and care for their own food, much like people do.","They live in the countryside instead of in crowded cities.","They eat only the vegetables that grow in fields.","They work only during the warm planting season."],"k":0,"why":"Farmers raise crops to eat. Paragraph 4 shows the ants feed and weed a fungus garden, which is their food, so the word compares them to human farmers."},{"on":"b","t":"mc","skill":"inference","q":"Based on paragraph 2, why do older workers most likely take the job of foraging outside the nest?","o":["Foraging is riskier, so the colony keeps its younger workers safe inside.","Older workers are the only ants that are able to smell pheromones.","Younger workers are too large to fit through the nest's entrance.","The queen trusts only the older workers to choose which food to carry back home."],"k":0,"why":"Paragraph 2 calls foraging 'the riskier job' and says younger workers stay in 'the safe nest.' Giving dangerous jobs to older workers protects the colony's younger members."},{"on":"ab","t":"mc","skill":"compare texts","q":"How do the two texts show ants differently?","o":["Text 1 gives ants human feelings and speech, while Text 2 describes how real ants behave.","Text 1 explains how pheromone trails work, while Text 2 tells a story about a winter.","Text 1 shows ants farming fungus, while Text 2 shows ants storing seeds.","Text 1 says ants always work alone, while Text 2 says that ants always work in big teams."],"k":0,"why":"In Text 1, Tessa talks, feels guilty, and argues, like a person. Text 2 uses facts about pheromones and division of labor to explain real ant behavior."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 1, Tessa notices the colony works better with Rollo's music. Which idea from Text 2 is most similar to this?","o":["A colony succeeds when each member contributes a small part.","Leafcutter ants carry leaves heavier than their own bodies.","Ants began farming fungus about 50 million years ago.","A single ant has a brain that is even smaller than the head of a pin."],"k":0,"why":"Text 2 ends by saying that 'by each doing a small part, the colony thrives.' In Text 1, Rollo's part is music, and it helps the whole colony.","ev":["b5.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Both texts show that a group can be stronger than one individual. Explain how Text 1 and Text 2 each show this idea. Use at least one detail from each text.","model":"Both texts show that a group is strongest when every member contributes something different. In Text 1, the ants gather seeds, but Rollo the grasshopper adds music. Tessa notices that she \"carried more seeds\" on days when he played, and during the long winter his songs help the young ants stop crying. The colony needs both food and music to get through. Text 2 shows the same idea with real ants. Workers split up jobs, with some caring for larvae, some guarding the entrance, and some foraging. The text says that \"by each doing a small part, the colony thrives.\" Text 1 teaches this lesson through a story, while Text 2 explains it with facts. Both show that teamwork makes a group stronger than any one member.","need":["States a claim about how a group is stronger than one individual","Uses a detail from Text 1, such as Rollo's music helping the ants","Uses a detail from Text 2, such as division of labor","Explains how each detail supports the claim"]}}];

  const inp=$("#ain");if(inp){inp.addEventListener("input",()=>{val=inp.value;const pv=$("#pv");if(pv&&inp.classList.contains("alg-in")){pv.innerHTML=inp.value.trim()?"= "+E(inp.value.replace(/\*/g,"")):"";return}if(pv){const p=parseNum(inp.value);pv.innerHTML=p&&(p.form.k==="frac"||p.form.k==="mixed")?"= "+(inp.value.trim().startsWith("-")?"−":"")+(p.form.k==="mixed"?mixHTML(p.form.w,p.form.a,p.form.b):fr(p.form.a,p.form.b)):""}});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")onEnter()});setTimeout(()=>inp.focus({preventScroll:true}),50)}
  $$(".qcard .opt").forEach(b=>b.onclick=()=>{if(b.disabled)return;if(q.type==="multi"){const v=b.dataset.v,on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);val=on?[...val,v]:val.filter(x=>x!==v)}else{$$(".qcard .opt").forEach(x=>x.setAttribute("aria-pressed",x===b));val=b.dataset.v}});
  const svg=document.querySelector(".qcard svg.clickable");
  if(svg)svg.addEventListener("click",e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const min=+svg.dataset.min,max=+svg.dataset.max,pad=+svg.dataset.pad,u=+svg.dataset.u,W=svg.viewBox.baseVal.width;const x=Math.round((p.x-pad)/u)+min,y=Math.round((W-pad-p.y)/u)+min;if(x<min||x>max||y<min||y>max)return;
    const c=svg.querySelector(".cursor");c.setAttribute("cx",pad+(x-min)*u);c.setAttribute("cy",W-pad-(y-min)*u);val=`(${x}, ${y})`;$("#clickv").textContent=val});

function showAnswerHTML(q){
  if(q.type==="poly"||q.type==="factor")return `<b>${E(q.key)}</b>`;
  if(q.type==="ineq")return `<b>${E("x")} ${q.key.op.replace("<=","≤").replace(">=","≥").replace("<","&lt;").replace(">","&gt;")} ${fx(q.key.v,"frac")}</b>`;
  if(q.type==="roots")return `<b>${E("x")} = ${sn(q.key[0])} or ${E("x")} = ${sn(q.key[1])}</b>`;
  if(q.type==="rad")return `<b class="numtxt">${q.key.a}√${q.key.b}</b>`;
  if(q.type==="num") return `<b>${q.key.includes("/")?(()=>{const p=parseNum(q.key);return p.form.k==="mixed"?mixHTML(p.form.w,p.form.a,p.form.b):fr(p.form.a,p.form.b)})():esc(q.key)}</b>${q.unit?" "+q.unit:""}`;
  if(q.type==="point"||q.type==="click") return `<b class="numtxt">(${q.key[0]}, ${q.key[1]})</b>`;
  if(q.type==="multi") return `<b class="numtxt">${q.key.join(", ")}</b>`;
  if(q.type==="sym") return `<b>${esc(q.key)}</b>`;
  return `<b>${"ABCD"[+q.key]}.</b> ${q.opts[+q.key]}`;
}
// mode "learn": feedback after each question. mode "test": no feedback until the end.
function qLoop(st,L,onEnd){
  if(L.i>=L.qs.length)return onEnd(L);
  const q=L.qs[L.i],test=L.mode==="test";
  const dots=L.qs.map((_,k)=>`<i class="${k===L.i?"cur ":""}${L.res[k]===undefined?"":test?"ans":L.res[k]?"ok":"no"}"></i>`).join("");
  st.innerHTML=`<div class="dots">${dots}</div>${L.rule?`<div class="rule"><b>The rule:</b> ${L.rule}</div>`:""}
  <div class="qcard"><div class="eyebrow">Question ${L.i+1} of ${L.qs.length}${L.label?` · ${L.label(q)}`:""}</div><div class="qprompt">${q.prompt}</div>${q.vis?`<div class="qvis">${q.vis}</div>`:""}${inputHTML(q)}<div id="fb"></div>
  <div class="row"><button class="btn" id="chk">${test?(L.i===L.qs.length-1?"Finish":"Next"):"Check"}</button>${test?"":`<button class="btn ghost" id="nxt" hidden>Next →</button>`}</div></div>`;
  const get=wireInput(q,()=>{const n=$("#nxt");if(n&&!n.hidden)n.click();else $("#chk").click()});
  if(test){$("#chk").onclick=()=>{const v=get();L.res[L.i]=judgeQ(q,v)[0]==="ok";L.times[L.i]=Date.now()-L.qt;L.qt=Date.now();logQ(L.res[L.i]);L.i++;window.scrollTo({top:0});qLoop(st,L,onEnd)};return}
  let tries=0;
  $("#chk").onclick=()=>{const v=get();const [r,msg]=judgeQ(q,v);const fb=$("#fb");
    if(r==="blank"){fb.innerHTML=`<div class="fb almost">Type or choose an answer first.</div>`;return}
    if(r==="almost"&&tries===0){tries++;fb.innerHTML=`<div class="fb almost"><span class="fbh">Almost</span><span>${msg}</span></div>`;return}
    const ok=r==="ok";L.res[L.i]=ok;L.onAnswer(q,ok);logQ(ok);Store.save();
    fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><span class="fbh">${ok?"Correct":"Not this time"}</span>${ok?"":`<span>The answer is ${showAnswerHTML(q)}.</span>${msg?`<span>${msg}</span>`:""}`}<div><b>${ok?"Why it works":"How to solve it"}</b>${q.explain}</div></div>`;
    $$(".qcard .opt").forEach(b=>{b.disabled=true;if(q.type==="mc"&&b.dataset.v===q.key)b.classList.add("right");else if(q.type==="mc"&&b.getAttribute("aria-pressed")==="true"&&!ok)b.classList.add("wrong")});
    if($("#ain"))$("#ain").readOnly=true;$("#chk").hidden=true;const nx=$("#nxt");nx.hidden=false;nx.textContent=L.i===L.qs.length-1?"Done →":"Next →";nx.focus();
    $$(".dots i")[L.i].className=ok?"ok":"no";nx.onclick=()=>{L.i++;window.scrollTo({top:0});qLoop(st,L,onEnd)}};
}

function bJudge(it,v){
  if(v===undefined||v===null||String(v).trim()==="")return["blank",null];
  switch(it.t){case "num":return judgeNum(v,it.k);case "sym":case "tf":case "mc":return[v===it.k?"ok":"no",null];
    case "quad":{const map={"1":"I","2":"II","3":"III","4":"IV"};const x=String(v).trim().toUpperCase().replace(/^QUADRANT\s*/,"");return[(map[x]||x)===it.k?"ok":"no",null]}

    case "words":{const w=new Set(norm(v).match(/[a-z]+|\d+/g)||[]);return[it.k.every(x=>w.has(x))?"ok":"no",null]}}
  return["blank",null];
}

    if(stage<2)$$("#main .csent").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,want=stage===0?P.q:P.x;tries++;
      if(k===want||tries>=2){if(k===want&&tries===1){earned++;sfx("goal")}const msg=stage===0?`The question is the sentence that asks something. Everything else is information.`:`That detail doesn't change the answer. Real tests add extra information on purpose.`;
        $("#dfb").innerHTML=`<div class="fb ${k===want?"ok":"no"}"><span class="fbh">${k===want?"Sharp eyes!":"This is the one"}</span><span>${msg}</span><div class="row"><button class="btn sm" id="dn">Next →</button></div></div>`;$$("#main .csent").forEach(x=>{x.disabled=true;if(+x.dataset.k===want)x.classList.add(stage===0?"isq":"isx")});$("#dn").onclick=()=>{stage++;draw()}}
      else{b.classList.add("wrong");sfx("close");$("#dfb").innerHTML=`<div class="fb almost">${stage===0?"That sentence gives information. Which one asks something?":"That one is needed to solve it. Which detail could you cross out?"}</div>`}});
    else{$("#dain").focus();$("#dain").onkeydown=e=>{if(e.key==="Enter")$("#dchk").click()};$("#dchk").onclick=()=>{const r=judgeNum($("#dain").value,String(P.ans));if(r[0]==="retry"){$("#dfb").innerHTML=`<div class="fb almost">${r[1]}</div>`;return}tries++;const ok=r[0]==="ok"||r[0]==="almost";
      if(ok||tries>=2){if(ok&&tries===1){earned++;sfx("goal")}$("#dchk").hidden=true;$("#dain").readOnly=true;$("#dfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><span class="fbh">${ok?"Case closed!":`The answer is ${P.ans} ${P.unit}`}</span><span>${P.key} ${P.op}.</span><div class="row"><button class="btn sm" id="dn">${i<items.length-1?"Next case →":"Finish →"}</button></div></div>`;$("#dn").onclick=()=>{i++;stage=0;draw()}}
      else{sfx("close");$("#dfb").innerHTML=`<div class="fb almost">Not yet. Look at the key word in the question again.</div>`}}}};
  draw()}

/* --- 7. reading: one complete text per day --- */
const halfSteps=h=>h===0?["words","t1"]:["detect","t2","write"];
function halvesOn(x){const d=S.days[x];if(!d||!SET_BY[d.rpid])return 0;const rs=d.rs||{};if(d.rhalf==null)return(rs.t1?1:0)+(rs.t2?1:0);return(d.rd||halfSteps(d.rhalf).every(k=>rs[k]))?1:0}
function readHalfIndex(k){const t=today();const sum=lim=>{const keys=new Set();let rv=0;Object.keys(S.days).filter(x=>x<lim).sort().forEach(x=>{const d=S.days[x];if(!d||!SET_BY[d.rpid])return;const rs=d.rs||{};
    const halves=d.rhalf==null?[rs.t1?0:null,rs.t2?1:null].filter(h=>h!=null):(halvesOn(x)?[d.rhalf]:[]);if(d.rrev){rv+=halves.length;return}halves.forEach(h=>keys.add(d.rpid+":"+h))});return keys.size+rv};if(k<=t)return sum(k);
  let i=sum(t)+((isStudyDay(t)||(S.days[t]&&S.days[t].rpid))?1:0);for(let x=addDays(t,1);x<k;x=addDays(x,1))if(isStudyDay(x))i++;return i}
readPlanAt=function(h){const si=Math.floor(h/2),half=h%2;if(si<SETS.length)return{p:SETS[si],half,review:false};
  const ranked=[...SETS].sort((a,b)=>setRatio(a)-setRatio(b)||(((S.reading[a.id]||{}).date)||"").localeCompare(((S.reading[b.id]||{}).date)||""));return{p:ranked[(si-SETS.length)%ranked.length],half,review:true}};
function readTodayV5(){const d=S.days[today()];if(d&&SET_BY[d.rpid])return{p:SET_BY[d.rpid],half:d.rhalf==null?"full":d.rhalf,review:!!d.rrev};return readPlanAt(readHalfIndex(today()))}
function readStepsV5(){const r=readTodayV5(),set=r.p;if(r.half==="full")return setSteps(set,true);
  if(r.half===0)return[{k:"words",n:8,t:"Word Lab",d:"8 quick questions: word parts, science roots, test and math words."},{k:"t1",t:`Read: ${set.a.title}`,d:`${set.a.genre} · ${textWords(set.a)} words · 9 questions`},{k:"extra",t:"Extra read",d:"A short science article with questions, to fill your 25 minutes."}];
  return[{k:"detect",t:"Word problem detective",d:"2 short cases: find the question, cross out the extra, solve."},{k:"t2",t:`Read: ${set.b.title}`,d:`${set.b.genre} · ${textWords(set.b)} words · questions on both texts`},{k:"write",t:"Write: Claim · Proof · Because",d:"A short answer with proof from both texts."},{k:"extra",t:"Extra read",d:"A short science article with questions, to fill your 25 minutes."}]}

/* --- 8. look and feel --- */
const NEKO=(mood="")=>{const ink="#14213a";const eyes=mood==="happy"?`<path d="M31 64 q9 -11 18 0" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M71 64 q9 -11 18 0" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`:`<ellipse cx="40" cy="64" rx="9" ry="11.5" fill="${ink}"/><ellipse cx="80" cy="64" rx="9" ry="11.5" fill="${ink}"/><circle cx="43.5" cy="59" r="3.8" fill="#fff"/><circle cx="83.5" cy="59" r="3.8" fill="#fff"/>`;
  return `<svg class="neko" viewBox="0 0 120 112" aria-hidden="true"><path d="M17 46 L26 8 L52 30 Z" fill="#fff" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/><path d="M103 46 L94 8 L68 30 Z" fill="#fff" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/><path d="M25 38 L29 19 L41 30 Z" fill="#ffb3cf"/><path d="M95 38 L91 19 L79 30 Z" fill="#ffb3cf"/><ellipse cx="60" cy="66" rx="48" ry="40" fill="#fff" stroke="${ink}" stroke-width="4"/><path d="M14 52 Q60 30 106 52 L104 62 Q60 42 16 62 Z" fill="#e5216f" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="47" r="5" fill="#fff" stroke="${ink}" stroke-width="2"/>${eyes}<ellipse cx="25" cy="80" rx="7" ry="4" fill="#ffb3cf"/><ellipse cx="95" cy="80" rx="7" ry="4" fill="#ffb3cf"/><path d="M52 80 q4 5 8 0 q4 5 8 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`};
const SFX={goal:["SUGOI!","すごい!"],hat:["COMBO x3!","コンボ!"],save:["NANI?!","なに?!"],close:["OSHII!","おしい!"],up:["LEVEL UP!","レベルアップ!"]};
function sfx(kind){const box=$("#sfx");if(!box||!SFX[kind])return;const [en,jp]=SFX[kind];box.innerHTML=`<div class="burst ${kind}"><span class="jp">${jp}</span><span class="en2">${en}</span></div>`;const el=box.firstChild;setTimeout(()=>{if(el&&el.parentNode)el.remove()},1150)}
const RANKS=[[0,"Rookie","ルーキー"],[150,"Apprentice","みならい"],[400,"Ace","エース"],[800,"Sensei","せんせい"],[1500,"Legend","でんせつ"]];
function stars(){return Object.values(S.days).reduce((a,d)=>a+(d.c||0),0)}
function rankHTML(){const t=stars();let r=0;RANKS.forEach((x,i)=>{if(t>=x[0])r=i});const nx=RANKS[r+1],p=nx?Math.round((t-RANKS[r][0])/(nx[0]-RANKS[r][0])*100):100;
  return `<div class="rank">${NEKO("happy")}<div class="rk-in"><span class="rk">Power level: <b>${RANKS[r][1]}</b> <span class="jp">${RANKS[r][2]}</span></span><span class="meter"><i style="width:${p}%"></i></span><span class="small muted">${t} ★ earned${nx?` · ${nx[0]-t} more to ${nx[1]}`:" · max level!"}</span></div></div>`}
function weekHTML(){const t=today(),mon=addDays(t,-((parseD(t).getDay()+6)%7));const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  return `<section class="card"><div class="spread"><h2>This week</h2><span class="small muted">Every day is different</span></div><div class="week">${days.map(k=>{const L=lessonOn(k),wd=parseD(k).toLocaleDateString("en-US",{weekday:"short"});const type=!L?"Rest":L.kind==="test"?"Boss battle":L.alg?"Algebra":L.kind==="mix"?"Review":"Grade 6 skill";
    return `<div class="wk ${k===t?"today":""} ${lessonDone(k)?"done":""} ${L&&L.alg?"wk-alg":L&&L.kind==="test"?"wk-boss":""}"><b>${wd}</b><span class="wt">${type}</span><span class="small">${L?esc(L.t):"–"}</span></div>`}).join("")}</div></section>`}
function petals(){const c=$("#petals");if(!c||!c.getContext)return;let rm=false;try{rm=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}if(rm)return;const x=c.getContext("2d");if(!x)return;let W,H,P=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener("resize",size);for(let i=0;i<14;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:5+Math.random()*5,vx:.3+Math.random()*.5,vy:.4+Math.random()*.7,a:Math.random()*6,va:(Math.random()-.5)*.04});
  const col=()=>getComputedStyle(document.documentElement).getPropertyValue("--petal").trim()||"#ff9cc6";let color=col(),n=0;
  const tick=()=>{if(!document.hidden){if(++n%120===0)color=col();x.clearRect(0,0,W,H);x.fillStyle=color;x.globalAlpha=.5;P.forEach(p=>{p.x+=p.vx+Math.sin(p.a)*.4;p.y+=p.vy;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}if(p.x>W+20)p.x=-20;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.beginPath();x.ellipse(0,0,p.r,p.r*.6,0,0,Math.PI*2);x.fill();x.restore()})}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
/* --- 9. safety net: if something breaks, show a way out and remember what happened --- */
function guard(msg){try{(S.errlog||(S.errlog=[])).push({t:new Date().toISOString(),m:String(msg).slice(0,240),w:run?(run.subj+":"+((run.steps[run.si]||{}).k||"")):tab});if(S.errlog.length>30)S.errlog=S.errlog.slice(-30);Store.save()}catch(e){}
  const el=$("#oops");if(!el)return;el.hidden=false;el.innerHTML=`<span>Oops, something glitched. Your progress is saved.</span><button class="btn sm" id="oopsb">Reload this step</button>`;$("#oopsb").onclick=()=>{el.hidden=true;try{render()}catch(e){location.reload()}}}
window.addEventListener("error",e=>{if(e&&e.message&&!/ResizeObserver/.test(e.message))guard(e.message+" @"+(e.lineno||""))});
window.addEventListener("unhandledrejection",e=>{const r=e&&e.reason;if(r&&r.code==="cancelled")return;guard("promise: "+(r&&(r.message||r.code)||r))});

/* ===== v6: Sensei Tower — adaptive climb that fills the full 25 minutes ===== */
const TIERS=[
 ["Letters for numbers",["a1_eval","a1_mystery","a1_pattern"]],
 ["Balance puzzles",["a1_balance","oa_order","g6_pct"]],
 ["Negative numbers",["int_add","int_mul","g6_int"]],
 ["Negatives in expressions",["int_order","alg_eval","rat_ops"]],
 ["Equations I",["eq_1step","alg_like","alg_translate"]],
 ["Equations II",["eq_2step","alg_addpoly","g6_ratio"]],
 ["Equations III",["eq_both","eq_frac","ineq"]],
 ["Word problems and powers",["eq_word","alg_exp","alg_monomul"]],
 ["Multiplying expressions",["alg_binmul","alg_special","fac_common"]],
 ["Lines and systems",["lin_slope","lin_eval","sys_solve"]]];
const tierOf=f=>Math.min(TIERS.length-1,Math.floor((f-1)/3));
function towerHTML(f){const top=Math.max(f+3,6),rows=[];for(let x=top;x>=Math.max(1,f-2);x--)rows.push(`<div class="fl ${x===f?"cur":x<f?"done":""} ${x%3===0?"boss":""}"><b>${x}</b><span>${x%3===0?"★ Boss · ":""}${TIERS[tierOf(x)][0]}</span></div>`);return `<div class="tower">${rows.join("")}</div>`}
function runTower(st,s){const TW=S.tower||(S.tower={floor:4,best:4,fails:0,clears:0});const f=TW.floor,tier=tierOf(f),boss=f%3===0,need=boss?3:2;
  const pool=TIERS[tier][1].filter(x=>G[x]&&SK[x]);const ids=(boss?shuffleArr(pool):weightedPick(pool,3)).slice(0,3);while(ids.length<3)ids.push(pool[0]);
  const left=Math.max(0,GOAL-used("math"));
  st.innerHTML=`<div class="card tower-card"><div class="spread"><div><div class="eyebrow">Sensei Tower · best floor ${TW.best}</div><h2>${boss?"★ BOSS FLOOR":"Floor"} ${f}</h2><p class="muted">${TIERS[tier][0]} · ${boss?"get all 3 right to clear it":"get 2 of 3 right to climb"}</p></div>${towerHTML(f)}</div>
   <p class="small muted">${left>0?`${Math.ceil(left/60)} minutes left. Climb as high as you can before the timer ends.`:"25 minutes done. Keep climbing for extra stars, or stop here."}</p><div class="row"><button class="btn big" id="climb">Climb!</button>${left<=0?`<button class="btn ghost" id="tstop">Stop for today</button>`:""}</div></div>`;
  if($("#tstop"))$("#tstop").onclick=()=>stepDone();
  $("#climb").onclick=()=>{const L={qs:ids.map(x=>makeQ(x,rnd())),i:0,res:[],mode:"learn",label:q=>`Floor ${f} · ${SK[q.skill].name}`,onAnswer:(q,ok)=>{recordSkill(q.skill,ok);if(!ok&&TW.floor<=9)addError(q)}};
    qLoop(st,L,L=>{const r=L.res.filter(Boolean).length,cleared=r>=need;let note="";
      if(cleared){TW.floor++;TW.clears=(TW.clears||0)+1;TW.fails=0;if(TW.floor>TW.best)TW.best=TW.floor;sfx(boss?"hat":"up")}
      else{TW.fails=(TW.fails||0)+1;sfx("save");if(TW.fails>=2&&f>1){TW.floor=f-1;TW.fails=0;note="Two tries missed, so you drop one floor to power up. You'll be back."}}
      (TW.log||(TW.log=[])).push({d:today(),f,r,ok:cleared});if(TW.log.length>60)TW.log=TW.log.slice(-60);Store.save();
      const done=used("math")>=GOAL;
      st.innerHTML=`<div class="card score ${cleared?"pass":"fail"}"><h2>${cleared?`Floor ${f} cleared!`:`Floor ${f}: ${r} of 3`}</h2><p>${cleared?(boss?"Boss defeated. The next floors get harder.":"On to the next floor."):note||`You need ${need} of 3. New questions on the same floor.`}</p>
        <div class="row"><button class="btn" id="tnext">${cleared?`Climb to floor ${TW.floor} →`:`Try floor ${TW.floor} again →`}</button>${done?`<button class="btn ghost" id="tstop">Stop for today</button>`:""}</div></div>`;
      $("#tnext").onclick=()=>{window.scrollTo({top:0});runTower(st,s)};if($("#tstop"))$("#tstop").onclick=()=>stepDone()})}}
function runExtraRead(st,s){runArticle(st,{free:extraRead().id,step:true})}


/* --- progress code: send results to Dad, or move to another device --- */
function backupCard(){return `<section class="card" id="bkcard"><div class="spread"><h2>Progress code</h2><span class="small muted">${Store.mode==="cloud"?"Saved to Dad's account":Store.mode==="drive"?"Saved to Dad's Drive":"Saved on this device"}</span></div>
 <p class="small">Tap <b>Copy progress code</b> and paste it in a message to Dad, so he can see how you're doing. To move to another device, paste a code below and load it.</p>
 <div class="row"><button class="btn sm" id="bkcopy">Copy progress code</button></div><textarea id="bktext" rows="3" placeholder="Paste a progress code here"></textarea><div class="row"><button class="btn sm ghost" id="bkload">Load this code</button></div><div id="bkmsg"></div></section>`}
function wireBackup(){const msg=h=>$("#bkmsg").innerHTML=h;
 $("#bkcopy").onclick=()=>{S.lastCode=today();Store.save();const code="ARLY-HUB:"+JSON.stringify(S);const done=()=>msg(`<div class="fb ok">Copied. Paste it in a message to Dad.</div>`);
   try{navigator.clipboard.writeText(code).then(done,()=>{$("#bktext").value=code;$("#bktext").select();msg(`<div class="fb almost">Copy the selected text above.</div>`)})}catch(e){$("#bktext").value=code;$("#bktext").select();msg(`<div class="fb almost">Copy the selected text above.</div>`)}};
 $("#bkload").onclick=()=>{let t=$("#bktext").value.trim().replace(/^ARLY-HUB:/,"");let o=null;try{o=JSON.parse(t)}catch(e){}
   if(!o||o.v!==1||!o.days){msg(`<div class="fb no">That doesn't look like a progress code.</div>`);return}
   const last=Object.keys(o.days).sort().pop()||"unknown";msg(`<div class="fb almost"><span>Load progress up to <b>${last}</b>? This replaces the progress on this device.</span><div class="row"><button class="btn sm" id="bkyes">Yes, load it</button><button class="btn sm ghost" id="bkno">Cancel</button></div></div>`);
   $("#bkno").onclick=()=>msg("");$("#bkyes").onclick=()=>{S=Object.assign(fresh(),o);Store.save();render();showToast("Progress loaded.")}}}
const _renderBk=render;render=function(){_renderBk();try{if(!run&&$("#main")&&!$("#bkcard")){$("#main").insertAdjacentHTML("beforeend",backupCard());wireBackup();const since=S.lastCode?Math.round((parseD(today())-parseD(S.lastCode))/864e5):99;if(Store.mode==="device"&&since>0&&(parseD(today()).getDay()===5||since>=7)){$("#main").insertAdjacentHTML("afterbegin",`<section class="card" style="border-color:var(--pink)"><div class="spread"><div><h2>Code day!</h2><p class="small">Copy your progress code and send it to Dad, so Neko-sensei can plan your next week.</p></div><button class="btn" id="bkgo">Get my code</button></div></section>`);$("#bkgo").onclick=()=>{$("#bkcard").scrollIntoView({behavior:"smooth"});$("#bkcopy").click()}}}}catch(e){}};

/* ---------- boot ---------- */
$$(".seg").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$("#clock .cl-b").onclick=()=>{if(clock.running)clock.pause();else{clock.start(clock.subj);clock.autoPaused=false}};
cleanErrors();petals();render();Store.badge();Store.init();
