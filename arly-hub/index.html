: According to Text 1, what does a battery actually store?","o":["chemical energy held in the bonds between atoms","electricity, the same way a bucket stores water","tiny sparks that are released one at a time","electrons that are pumped in at the factory"],"k":0,"why":"Paragraph 2 says a battery 'does not actually store electricity' but instead stores 'chemical energy, the energy held in the bonds between atoms.'","ev":["a2.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: Based on paragraph 4, why do electrons travel through the wire instead of straight across the battery?","o":["The electrolyte blocks electrons, so they must take the outside path.","The wire is shorter, so electrons can reach the cathode faster that way.","The ions push the electrons out of the battery and into the bulb.","The bulb pulls the electrons toward it because it needs to glow."],"k":0,"why":"Paragraph 4 states that electrons 'cannot pass through the electrolyte, so they travel the long way, through the wire and the bulb.'","ev":["a4.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 8, lithium-ion batteries made \"<b>portable</b> devices practical.\" The root <i>port</i> means \"carry.\" What does <b>portable</b> mean?","o":["able to be carried easily","able to be charged quickly","able to work without electricity","able to last for many years"],"k":0,"why":"The root port means carry, and -able means able to be. Paragraph 8 connects light batteries to devices like laptops and phones that people carry around."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 10, the author says our world has become <b>dependent</b> on batteries. What does <b>dependent</b> mean, and what does the suffix -ent show?","o":["needing something; -ent turns the verb depend into a describing word","afraid of something; -ent means \"full of fear or worry\"","finished with something; -ent means \"no longer\"","tired of something; -ent turns the noun depend into a verb"],"k":0,"why":"Paragraph 1 shows that phones, remotes, and smoke alarms all depend on batteries, so we need them. The suffix -ent turns the verb depend into the adjective dependent."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author organize paragraphs 5 through 8?","o":["in time order, from Volta's pile in 1800 to the Nobel Prize in 2019","as a comparison of batteries that are safe and batteries that are dangerous","as a list of the steps needed to recharge a lithium-ion battery","as a problem followed by several possible ways to recycle batteries"],"k":0,"why":"Paragraph 5 starts in 1800, paragraph 6 covers 'the next two centuries,' and paragraph 8 mentions 1991 and 2019, so the history is told in time order."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO statements explain why lithium-ion batteries became so important? Choose TWO answers.","o":["Lithium is very light, so the batteries hold a lot of energy without much weight.","The batteries can be recharged and used again hundreds of times.","The batteries never wear down, no matter how often they are charged.","The batteries were first built by Alessandro Volta in 1800.","The batteries can be safely thrown away in the regular trash."],"ks":[0,1],"why":"Paragraph 7 says lithium is the lightest metal and that the charging cycle can be repeated hundreds of times. The text says each cycle wears the battery down a little, so 'never wear down' is wrong."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author include paragraph 9 about the drawbacks of batteries?","o":["to give a balanced view by showing problems that engineers are still working to solve","to persuade readers to stop buying phones, laptops, and other devices that contain batteries","to explain the steps for safely recycling a lithium-ion battery at home","to prove that Volta's first battery was safer than modern batteries"],"k":0,"why":"Paragraph 9 lists real problems, such as aging and overheating, and ends by saying engineers are searching for better batteries. It balances the positive history in paragraphs 5–8."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer about why Volta's pile \"amazed scientists across Europe\" (paragraph 5)?","o":["It let scientists study electricity in a steady way for the first time.","It was the smallest, lightest, and cheapest source of energy anyone had ever built.","It could be recharged over and over without wearing out.","It proved that electricity was the same as chemical energy."],"k":0,"why":"Paragraph 5 says earlier experimenters could make 'only quick sparks,' but the pile gave 'a reliable, continuous source of electricity to study.'","ev":["a5.4","a5.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"main idea","q":"What is the author's main claim in Text 2?","o":["School districts should replace diesel buses with electric buses.","Electric buses cost three times as much as diesel buses.","Students should walk or ride bikes to school instead of taking buses.","Diesel buses should be repaired so they produce less exhaust."],"k":0,"why":"Paragraph 1 ends with the claim, 'School districts should replace their diesel buses with electric buses,' and the rest of the essay supports it."},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the author respond to the argument that electric buses are too expensive?","o":["The author agrees the price is high but argues that savings over time help balance it.","The author says the price is not actually high once the bus is delivered.","The author ignores the cost completely and talks only about students’ health and the air.","The author admits the cost is too high and suggests waiting many years."],"k":0,"why":"In paragraph 4 the author says critics 'have a point,' but paragraph 5 explains that cheaper fuel and less maintenance help make up for the higher price over time.","ev":["b4.2","b5.4"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 6, the author writes, \"It is time to let the diesel bus <b>retire</b>.\" What does the word <b>retire</b> suggest?","o":["The diesel bus has done its job and should respectfully step aside.","The diesel bus should be punished for all the pollution it has caused.","The diesel bus is too tired to start in the morning.","The diesel bus will soon be faster than the electric one."],"k":0,"why":"People retire after many years of work. Using this word makes the diesel bus sound like an old worker that has earned a rest, so the change feels respectful, not angry."},{"on":"b","t":"mc","skill":"key details","q":"Which reason does the author give to explain why diesel exhaust especially affects children (paragraph 2)?","o":["Their lungs are still growing and they breathe faster than adults.","They spend more hours riding buses than adults spend driving cars.","They sit closer to the engine than the bus driver does.","They are more likely than adults to ride without a seat belt."],"k":0,"why":"Paragraph 2 says children are especially affected 'because their lungs are still growing and they breathe faster than adults.'"},{"on":"ab","t":"mc","skill":"compare texts","q":"How do the purposes of Text 1 and Text 2 differ?","o":["Text 1 explains how batteries work, while Text 2 tries to convince readers to choose electric buses.","Text 1 argues that batteries are dangerous, while Text 2 explains how school buses are built.","Text 1 tells a story about Volta’s whole life, while Text 2 gives the long history of school buses.","Text 1 persuades readers to recycle batteries, while Text 2 describes how diesel engines work."],"k":0,"why":"Text 1 informs readers about how batteries store and release energy. Text 2 is an opinion essay that makes a claim and gives reasons to persuade."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 helps explain why electric buses are possible today, as Text 2 argues?","o":["Lithium-ion batteries are light and powerful enough to run vehicles.","Volta’s pile was too heavy and messy to be practical for daily use.","Batteries can overheat if they are crushed or damaged.","AA batteries are meant to be used once and thrown away."],"k":0,"why":"Text 2 assumes buses can run on batteries. Text 1 paragraph 8 explains that lithium-ion batteries are light and powerful and already power electric cars.","ev":["a8.2","a8.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."}],"write":{"prompt":"Explain how the information in Text 1 helps support the argument in Text 2. Use at least one detail from each text.","model":"Text 1 helps support the argument in Text 2 by showing that battery technology is strong enough to power large vehicles. Text 1 explains that lithium-ion batteries are light and powerful and that they already run electric cars and bikes. It also says they can be recharged hundreds of times. Text 2 argues that schools should switch to electric buses because they produce no exhaust and keep children's lungs healthier. The facts from Text 1 show that the author of Text 2 is not asking for something impossible, because the batteries needed to run a bus already exist. Together, the texts show that a scientific invention can be used to solve a real problem in our community.","need":["States how Text 1 connects to the argument in Text 2","Uses a detail from Text 1 about how batteries work or what they power","Uses a reason from Text 2 for switching to electric buses","Explains why the Text 1 detail makes the Text 2 argument stronger"]}},{"id":"s13-canal","theme":"Lifting Ships Across Panama","a":{"title":"A Water Staircase Between Two Oceans","genre":"Informational","topic":"Technology and Engineering","gloss":{"isthmus":["a narrow strip of land with water on both sides that connects two larger areas of land","istmo"],"chamber":["a large, closed space or room","cámara"],"culverts":["large tunnels or pipes that carry water under or through something","alcantarillas, conductos"],"descend":["to go down","descender"],"transported":["carried from one place to another","transportado"],"reservoir":["a large lake used to store water for people or machines to use","embalse, depósito de agua"],"expansion":["the act of making something bigger","ampliación"]},"paras":[["Before 1914, a ship traveling from New York to San Francisco had to sail all the way around the southern tip of South America.","The journey covered thousands of extra miles and could take weeks, often through stormy, dangerous waters.","For centuries, people dreamed of cutting a shortcut through Panama, the narrow isthmus that connects North and South America.","When the Panama Canal finally opened on August 15, 1914, that dream came true, but not in the way most people had first imagined."],["The simplest idea would have been to dig a flat ditch from one ocean to the other, so ships could sail straight through at sea level.","An earlier French effort had tried something close to that, but it failed because of disease, landslides, and the huge amount of rock and earth that had to be removed.","When the United States took over the project, its engineers chose a different plan.","Instead of cutting the mountains down to the ocean, they would raise the ships up and over the land."],["The key to the plan was water.","Engineers built a dam across the Chagres River, and the river's water spread out to form Gatun Lake, which was the largest artificial lake in the world at the time.","The surface of the lake sits about 85 feet above sea level.","Ships cross much of Panama by sailing across this lake, but first they have to climb up to it."],["That climb happens in locks, which work like a giant staircase made of water.","A lock is a long concrete chamber with huge steel gates at each end.","When a ship enters from the ocean side, the gates close behind it.","Then water flows into the chamber, and the ship floats upward as the water level rises, the way a rubber duck rises in a filling bathtub.","When the water inside matches the level of the next chamber, the gates ahead swing open, and the ship moves forward to the next step."],["What surprises many visitors is that the canal's original locks use no pumps to move this water.","Everything works by gravity.","Water from Gatun Lake flows downhill through enormous tunnels, called culverts, that run through the lock walls and beneath the chamber floors.","Opening a valve lets water pour in from above to lift a ship, and opening a different valve lets water drain out to lower it.","Because the lake is higher than the oceans, water will always flow down toward the sea on its own."],["A ship traveling from the Atlantic side climbs three steps at the Gatun Locks to reach the lake.","After crossing the lake and a deep channel cut through the mountains, it must descend to the Pacific.","It goes down one step at the Pedro Miguel Locks and two more at the Miraflores Locks.","Along the way, small electric locomotives nicknamed \"mules\" run on tracks beside the chambers and use steel cables to keep ships centered, since a large vessel may have only a few feet of space on each side.","The whole trip through the canal, which is about 50 miles long, usually takes 8 to 10 hours."],["This clever system has a cost: every ship that passes through the original locks lets millions of gallons of fresh water flow out into the ocean.","By one estimate, it is about 52 million gallons for each trip.","That water comes from Gatun Lake, a huge reservoir that depends on Panama’s heavy rainfall to stay full.","The lake also supplies drinking water for nearby cities, so during dry years, the canal must sometimes limit how many ships can pass or how heavy they can be."],["As the years went by, ships kept growing larger, and many of the biggest could no longer fit in the original chambers.","To solve this problem, Panama built a major expansion that opened on June 26, 2016.","It added two new sets of locks, the Agua Clara Locks near the Atlantic and the Cocoli Locks near the Pacific, which are wider and deeper than the old ones.","Instead of mules, tugboats help guide ships through them."],["The new locks also include an important improvement.","Beside each chamber are water-saving basins, a series of side pools that catch some of the water when a chamber is emptied.","That water is later reused to help fill the chamber again.","According to the canal authority, the basins recycle about 60 percent of the water used in each trip."],["More than a century after it opened, the Panama Canal still depends on the same simple idea: water flowing downhill can lift a ship as heavy as a building.","Every year, thousands of vessels carrying cars, grain, fuel, and other goods are transported across Panama by this water staircase, connecting two oceans and the people who trade across them."]]},"b":{"title":"Up the Water Stairs","genre":"Poem","poem":true,"gloss":{"towering":["very tall, rising high above","imponente, altísimo"],"murmur":["a soft, low, steady sound","murmullo"],"patient":["calm and willing to wait without complaining","paciente"],"stern":["the back end of a ship","popa"],"gently":["in a soft and careful way","suavemente"],"tide":["the regular rise and fall of the ocean","marea"]},"paras":[["The towering ship slides in from the sea,","heavy with boxes stacked high as a tree.","Behind her stern the great gates swing tight,","and she waits in a box of gray concrete and light."],["Then comes a murmur from under the floor,","the lake pouring down through a hidden door.","No engine is pushing, no pump makes it climb,","just water that falls, as it has for all time."],["Up she rises, slow and patient and proud,","a mountain of steel lifted up like a cloud.","The mules hum beside her on silver-bright rails,","they hold her in place while she waits without sails."],["Three steps up she travels, then over the lake,","where egrets glide low in her slow-moving wake.","Then down the far stairs she is gently let go,","to the wide blue Pacific that waits there below."],["She was carried by rain that fell on the hills,","by the lake and the dam and the engineers’ skills.","So when she sails off on a new ocean's tide,","the rain of the rainforest rides at her side."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["The Panama Canal uses gravity-fed locks to lift ships over land between two oceans.","Ships once had to sail around South America to travel between New York and San Francisco.","The French effort to build a canal in Panama failed because of disease and landslides.","The Agua Clara and Cocoli Locks were opened in 2016 to fit very large ships."],"k":0,"why":"Most of Text 1 explains how locks use water flowing down from Gatun Lake to raise and lower ships (paragraphs 3–9). The other choices are true details from single paragraphs."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 5, what makes water flow into and out of the original lock chambers?","o":["gravity, because Gatun Lake is higher than the chambers and the oceans","huge electric pumps that push water up from the ocean into each chamber","the ocean tides, which rise and fall twice each day","the ships' engines, which churn water through the culverts"],"k":0,"why":"Paragraph 5 says the original locks 'use no pumps' and that 'Everything works by gravity' because the lake is higher than the oceans.","ev":["a5.2","a5.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 10, ships are <b>transported</b> across Panama. The prefix <i>trans-</i> means \"across,\" and the root <i>port</i> means \"carry.\" What does <b>transported</b> mean?","o":["carried across from one place to another","stopped and checked before entering","built, painted, and repaired in a shipyard","sunk to the bottom of a lake"],"k":0,"why":"Trans- (across) + port (carry) means carried across. Paragraph 10 describes ships being moved from one ocean to the other."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, a ship must <b>descend</b> to the Pacific. Which phrase from the paragraph helps you understand what <b>descend</b> means?","o":["\"goes down one step\"","\"climbs three steps\"","\"run on tracks beside the chambers\"","\"keep ships centered\""],"k":0,"why":"Right after saying the ship must descend, paragraph 6 explains that 'It goes down one step' and then two more, so descend means go down."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author explain how a lock works in paragraph 4?","o":["by describing the steps in order and comparing the ship to a toy in a bathtub","by listing the problems with locks and then giving a solution for each one","by comparing the Panama Canal with several other famous canals around the world","by telling the story of the first ship to pass through the canal in 1914"],"k":0,"why":"Paragraph 4 goes step by step (gates close, water flows in, the ship rises, gates open) and compares the ship to 'a rubber duck' rising in a bathtub."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO details from Text 1 describe ways the canal's water supply is limited or protected? Choose TWO answers.","o":["During dry years, the canal may limit how many ships pass through.","Water-saving basins recycle about 60 percent of the water used in a trip.","Electric locomotives called mules keep ships centered in the chambers.","The canal is about 50 miles long and takes 8 to 10 hours to cross.","The expansion added locks that are wider and deeper than the old ones."],"ks":[0,1],"why":"Paragraph 7 says the canal limits ships in dry years, and paragraph 9 says the basins reuse about 60 percent of the water. The other details are about ships, not the water supply."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 2, what can the reader infer about why U.S. engineers chose to build locks?","o":["Digging the land all the way down to sea level would have been too difficult.","Locks were cheaper to build because they required no concrete or steel.","Engineers wanted the canal to look like the canals they had seen in Europe.","Ships at that time were too small and too slow to sail safely through a sea-level canal."],"k":0,"why":"Paragraph 2 says the French failed partly because of 'the huge amount of rock and earth that had to be removed,' so the U.S. chose to raise ships 'Instead of cutting the mountains down.'","ev":["a2.2","a2.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to Text 1, what caused Panama to build new locks that opened in 2016?","o":["Ships had grown too large to fit in the original chambers.","Gatun Lake had dried up and could no longer fill the old locks.","The original locks had been damaged by a powerful earthquake.","The mules had become too old to guide ships safely."],"k":0,"why":"Paragraph 8 explains that 'many of the biggest' ships 'could no longer fit in the original chambers,' so Panama built an expansion.","ev":["a8.1"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author begin Text 1 by describing the long trip around South America?","o":["to show how much time and danger the canal helped ships avoid","to explain why most ships still choose to sail around South America","to describe the weather patterns at the southern tip of South America","to compare the cities of New York and San Francisco"],"k":0,"why":"Paragraph 1 describes a trip that took 'thousands of extra miles' through 'dangerous waters,' which helps readers understand why the canal mattered so much."},{"on":"b","t":"mc","skill":"theme","q":"Which idea is best supported by the poem?","o":["Natural forces like rain and gravity can do great work with the help of people.","Large ships are dangerous and should not be allowed to pass through narrow canals at all.","The Pacific Ocean is more beautiful than the Atlantic Ocean.","Traveling by ship is the slowest and least useful way to move goods."],"k":0,"why":"The poem shows the ship lifted by falling water with 'No engine' and 'no pump' (stanza 2), and stanza 5 says rain and 'the dams' quiet skills' carried her."},{"on":"b","t":"mc","skill":"word choice","q":"In stanza 3, the ship is called \"a mountain of steel lifted up like a cloud.\" What feeling does this comparison create?","o":["amazement that something so huge can rise so lightly","fear that the ship might break loose and float away to be lost at sea","sadness that the ship is too heavy to keep moving","annoyance that the ship is taking so long to rise"],"k":0,"why":"A mountain is enormous and heavy, but a cloud is light. Putting them together creates wonder at how easily the water lifts such a giant ship."},{"on":"b","t":"ebsr","skill":"key details","q":"Part A: Which detail in the poem matches the fact from Text 1 that the locks use no pumps?","o":["The speaker says the ship climbs with only falling water, not an engine or pump.","The speaker says the mules pull the ship up the steps with their cables.","The speaker says the ocean tide rises and pushes the ship up into the lake.","The speaker says the ship's own engines lift her up each step."],"k":0,"why":"Stanza 2 says 'No engine is pushing, no pump makes it climb, / just water that falls,' which matches the gravity system in Text 1.","ev":["b2.3","b2.4"],"evq":"Part B: Click the line in the poem that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"point of view","q":"How does the speaker of the poem seem to feel about the ship's journey?","o":["full of admiration and wonder","worried and nervous for the crew","bored and impatient","angry and disappointed"],"k":0,"why":"The speaker calls the ship 'patient and proud' and describes the climb with beautiful images, showing admiration, not worry or boredom."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the poem's description of the ship's journey different from Text 1's description?","o":["The poem uses images and feelings, while Text 1 uses facts, names, and numbers.","The poem gives exact dates, while Text 1 describes only how the ship looks.","The poem explains how the culverts work, while Text 1 describes birds and rain.","The poem argues against the canal, while Text 1 argues for building a new one."],"k":0,"why":"Text 1 gives facts like '85 feet' and '60 percent.' The poem uses images like 'a mountain of steel' and 'egrets glide low' to help readers feel the journey."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Both texts suggest that the canal depends on rain. Which statement best explains this idea?","o":["Rain fills the lake whose water flows down to lift the ships.","Rain makes the ocean deeper so that large ships can sail more easily.","Rain cools the mules' engines so they can pull longer.","Rain washes the ships clean before they reach the Pacific."],"k":0,"why":"Text 1 paragraph 7 says Gatun Lake 'depends on Panama's heavy rainfall to stay full,' and the poem's last stanza says the ship 'was carried by rain that fell on the hills.'","ev":["a7.3","b5.1"],"evq":"Part B: Click the sentence or line in Text 1 or the poem that best supports your answer to Part A."}],"write":{"prompt":"Explain how Text 1 and the poem each show the role of water in moving ships through the Panama Canal. Use at least one detail from each text.","model":"Both texts show that water, not machines, is what moves ships through the Panama Canal. Text 1 explains that the original locks use no pumps. Instead, water from Gatun Lake flows downhill through culverts and fills each chamber, so the ship floats up 'the way a rubber duck rises in a filling bathtub.' The poem shows the same idea in a more emotional way. It says, 'No engine is pushing, no pump makes it climb, / just water that falls.' The poem even reminds readers that the water started as rain on the hills. Text 1 gives the facts of how the system works, and the poem makes readers feel amazed that falling water can lift a giant ship.","need":["States a claim about how water moves the ships","Uses a fact from Text 1 (such as gravity, culverts, or Gatun Lake)","Uses a line or image from the poem","Explains how the two texts show the idea in different ways"]}},{"id":"s14-sound","theme":"Sound, Hearing, and Protecting Your Ears","a":{"title":"From Vibration to Brain: How We Hear","genre":"Informational","topic":"Human Body","gloss":{"vibrate":["to move back and forth very quickly","vibrar"],"compressed":["pushed closer together into less space","comprimido"],"audible":["loud enough to be heard","audible"],"cochlea":["the snail-shaped part of the inner ear that is filled with fluid","cóclea, caracol del oído"],"permanent":["lasting forever; not able to be fixed or undone","permanente"],"irreversible":["not able to be changed back to the way it was","irreversible"],"intensity":["how strong or powerful something is","intensidad"]},"paras":[["Clap your hands once.","In that instant, you set off a chain of events that travels through the air, enters your head, and ends inside your brain, all in a tiny fraction of a second.","Hearing seems effortless, but it depends on some of the most delicate machinery in the human body.","Understanding how it works can also help you protect it for the rest of your life."],["Every sound begins with a vibration.","When you clap, pluck a guitar string, or speak, something moves back and forth very quickly.","As it moves, it bumps into the air molecules next to it, pushing them together and then letting them spread apart.","Those molecules bump into their neighbors, which bump into their neighbors, passing the motion along.","The result is a sound wave, a pattern of compressed and spread-out air that travels outward in every direction."],["Sound waves need something to travel through, such as air, water, or a solid wall.","In the emptiness of outer space, where there are almost no molecules, sound cannot travel at all, so even a huge explosion would be silent.","In air at room temperature, sound moves at about 343 meters per second, or roughly 767 miles per hour.","That is fast, but light is far faster, which is why you see a flash of lightning before you hear the thunder that comes with it."],["Sounds differ in two important ways.","Pitch describes how high or low a sound is, and it depends on how quickly the source vibrates.","A tiny flute produces fast vibrations and high notes, while a large tuba produces slow vibrations and low notes.","Loudness depends on how much energy the wave carries, and it is measured in units called decibels, written dB.","A whisper is about 30 decibels, and a normal conversation is about 60 to 70 decibels."],["The decibel scale does not work like an ordinary ruler.","Each increase of 10 decibels means the sound wave carries ten times as much energy, and to our ears it seems roughly twice as loud.","So a sound of 90 decibels is not just a little louder than one of 80 decibels; it carries ten times the intensity.","This explains why a sound that seems only somewhat louder can be much more dangerous."],["Once a sound wave reaches you, your ear goes to work.","The curved outer ear gathers the wave and funnels it down the ear canal to the eardrum, a thin layer of tissue stretched tight like the top of a drum.","The wave makes the eardrum vibrate, and the eardrum passes those vibrations to three tiny bones in the middle ear, which are among the smallest bones in your body.","These bones strengthen the vibrations and pass them along to the cochlea, a snail-shaped tube in the inner ear that is filled with fluid."],["Inside the cochlea, the fluid ripples, and thousands of sensory cells called hair cells ride those ripples.","Each hair cell is topped with tiny bristles that bend as the fluid moves.","That bending turns the motion into an electrical signal, which travels along the auditory nerve to the brain.","Only then does your brain recognize the sound as a friend's voice, a barking dog, or a favorite song.","The word auditory comes from the Latin root aud, meaning \"hear,\" the same root found in audible, audience, and audio."],["Hair cells are amazing, but they are also fragile.","Very loud sounds, or sounds that last a long time, can bend them too far and damage or destroy them.","In humans, these cells do not grow back, so hearing loss caused by noise is permanent.","Health experts say that sounds at or above 85 decibels can harm your hearing over time, and extremely loud sounds, such as fireworks exploding nearby, can cause damage almost instantly.","One warning sign is a ringing or buzzing in your ears after a concert or a noisy event."],["The good news is that noise-induced hearing loss is almost completely preventable.","Experts recommend three simple strategies: lower the volume, move away from the source of the noise, or protect your ears with earplugs or earmuffs.","If you have to raise your voice to be heard by someone standing an arm's length away, the noise around you is probably loud enough to be harmful.","When you listen with headphones, keep the volume low enough that you can still hear people nearby."],["Your ears work every moment of every day, even while you sleep.","Because damage to them is irreversible, taking care of them now is one of the smartest choices you can make for your future self.","After all, the world is full of audible wonders, and you will want to hear them for many years to come."]]},"b":{"title":"Fortissimo","genre":"Realistic fiction","gloss":{"fortissimo":["a music direction meaning to play very loudly","fortísimo, muy fuerte"],"muffled":["quieter and less clear, as if covered by something","amortiguado, apagado"],"reluctantly":["without really wanting to","de mala gana"],"crisp":["clear and sharp","nítido, claro"],"cymbals":["round metal plates that make a loud crashing sound when struck","platillos"],"humming":["a low, steady buzzing sound","zumbido"]},"paras":[["Rosa loved the moment in the spring concert piece when Mr. Delgado raised both arms and the whole band hit the fortissimo.","The trumpets blared, the cymbals crashed, and the bass drum boomed right behind her chair, so close that she could feel it in her ribs.","It felt like standing inside a thunderstorm."],["After Thursday's rehearsal, though, something strange happened.","On the walk home, her little brother kept talking, and his voice sounded muffled, as if he were speaking through a pillow.","A high, thin humming filled her ears, like a mosquito that would not leave.","It was still there when she brushed her teeth that night."],["By morning, the humming had faded, and Rosa decided not to mention it.","But at Friday's rehearsal, Mr. Delgado noticed her rubbing her ear and asked her to stay after class."],["\"Ringing?\" he asked, and she nodded reluctantly.","He sighed and opened his desk drawer, which was full of small plastic cases.","\"I got these after I played in a rock band for ten years without them,\" he said, pointing to his own ears.","\"Now I hear a little ringing every single day. It never goes away.\""],["He handed her a case with a pair of musician's earplugs inside.","\"These don't block the music,\" he explained.","\"They just turn everything down evenly, like lowering the volume on a speaker.\""],["Rosa frowned.","\"Won't I sound weird? Won't everyone notice?\""],["\"Half the high school band wears them,\" he said.","\"And I'm moving the drums back three rows.\""],["At Monday's rehearsal, Rosa twisted the earplugs in, expecting the music to sound flat and far away.","Instead, it was like wiping a foggy window.","The crashing chaos broke apart into crisp layers: the trumpets on top, the clarinets in the middle, and her own saxophone line weaving between them.","She could actually hear herself playing."],["When the fortissimo came, it still felt like a thunderstorm, but now it was one she could stand inside safely.","On the walk home, her brother's voice sounded perfectly clear, and there was no humming at all.","Rosa smiled and patted the little plastic case in her pocket."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Sound travels as vibrations that the ear turns into signals, and these delicate parts need protection from loud noise.","A normal conversation measures about 60 to 70 decibels, while a quiet whisper measures only about 30 decibels on the scale.","Sound moves through air at about 343 meters per second, which is much slower than the speed of light.","The three tiny bones in the middle ear are among the smallest bones found anywhere in the human body."],"k":0,"why":"Text 1 explains how sound waves travel (paragraphs 2–5), how the ear hears them (paragraphs 6–7), and how to protect hearing (paragraphs 8–10). The other choices are single details."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to Text 1, what is the first thing that happens when any sound is made?","o":["Something vibrates and pushes on the air molecules next to it.","The eardrum begins to vibrate and moves the three tiny bones.","Hair cells in the cochlea bend and send a signal to the brain.","The brain recognizes the sound as a voice or a song."],"k":0,"why":"Paragraph 2 says 'Every sound begins with a vibration' and explains that the moving object bumps into nearby air molecules.","ev":["a2.1","a2.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"Paragraph 7 explains that the root <i>aud</i> means \"hear.\" In paragraph 10, what does <b>audible</b> mean?","o":["able to be heard","able to be seen","too loud to be safe","too quiet to notice"],"k":0,"why":"The root aud means hear and the suffix -ible means able to be, so audible means able to be heard. Paragraph 10 talks about the sounds of the world you will want to hear."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 10, damage to the ears is called <b>irreversible</b>. Based on the prefix <i>ir-</i>, what does <b>irreversible</b> mean?","o":["not able to be undone","able to be undone easily","undone again and again","undone before it happens"],"k":0,"why":"The prefix ir- means 'not,' so irreversible means not reversible. Paragraph 8 supports this by saying hair cells do not grow back and the loss is permanent."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 5, why might a sound that seems \"only somewhat louder\" be much more harmful?","o":["A small change in decibels means a big jump in the energy of the sound.","Louder sounds travel faster and reach the ear before quieter sounds.","People usually stand closer to sounds that are only slightly louder.","The ear stops working completely whenever a sound goes over 80 decibels."],"k":0,"why":"Paragraph 5 says each 10-decibel increase means ten times as much energy, so 90 decibels carries ten times the intensity of 80 decibels.","ev":["a5.2","a5.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"How are paragraphs 6 and 7 mainly organized?","o":["in sequence, following a sound from the outer ear to the brain","as a comparison between the way human ears and animal ears hear","as a list of reasons why people lose their hearing","as a problem about loud noise followed by a solution"],"k":0,"why":"Paragraph 6 moves from the outer ear to the eardrum, bones, and cochlea, and paragraph 7 continues to the hair cells, the auditory nerve, and the brain, in order."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO actions does Text 1 recommend for protecting your hearing? Choose TWO answers.","o":["Move away from the source of a loud noise.","Wear earplugs or earmuffs around loud sounds.","Clap your hands to test whether your ears are working.","Raise your voice so people can hear you over the noise.","Turn up your headphones so you cannot hear people nearby."],"ks":[0,1],"why":"Paragraph 9 lists three strategies: lower the volume, move away from the noise, and use earplugs or earmuffs. Turning headphones up is the opposite of what the text advises."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 8, why is hearing loss from noise permanent?","o":["The damaged hair cells in the inner ear do not grow back.","The eardrum tears and can never be repaired by doctors.","The auditory nerve stops sending signals after one loud sound.","The three tiny bones in the middle ear break apart."],"k":0,"why":"Paragraph 8 says loud sounds can damage hair cells and 'In humans, these cells do not grow back, so hearing loss caused by noise is permanent.'","ev":["a8.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author begin Text 1 by asking the reader to \"Clap your hands once\"?","o":["to get the reader involved and show that hearing happens in everyday moments","to prove that clapping is the loudest sound a person can make","to warn readers that clapping can damage the hair cells in their ears","to explain the history of how scientists first discovered and measured sound waves"],"k":0,"why":"Paragraph 1 uses a simple action the reader can try to show that even a clap starts the whole process of hearing, which makes the topic feel personal."},{"on":"b","t":"mc","skill":"theme","q":"Which theme is best supported by Text 2?","o":["Protecting yourself does not have to mean giving up what you love.","Adults always know more than young people about music.","It is better to keep problems to yourself than to worry others.","Playing in a band is too dangerous for young students."],"k":0,"why":"Rosa worries earplugs will ruin the music, but in paragraphs 8–9 she still enjoys the fortissimo 'safely' and can even hear herself better."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 8, wearing the earplugs is described as \"like wiping a foggy window.\" What does this comparison suggest?","o":["The music becomes clearer instead of more muffled.","The music becomes so quiet that it is hard to hear.","The band room becomes cold and damp during rehearsal.","Rosa feels confused and cannot see the conductor."],"k":0,"why":"Wiping a foggy window makes things easier to see. The comparison shows the music became clearer, which matches the next sentence about 'crisp layers.'"},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Rosa feel when Mr. Delgado first offers her the earplugs?","o":["worried about how she will sound and look","thankful and eager to try them right away","angry that he is moving the drums","bored because she already owns a pair"],"k":0,"why":"In paragraph 6 Rosa frowns and asks, 'Won't I sound weird? Won't everyone notice?' which shows she is worried.","ev":["b6.1","b6.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"Why does Mr. Delgado tell Rosa about his own ringing ears (paragraph 4)?","o":["to show her that the damage is real and can last forever","to convince her to quit the band and join the school choir instead","to explain why he no longer plays the trumpet","to prove that rock music is louder than band music"],"k":0,"why":"Mr. Delgado says he hears ringing 'every single day' and that 'It never goes away,' so he uses his own experience to warn her."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which fact from Text 1 best explains the humming Rosa hears after rehearsal in Text 2?","o":["A ringing or buzzing in the ears after a loud event is a warning sign.","Pitch depends on how quickly the source of a sound vibrates.","Sound cannot travel through the emptiness of outer space.","The curved outer ear gathers sound waves and funnels them inward."],"k":0,"why":"Text 1 paragraph 8 says ringing or buzzing after a noisy event is a warning sign. Rosa hears 'a high, thin humming' after sitting near the loud drums.","ev":["a8.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does Text 2 add to the reader's understanding of the ideas in Text 1?","o":["It shows how one person experiences a hearing warning sign and solves the problem.","It gives more scientific facts about each part of the ear and exactly how it works.","It proves that the decibel numbers in Text 1 are not correct.","It explains why musicians should stop playing loud songs."],"k":0,"why":"Text 1 explains the science and the advice. Text 2 shows that advice in action through Rosa's ringing ears, her worries, and her new earplugs."}],"write":{"prompt":"Explain how Text 1 and Text 2 each show why it is important to protect your hearing. Use at least one detail from each text.","model":"Both texts show that protecting your hearing is important because noise damage cannot be fixed. Text 1 explains that hair cells in the cochlea can be damaged by loud sounds, and \"In humans, these cells do not grow back.\" It also says a ringing sound after a noisy event is a warning sign. In Text 2, Rosa hears a humming after sitting near the bass drum. Mr. Delgado warns her that his own ringing \"never goes away\" and gives her earplugs. When she wears them, she can still enjoy the music. Text 1 gives the scientific reason to protect your ears, while Text 2 shows a real-life way to do it without missing out.","need":["States why protecting hearing matters","Uses a fact from Text 1 (such as hair cells not growing back or the 85-decibel limit)","Uses a detail from Text 2 (such as Rosa's humming ears or the earplugs)","Explains how the two details work together"]}},{"id":"s15-katherine","theme":"The Mathematics of Spaceflight","a":{"title":"Katherine Johnson: The Woman Who Checked the Numbers","genre":"Biography","topic":"History of Science","gloss":{"segregated":["kept separate by race, by law or by custom","segregado"],"trajectory":["the curved path an object follows as it moves through the air or through space","trayectoria"],"orbit":["the curved path an object takes as it circles around a planet or star","órbita"],"verify":["to check that something is correct","verificar"],"precise":["exact and careful, with no mistakes","preciso"],"inspected":["looked at closely and carefully to find problems","inspeccionado"],"persistence":["the quality of continuing to try even when something is hard","perseverancia"]},"paras":[["In February 1962, the astronaut John Glenn was preparing to become the first American to orbit Earth.","NASA had a new electronic computer to calculate his path, but Glenn was not ready to trust his life to a machine he had never seen work.","According to NASA, he asked the engineers to have one particular mathematician check the computer's numbers by hand.","If she said they were good, he reportedly said, he was ready to go.","That mathematician was Katherine Johnson."],["Katherine Coleman was born on August 26, 1918, in White Sulphur Springs, West Virginia.","From an early age, numbers fascinated her, and she later recalled, \"I counted everything.\"","She counted the steps to church, the dishes she washed, and the stars she could see in the night sky.","She moved through school so quickly that she was ready for high school years ahead of other children her age."],["Her talent ran into an unfair obstacle.","At the time, schools in much of the United States were segregated, and her town offered no high school classes for Black students.","Determined that his children would get an education, her father moved the family about 120 miles to the town of Institute, where she could attend a high school on a college campus.","She graduated from high school at 14, and by 18 she had earned degrees in mathematics and French from West Virginia State College with the highest honors."],["At college, a professor named William W. Schieffelin Claytor noticed her gift.","He created advanced math courses just for her and told her that she would make a good research mathematician.","Back then, very few jobs of that kind were open to women, and even fewer were open to Black women.","For years, Johnson worked as a teacher, which was one of the careers available to her."],["In 1953, she finally got her chance.","She was hired at the Langley laboratory in Hampton, Virginia, by NACA, the agency that would later become NASA.","She joined a group of Black women who worked as \"computers,\" a word that once meant people who performed calculations by hand.","Within weeks, she was assigned to work with a team of engineers studying flight.","Johnson did not simply follow instructions; she asked questions and wanted to know why things worked the way they did."],["Her skill soon became essential to America's space program.","In 1961, she calculated the trajectory for Alan Shepard's flight, the first time an American traveled into space.","A trajectory is the curved path an object follows, and calculating it correctly meant figuring out exactly when and where a spacecraft should launch so it would land in the right place.","A tiny mistake could send a spacecraft hundreds of miles off course."],["This is why John Glenn's request mattered so much.","Electronic computers were new and sometimes unreliable, and astronauts knew that a small error could be deadly.","Johnson spent long hours working through the equations of Glenn’s orbit to verify what the machine had calculated.","Her numbers matched, and on February 20, 1962, Glenn circled Earth three times and returned safely."],["Johnson went on to help with some of NASA's greatest achievements.","She performed calculations for the Apollo 11 mission, which landed the first astronauts on the Moon in 1969.","Her work helped make sure the small lunar lander, after leaving the Moon's surface, could meet up with the spacecraft orbiting above it.","Later, she contributed to the Space Shuttle program before she retired in 1986, after more than thirty years of precise work."],["For decades, few Americans knew her name.","That changed in 2015, when President Barack Obama awarded her the Presidential Medal of Freedom, the nation's highest honor for a civilian.","A year later, the book and film Hidden Figures told the story of Johnson and her fellow mathematicians to millions of people.","In 2017, NASA opened a new research building at Langley named in her honor."],["Katherine Johnson died in 2020 at the age of 101.","Her life shows that a curious mind, a love of numbers, and persistence can open doors that once seemed closed.","Her story also reminds us that behind every rocket launch are people whose careful, inspected work makes the impossible possible."]]},"b":{"title":"The Teacher Who Drew on the Windows","genre":"Memoir (fiction)","gloss":{"dreaded":["felt very worried or afraid about something before it happened","temía"],"equation":["a math statement that shows two amounts are equal","ecuación"],"hesitated":["paused because of being unsure","dudó"],"stubborn":["hard to solve or change; refusing to give in","difícil, terco"],"wonder":["a feeling of surprise and amazement","asombro"],"glowed":["shone with light","brillaba"]},"paras":[["Today I design guidance systems that help satellites find their way around Earth.","People sometimes ask me when I first knew I wanted to be an engineer.","The honest answer is that, for a long time, I didn't.","In fifth grade, I dreaded math more than anything, even more than the dentist."],["Then I walked into Ms. Ferreira's sixth-grade classroom.","The first thing I noticed was that her windows were covered in numbers.","She wrote on them with special markers, so every problem we solved glowed in the afternoon sun.","On the first day, she drew a curved line across the glass and asked, \"Who can tell me where a ball will land if I throw it from this window?\""],["Nobody raised a hand.","She smiled and said, \"By June, all of you will be able to tell me.\""],["I didn't believe her.","Whenever I got a problem wrong, I would erase it so hard that the paper tore.","Ms. Ferreira noticed.","One day she knelt beside my desk and said, \"Don't erase your mistakes. Circle them.","A mistake is just the problem showing you where it's hiding.\""],["So I started circling.","At first my papers looked like they had chicken pox.","But slowly the circles became fewer, and the ones that remained began to teach me things.","I learned that I always forgot to carry the one, and that I rushed when I was nervous.","I learned that a stubborn equation usually gave in if I drew a picture of it."],["In the spring, she showed us a photograph of Katherine Johnson and told us how one woman's careful math had helped bring astronauts safely home.","I remember staring at that photograph for a long time.","I hadn't known that math could keep people safe.","When the bell rang, I hesitated by the door, and Ms. Ferreira asked what I was thinking.","\"I want to do that,\" I said, surprised at my own voice."],["By June, I could tell her where the ball would land.","I went back to visit her the year I started my first engineering job.","Her windows were still covered in numbers, and when I showed her one of my calculations, she circled a tiny error in the corner and laughed.","\"Still hiding,\" she said.","I still feel that same wonder every time a satellite I helped guide finds its path in the sky."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Katherine Johnson overcame unfair barriers and used her math skills to help make America's spaceflights safe.","Katherine Johnson was born in West Virginia in 1918 and counted the steps to church and the stars in the sky as a child.","Electronic computers in the 1960s were often unreliable, so astronauts did not trust their results.","The book and film Hidden Figures made Katherine Johnson famous around the world in 2016."],"k":0,"why":"Text 1 describes the obstacles Johnson faced (paragraphs 3–4) and her important work on Shepard's, Glenn's, and Apollo 11's flights (paragraphs 6–8). The other choices are smaller details."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What does John Glenn's request in paragraph 1 suggest about how people at NASA viewed Katherine Johnson?","o":["They trusted her calculations even more than a new machine.","They thought she should become an astronaut herself.","They believed she knew how to build and repair electronic computers.","They hoped she would take Glenn's place on the mission."],"k":0,"why":"Paragraph 1 says Glenn did not trust the new computer but would be 'ready to go' if Johnson said the numbers were good.","ev":["a1.2","a1.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 3, why did Katherine Johnson's family move to Institute, West Virginia?","o":["Her town had no high school classes for Black students.","Her father had found a new job working at a college there.","Her family wanted to live closer to the NASA laboratory.","Her teachers said she was too young to stay in school."],"k":0,"why":"Paragraph 3 says schools were segregated and 'her town offered no high school classes for Black students,' so her father moved the family.","ev":["a3.2","a3.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, the author defines <b>trajectory</b> as \"the curved path an object follows.\" The Latin root <i>ject</i> means \"throw.\" How does this root help explain the word?","o":["A trajectory is the path of something thrown or launched through the air.","A trajectory is the speed at which a spacecraft falls back down to Earth after its mission.","A trajectory is a machine that throws away wrong calculations.","A trajectory is a list of the steps for building a rocket."],"k":0,"why":"Ject means throw, and paragraph 6 explains that a trajectory is the curved path of a spacecraft that is launched, like something thrown."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 10, the author says Johnson's life shows the power of <b>persistence</b>. What does <b>persistence</b> mean, and what does the suffix -ence do?","o":["continuing to try even when things are hard; -ence turns the verb persist into a noun","giving up quickly when things are hard; -ence means \"without\"","being smarter than everyone else; -ence turns the noun into an adjective that describes","asking for help from others; -ence means \"before\" or \"earlier\""],"k":0,"why":"Johnson kept going for years before she got her chance at Langley (paragraphs 4–5). The suffix -ence turns the verb persist into the noun persistence."},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author begin with Glenn's 1962 flight and then go back to 1918 in paragraph 2?","o":["to open with an exciting moment and then tell how Johnson's life led up to it","to show that Johnson's childhood was more important than her NASA work","to compare John Glenn’s childhood in Ohio with Katherine Johnson’s childhood in West Virginia","to explain that the events of the story happened in a different order"],"k":0,"why":"Paragraph 1 grabs attention with a dramatic scene. Paragraph 2 jumps back to her birth so readers can see how she became the person Glenn trusted."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO details show that Katherine Johnson had an unusual talent for math from a young age? Choose TWO answers.","o":["She counted everything, including steps, dishes, and stars.","A professor created advanced math courses just for her.","She worked as a teacher for several years before 1953.","She was awarded the Presidential Medal of Freedom in 2015.","She retired from NASA in 1986 after the Space Shuttle program."],"ks":[0,1],"why":"Paragraph 2 says she 'counted everything,' and paragraph 4 says Professor Claytor made special courses just for her. The other details happened later in her life."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author include paragraph 9 about the Medal of Freedom and Hidden Figures?","o":["to show that Johnson's work was recognized only many years after she did it","to explain how the film Hidden Figures was made and who acted in it","to argue that Johnson deserved to be paid much more money for all of her work at NASA","to describe the calculations Johnson performed for the Apollo 11 mission"],"k":0,"why":"Paragraph 9 begins 'For decades, few Americans knew her name' and then lists honors from 2015 to 2017, long after her famous work."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: Which statement best describes the author's point of view about Katherine Johnson?","o":["The author admires her and believes her careful work was essential.","The author thinks she was lucky to be chosen for an easy and simple job.","The author believes computers did most of the important work.","The author feels her story is not important to people today."],"k":0,"why":"In paragraph 6 the author calls her skill 'essential,' and in paragraph 10 says her work 'makes the impossible possible,' which shows admiration.","ev":["a6.1","a10.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"theme","q":"Which theme is best supported by Text 2?","o":["A caring teacher can help a student see mistakes as chances to learn.","Students who struggle with math should give up and choose a different subject.","Engineers never make mistakes once they finish school.","The best teachers give very easy work so students feel successful."],"k":0,"why":"Ms. Ferreira teaches the narrator to circle mistakes instead of erasing them (paragraph 4), and the narrator slowly learns from them and becomes an engineer."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 5, the narrator says, \"At first my papers looked like they had chicken pox.\" What does this comparison suggest?","o":["Her papers were covered with many circled mistakes.","Her papers were dirty and needed to be thrown away.","She was sick and missed many days of school.","She drew red pictures to decorate her homework."],"k":0,"why":"Chicken pox makes many spots appear. The comparison shows that her papers were covered with circles around her mistakes."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does the narrator's attitude toward math change during sixth grade?","o":["She goes from dreading math to wanting to use it in her career.","She goes from loving math to finding it boring and too easy.","She goes from enjoying math to fearing it because of all her mistakes.","She goes from ignoring math to only caring about her grades."],"k":0,"why":"Paragraph 1 says she \"dreaded math more than anything,\" but in paragraph 6 she sees Johnson’s photograph and says, \"I want to do that.\"","ev":["b1.4","b6.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"At the end of the memoir, Ms. Ferreira circles an error and says, \"Still hiding.\" What does this moment suggest?","o":["Even an expert keeps finding and learning from mistakes.","Ms. Ferreira is disappointed that the narrator became an engineer.","The narrator never really learned the lesson about mistakes.","Ms. Ferreira thinks the narrator should go back to sixth grade."],"k":0,"why":"Ms. Ferreira laughs and repeats her old idea that a mistake shows \"where it’s hiding\" (paragraph 4). It shows that checking for errors is part of the work, even for professionals."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the point of view in Text 2 different from the point of view in Text 1?","o":["Text 2 is told in first person by a narrator sharing her own memories, while Text 1 is told in third person.","Text 2 is told by Katherine Johnson herself, while Text 1 is told by John Glenn.","Text 2 is told in third person by a historian, while Text 1 is told by the narrator’s former sixth-grade teacher.","Text 2 and Text 1 are both told in first person by people who worked at NASA."],"k":0,"why":"Text 2 uses 'I' and 'my' as the narrator remembers her teacher. Text 1 is a biography that tells about Johnson using 'she' and 'her.'"},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea about Katherine Johnson appears in both texts?","o":["Her careful math helped keep astronauts safe.","She was the first woman to travel into space.","She built the first electronic computer at NASA.","She taught sixth grade before joining NASA."],"k":0,"why":"Text 1 explains how she checked Glenn's orbit before his flight. Text 2 says her 'careful math had helped bring astronauts safely home.'","ev":["b6.1","b6.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Both texts show how people can grow into strong mathematicians. Explain what helped Katherine Johnson in Text 1 and the narrator in Text 2 succeed. Use at least one detail from each text.","model":"In both texts, support from others and a willingness to keep working helped each person succeed in math. In Text 1, Katherine Johnson's father moved the family 120 miles so she could attend high school, and her professor created advanced courses just for her. These people helped her talent grow even when segregation blocked her path. In Text 2, the narrator dreaded math until Ms. Ferreira taught her to circle her mistakes instead of erasing them. By studying those circles, she learned to slow down and draw pictures of hard problems. Both texts show that talent is not enough by itself. Caring people and steady effort turn a love of numbers into real success.","need":["States what helped both people succeed","Uses a detail from Text 1 about Katherine Johnson","Uses a detail from Text 2 about the narrator or Ms. Ferreira","Explains how the details show growth in math"]}},{"id":"s16-lovelace","theme":"Thinking Like a Programmer","a":{"title":"Ada Lovelace: Seeing Beyond the Numbers","genre":"Biography","topic":"History of Science","gloss":{"demonstration":["a showing of how something works","demostración"],"ambitious":["aiming to do something big and difficult","ambicioso"],"translated":["changed words from one language into another","tradujo"],"operation":["one step of math, such as adding or multiplying","operación"],"insight":["a deep and clear understanding of something","perspicacia / idea profunda"],"exaggerate":["to say something is bigger or better than it really is","exagerar"],"foreseen":["known or imagined before it happened","previsto"]},"paras":[["In 1833, a seventeen-year-old named Ada Byron watched a demonstration of a remarkable calculating machine.","Its inventor, the mathematician Charles Babbage, had built a small working section of a device he called the Difference Engine, and its brass wheels clicked through calculations on their own.","Many visitors admired the machine the way they might admire a fancy clock.","Ada, however, wanted to understand exactly how it worked and what else it might do.","That curiosity would eventually lead her to write about computing more than a century before the first electronic computer was built."],["Ada was born in London in 1815.","Her father was Lord Byron, one of the most famous poets in England, but her parents separated when she was only a few weeks old, and she never knew him.","Her mother, Anne Isabella Milbanke, had a strong interest in mathematics.","Worried that her daughter might turn out to be a poet like her father, she made sure Ada studied mathematics and science with tutors.","Ada was often sick as a child, but her lessons gave her a disciplined way of thinking that she would use for the rest of her life."],["Babbage had a practical problem he wanted to solve.","In his time, sailors, engineers, and bankers relied on printed tables of numbers that had been calculated and copied by hand, and those tables often contained errors.","His Difference Engine was designed to calculate such tables automatically.","Soon, though, he imagined a far more ambitious machine: the Analytical Engine.","It would have a “store” to hold numbers and a “mill” to work on them, much like the memory and processor inside a modern computer.","Instructions would be fed into it on punched cards, an idea borrowed from the Jacquard loom, a weaving machine that used cards with holes to create detailed patterns in cloth."],["In 1842, an Italian engineer named Luigi Menabrea published an article in French describing the Analytical Engine.","Ada, who by then had married and become the Countess of Lovelace, translated the article into English.","Babbage encouraged her to add her own explanations, and she took on the task with enormous energy.","Her notes, labeled with the letters A through G, grew to be about three times as long as the article itself.","When the work was published in 1843, she signed her notes only with her initials, A.A.L."],["The most famous section is Note G.","In it, Lovelace laid out, step by step, how the Analytical Engine could calculate a series of values called Bernoulli numbers, which are important in advanced mathematics.","She arranged the steps in a table that showed each operation in order and where every result would be stored.","Because this table told a machine exactly what to do and when to do it, many people call it the first published computer program.","Historians still debate how much of the work was Babbage's, since he had worked out some earlier examples of his own.","Even so, the clear, detailed explanation in Note G was Lovelace's own work."],["Lovelace's greatest insight went beyond any single calculation.","Most people who heard about the engine thought of it as a very powerful calculator.","Lovelace realized that it “might act upon other things besides number.”","If the rules of music could be written in symbols, she suggested, the engine might even compose “elaborate and scientific pieces of music.”","She also wrote that the Analytical Engine “weaves algebraic patterns just as the Jacquard loom weaves flowers and leaves.”","In other words, any information that could be turned into symbols, whether numbers, musical notes, or letters, could be processed by a machine.","Today, that is exactly what computers do when they play songs, display photographs, and check the spelling of an essay."],["Lovelace was also careful not to exaggerate.","She warned that the engine could not create original ideas of its own.","It could do only what people knew how to order it to perform.","In 1950, the British mathematician Alan Turing discussed her warning in a famous paper about whether machines could think, and people still argue about the question today."],["Sadly, the Analytical Engine was never built.","Babbage could not raise enough money, and the thousands of precise metal parts it required were extremely difficult to make with the tools of the time.","Lovelace died in 1852 at the age of thirty-six, and for many years her notes were largely forgotten.","When the first electronic computers appeared in the 1940s and 1950s, scientists rediscovered her writing and were amazed at how much she had foreseen."],["Today, Lovelace is honored in many ways.","A programming language called Ada is named after her, and every year on the second Tuesday of October, people around the world celebrate Ada Lovelace Day to recognize women in science, technology, engineering, and mathematics.","Her story shows that imagination and careful reasoning are not opposites.","Lovelace needed both to look at a machine full of gears and see the future."]]},"b":{"title":"Every Student Should Learn to Code","genre":"Opinion essay","gloss":{"debugging":["finding and fixing mistakes in a computer program","depuración (corregir errores)"],"strategy":["a plan for solving a problem","estrategia"],"overlook":["to fail to notice something","pasar por alto"],"professional":["doing a job for pay as a career","profesional"],"reasonable":["fair and sensible","razonable"],"confidence":["a feeling that you can do something well","confianza"]},"paras":[["Think about the last hour of your day.","Maybe you sent a message, played a game, streamed a song, or checked the weather.","Every one of those actions depended on code, the step-by-step instructions that tell computers what to do.","Since code shapes so much of our lives, I believe every student should learn the basics of coding before finishing middle school."],["First, coding teaches a powerful way of thinking.","A computer cannot guess what you mean, so a programmer has to break a big problem into small, exact steps.","When my program for a simple quiz game kept crashing, I had to test each part, find the mistake, and fix it.","That process, called debugging, taught me patience, and I now use the same strategy when I get stuck on a hard math problem."],["Second, coding is creative.","Many people picture programmers as people who only work with numbers, but students use code to design animations, compose music, and build games for their friends.","Learning to code turns students from people who only use technology into people who can invent it."],["Third, coding skills open doors.","Doctors, farmers, scientists, and artists all use software in their work.","People who understand how that software works can solve problems that others might overlook."],["Some people argue that coding should not be required.","They point out that most students will not become professional programmers and that the school day is already crowded with important subjects.","These concerns are reasonable, but they miss the point.","Schools teach every student to write, even though very few will become authors, because writing helps everyone think and communicate.","Coding deserves a place for the same reason, and it can be woven into math and science lessons instead of replacing them."],["Learning to code is not about turning every student into a software engineer.","It is about giving young people the confidence to understand the tools that shape their world, and perhaps to build better ones.","Every student deserves that chance."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Ada Lovelace used math and imagination to explain what a computing machine could do.","Ada Lovelace's mother made her study math so she would not become a poet like her father.","Charles Babbage never finished the Analytical Engine because he ran out of money.","Ada Lovelace proved that machines would one day think and invent ideas on their own."],"why":"The whole biography shows Lovelace combining careful math with big ideas about machines. The other choices are small details (paragraphs 2 and 8) or the opposite of her warning in paragraph 7.","k":0},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 4, what can the reader infer about Lovelace's understanding of the Analytical Engine?","o":["She understood it well enough to explain much more than the original article did.","She understood it only after Babbage had patiently explained each of her notes to her.","She understood the French article better than she understood the machine.","She understood it less than Menabrea did, so she kept her notes short."],"why":"Paragraph 4 says her notes grew to about three times as long as the article. Someone who could add that much explanation must have understood the machine very well.","ev":["a4.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 4: “Ada, who by then had married and become the Countess of Lovelace, <b>translated</b> the article into English.” The prefix <i>trans-</i> is a clue. What does <b>translated</b> mean?","o":["carried the meaning across into another language","made the article shorter so it was easier to read","copied the article by hand without changing anything","corrected the mistakes in the article's mathematics"],"why":"The prefix trans- means “across.” In paragraph 4 she took an article written in French and carried its meaning across into English.","k":0},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 5, why do many people call Note G the first published computer program?","o":["It listed, in order, every step a machine would follow to solve a problem.","It was the first time anyone had ever calculated the Bernoulli numbers.","It was printed on punched cards so that the engine could read it without any help.","It was written entirely by Babbage and then signed by Lovelace."],"why":"Paragraph 5 says her table showed each operation in order and told a machine exactly what to do and when. That is what a program does.","ev":["a5.3","a5.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"ms","skill":"key details","q":"Paragraph 3 compares parts of the Analytical Engine to parts of a modern computer. Which TWO parts does it compare? Choose TWO answers.","o":["the “store,” which would hold numbers","the “mill,” which would work on numbers","the punched cards, which came from a loom","the printed tables, which sailors used","the brass wheels, which clicked through math"],"why":"Paragraph 3 says the store and the mill are “much like the memory and processor inside a modern computer.” The punched cards are compared to a loom, not to a computer part.","ks":[0,1]},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author begin Text 1 with a scene from 1833 instead of with Lovelace's birth?","o":["To hook readers with a key moment before telling her life story in order","To show that Lovelace met Babbage before she had studied any math","To explain why the Difference Engine mattered more than the Analytical Engine","To prove that most visitors understood the machine better than Lovelace"],"why":"Paragraph 1 opens with an exciting moment that hints at her future. Paragraph 2 then jumps back to 1815, and the rest of the text follows her life in time order.","k":0},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 3, the Analytical Engine is called “a far more <b>ambitious</b> machine.” What does <b>ambitious</b> mean as it is used here?","o":["aiming to do much more and very hard to achieve","simple enough to build with ordinary tools","designed mainly to look beautiful in a room","smaller and cheaper than the earlier design"],"why":"Paragraph 3 shows the new engine would do far more than the Difference Engine, with a store, a mill, and punched cards. Paragraph 8 shows it was too hard to build, which fits “ambitious.”","k":0},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author include Lovelace's warning in paragraph 7?","o":["To show that she understood the machine's limits as well as its power","To show that she was disappointed the engine would never be built","To show that she disagreed with Alan Turing about how machines work","To show that she believed machines would soon become smarter than people"],"why":"Paragraph 7 says she was “careful not to exaggerate” and explains that the engine could not create original ideas. After paragraph 6 shows the engine's power, this shows she saw its limits too.","ev":["a7.1","a7.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A.","k":0},{"on":"a","t":"mc","skill":"point of view","q":"How does the author of Text 1 present the debate about who deserves credit for Note G?","o":["The author admits there is a debate but still credits Lovelace for the explanation.","The author argues that Babbage deserves all the credit because he wrote programs first.","The author says historians have proved that Lovelace wrote every program alone.","The author avoids the debate and never mentions Babbage's earlier examples."],"why":"In paragraph 5 the author says historians still debate how much was Babbage's work, then states that the clear, detailed explanation “was Lovelace's own work.”","k":0},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["All students should learn coding because it builds thinking, creativity, and confidence.","Coding should replace math and science lessons because it is more useful today.","Only students who plan to become programmers should be required to learn to code.","Debugging is the single most important skill that any student can learn in middle school."],"why":"The author states the claim in paragraph 1 and supports it with reasons about thinking (paragraph 2), creativity (paragraph 3), and future careers (paragraph 4). Paragraph 5 says coding should not replace other subjects.","k":0},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 6, the author says coding helps students understand “the tools that <b>shape</b> their world.” What does the word <b>shape</b> suggest about technology?","o":["It has a strong effect on how people live every day.","It is mostly about drawing shapes on a screen.","It breaks easily when people use it the wrong way.","It changes so slowly that people rarely notice it."],"why":"To shape something means to form it. The word suggests technology has a big influence on daily life, which matches the examples of messages, games, and songs in paragraph 1.","k":0},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the author respond to people who say coding should not be required (paragraph 5)?","o":["The author calls their concerns fair but compares coding to writing, which everyone learns.","The author calls their concerns silly because every student will one day become a programmer.","The author agrees with them and suggests making coding an after-school club instead.","The author ignores their concerns and simply repeats the first reason from paragraph 2."],"why":"Paragraph 5 calls the concerns “reasonable,” then explains that schools teach everyone to write even though few become authors. The author uses the same logic for coding.","ev":["b5.4"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A.","k":0},{"on":"b","t":"mc","skill":"inference","q":"What can the reader infer from the author's story about the quiz game in paragraph 2?","o":["The author has real coding experience and learned from fixing mistakes.","The author gave up on coding after the program kept crashing.","The author thinks math problems are harder than coding problems.","The author learned to code from a professional software engineer."],"why":"In paragraph 2 the author describes testing, finding, and fixing a mistake in their own program and says it taught patience. This shows personal experience and learning from errors.","k":0},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the purpose of Text 2 different from the purpose of Text 1?","o":["Text 2 tries to persuade r
