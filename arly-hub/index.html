re the purposes of Text 1 and Text 2 different?","o":["Text 1 informs readers about a real scientist's life, while Text 2 tries to persuade readers to support school gardens.","Text 1 tries to persuade readers to become botanists, while Text 2 tells the story of a famous scientist's life.","Text 1 explains how to press and dry plants, while Text 2 explains how to grow vegetables in raised beds.","Text 1 entertains with an invented adventure; Text 2 reports facts about Massachusetts plants."],"k":0,"why":"Text 1 is a biography that gives facts about Mexía's life. Text 2 is an opinion essay with a claim, reasons, and a call to action, so its purpose is to persuade."}],"write":{"prompt":"The writer of Text 2 says students learn about plants best by going outside and working with them. How does Text 1 support this idea? Use at least one detail from each text in your answer.","model":"Text 1 supports the idea in Text 2 because Ynés Mexía learned the most about plants by working with them outdoors. In Text 2, the student writer argues that a garden “turns science from something we read about into something we do.” She explains that students could measure plants and keep data like real scientists. Text 1 shows this is true. Mexía only became fascinated by plants on Sierra Club hiking trips, and she learned to be a collector by gathering specimens in the field in Mexico. Later, she found so many plants that about 500 new species were discovered in her collections. Her success came from exploring, not just reading. Both texts show that hands-on work outside can turn curiosity into real science.","need":["States how Text 1 supports the claim in Text 2","Uses a detail from Text 2 (the student's essay)","Uses a detail from Text 1 about Mexía's outdoor work","Explains how the details connect to each other"]}},{"id":"s04-sleep","theme":"Sleep and the Brain","a":{"title":"The Night Shift Inside Your Head","genre":"Informational","topic":"Human Body","gloss":{"consolidation":["the process of making memories stronger and more lasting","consolidación"],"hippocampus":["a small part of the brain that helps form new memories","hipocampo"],"cerebrospinal":["having to do with the brain and spinal cord","cerebroespinal"],"metabolism":["all the chemical work that cells do to stay alive and use energy","metabolismo"],"deprived":["kept from having something you need","privado"],"irritable":["easily annoyed or upset","irritable"],"insufficient":["not enough","insuficiente"]},"paras":[["Every night, you spend hours lying still with your eyes closed, doing what looks like nothing at all.","Over a lifetime, a person may spend roughly one-third of their life asleep.","For a long time, many people thought sleep was simply a way for the body to rest.","Scientists now know that sleep is much more than an off switch.","While you sleep, your brain is working on an important night shift, organizing memories and even cleaning itself."],["Sleep is not one single state.","Throughout the night, the brain moves through repeating cycles that last about 90 minutes each.","Each cycle includes lighter stages of sleep, deep sleep, and a stage called REM sleep, short for “rapid eye movement.”","During deep sleep, brain waves become slow and large, and it is hard to wake a person up.","During REM sleep, the eyes dart back and forth under the eyelids, the brain becomes very active, and most vivid dreams occur."],["One of sleep's most important jobs is helping you remember what you learned.","During the day, a small, curved part of the brain called the hippocampus stores new information for a short time, a little like a notepad.","During sleep, especially deep sleep, the brain replays some of the day's experiences and moves important information into longer-lasting storage in other areas.","Scientists call this process memory consolidation.","In studies, people who sleep after learning a new skill or a list of facts usually remember it better than people who stay awake for the same amount of time."],["Sleep also seems to help the brain take out its trash.","Like every part of the body, the brain produces waste as its cells carry out their metabolism, the chemical work of staying alive.","In 2012, a team led by Danish neuroscientist Maiken Nedergaard at the University of Rochester described a system that uses cerebrospinal fluid, the clear liquid that surrounds the brain and spinal cord, to wash through brain tissue and carry waste away.","They named it the glymphatic system."],["A year later, the same team made a surprising discovery.","When they studied mice, they found that the spaces between brain cells grew about 60 percent larger while the animals slept.","With more room, the fluid could flow through more quickly, and the brain cleared away a harmful protein called beta-amyloid faster than when the mice were awake.","Researchers are still learning how this system works in people, but these results suggest that sleep gives the brain a chance to clean itself in a way that is harder to do while it is busy."],["So how much sleep do young people actually need?","In 2016, the American Academy of Sleep Medicine, a group of doctors who study sleep, published recommendations.","Children ages 6 to 12 should regularly get 9 to 12 hours of sleep every 24 hours.","Teenagers ages 13 to 18 should get 8 to 10 hours.","That means a sixth grader who must wake up at 6:30 a.m. would need to fall asleep by about 9:30 p.m. to reach even the lowest amount."],["Many students do not come close.","When people are sleep-deprived, the effects show up quickly.","They may have trouble paying attention, solving problems, and remembering information.","They often become irritable and have a harder time controlling their emotions.","Over time, insufficient sleep is linked to a higher risk of injuries and to health problems such as obesity and depression."],["Part of the challenge for older kids is biological.","Around the teenage years, the body's internal clock, called the circadian rhythm, shifts later.","Many teens do not feel sleepy until about 11 p.m., even if they try to go to bed earlier.","Screens can make this even harder, because the bright light from phones and tablets can signal the brain that it is still daytime."],["The good news is that small habits can make a big difference.","Sleep experts suggest going to bed and waking up at about the same time every day, even on weekends.","They also recommend turning off screens about an hour before bed and keeping the bedroom cool, dark, and quiet.","Getting sunlight and exercise during the day can help the body feel ready to sleep at night."],["Sleep is not wasted time.","It is when your brain files away the day's lessons and clears out the clutter so you can wake up ready to learn again.","The next time you are tempted to stay up late, remember that the night shift inside your head needs time to finish its work."]]},"b":{"title":"Let Middle Schoolers Sleep","genre":"Opinion essay","gloss":{"alert":["awake and paying close attention","alerto, despierto"],"reluctant":["not wanting to do something","renuente, poco dispuesto"],"resistance":["the act of pushing back against a change","resistencia"],"inconvenient":["causing trouble or extra difficulty","inconveniente, incómodo"],"investment":["something you spend time or money on now to get benefits later","inversión"]},"paras":[["At 7:15 every morning, my first-period class looks like a room full of zombies.","Heads rest on desks, eyes are half closed, and the only sound is someone yawning in the back row.","Our teacher is explaining fractions, but most of us are not really there.","This happens because our school starts too early.","Middle schools should start no earlier than 8:30 a.m. so students can get the sleep their brains need."],["First, students our age are not getting enough sleep.","Sleep doctors recommend 9 to 12 hours a night for children ages 6 to 12, and 8 to 10 hours for teenagers.","But as kids get older, their body clocks shift so that they do not feel tired until later at night.","If you cannot fall asleep until 10:30 and the bus comes at 6:45, there is no way to get nine hours.","Telling students to just go to bed earlier ignores how our bodies actually work."],["Second, a later start would help students learn.","Sleep is when the brain turns the day's lessons into long-term memories.","A student who is exhausted is not alert enough to take in new information, and she is less likely to remember it later.","In 2014, the American Academy of Pediatrics recommended that middle and high schools start at 8:30 a.m. or later for exactly these reasons.","California took the idea seriously, and since 2022 a state law has required most of its middle schools to start no earlier than 8:00 a.m. and most high schools no earlier than 8:30."],["Of course, not everyone agrees.","Some parents are reluctant because a later start could make it harder to get to work on time.","Others point out that changing bus schedules costs money and that sports practices would end later in the evening.","These are real problems, and they explain much of the resistance to changing start times.","However, other districts have found ways to solve them, such as reorganizing bus routes or offering supervised early drop-off at school.","A schedule change may be inconvenient for adults at first, but it is a smart investment in students' health and learning."],["Finally, starting later would make school a happier place.","Tired students are more irritable, and they are more likely to argue or give up when work gets hard.","Well-rested students can manage their feelings and focus on what matters."],["Schools exist to help students learn.","It makes no sense to schedule the most important part of the day at a time when students' brains are still half asleep.","Our school board should listen to the science and let middle schoolers sleep.","Everyone will wake up to the benefits."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Sleep is an active time when the brain stores memories and clears out waste.","Sleep happens in cycles that each last about 90 minutes during the night.","Teenagers stay up late because screens trick the brain into feeling awake.","Scientists studied sleeping mice to learn how the glymphatic system removes waste."],"k":0,"why":"Paragraph 1 says the brain works a night shift, organizing memories and cleaning itself, and the rest of the article explains both jobs. The other choices are single details."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 3, what happens to new information during sleep?","o":["The brain moves important information into longer-lasting storage.","The brain erases information it learned during the day to make space.","The hippocampus grows larger so it can hold more information.","The brain stops working so that information stays in the same place."],"k":0,"why":"Paragraph 3 says that during sleep the brain replays experiences and moves important information into longer-lasting storage. This is called memory consolidation.","ev":["a3.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 3, the author says “Scientists call this process memory <b>consolidation</b>.” Based on the paragraph, what does <b>consolidation</b> mean?","o":["making memories stronger by moving them into lasting storage","forgetting information that the brain no longer needs","learning a new skill by practicing it again and again","dreaming about events that happened earlier in the day"],"k":0,"why":"The sentence just before says the brain moves important information into longer-lasting storage. That process of making memories stronger and more lasting is consolidation."},{"on":"a","t":"mc","skill":"text structure","q":"How are paragraphs 4 and 5 organized?","o":["They describe a discovery and then a later finding that built on it.","They compare the ways that the brains of mice and of people clean themselves.","They explain a problem with sleep and then offer several solutions.","They list the steps a person should follow to clean the brain."],"k":0,"why":"Paragraph 4 describes the 2012 discovery of the glymphatic system. Paragraph 5 begins “A year later” and tells what the same team found next."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 5, why might sleep make it easier for the brain to clear away waste?","o":["More space opens between brain cells, so fluid can flow through faster.","The brain makes much less waste at night because dreams use up no energy at all.","The brain's waste turns into memories, which are stored during sleep.","The body stops making cerebrospinal fluid until the person wakes up."],"k":0,"why":"Paragraph 5 says the spaces between brain cells grew about 60 percent larger during sleep. With more room, the cleaning fluid could flow through more quickly.","ev":["a5.2","a5.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO effects of not getting enough sleep are described in paragraph 7?","o":["trouble paying attention and remembering","becoming irritable and upset more easily","having more vivid dreams during REM sleep","feeling sleepy earlier in the evening","growing a larger hippocampus"],"ks":[0,1],"why":"Paragraph 7 lists trouble paying attention and remembering, and becoming irritable. Vivid dreams come from paragraph 2 and are not an effect of missing sleep."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 8, why do many teenagers have trouble falling asleep early?","o":["Their internal clock shifts so they do not feel sleepy until later.","Their schools give them far too much homework to finish each night.","They need less sleep than younger children, so they are not tired.","Their bedrooms are usually too warm and too noisy for sleeping."],"k":0,"why":"Paragraph 8 says the circadian rhythm shifts later during the teenage years, so many teens do not feel sleepy until about 11 p.m.","ev":["a8.2","a8.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 7: “When people are sleep-<b>deprived</b>, the effects show up quickly.” The prefix de- can mean “away from” or “remove.” What does <b>sleep-deprived</b> mean?","o":["not getting the sleep you need","sleeping much later than usual","dreaming a lot during the night","falling asleep very quickly"],"k":0,"why":"The prefix de- means away from, so deprived means having something kept away from you. Paragraph 7 then describes trouble paying attention and remembering, which happen when people do not get enough sleep."},{"on":"a","t":"mc","skill":"author's purpose","q":"What is the author's main purpose in paragraph 9?","o":["to give readers practical habits that can help them sleep better","to explain why scientists still disagree about the causes of sleep","to persuade schools to start the school day at a much later time","to describe what happens in the brain during deep sleep"],"k":0,"why":"Paragraph 9 begins “The good news is that small habits can make a big difference,” then gives tips like a regular bedtime and turning off screens."},{"on":"b","t":"mc","skill":"main idea","q":"What is the writer's central claim in Text 2?","o":["Middle schools should start at 8:30 a.m. or later to help students sleep.","Students should go to bed much earlier so that they are not tired in class.","Middle schools should stop giving homework on school nights.","Sports practices should be moved to early morning before school."],"k":0,"why":"The last sentence of paragraph 1 states the claim: middle schools should start no earlier than 8:30 a.m. so students can get enough sleep."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 1, the writer says the class “looks like a room full of zombies.” What effect does this description have?","o":["It creates a vivid, slightly funny picture of how tired the students are.","It shows that the students are frightened of their strict first-period teacher.","It suggests that the students are sick and should stay home from school.","It shows that the students are bored because fractions are too easy."],"k":0,"why":"Zombies are slow and only half awake. The comparison, plus details like heads on desks and yawning, helps readers picture exhausted students."},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the writer respond to people who disagree with a later start time?","o":["The writer admits the concerns are real but says they can be solved.","The writer says that parents who disagree do not care about their children.","The writer agrees that changing the schedule would cost far too much money.","The writer ignores other opinions and only gives reasons that support the claim."],"k":0,"why":"In paragraph 4 the writer calls the concerns “real problems” but explains that other districts have solved them by reorganizing buses or offering early drop-off.","ev":["b4.4","b4.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"author's purpose","q":"Why does the writer include the information about California in paragraph 3?","o":["to show that a later start is a realistic idea that a state has adopted","to show that students in California sleep more than students in other states","to explain why California schools have better test scores than others","to admit that most states do not agree with later start times"],"k":0,"why":"The writer mentions the California law to show that a later start is not just a wish; a whole state has made it a rule. This makes the argument more convincing."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 does the writer of Text 2 use as a reason for a later start?","o":["Sleep helps the brain turn lessons into lasting memories.","The brain's cleaning system works faster in sleeping mice.","Sleep is made of repeating cycles of about 90 minutes.","Bright screens can make the brain think it is daytime."],"k":0,"why":"Text 1 explains memory consolidation in paragraph 3. In paragraph 3 of Text 2, the writer uses the same idea to argue that a later start would help students learn.","ev":["b3.2","b3.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is Text 2 different from Text 1?","o":["Text 2 uses sleep facts to argue for a change; Text 1 mainly explains how sleep works.","Text 2 explains the glymphatic system in detail, while Text 1 tells a story about a school.","Text 2 gives tips for better sleep habits, while Text 1 argues schools should start later.","Text 2 is about adults' sleep, while Text 1 is about the sleep of children and teenagers."],"k":0,"why":"Text 1 is an informational article about what sleep does for the brain. Text 2 is an opinion essay that uses some of the same facts to persuade a school board."}],"write":{"prompt":"The writer of Text 2 argues that middle schools should start later. Explain how information in Text 1 supports this argument. Use at least one detail from each text.","model":"Information in Text 1 strongly supports the argument in Text 2 that middle schools should start later. Text 1 explains that “around the teenage years, the body's internal clock … shifts later,” so many teens do not feel sleepy until about 11 p.m. If students cannot fall asleep early, an early start time takes away sleep they need. Text 1 also says that during sleep the brain moves new information into long-term storage. In Text 2, the writer describes a first-period class full of “zombies” and says an exhausted student is less likely to remember what she learns. The science in Text 1 explains why those students are struggling. Together, the texts show that a later start would give students' brains time to rest and learn.","need":["States how Text 1 supports the argument in Text 2","Uses a fact from Text 1 (such as body clocks or memory)","Uses a detail from Text 2","Explains why the fact makes the argument stronger"]}},{"id":"s05-coral","theme":"Coral Reefs and Cooperation","a":{"title":"Partners in the Reef","genre":"Informational","topic":"Life Science","gloss":{"polyp":["a tiny, soft-bodied sea animal with a tube-shaped body and a ring of tentacles","pólipo"],"colony":["a group of the same kind of living things that live closely together","colonia"],"symbiosis":["a close relationship between two different living things","simbiosis"],"photosynthesis":["the process plants and algae use to turn sunlight into food","fotosíntesis"],"expel":["to force out or push away","expulsar"],"vulnerable":["easily hurt or harmed","vulnerable"],"resilient":["able to recover after something bad happens","resiliente"]},"paras":[["From above, a coral reef can look like an underwater garden, full of branching shapes, rounded domes, and bright colors.","It is easy to mistake corals for rocks or plants.","In fact, reef-building corals are animals, and the secret to their success is a partnership so close that one partner actually lives inside the other."],["A single coral is made up of many tiny animals called polyps.","Each polyp has a soft, tube-shaped body, often no bigger than a pencil eraser, with a mouth at the top surrounded by a ring of tentacles.","Corals are related to jellyfish and sea anemones, and like their relatives, they have stinging cells on their tentacles.","At night, many polyps stretch out their tentacles to catch tiny drifting animals called zooplankton."],["Hard corals build the reef.","Each polyp takes in minerals from seawater and uses them to build a stony cup of calcium carbonate, the same material found in seashells and chalk.","The polyp lives in this cup and can pull back into it for protection.","Polyps divide to form new polyps, and over time hundreds or even thousands of them grow together into a colony.","When polyps die, their skeletons remain, and new polyps grow on top.","Layer by layer, over thousands of years, these skeletons can build enormous structures.","The Great Barrier Reef off the coast of Australia, the largest coral reef system in the world, stretches for about 2,300 kilometers and can be seen from space."],["But polyps could not build such huge reefs on their own.","Living inside the tissues of most reef-building corals are microscopic algae called zooxanthellae (zoh-uh-zan-THEL-ee).","This relationship is an example of symbiosis, a close partnership between two different kinds of living things.","In this case, both partners benefit."],["The coral gives the algae a safe home and a steady supply of materials they need, such as carbon dioxide and nutrients from the coral's waste.","In return, the algae use sunlight to make food through photosynthesis.","They share much of that food with the coral, in the form of sugars and other substances.","In some corals, the algae provide as much as 90 percent of the food the coral needs.","The algae are also responsible for many of the beautiful colors of corals.","This partnership explains why most reef-building corals grow in shallow, clear water, where sunlight can reach the algae."],["Coral reefs, in turn, support an astonishing amount of life.","Scientists estimate that about 25 percent of all ocean species depend on coral reefs at some point in their lives, including thousands of kinds of fish.","Reefs provide hiding places, nurseries for young fish, and hunting grounds for predators.","They also protect coastlines by breaking up powerful waves before they reach the shore, and they provide food and jobs for millions of people."],["However, this partnership is delicate.","When ocean water stays too warm for too long, the relationship between corals and algae breaks down.","The stressed corals expel the algae from their tissues.","Without the colorful algae, the coral's clear tissue reveals its white skeleton underneath, and the coral looks as if it has been painted white.","This process is called coral bleaching."],["A bleached coral is not dead, but it is in serious trouble.","Without its algae, it loses its main source of food, and it becomes weak and vulnerable to disease.","If the water cools down soon enough, the algae can return, and the coral can recover.","If the heat lasts too long, the coral may starve and die.","As ocean temperatures have risen, bleaching events have become more common.","In 2024, the National Oceanic and Atmospheric Administration (NOAA) confirmed that the world was experiencing its fourth global coral bleaching event on record, with heat stress affecting reefs in the Atlantic, Pacific, and Indian Oceans."],["Scientists and communities around the world are working to protect reefs.","Some researchers grow small pieces of coral in underwater nurseries and replant them on damaged reefs.","Others search for corals that are especially resilient to heat, hoping to help reefs survive warmer waters.","Reducing pollution and overfishing can also make reefs healthier and better able to recover."],["A coral reef is proof that partnership can build something far greater than any single creature could.","A tiny polyp and an even tinier alga, working together, have created some of the largest living structures on Earth."]]},"b":{"title":"The Shrimp and the Goby","genre":"Fable","gloss":{"boasted":["talked with too much pride about yourself","presumió, se jactó"],"scoffed":["laughed at or spoke about something in a mocking way","se burló"],"collapsed":["fell down or caved in suddenly","se derrumbó"],"unprotected":["without anything to keep it safe","desprotegido"],"sheepishly":["in an embarrassed way, after doing something foolish","avergonzadamente"],"vigilant":["carefully watching for danger","vigilante, alerta"]},"paras":[["On a sandy patch at the edge of a coral reef lived a Shrimp who was the finest digger in the sea.","With her strong claws, she could carve a burrow in the sand faster than any crab.","But the Shrimp had a problem: her eyes were so weak that she could barely see past the tip of her own antennae."],["Sharing her burrow was a small, speckled Goby fish.","The Goby could not dig at all, but his eyes were sharp, and he could spot a hungry grouper from across the reef.","Each morning, the Goby sat at the entrance to the burrow, watching, while the Shrimp worked behind him, pushing out sand.","She always kept one antenna resting on his tail.","When the Goby saw danger, he flicked his tail, and both of them darted safely into the burrow."],["One day, a passing Parrotfish stopped to watch them.","“Shrimp,” he said, “why do you share your home with that lazy fish?","You do all the work, and he just sits there.”"],["The Shrimp had never thought about it that way.","That evening, she turned to the Goby.","“I am the one who builds our home,” she boasted.","“From now on, I will live alone.”"],["The Goby looked hurt, but he swam off to find another place to rest."],["The next morning, the Shrimp went to work by herself.","She dug and pushed, dug and pushed, but every few moments she stopped and peered nervously into the blurry water.","Was that shadow a rock or a grouper?","Was that movement a drifting leaf of seaweed or the jaws of an eel?","With no one to warn her, she could not dig in peace, and her burrow soon collapsed."],["Meanwhile, the Goby found a smooth spot in the sand, but he had nowhere to hide.","He stayed vigilant all day, watching every direction at once, until he was so tired he could barely keep his fins moving.","At sunset, a grouper swept past, and the Goby barely escaped by squeezing under a broken shell.","He spent the night unprotected and shivering."],["The following morning, the Goby swam back to the Shrimp's sandy patch.","He found her sitting beside a pile of fallen sand.","“I could not build without someone to watch,” she admitted sheepishly.","“And I could not hide without someone to build,” said the Goby."],["So the Shrimp dug a new burrow, the Goby took his place at the door, and the Shrimp rested her antenna on his tail once more.","When the Parrotfish passed by again, he scoffed.","“Still sharing your home with that lazy fish?”","“He is not lazy,” said the Shrimp.","“He does the work I cannot do.”"],["Moral: A partner's gifts may look small until you try to live without them."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Reefs depend on a coral-algae partnership that warming water now threatens.","Reefs are underwater gardens of colorful plants that grow slowly in shallow water.","The Great Barrier Reef in Australia is the largest coral reef system in the world.","Scientists grow coral in underwater nurseries so they can replant damaged reefs."],"k":0,"why":"The article explains the coral-algae partnership (paragraphs 4–5) and how heat breaks it apart (paragraphs 7–8). The other choices are single details or wrong: corals are animals, not plants."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 2, which fact shows that corals are animals?","o":["Their polyps use stinging tentacles to catch tiny drifting animals.","They are hard and stony, just like the rocks found on the ocean floor.","They grow in shallow water where they can reach the sunlight.","They come in many bright colors and in many different branching shapes."],"k":0,"why":"Paragraph 2 says polyps have mouths and stinging tentacles and catch zooplankton to eat. Catching and eating other animals is something animals do, not rocks or plants.","ev":["a2.3","a2.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author organize the information in paragraph 3?","o":["by explaining in order how small polyps slowly build a huge reef","by comparing hard corals with soft corals that do not build reefs","by describing a problem on the reef and offering a possible solution","by listing the different kinds of animals that live inside the reef"],"k":0,"why":"Paragraph 3 moves step by step: a polyp builds a cup, polyps divide into a colony, skeletons pile up layer by layer, and finally huge reefs form."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the author says the coral and algae have a relationship called <b>symbiosis</b>. The Greek root sym- means “together,” and bio means “life.” Which meaning fits this word in paragraph 4?","o":["two different living things living close together","a living thing that makes food from sunlight","an animal that hunts other animals for food","a group of the very same kind of animals living in one place"],"k":0,"why":"Sym- means together and bio means life, so symbiosis is living together. Paragraph 4 defines it as a close partnership between two different kinds of living things."},{"on":"a","t":"ms","skill":"key details","q":"According to paragraph 5, what do the algae give the coral? Choose TWO answers.","o":["food made through photosynthesis","much of the coral's bright color","a stony cup for protection","carbon dioxide and nutrients","stinging cells for hunting"],"ks":[0,1],"why":"Paragraph 5 says the algae share the food they make and are responsible for the coral's colors. Carbon dioxide and nutrients go the other way, from the coral to the algae."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 5, why would muddy, cloudy water most likely harm a reef?","o":["It would block sunlight, so the algae could not make enough food.","It would make the water too warm, so the corals would bleach.","It would hide the polyps, so they could not catch zooplankton.","It would wash away all of the calcium carbonate that the polyps use to build the reef."],"k":0,"why":"Paragraph 5 says reef corals grow in shallow, clear water where sunlight can reach the algae. Cloudy water would block that light, so the algae could not make food for the coral.","ev":["a5.6","a5.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraphs 7 and 8, what happens when ocean water stays too warm for too long?","o":["Corals push out their algae, turn white, and lose their main food.","Corals grow faster because warm water helps the algae make more food.","Corals become brighter in color as the algae spread through the reef.","Corals immediately die, and their skeletons quickly break apart in the water."],"k":0,"why":"Paragraph 7 says stressed corals expel the algae and look white. Paragraph 8 says the bleached coral loses its main food source but is not dead yet.","ev":["a7.3","a8.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 9, researchers look for corals that are especially <b>resilient</b> to heat. Which word is the best synonym for <b>resilient</b> in this sentence?","o":["tough","colorful","ancient","fragile"],"k":0,"why":"Paragraph 9 says scientists hope these corals can help reefs survive warmer water. Corals that can survive and recover from heat are tough. Fragile means the opposite."},{"on":"a","t":"mc","skill":"author's purpose","q":"Why does the author end the article with paragraph 10?","o":["to connect the reef's size to the idea that partners achieve great things","to warn readers that every coral reef on Earth will disappear within a few years","to introduce a new topic about other partnerships found in the ocean","to explain how scientists measure the size of the largest reefs"],"k":0,"why":"Paragraph 10 says a reef is proof that partnership can build something greater than any single creature. It sums up the article's main idea about cooperation."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses the theme of “The Shrimp and the Goby”?","o":["Partners who have different strengths need each other to succeed.","Hard workers should be proud of themselves and should never depend on others.","It is wise to listen to the advice of strangers you meet.","Small creatures must always hide from bigger creatures."],"k":0,"why":"When the Shrimp and Goby split up, both struggle: she cannot dig safely and he cannot hide. The moral says a partner's gifts may look small until you live without them."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: Why does the Shrimp decide to live alone in paragraph 4?","o":["The Parrotfish convinces her that the Goby does no real work.","The Goby refuses to keep watch and wants to spend his days resting.","She finds a larger burrow that only has enough room for one animal to live in.","Her eyesight improves, so she no longer needs a partner to warn her."],"k":0,"why":"In paragraph 3, the Parrotfish calls the Goby lazy and says the Shrimp does all the work. Paragraph 4 says she had never thought about it that way, and then she sends the Goby off.","ev":["b3.3","b4.1"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 8, the Shrimp speaks <b>sheepishly</b>. What does this word suggest about how she feels?","o":["She is embarrassed that she was wrong to send the Goby away.","She is angry that the Goby left her all alone for a whole day.","She is proud that she tried to build the burrow by herself.","She is frightened that a hungry grouper is hiding somewhere close by."],"k":0,"why":"Sheepishly means in an embarrassed way after doing something foolish. The Shrimp is admitting that she could not build without the Goby, so she realizes her mistake."},{"on":"b","t":"mc","skill":"inference","q":"What does the Shrimp's final answer to the Parrotfish in paragraph 9 show?","o":["She now understands that keeping watch is real work.","She now believes that the Parrotfish is a dangerous enemy.","She still thinks that she does most of the work in the burrow.","She wants the Parrotfish to come and live in the burrow with them too."],"k":0,"why":"The Shrimp says the Goby “does the work I cannot do.” Earlier she agreed he was lazy, so this shows she has changed her mind about the value of his job."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: How is the partnership in the fable similar to the partnership described in Text 1?","o":["In both, each partner gives the other something it cannot get alone.","In both, one partner does all the work while the other one only rests.","In both, the partners live apart from each other and meet only when there is danger nearby.","In both, the partners compete with each other for food and shelter."],"k":0,"why":"In Text 1, the coral gives the algae a home and the algae give the coral food. In the fable, the Shrimp builds the home and the Goby keeps watch. Each partner fills the other's need.","ev":["a5.1","a5.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the fable's way of teaching about cooperation differ from Text 1's?","o":["The fable teaches a lesson through a story; Text 1 explains a real partnership with facts.","The fable gives scientific facts about how reefs form, while Text 1 tells a story about two reef animals.","The fable argues that reefs need protection, while Text 1 tells readers how to make friends.","The fable describes coral bleaching in detail, while Text 1 describes how gobies hunt for food."],"k":0,"why":"The fable uses talking animals and ends with a moral to teach a life lesson. Text 1 uses facts and real examples to explain the coral and algae partnership."}],"write":{"prompt":"Both texts show that partners can do more together than alone. Explain how each text develops this idea. Use at least one detail from each text in your answer.","model":"Both texts show that partners with different strengths can accomplish more together than alone. In Text 1, coral polyps give algae a safe home, and the algae use sunlight to make food for the coral. Together, they build reefs so large that the Great Barrier Reef can be seen from space. When heat breaks the partnership apart, the coral bleaches and may starve. In the fable, the Shrimp can dig but cannot see, while the Goby can see but cannot dig. When they split up, her burrow collapses and he spends the night unprotected. Only together are they safe. Text 1 proves the idea with real science, and the fable teaches it as a lesson. Both show that a partner's gifts matter.","need":["States a claim about partners doing more together","Uses a detail from Text 1 about coral and algae","Uses a detail from the fable about the Shrimp and Goby","Explains what happens when the partnership breaks apart or why it works"]}},{"id":"s06-paricutin","theme":"A Volcano Is Born","a":{"title":"The Volcano That Grew in a Cornfield","genre":"Informational","topic":"Earth and Space Science","gloss":{"magma":["melted rock that is still deep underground","magma"],"vent":["an opening in the ground where gas, ash, and lava escape","chimenea (de un volcán)"],"cinders":["light, bubbly bits of volcanic rock full of tiny holes","cenizas volcánicas / escoria"],"evacuated":["emptied of people so they could stay safe","evacuado"],"spectators":["people who come to watch something happen","espectadores"],"summit":["the very top of a mountain","cima"],"geologists":["scientists who study rocks and how the Earth changes","geólogos"]},"paras":[["On the afternoon of February 20, 1943, a farmer named Dionisio Pulido was working in his cornfield near the village of Parícutin, in the Mexican state of Michoacán.","He and his wife, Paula, were burning piles of branches to get the land ready for spring planting.","Suddenly, Pulido noticed a crack in the ground, only about half a meter deep.","As he watched, the earth beside it swelled upward, and smoke began hissing out of the ground with a sharp smell of sulfur.","Pulido was looking at something almost no one in history had ever seen: the birth of a brand-new volcano."],["The eruption did not arrive completely without warning.","For weeks, people in the area had heard deep rumbling sounds, like thunder, even when the sky was clear.","Later studies showed that a series of earthquakes had shaken the region for about five weeks before the eruption began.","Far below the surface, melted rock called magma was pushing its way upward, and Pulido’s field happened to sit right above its path."],["Once the volcano broke through, it grew at an astonishing speed.","Within about a day, a hill of loose volcanic rock stood roughly 50 meters tall.","By the end of the first week, it had reached between 100 and 150 meters.","After four months it was about 200 meters high, and after eight months it rose about 365 meters above the field where Pulido had planted corn."],["Parícutin is a kind of volcano called a cinder cone.","A cinder cone forms when gas-filled magma bursts out of a single opening, or vent, and breaks apart into chunks.","The chunks cool as they fly through the air and land as cinders, which are light, bubbly pieces of rock full of tiny holes.","Layer by layer, the cinders pile up around the vent, building a steep hill shaped like an upside-down ice cream cone.","Clouds of fine ash also blasted into the sky and drifted across the countryside, coating fields, roofs, and forests in gray dust.","Parícutin has many older relatives: the region around it contains more than a thousand small volcanic vents, nearly all of them quiet for centuries."],["Lava, which is what magma is called once it reaches the surface, also poured from openings near the base of the cone.","These thick, heavy flows usually crept forward slowly, which gave families time to gather their belongings and leave.","The village of Parícutin, home to roughly 700 people, was buried and abandoned.","The larger town of San Juan Parangaricutiro, with nearly 1,900 residents, was evacuated before lava and ash covered it.","Remarkably, no one was killed by the lava itself, although three people died when lightning, created inside the eruption’s ash clouds, struck them."],["Today, one sight tells the story of Parícutin better than any other.","In the middle of a wide field of black, jagged lava stands the stone tower of San Juan Parangaricutiro’s old church, rising out of the rock like the mast of a sunken ship.","The lava flowed around and into the building, yet the tower and the altar were left standing.","The townspeople moved to safer ground and founded a new town, Nuevo San Juan Parangaricutiro, in 1944.","Visitors still hike across the hardened lava to reach the old church, where the altar is often decorated with candles and flowers."],["News of the volcano spread quickly, and spectators traveled from around the world to watch it rumble and glow.","Scientists rushed to the scene as well, because they had never before been able to follow a volcano from its very first day.","Researchers from Mexico and the United States, including Jenaro González Reyna and William Foshag, recorded its growth with maps, sketches, rock samples, and thousands of photographs.","Their careful notes became one of the most complete records of a volcano’s life ever made."],["Parícutin kept erupting for about nine years before it finally went quiet in 1952.","By then, its cone stood about 424 meters above the valley floor, and its summit reached roughly 2,800 meters above sea level.","Lava had spread over about 26 square kilometers of land, and a far wider area had been damaged by ash.","Because most cinder cones formed long before anyone could watch them, geologists had mostly studied them after the fact.","At Parícutin, they observed the entire life of a volcano, from birth to rest, within a single human lifetime."],["For Dionisio Pulido, of course, the volcano meant losing his farm.","Still, he kept his sense of humor, and he later put up a sign announcing that the volcano was “owned and operated” by him.","His ordinary cornfield had become one of the most famous places in the science of the Earth.","Parícutin remains a powerful reminder that the solid ground beneath our feet is always being built, broken, and reshaped."]]},"b":{"title":"Ash on the Windowsill","genre":"Historical fiction","gloss":{"column":["a tall, narrow shape that rises straight up","columna"],"adobe":["sun-dried bricks made of mud and straw","adobe"],"gritty":["rough, like tiny grains of sand","arenoso / áspero"],"husks":["the dry outer leaves that cover an ear of corn","hojas de maíz (totomoxtle)"],"trembling":["shaking a little, often from fear","temblando"],"steady":["calm and firm, not shaking","firme / tranquilo"]},"paras":[["The rumbling had gone on for weeks, so at first Tomasa did not even look up when the clay cups rattled on the shelf.","But on that Saturday afternoon in February 1943, her grandfather stepped into the doorway of their adobe house in San Juan and stood perfectly still.","Beyond the pine-covered hills, a gray column was climbing into the sky, thick and twisting, like smoke from a thousand cooking fires."],["“It’s the Pulido field!” a neighbor shouted from the road.","“The ground split open!”","By nightfall, the bottom of the column glowed orange, and every few seconds a boom rolled across the valley.","Tomasa lay awake beside her little brother, Beto, counting the booms the way she counted the seconds between lightning and thunder."],["In the morning, the whole village wore a coat of gray.","Ash dusted the windowsill, the corn husks drying in the yard, and even the long ears of their old mule.","Tomasa ran a finger along the sill and rubbed the powder between her fingers.","It was gritty, like sand that had been ground far too fine."],["All week, people climbed the hill behind the church to watch.","Each day the black cone was taller, and each night it spat glowing rocks that fell like sparks from a blacksmith’s fire.","Some neighbors wept for their ruined fields, while others lit candles and prayed.","“Is the mountain angry with us?” Beto whispered.","Abuelo shook his head.","“A mountain does not get angry, mijo,” he said.","“It only does what the earth inside it tells it to do.”"],["On the seventh day, Tomasa found her grandfather wrapping the family’s few photographs in a clean cloth.","“Are we leaving?” she asked, her voice trembling.","“Not today,” he answered, tying a careful knot.","“But a wise person packs before the river rises, not after.”","He handed her an empty flour sack and told her to choose what mattered most.","Tomasa looked around the small room for a long time.","In the end she packed her school notebook, her mother’s blue rebozo, and the wooden spinning top Beto loved."],["That evening the cone flashed red against the darkness, and Tomasa stood at the window holding Beto’s hand.","She was still afraid, but the fear felt different now, smaller and steady, like a sack she knew how to carry.","Whatever happened to San Juan, she thought, her family would face it together."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes the central idea of Text 1?","o":["A volcano that suddenly formed in a farm field changed the land around it and taught scientists how cinder cones grow.","A farmer named Dionisio Pulido noticed a crack in his cornfield and smelled sulfur coming out of the ground in 1943.","Volcanoes in Michoacán erupt so often that towns in the region must be moved to new places every few years.","The old church of San Juan Parangaricutiro survived the eruption because its stone walls were stronger than lava."],"k":0,"why":"The whole text follows Parícutin from its birth (paragraph 1) to its end in 1952 (paragraph 8) and explains what it destroyed and what scientists learned. The other choices are single details or ideas the text does not say."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 5, what can the reader infer about why no one was killed by the lava?","o":["The lava moved slowly enough that people could leave before it arrived.","The lava stopped flowing before it reached any homes or buildings.","Scientists warned the villages to leave weeks before the eruption began.","The lava cooled so quickly that it never traveled beyond the cone."],"k":0,"why":"Paragraph 5 says the flows “crept forward slowly, which gave families time” to leave, and that San Juan was evacuated before the lava covered it. The lava did reach towns, so the second and fourth choices are wrong.","ev":["a5.2","a5.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 4, what causes a cinder cone to get its shape?","o":["Chunks of exploded magma land and pile up around the vent.","Slow rivers of lava harden into flat sheets of black rock.","Fine ash drifts across the land and settles on nearby roofs.","Earthquakes push the ground upward into a tall, steep hill."],"k":0,"why":"Paragraph 4 explains that magma bursts out, breaks into cinders, and “layer by layer, the cinders pile up around the vent.” Ash and lava are real details, but they are not what builds the cone.","ev":["a4.4","a4.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO details from paragraph 2 show that there were warning signs before the volcano appeared? Choose TWO answers.","o":["People heard rumbling like thunder even when the sky was clear.","Earthquakes shook the region for about five weeks beforehand.","Smoke hissed out of a crack in the ground with a smell of sulfur.","Ash drifted across the countryside and coated roofs and forests.","Scientists made maps and took thousands of photographs."],"ks":[0,1],"why":"Paragraph 2 says people heard rumbling “for weeks” and that earthquakes shook the area “for about five weeks before the eruption began.” The smoke and ash came during the eruption, not before it."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 7: “News of the volcano spread quickly, and <b>spectators</b> traveled from around the world to watch it rumble and glow.” What does the word <b>spectators</b> mean?","o":["people who come to watch an event","people who study rocks for a living","people who must leave their homes","people who guard a dangerous place"],"k":0,"why":"Spectators contains the Latin root <i>spect</i>, which means “to look.” The sentence also says they came “to watch it,” so spectators are people who watch."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, the town of San Juan Parangaricutiro “was <b>evacuated</b> before lava and ash covered it.” What does <b>evacuated</b> mean as it is used here?","o":["emptied of people to keep them safe","buried completely under hot, hardened rock","rebuilt with stone in a new place","warned that danger might be near"],"k":0,"why":"The word “before” is the clue: the town was emptied of people before the lava came. That is why paragraph 5 can say no one was killed by the lava."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author mainly organize paragraph 3?","o":["in time order, telling how tall the volcano was at different points","by comparing Parícutin with older volcanoes in the same region","as a problem that people faced, followed by how they solved it","by listing the different kinds of rock that came out of the vent"],"k":0,"why":"Paragraph 3 moves through time: “within about a day,” “by the end of the first week,” “after four months,” and “after eight months.” Each step gives the cone’s new height."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author include the detail about Pulido’s sign in paragraph 9?","o":["to show that Pulido stayed good-humored even after losing his farm","to prove that Pulido charged visitors money to come see the volcano","to explain that the government gave the volcano to Pulido","to show that scientists needed Pulido’s permission to study it"],"k":0,"why":"Paragraph 9 says the volcano “meant losing his farm,” but that he “kept his sense of humor” and joked that he owned and operated it. The sign was a joke, not a real business.","ev":["a9.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"inference","q":"Based on paragraphs 7 and 8, why was Parícutin so valuable to scientists?","o":["It let them watch a whole volcano’s life instead of only studying old ones.","It was the tallest volcano in Mexico, so it was easy to see from far away.","It was the only volcano in the region, so it had no neighbors to compare.","It erupted for just a few days, so they could study it without much danger."],"k":0,"why":"Paragraph 8 says geologists had “mostly studied them after the fact,” but at Parícutin they saw it “from birth to rest.” Paragraph 4 shows there are many other vents nearby, and it erupted for nine years, not a few days."},{"on":"b","t":"mc","skill":"theme","q":"Which theme is best developed in Text 2?","o":["A frightening change is easier to face when people prepare and stay together.","Nature always punishes people who do not take good care of their land.","Children should not ask adults questions about things that scare them.","Moving to a new town is an exciting adventure that everyone should try."],"k":0,"why":"Abuelo prepares calmly in paragraph 5, and in paragraph 6 Tomasa’s fear becomes something she can carry because “her family would face it together.” The story never blames anyone for the eruption."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 3, the author writes that “the whole village wore a <b>coat of gray</b>.” What does this phrase suggest?","o":["Ash covered everything, making the village look dull and changed.","The villagers put on warm clothes because the morning turned cold.","Heavy storm clouds hung over the village and blocked the sunlight.","Neighbors had painted their houses gray to match the mountains."],"k":0,"why":"The next sentence explains that ash “dusted the windowsill, the corn husks…and even the long ears of their old mule.” Like a coat, the ash covered everything."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: What do Abuelo’s words and actions in paragraph 5 show about him?","o":["He stays calm and plans ahead for danger.","He wants to leave San Juan immediately.","He does not believe that the volcano is real.","He is angry that the mountain hurt them."],"k":0,"why":"In paragraph 5 Abuelo says they are not leaving “today,” but he is already packing because “a wise person packs before the river rises.” He is calm and prepared, not rushing or angry.","ev":["b5.4","b5.1"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"character","q":"How do Tomasa’s feelings change from paragraph 5 to the end of the story?","o":["Her fear becomes something she feels able to handle.","Her fear disappears because the volcano stops erupting.","Her calm turns into panic when she sees the red cone.","Her excitement grows because she wants to see the lava."],"k":0,"why":"In paragraph 5 her voice is “trembling,” but in paragraph 6 the fear feels “smaller and steady, like a sack she knew how to carry.” She is still afraid, so the fear does not disappear."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the way Text 2 presents the eruption different from the way Text 1 presents it?","o":["Text 2 shows how the eruption felt to one family, while Text 1 explains facts about it.","Text 2 gives exact heights and dates, while Text 1 tells a story about one child.","Text 2 argues that people should leave volcanoes alone, while Text 1 only describes one.","Text 2 describes the volcano’s final years, while Text 1 tells only about its first day."],"k":0,"why":"Text 1 is informational and gives dates, heights, and scientific explanations. Text 2 is historical fiction that shows Tomasa’s fear, her grandfather’s advice, and her family’s choices."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which fact from Text 1 is also shown through the events of Text 2?","o":["Ash from the eruption spread over the land and buildings nearby.","Lightning formed inside the ash clouds and killed three people nearby.","Scientists from two countries took thousands of photographs.","Lava flowed into the old church but left the tower standing."],"k":0,"why":"Text 1, paragraph 4, says ash coated “fields, roofs, and forests,” and Text 2, paragraph 3, shows ash on the windowsill, the corn husks, and the mule. The other facts appear only in Text 1.","ev":["a4.5","b3.2"],"evq":"Part B: Click the sentence from either text that best supports your answer to Part A."}],"write":{"prompt":"Text 1 and Text 2 both show how the Parícutin eruption affected the people who lived near it. Explain what each text shows about these effects. Use at least one detail from each text to support your answer.","model":"Both texts show that Parícutin turned people’s lives upside down, but they show it in different ways. Text 1 gives facts about the damage. For example, it says the village of Parícutin was “buried and abandoned” and that nearly 1,900 people in San Juan Parangaricutiro had to leave their town. Text 2 shows how that change felt to one family. When Tomasa sees “the whole village wore a coat of gray,” the reader understands that her home is changing before her eyes. Her grandfather packs early because “a wise person packs before the river rises.” Together, the texts show that the eruption destroyed homes and fields, but people survived by planning ahead and sticking together.","need":["States a clear claim about how the eruption affected people","Uses a fact from Text 1, such as the evacuation of San Juan","Uses a detail from Text 2, such as the ash or Abuelo packing","Explains how each detail supports the claim"]}},{"id":"s07-mars","theme":"Exploring Mars","a":{"title":"A Rover and a Helicopter on the Red Planet","genre":"Informational","topic":"Technology and Engineering","gloss":{"delta":["a fan-shaped pile of mud and sand that a river leaves where it flows into a lake or sea","delta"],"atmosphere":["the layer of gases that surrounds a planet","atmósfera"],"transport":["to carry something from one place to another","transportar"],"independent":["able to act on its own without help","independiente"],"sediment":["sand, mud, and bits of rock carried and dropped by water or wind","sedimento"],"demonstration":["a test that shows something can be done","demostración"],"durable":["strong enough to last a long time","resistente / duradero"]},"paras":[["On February 18, 2021, a robot the size of a small car dropped through the thin pink sky of Mars and touched down safely on the floor of Jezero Crater.","The rover was named Perseverance, and tucked under its belly was a passenger that had never been tried before: a tiny helicopter called Ingenuity.","Together, the two machines would help scientists answer one of the biggest questions people have ever asked: has life ever existed anywhere besides Earth?"],["NASA chose Jezero Crater for a reason.","Billions of years ago, scientists believe, the crater held a lake, and a river flowed into it.","Where the river met the lake, it dropped mud and sand, forming a fan-shaped pile called a delta.","On Earth, deltas and lake beds are excellent at trapping and preserving signs of tiny living things.","If microscopic life ever existed on Mars, the layers of sediment in Jezero are among the best places to search for clues."],["Perseverance’s main job is to collect pieces of Mars.","Using a drill at the end of its long robotic arm, the rover cuts out rock cores slightly thicker than a pencil.","Each core is sealed inside its own metal tube so that it stays clean and unchanged.","The first rock sample was sealed in September 2021, and since then the rover has filled dozens of tubes with rock, soil, and even a sample of thin Martian air."],["Why go to so much trouble?","The most powerful laboratories in the world are on Earth, and they are far too large to transport across space.","Scientists hope a future mission will bring the tubes home so researchers can examine them with tools that do not yet exist.","As a backup plan, Perseverance dropped ten of its tubes in a group on the crater floor in 2022 and 2023, at a spot called Three Forks."],["Ingenuity, meanwhile, had a very different job.","It was a technology demonstration, which meant its purpose was simply to prove that something could be done.","That something was powered, controlled flight on another planet, and many experts were unsure it could work."],["Flying on Mars is extremely difficult because the planet’s atmosphere is so thin.","The air at the Martian surface is only about one percent as dense as the air at sea level on Earth.","A helicopter stays up by pushing air downward with its spinning blades, and with so little air to push, the blades must work much harder.","To solve this problem, engineers made Ingenuity extremely light, about four pounds, and gave it two sets of blades that spin in opposite directions roughly 2,400 times per minute.","That is several times faster than the blades of a typical helicopter on Earth."],["Distance created another challenge.","Radio signals between Earth and Mars take several minutes to travel each way, so no pilot could steer Ingenuity with a joystick.","Instead, the helicopter had to be independent, using its own camera and computer to watch the ground and keep itself steady.","It also had to survive freezing Martian nights, using a small heater powered by a battery that its solar panel recharged each day."],["On April 19, 2021, Ingenuity lifted about three meters off the ground, hovered for less than a minute, and landed gently.","It was the first powered, controlled flight of an aircraft on another world.","In honor of the Wright brothers, the helicopter carried a tiny swatch of fabric from the wing of their 1903 airplane.","NASA had planned only five test flights in about a month, but Ingenuity proved far more durable than expected.","It went on to make 72 flights over nearly three years, scouting the ground ahead and photographing places the rover might visit."],["In January 2024, Ingenuity’s mission ended when its rotor blades were damaged during a rough landing on smooth, featureless sand.","Its legacy, however, is enormous: engineers now know that flying machines can help explore other planets.","Perseverance, meanwhile, kept rolling across Jezero, drilling and sealing its precious samples.","The two robots showed that patience and creative engineering can carry human curiosity across millions of kilometers of space."]]},"b":{"title":"Rover’s Song","genre":"Poem","poem":true,"gloss":{"rusted":["covered with a reddish color, like old iron","oxidado"],"patient":["able to wait calmly without giving up","paciente"],"ancient":["very, very old","antiguo"],"whispers":["very soft, quiet sounds or messages","susurros"],"stubborn":["refusing to give up or change","terco / tenaz"]},"paras":[["I wake each morning on a rusted plain,","where no bird calls and there is never rain.","The sun is small, the sky is butterscotch,","and I am the only one awake to watch."],["Six wheels, one arm, a drill to taste the stone,","I roll so slowly, but I roll alone.","My makers sleep so many million miles away;","their whispers reach me later in the day."],["I read this crater like an ancient book.","Each layer is a page. I stop. I look.","Here water ran, here sand was gently laid,","here something small might once have lived, and stayed."],["I seal a secret in a silver tube,","a pencil-thin and patient piece of proof.","Someday a ship will gather what I keep","and carry home the questions while I sleep."],["My little friend once hummed above my head,","a dragonfly where nothing flies, they said.","It flew so far, then rested in the sand.","I carry on. I finish what we planned."],["So when you see a red star after dark,","remember me, a stubborn, rolling spark,","still tasting stone and turning every page,","still asking, Was there life here, in some age?"]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Perseverance and Ingenuity each solved hard problems to help scientists explore Mars and search for signs of past life.","Ingenuity was the first helicopter on Mars, and it carried a small piece of the Wright brothers’ airplane on its flights.","Mars has a very thin atmosphere, which makes it one of the most dangerous places in the solar system to explore.","Scientists have proven that tiny living things once existed in the lake that filled Jezero Crater long ago."],"k":0,"why":"The text explains the rover’s sampling job (paragraphs 3–4) and the helicopter’s flying test (paragraphs 5–8), both tied to the search for life in paragraph 1. Scientists have not proven life existed, so the last choice is wrong."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: Why did NASA choose Jezero Crater as Perseverance’s landing site?","o":["It once held a lake and river delta that could preserve signs of tiny life.","It is the flattest place on Mars, so the rover could land without any danger.","It is close to Earth, so radio signals could reach the rover more quickly.","It still holds liquid water that scientists can test for living things."],"k":0,"why":"Paragraph 2 says the crater held a lake long ago and that deltas and lake beds are good at preserving signs of tiny living things. The lake is gone now, so the last choice is wrong.","ev":["a2.2","a2.4","a2.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 6, why did Ingenuity’s blades need to spin so fast?","o":["The thin air gave the blades very little to push against.","The freezing cold nights made the blades stiff and hard to turn.","The helicopter was heavier than helicopters on Earth.","The rover needed the helicopter to keep up with it."],"k":0,"why":"Paragraph 6 says the air is only about one percent as dense as Earth’s, and “with so little air to push, the blades must work much harder.” The helicopter was actually very light.","ev":["a6.3","a6.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"key details","q":"Which TWO problems did engineers have to solve so that Ingenuity could fly on Mars? Choose TWO answers.","o":["No one on Earth could steer it in real time because signals take minutes to arrive.","The Martian air is so thin that ordinary helicopter blades could not lift it.","Its rotor blades were broken during its very first landing in Jezero Crater.","Dust storms on Mars blocked all sunlight from reaching its solar panel.","Its drill had to cut rock cores slightly thicker than a pencil."],"ks":[0,1],"why":"Paragraph 6 explains the thin-air problem, and paragraph 7 explains the signal delay. The blades broke on the last flight, not the first, and the drill belongs to Perseverance."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the author says the best laboratories are “far too large to <b>transport</b> across space.” The root <i>port</i> means “carry,” and the prefix <i>trans-</i> means “across.” What does <b>transport</b> mean?","o":["to carry from one place to another","to build again in a new location","to look at something very closely","to break into smaller, lighter pieces"],"k":0,"why":"Trans- (across) plus port (carry) means “carry across.” Paragraph 4 explains that the labs cannot be carried to Mars, so the samples must come to Earth."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 7: “Instead, the helicopter had to be <b>independent</b>, using its own camera and computer to watch the ground and keep itself steady.” What does <b>independent</b> mean?","o":["able to work on its own without help","built from many separate small parts","able to travel very long distances","connected closely to another machine"],"k":0,"why":"The rest of the sentence explains that the helicopter used “its own camera and computer.” The prefix in- means “not,” so independent means not depending on someone else."},{"on":"a","t":"mc","skill":"text structure","q":"How are paragraphs 6 and 7 mainly organized?","o":["Each paragraph describes a problem for flying on Mars and how engineers solved it.","Each paragraph compares the Perseverance rover to the Ingenuity helicopter.","The paragraphs list Ingenuity’s flights in the order they happened.","The paragraphs explain the causes of Ingenuity’s final rough landing."],"k":0,"why":"Paragraph 6 names the thin-air problem and the solution (light body, fast blades). Paragraph 7 names the distance problem and the solution (its own camera and computer)."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: How does the author feel about what Ingenuity accomplished?","o":["The author admires it as a success that went beyond what anyone expected.","The author thinks it wasted time that the rover could have spent drilling.","The author believes it failed because it was damaged in the end.","The author is unsure whether it taught engineers anything useful."],"k":0,"why":"In paragraph 8 the author says it “proved far more durable than expected,” and paragraph 9 calls its legacy “enormous.” These words show admiration, even though it was damaged at the end.","ev":["a9.2","a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"inference","q":"Based on paragraphs 3 and 4, what can the reader infer about the rock samples?","o":["Scientists expect to learn the most from them once they reach Earth.","The rover has already found clear signs of life inside most of the tubes.","The samples are being studied right now by tools on the rover.","The samples are only useful as a backup if the rover breaks down."],"k":0,"why":"Paragraph 4 says the best labs are on Earth and scientists hope a mission will “bring the tubes home.” The text never says life was found."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best describes a theme of the poem?","o":["Patient, steady work can keep a big question alive even in a lonely place.","Machines are always lonelier than people because they cannot have true friends.","Exploring space is too dangerous, so people should stay close to home.","It is better to work quickly than to stop and look closely at details."],"k":0,"why":"The rover rolls “so slowly” but keeps going, and in the last stanza it is “stubborn” and “still asking” whether life existed. The poem praises patience, not speed."},{"on":"b","t":"ebsr","skill":"word choice","q":"Part A: In stanza 3, the speaker says, “I read this crater like an <b>ancient book</b>.” What does this comparison suggest?","o":["The rock layers hold a long history that the rover studies one piece at a time.","The rover carries a library of books to read during the long Martian nights.","The crater is so old and dull that the rover finds it boring to explore.","Scientists wrote the history of Mars in a book that the rover is carrying."],"k":0,"why":"The next line explains the comparison: “Each layer is a page.” Like reading a book page by page, the rover studies the crater layer by layer to learn its story.","ev":["b3.2","b3.3"],"evq":"Part B: Click the line in the poem that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In stanza 6, the rover calls itself “a <b>stubborn</b>, rolling spark.” What feeling does the word <b>stubborn</b> create here?","o":["determined pride, because the rover refuses to give up","annoyance, because the rover will not follow any orders","sadness, because the rover is stuck and cannot move","fear, because the rover is lost in a strange place"],"k":0,"why":"Stubborn can sound negative, but here it is paired with “spark” and “still tasting stone.” It suggests the rover proudly keeps going."},{"on":"b","t":"mc","skill":"point of view","q":"How does the speaker seem to feel about the helicopter in stanza 5?","o":["fond of it and determined to finish their shared work","jealous that it could fly while the rover could only roll","angry that it stopped working and left the rover alone","worried that it will crash into the rover from above"],"k":0,"why":"The rover calls it “my little friend,” which shows fondness, and then says, “I carry on. I finish what we planned,” which shows determination."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the poem add to the reader’s understanding of the topic in Text 1?","o":["It imagines how the mission might feel from the rover’s point of view.","It gives exact dates and numbers that Text 1 leaves out.","It explains in detail how the helicopter’s blades created lift.","It argues that the samples should never be brought to Earth."],"k":0,"why":"Text 1 gives facts such as dates, blade speeds, and the number of flights. The poem uses the rover’s voice (“I roll so slowly, but I roll alone”) to show what the mission might feel like."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 does the poem also include?","o":["Perseverance seals rock samples in tubes so they can be taken to Earth later.","Radio signals take several minutes to travel between Earth and Mars.","Ingenuity carried a piece of fabric from the Wright brothers’ airplane.","Ingenuity made 72 flights over nearly three years before it stopped."],"k":0,"why":"Text 1, paragraphs 3–4, explains sealing cores in tubes for a future trip home, and stanza 4 of the poem says, “I seal a secret in a silver tube” and “Someday a ship will gather what I keep.”","ev":["b4.1","b4.3","a4.3"],"evq":"Part B: Click the sentence or line from either text that best supports your answer to Part A."}],"write":{"prompt":"Text 1 and Text 2 both describe the work of the Perseverance rover. Explain how each text shows that exploring Mars takes patience. Use at least one detail from each text to support your answer.","model":"Both texts show that exploring Mars takes a lot of patience. Text 1 explains that Perseverance drills rock cores and seals them in tubes, but scientists must wait for a future mission to bring the tubes back to Earth. That means the rover is collecting answers that people may not get for years. In Text 2, the rover says, “I roll so slowly, but I roll alone,” and it reads the crater “like an ancient book,” one layer at a time. This shows that the work is slow and careful. Together, the texts show that discovering whether life ever existed on Mars cannot be rushed, so explorers have to keep going one step at a time.","need":["States a claim about patience in exploring Mars","Uses a fact from Text 1, such as the samples waiting for a trip to Earth","Uses a line or detail from the poem","Explains how each detail shows patience"]}},{"id":"s08-aquifer","theme":"Water Under Our Feet","a":{"title":"The City That Is Sinking","genre":"Informational","topic":"Earth and Space Science","gloss":{"aquifer":["a layer of underground rock, sand, or gravel that holds water","acuífero"],"groundwater":["water stored underground in soil and rock","agua subterránea"],"recharge":["to fill up again","recargar"],"subsidence":["the slow sinking of the ground","hundimiento"],"compress":["to squeeze into a smaller space","comprimir"],"irreversible":["not able to be changed back","irreversible"],"shortage":["a situation in which there is not enough of something","escasez"]},"paras":[["If you dig deep enough almost anywhere on Earth, you will eventually reach water.","This hidden water, called groundwater, fills the tiny spaces between grains of sand, gravel, and soil, and seeps into cracks in solid rock.","Groundwater is not usually an underground lake or river; it is more like water soaked into a giant sponge.","In fact, about 30 percent of all the fresh water on Earth is stored underground, while most of the rest is frozen in ice."],["A layer of rock or sediment that holds enough water for people to pump out is called an aquifer.","Aquifers recharge when rain and melting snow soak down through the soil and slowly refill the spaces below.","This process can take a long time, from days in some places to thousands of years in others.","When people pump water out faster than nature can put it back, the level of water in the aquifer drops."],["Mexico City shows what can happen when an aquifer is overused.","The city, home to more than 20 million people in its wider metropolitan area, gets much of its drinking water by pumping it from wells that reach deep into the aquifer below.","Pumping began in earnest more than a century ago, and as the city grew, the number of wells grew with it.","Today, groundwater supplies most of the water that flows from the city’s taps."],["There is a reason this matters so much in Mexico City in particular.","Long ago, much of the valley was covered by a large, shallow lake called Lake Texcoco.","The Aztec capital, Tenochtitlan, was built on an island in that lake, and over the centuries the lake was drained so the city could spread.","The ground left behind is made of thick layers of soft clay that once held a great deal of water."],["When water is pumped out of this clay, the tiny particles squeeze closer together, like a wet sponge being pressed in your hand.","As the clay layers compress, the land on top of them sinks.","Scientists call this sinking land subsidence.","Unlike a sponge, however, the clay does not spring back when water returns, so most of the damage is irreversible."],["The results are easy to see.","In some neighborhoods, the ground dropped by about ten meters during the twentieth century.","Satellite studies have shown that parts of the city are still sinking by up to about 40 to 50 centimeters per year, though other areas barely move.","In 2026, scientists shared measurements from a new satellite called NISAR, built by the space agencies of the United States and India, that showed some areas sinking by more than two centimeters every month."],["One famous landmark tells the story clearly.","The Angel of Independence is a tall stone column topped by a gold-covered statue, and it was completed in 1910.","As the street around it sank, the monument seemed to rise out of the ground, so workers had to add 14 steps to its base so that people could still climb up to it.","Elsewhere, uneven sinking has cracked buildings, tilted old churches, broken water pipes, and damaged parts of the subway system."],["Ironically, the sinking also makes the city’s water problems worse.","Cracked pipes leak, so a large amount of clean water is lost before it ever reaches homes.","Low spots in the city flood more easily during heavy rains, yet much of that rainwater runs off the paved streets instead of soaking back into the aquifer.","This combination of too much water in storms and too little water in the taps has made the threat of a water shortage a constant worry."],["Mexico City is not alone; land is also sinking above overused aquifers in places like California, Jakarta, and parts of China.","Scientists say there is no single solution, but helpful steps include fixing leaks, capturing rainwater, recycling wastewate
