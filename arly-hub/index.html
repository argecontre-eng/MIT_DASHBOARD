<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Arly's Training Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: app shell. Sticky top bar with tabs; one centered work column; practice card is the hero of each view. Graph-paper ground, same identity as Score Map. */
:root{
  --paper:#f3f6f9; --card:#ffffff; --ink:#14213a; --muted:#56667c; --grid:#dde5ed; --rule:#c9d4df; --field:#fbfcfe;
  --earned:#2563a8; --lost:#cf4458; --part:#c98a14; --hi:#f6cd3c; --hi-ink:#4a3a00;
  --good:#23794a; --good-soft:#dff1e6; --bad:#b8323f; --bad-soft:#fbe3e6; --warn:#8a5d00; --warn-soft:#fbefd2;
  --tint:#e3edf8; --sh:#2563a8; --sh2:#9cc0e8; --un:#eef3f8;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-read:"Literata",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1720; --card:#16212d; --ink:#e7eef6; --muted:#9eb0c4; --grid:#1d2a38; --rule:#2c3d50; --field:#111b26;
    --earned:#4a86cf; --lost:#d9566a; --part:#b5821f; --hi:#f2c53a; --hi-ink:#2a2000;
    --good:#5fc48a; --good-soft:#163323; --bad:#f08592; --bad-soft:#3a1d23; --warn:#e8b75a; --warn-soft:#3a2d16;
    --tint:#1a2c42; --sh:#4a86cf; --sh2:#2b4e78; --un:#1c2836; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1720; --card:#16212d; --ink:#e7eef6; --muted:#9eb0c4; --grid:#1d2a38; --rule:#2c3d50; --field:#111b26;
  --earned:#4a86cf; --lost:#d9566a; --part:#b5821f; --hi:#f2c53a; --hi-ink:#2a2000;
  --good:#5fc48a; --good-soft:#163323; --bad:#f08592; --bad-soft:#3a1d23; --warn:#e8b75a; --warn-soft:#3a2d16;
  --tint:#1a2c42; --sh:#4a86cf; --sh2:#2b4e78; --un:#1c2836; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--rule)}
.topin{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:grid;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand b span{background:linear-gradient(transparent 58%,var(--hi) 58%)}
.sync{font-size:12.5px;color:var(--muted);font-family:var(--f-data);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;padding:8px 12px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:15.5px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,3.4vw,26px);line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--f-data);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px clamp(14px,3vw,22px);display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.cols2{grid-template-columns:minmax(0,1fr)}.cols3{gap:8px}.cols3 .stat{padding:10px}.cols3 .stat .v{font-size:22px}.cols3 .stat .l{font-size:12.5px;line-height:1.3}}
@media (max-width:480px){.brand b{font-size:19px}.sync{font-size:11px}}
.btn{font-weight:700;border-radius:10px;padding:11px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--card);line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:14.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;padding:0;color:var(--earned);text-decoration:underline;font-weight:700}
.stat{display:grid;gap:0;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:13.5px;color:var(--muted)}
/* plan */
.plan{display:grid;gap:10px;counter-reset:pl}
.task{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.task::before{counter-increment:pl;content:counter(pl);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;background:var(--tint);color:var(--ink)}
.task.done{background:var(--good-soft);border-color:var(--good)}
.task.done::before{content:"✓";background:var(--good);color:var(--card)}
.task .tt{font-weight:700}
.task .td{font-size:14px;color:var(--muted)}
@media (max-width:520px){.task{grid-template-columns:34px minmax(0,1fr)}.task .btn{grid-column:2}}
/* skills */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.skill{display:grid;gap:6px;text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.skill:hover{border-color:var(--ink)}
.skill .sn{font-weight:700;line-height:1.25}
.meter{height:8px;border-radius:4px;background:var(--un);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;font-family:var(--f-data);width:max-content}
.st-new{background:var(--un);color:var(--muted)} .st-low{background:var(--bad-soft);color:var(--bad)} .st-mid{background:var(--warn-soft);color:var(--warn)} .st-strong{background:var(--good-soft);color:var(--good)}
.tag6{background:var(--ink);color:var(--card)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--un);border:1px solid var(--rule)}
.dots i.cur{border:2px solid var(--ink)}
.dots i.ok{background:var(--good);border-color:var(--good)} .dots i.no{background:var(--lost);border-color:var(--lost)} .dots i.ans{background:var(--muted);border-color:var(--muted)}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:20px clamp(14px,3vw,26px);display:grid;gap:16px;min-width:0}
.qprompt{font-size:20px;line-height:1.75;overflow-wrap:anywhere}
.qvis{overflow-x:auto}
.vis{display:block;max-width:100%;height:auto;max-height:340px}
.vis .sh{fill:var(--sh);stroke:var(--card);stroke-width:2}
.vis .half{fill:var(--sh2);stroke:var(--card);stroke-width:2}
.vis .un{fill:var(--un);stroke:var(--rule);stroke-width:2}
.vis .ax{stroke:var(--ink);stroke-width:2}
.vis .gl{stroke:var(--rule);stroke-width:1}
.vis .lab{fill:var(--ink);font-family:var(--f-data);font-size:13px}
.vis .lab.sm{font-size:11px;fill:var(--muted)}
.vis .lab.b{font-weight:700;font-family:var(--f-body);font-size:14px}
.vis .lab.xm{font-size:18px;font-weight:700;font-family:var(--f-body)}
.vis .pt{fill:var(--lost);stroke:var(--card);stroke-width:2}
.vis .poly{fill:var(--tint);stroke:var(--earned);stroke-width:2}
.vis .poly2{fill:var(--tint);stroke:var(--ink);stroke-width:2.5}
.vis .mk{stroke:var(--ink);stroke-width:2}
.vis .face1{fill:var(--sh2);stroke:var(--ink);stroke-width:1.5}
.vis .face2{fill:var(--tint);stroke:var(--ink);stroke-width:1.5}
.vis .face3{fill:var(--sh);stroke:var(--ink);stroke-width:1.5;opacity:.75}
.vis.clickable{cursor:crosshair;touch-action:manipulation}
.vis .cursor{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ain{font:inherit;font-size:22px;width:100%;max-width:260px;padding:8px 12px;border:2px solid var(--rule);border-radius:10px;background:var(--field);color:var(--ink);font-family:var(--f-data)}
.ain:focus{border-color:var(--ink);outline:none}
.preview{font-size:20px;min-height:1em;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:2px solid var(--rule);border-radius:10px;background:var(--field);font-size:17px;line-height:1.5;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.opt .ol{font-family:var(--f-data);font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--tint)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.symopts{display:flex;gap:10px}
.symopts .opt{grid-template-columns:1fr;min-width:64px;text-align:center;font-size:26px;font-weight:700;padding:8px 16px}
.chipopts{display:flex;gap:8px;flex-wrap:wrap}
.chipopts .opt{grid-template-columns:1fr;min-width:56px;text-align:center;font-family:var(--f-data);font-size:19px;font-weight:600}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.almost{background:var(--warn-soft);border:1px solid var(--warn)}
.fb .fbh{font-family:var(--f-display);font-weight:800;font-size:20px}
.steps{margin:0;padding-left:22px;display:grid;gap:4px;line-height:1.75}
.rule{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:15.5px}
.rule b{font-family:var(--f-display)}
.timer{font-family:var(--f-data);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
/* fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.1;margin:0 2px}
.fr .nu{border-bottom:2px solid currentColor;padding:0 3px}
.fr .de{padding:0 3px}
.mixsp{display:inline-block;width:2px}
.numtxt{font-family:var(--f-data);white-space:nowrap}
/* reading */
.reader{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.reader{grid-template-columns:minmax(0,1fr)}.reader .qside{order:-1}}
.article{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px clamp(16px,3vw,30px);font-family:var(--f-read);font-size:18.5px;line-height:1.8;display:grid;gap:14px}
.article h2{font-family:var(--f-display)}
.article .para{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.article .pn{font-family:var(--f-data);font-size:12.5px;color:var(--muted);padding-top:6px}
.sent{border-radius:4px;transition:background .15s}
.picking .sent{cursor:pointer;background:linear-gradient(transparent 92%,var(--rule) 92%)}
.picking .sent:hover{background:var(--tint)}
.sent.sel{background:var(--hi);color:var(--hi-ink)}
.sent.evok{background:var(--good-soft);outline:2px solid var(--good);outline-offset:1px}
.gw{background:none;border:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted 2px;text-underline-offset:4px;text-decoration-color:var(--earned)}
.qside{position:sticky;top:110px;display:grid;gap:12px}
@media (max-width:860px){.qside{position:static}}
.pop{position:fixed;z-index:20;background:var(--ink);color:var(--card);border-radius:10px;padding:10px 12px;max-width:280px;font-size:15px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pop i{opacity:.8}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{text-align:left;display:grid;gap:6px;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--card)}
.pcard:hover{border-color:var(--ink)}
.pcard .pt{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wcard{padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--card);display:grid;gap:6px}
.wcard .wp{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.wcard ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:2px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{padding:7px 14px;border-radius:99px;border:2px solid var(--rule);background:var(--card);font-weight:700;font-size:15px}
.subtabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
textarea{font:inherit;width:100%;min-height:96px;padding:10px 12px;border:2px solid var(--rule);border-radius:10px;background:var(--field);color:var(--ink)}
/* booklet */
.bmap{display:grid;gap:4px}
.chrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--rule)}
.chrow:first-child{border-top:none}
.chname{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{min-width:38px;height:32px;border-radius:6px;border:2px solid var(--rule);background:var(--field);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip.tried{background:var(--warn-soft);border-color:var(--warn)} .chip.pass{background:var(--good-soft);border-color:var(--good)} .chip.cur{outline:3px solid var(--ink);outline-offset:1px}
@media (max-width:560px){.chrow{grid-template-columns:1fr}.chips{justify-content:flex-start}}
.bgrid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.bgrid.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:620px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) 26px;gap:6px 8px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--field)}
.item.ok{background:var(--good-soft);border-color:var(--good)} .item.no{background:var(--bad-soft);border-color:var(--bad)} .item.almost{background:var(--warn-soft);border-color:var(--warn)}
.item .num{font-weight:700;color:var(--muted);align-self:start}
.item .q{line-height:1.8;overflow-wrap:anywhere}
.item .q svg{max-width:100%;height:auto;display:block}
.item .mark{font-weight:700;font-size:20px;text-align:center;align-self:start}
.item .ans{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .hint{grid-column:2/-1;font-size:14.5px}
.item input.a{font:inherit;font-size:18px;width:100%;max-width:220px;padding:6px 10px;border:2px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);font-family:var(--f-data)}
.item .bopt{min-width:44px;padding:6px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--card);font-weight:700}
.item .bopt[aria-pressed="true"]{border-color:var(--ink);background:var(--tint)}
.key{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--rule);line-height:1.8}
.score{padding:14px 16px;border-radius:12px;border:2px solid var(--rule)}
.score.pass{border-color:var(--good);background:var(--good-soft)} .score.fail{border-color:var(--bad);background:var(--bad-soft)}
.g6{display:inline-block;font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--card);background:var(--ink);padding:0 5px;border-radius:3px;vertical-align:2px}
/* progress */
.mgrid{display:grid;gap:12px}
.mcat{display:grid;gap:6px}
.mcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mcell{border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.25;display:grid;gap:2px;border:1px solid var(--rule)}
.mcell b{font-family:var(--f-data);font-size:13px}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
table{border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left}
.tablewrap{overflow-x:auto}
.empty{border:2px dashed var(--rule);border-radius:12px;padding:16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2: two subjects, timer, calendar ===== */
.top .topin{padding-block:10px 10px}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;gap:3px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--field)}
.seg[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.seg-n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.seg-s{font-size:13px;opacity:.85}
.seg-bar{height:6px;border-radius:3px;background:var(--un);overflow:hidden}
.seg-bar i{display:block;height:100%;background:var(--hi);border-radius:3px;width:0}
.clock{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:99px;background:var(--hi);color:var(--hi-ink)}
.clock.paused{background:var(--un);color:var(--ink)}
.cl-ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--hi-ink) calc(var(--p)*360deg),transparent 0);border:3px solid currentColor;flex:0 0 auto;opacity:.85}
.cl-txt{display:grid;line-height:1.05}
.cl-t{font-family:var(--f-data);font-size:20px;font-variant-numeric:tabular-nums}
.cl-l{font-size:11.5px}
.clock .btn{border-color:currentColor;color:inherit;padding:5px 10px}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px clamp(16px,3vw,26px);display:grid;gap:14px}
.hero-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.ring{--p:0;flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*360deg),var(--un) 0);display:grid;place-items:center}

/* ===== Engine: exact fractions, answer checking, question generators ===== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const fAdd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d), fSub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d);
const fMul=(a,b)=>F(a.n*b.n,a.d*b.d), fDiv=(a,b)=>F(a.n*b.d,a.d*b.n);
const fCmp=(a,b)=>a.n*b.d-b.n*a.d;

// HTML helpers
const fr=(n,d)=>`<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
function fx(r,pref="mixed"){ // display a rational
  const neg=r.n<0,n=Math.abs(r.n),d=r.d,s=neg?"−":"";
  if(d===1) return s+n;
  if(pref==="mixed"&&n>d){const w=Math.floor(n/d),a=n%d;return `${s}${w}<span class="mixsp"></span>${fr(a,d)}`}
  return s+fr(n,d);
}
function key(r,pref="mixed"){ // typed form used for checking
  const neg=r.n<0,n=Math.abs(r.n),d=r.d,s=neg?"-":"";
  if(d===1) return s+n;
  if(pref==="mixed"&&n>d) return `${s}${Math.floor(n/d)} ${n%d}/${d}`;
  return `${s}${n}/${d}`;
}
const mixHTML=(w,a,b)=>`${w}<span class="mixsp"></span>${fr(a,b)}`;
const dec=x=>{const s=(Math.round(x*10000)/10000).toString();return s};

// ---------- answer parsing / judging
function parseNum(s){
  s=String(s).trim().replace(/[−–]/g,"-").replace(/,/g,"").replace(/^[a-z]\s*=\s*/i,"").replace(/^\$/,"");
  const m=s.match(/^(-?\d*\.?\d+(?:\s+\d+\/\d+)?|-?\d+\/\d+)(?:\s*[a-z°%$.\s²³]*)?$/i);
  if(!m) return null;
  const t=m[1];let n,d,form,r;
  if(r=t.match(/^(-?\d+)\s+(\d+)\/(\d+)$/)){const w=+r[1],a=+r[2],b=+r[3];if(!b)return null;n=Math.abs(w)*b+a;d=b;if(t.startsWith("-"))n=-n;form={k:"mixed",w:Math.abs(w),a,b}}
  else if(r=t.match(/^(-?\d+)\/(\d+)$/)){n=+r[1];d=+r[2];if(!d)return null;form={k:"frac",a:Math.abs(n),b:d}}
  else if(t.includes(".")){const p=t.split(".")[1].length;d=10**p;n=Math.round(parseFloat(t)*d);form={k:"dec"}}
  else{n=+t;d=1;form={k:"int"}}
  const g=gcd(n,d)||1;return {n:n/g,d:d/g,form};
}
function judgeNum(input,k){
  const u=parseNum(input),kk=parseNum(k);
  if(!u) return ["no","I can't read that. Type a number like 12, 3/4, 2 1/3 or 4.5."];
  if(u.n!==kk.n||u.d!==kk.d) return ["no",null];
  const f=u.form,kf=kk.form.k;
  if(f.k==="frac"&&gcd(f.a,f.b)>1) return ["almost","Right value. Now simplify the fraction."];
  if(f.k==="mixed"&&(gcd(f.a,f.b)>1||f.a>=f.b)) return ["almost","Right value. Simplify the fraction part."];
  if(kf==="mixed"&&f.k==="frac") return ["almost","Right value. Write it as a mixed number."];
  if(kf==="frac"&&f.k==="mixed") return ["almost","Right value. Write it as a fraction."];
  if((kf==="frac"||kf==="mixed")&&f.k==="dec") return ["almost","Right value. Write it as a fraction."];
  if(kf==="int"&&f.k==="frac") return ["almost","Right value. Write it as a whole number."];
  return ["ok",null];
}
function judgePoint(v,k){
  const m=String(v).replace(/[−–]/g,"-").match(/(-?\d+)\s*[, ]\s*(-?\d+)/);
  if(!m) return ["no","Write the point like (2, 3)."];
  if(+m[1]===k[0]&&+m[2]===k[1]) return ["ok",null];
  if(+m[1]===k[1]&&+m[2]===k[0]) return ["no","You switched x and y. x comes first: go across, then up or down."];
  return ["no",null];
}
function judgeQ(q,v){
  if(v===undefined||v===null||(typeof v==="string"&&v.trim()==="")||(Array.isArray(v)&&!v.length)) return ["blank",null];
  switch(q.type){
    case "num":{const r=judgeNum(v,q.key);if(r[0]==="almost"&&(q.anyform||(q.loose&&/simplif/i.test(r[1]))))return ["ok",null];return r}
    case "mc": case "sym": return [v===q.key?"ok":"no",null];
    case "multi":{const a=[...v].sort().join(","),b=[...q.key].sort().join(",");return [a===b?"ok":"no",null]}
    case "point": case "click": return judgePoint(v,q.key);
  }
  return ["no",null];
}

// ---------- seeded random
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tools(seed){const r=rng(seed);const int=(a,b)=>a+Math.floor(r()*(b-a+1));const pick=a=>a[Math.floor(r()*a.length)];
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};return{r,int,pick,shuffle}}
// multiple choice builder: options HTML list with one correct
function mc(T,correct,wrongs){const uniq=[...new Set(wrongs.filter(w=>w!==correct))].slice(0,3);const opts=T.shuffle([correct,...uniq]);return{opts,key:String(opts.indexOf(correct))}}

// ---------- SVG helpers
function barSVG(parts,shaded,{w=300,h=34,label=""}={}){
  const pw=w/parts;let s=`<svg viewBox="0 0 ${w+4} ${h+4}" class="vis" role="img" aria-label="${label||`bar split into ${parts} equal parts, ${shaded} shaded`}">`;
  for(let i=0;i<parts;i++) s+=`<rect x="${2+i*pw}" y="2" width="${pw}" height="${h}" class="${i<shaded?"sh":"un"}"/>`;
  return s+`</svg>`;
}
function lineSVG(max,den,pointNum,{w=320}={}){
  const L=16,R=w-16,y=34,X=v=>L+v/max*(R-L);let s=`<svg viewBox="0 0 ${w} 62" class="vis" role="img" aria-label="number line from 0 to ${max} split into ${den} parts per whole">`;
  s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" class="ax"/>`;
  for(let k=0;k<=max*den;k++){const x=X(k/den),big=k%den===0;s+=`<line x1="${x}" x2="${x}" y1="${y-(big?9:6)}" y2="${y+(big?9:6)}" class="ax"/>`;if(big)s+=`<text x="${x}" y="${y+24}" text-anchor="middle" class="lab">${k/den}</text>`}
  s+=`<circle cx="${X(pointNum/den)}" cy="${y}" r="6" class="pt"/><text x="${X(pointNum/den)}" y="${y-14}" text-anchor="middle" class="lab b">?</text>`;
  return s+`</svg>`;
}
function areaSVG(a,b,c,d){ // a/b × c/d area model: columns b (shade a), rows d (shade c)
  const W=220,H=150,cw=W/b,rh=H/d;let s=`<svg viewBox="0 0 ${W+4} ${H+4}" class="vis" style="max-width:240px" role="img" aria-label="area model">`;
  for(let i=0;i<b;i++)for(let j=0;j<d;j++){const both=i<a&&j<c,one=i<a||j<c;s+=`<rect x="${2+i*cw}" y="${2+j*rh}" width="${cw}" height="${rh}" class="${both?"sh":one?"half":"un"}"/>`}
  return s+`</svg>`;
}
function gridSVG(min,max,{points=[],poly=null,click=false,size=300}={}){
  const pad=26,W=size,span=max-min,u=(W-2*pad)/span,X=x=>pad+(x-min)*u,Y=y=>W-pad-(y-min)*u;
  let s=`<svg viewBox="0 0 ${W} ${W}" class="vis grid${click?" clickable":""}" data-min="${min}" data-max="${max}" data-pad="${pad}" data-u="${u}" role="img" aria-label="coordinate grid">`;
  for(let k=min;k<=max;k++){s+=`<line x1="${X(k)}" x2="${X(k)}" y1="${Y(min)}" y2="${Y(max)}" class="${k===0?"ax":"gl"}"/><line y1="${Y(k)}" y2="${Y(k)}" x1="${X(min)}" x2="${X(max)}" class="${k===0?"ax":"gl"}"/>`;
    if(k!==0||min===0){s+=`<text x="${X(k)}" y="${Y(Math.max(min,0))+15}" text-anchor="middle" class="lab sm">${k===0&&min<0?"":k}</text>`;if(k!==0)s+=`<text x="${X(Math.max(min,0))-6}" y="${Y(k)+4}" text-anchor="end" class="lab sm">${k}</text>`}}
  s+=`<text x="${X(max)-2}" y="${Y(Math.max(min,0))-6}" text-anchor="end" class="lab b">x</text><text x="${X(Math.max(min,0))+8}" y="${Y(max)+12}" class="lab b">y</text>`;
  if(poly){s+=`<polygon points="${poly.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" class="poly"/>`;poly.forEach((p,i)=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" class="pt"/>`;if(p[2])s+=`<text x="${X(p[0])+7}" y="${Y(p[1])-7}" class="lab b">${p[2]}</text>`})}

  if(k===0){e=`${a} × (${b} + ${c}) − ${d}`;v=a*(b+c)-d;ex=[`Parentheses first: ${b} + ${c} = ${b+c}.`,`Multiply: ${a} × ${b+c} = ${a*(b+c)}.`,`Subtract: ${a*(b+c)} − ${d} = <b>${v}</b>.`]}
  else if(k===1){const m=c*d;e=`${a} + ${b} × ${c} − ${m} ÷ ${d}`;v=a+b*c-c;ex=[`Multiply and divide first, left to right: ${b} × ${c} = ${b*c} and ${m} ÷ ${d} = ${c}.`,`Then add and subtract left to right: ${a} + ${b*c} − ${c} = <b>${v}</b>.`]}
  else if(k===2){const big=(b+c)*d+T.int(1,9);e=`[${big} − (${b} + ${c}) × ${d}] × ${a}`;v=(big-(b+c)*d)*a;ex=[`Innermost first: ${b} + ${c} = ${b+c}.`,`Inside the brackets, multiply before subtracting: ${b+c} × ${d} = ${(b+c)*d}, then ${big} − ${(b+c)*d} = ${big-(b+c)*d}.`,`Last: ${big-(b+c)*d} × ${a} = <b>${v}</b>.`]}
  else{e=`(${a} + ${b}) × (${c} + ${d})`;v=(a+b)*(c+d);ex=[`Each set of parentheses first: ${a+b} and ${c+d}.`,`Multiply: ${a+b} × ${c+d} = <b>${v}</b>.`]}
  return {prompt:`Evaluate: &nbsp; <span class="numtxt">${e}</span>`,type:"num",key:String(v),explain:steps(ex)}};
G.oa_write=T=>{const a=T.int(2,12),b=T.int(2,12),m=T.int(2,5),k=T.int(0,2);let words,cor,wr;
  if(k===0){words=`Add ${a} and ${b}, then multiply by ${m}.`;cor=`${m} × (${a} + ${b})`;wr=[`${m} × ${a} + ${b}`,`${a} + ${b} × ${m}`,`(${m} + ${a}) × ${b}`]}
  else if(k===1){words=`Subtract ${b} from ${a+b+5}, then divide by ${m}.`;cor=`(${a+b+5} − ${b}) ÷ ${m}`;wr=[`${a+b+5} − ${b} ÷ ${m}`,`(${b} − ${a+b+5}) ÷ ${m}`,`${m} ÷ (${a+b+5} − ${b})`]}
  else{words=`${m} times as large as the sum of ${a} and ${b}.`;cor=`${m} × (${a} + ${b})`;wr=[`${m} + (${a} + ${b})`,`${m} × ${a} + ${b}`,`(${a} + ${b}) ÷ ${m}`]}
  const M=mc(T,cor,wr);return {prompt:`Which expression matches the words?<br><i>"${words}"</i>`,type:"mc",opts:M.opts.map(o=>`<span class="numtxt">${o}</span>`),key:M.key,explain:steps([`The step that happens first must be in parentheses.`,`Correct: <b class="numtxt">${cor}</b>.`])}};
G.oa_pattern=T=>{const a=T.int(2,5),m=T.int(2,4),b=a*m,n=T.int(4,7);const A=Array.from({length:5},(_,i)=>i*a),B=Array.from({length:5},(_,i)=>i*b);
  if(T.r()<.5) return {prompt:`Pattern A starts at 0 and adds ${a} each time.<br>Pattern B starts at 0 and adds ${b} each time.<br>Each term in B is how many times the matching term in A?`,type:"num",key:String(m),explain:steps([`A: ${A.join(", ")}…`,`B: ${B.join(", ")}…`,`${B[1]} ÷ ${A[1]} = ${m}, ${B[2]} ÷ ${A[2]} = ${m}. Each B term is <b>${m}</b> times the A term.`])};
  return {prompt:`Pattern A starts at 0 and adds ${a}. Pattern B starts at 0 and adds ${b}.<br>Write the ordered pair (A, B) for term number ${n+1} (the first term is 0, 0).`,type:"point",key:[n*a,n*b],explain:steps([`Term ${n+1} is ${n} steps after 0.`,`A: ${n} × ${a} = ${n*a}. B: ${n} × ${b} = ${n*b}.`,`Ordered pair: <b>(${n*a}, ${n*b})</b>.`])}};
G.oa_divis=T=>{const ds=[2,3,4,5,6,9,10];let n;do{n=T.int(100,999)}while(ds.filter(d=>n%d===0).length<1);
  const keyArr=ds.filter(d=>n%d===0).map(String),sd=String(n).split("").reduce((s,x)=>s+ +x,0);
  return {prompt:`Which numbers divide <b class="numtxt">${n}</b> evenly? Choose all that apply.`,type:"multi",opts:ds.map(String),key:keyArr,explain:steps([`2: last digit even? ${n%2===0?"Yes":"No"}. 5: last digit 0 or 5? ${n%5===0?"Yes":"No"}. 10: last digit 0? ${n%10===0?"Yes":"No"}.`,`3 and 9: digit sum ${String(n).split("").join(" + ")} = ${sd}. Divisible by 3? ${sd%3===0?"Yes":"No"}. By 9? ${sd%9===0?"Yes":"No"}.`,`4: last two digits ${String(n).slice(-2)} divisible by 4? ${n%4===0?"Yes":"No"}. 6: divisible by both 2 and 3? ${n%6===0?"Yes":"No"}.`,`Answer: <b>${keyArr.join(", ")}</b>.`])}};
G.oa_gcflcm=T=>{const g=T.int(2,9),a=g*T.int(1,6),b=g*T.int(2,7);if(a===b)return G.oa_gcflcm(T);
  if(T.r()<.5) return {prompt:`Find the GCF (greatest common factor) of ${a} and ${b}.`,type:"num",key:String(gcd(a,b)),explain:steps([`List the factors of each number and find the biggest one they share.`,`The GCF of ${a} and ${b} is <b>${gcd(a,b)}</b>.`])};
  return {prompt:`Find the LCM (least common multiple) of ${a} and ${b}.`,type:"num",key:String(lcm(a,b)),explain:steps([`List multiples of the bigger number until one is also a multiple of the smaller number.`,`The LCM of ${a} and ${b} is <b>${lcm(a,b)}</b>.`])}};

// Geometry
G.g_read=T=>{const x=T.int(0,9),y=T.int(0,9),l=T.pick(["A","B","P","Q"]);
  return {prompt:`What are the coordinates of point ${l}? Type them like (2, 3).`,vis:gridSVG(0,10,{points:[[x,y,l]]}),type:"point",key:[x,y],explain:steps([`Start at (0, 0). Go <b>across</b> to find x: ${x}.`,`Then go <b>up</b> to find y: ${y}.`,`Point ${l} is <b>(${x}, ${y})</b>. Across first, then up.`])}};
G.g_plot=T=>{const x=T.int(1,9),y=T.int(1,9);if(x===y)return G.g_plot(T);
  return {prompt:`Click the grid to plot the point <b>(${x}, ${y})</b>.`,vis:gridSVG(0,10,{click:true}),type:"click",key:[x,y],explain:steps([`x = ${x}: go ${x} across.`,`y = ${y}: go ${y} up.`,`Remember: (x, y) means across first, then up.`])}};
const CLASS_BANK=[["Every square is a rectangle.",true,"A square has 4 right angles, so it is a rectangle with equal sides."],["Every rectangle is a square.",false,"A rectangle doesn't need 4 equal sides."],["Every square is a rhombus.",true,"A rhombus has 4 equal sides. A square does too."],["Every rhombus is a square.",false,"A rhombus doesn't need right angles."],["Every rectangle is a parallelogram.",true,"A rectangle has 2 pairs of parallel sides."],["Every parallelogram is a rectangle.",false,"A parallelogram doesn't need right angles."],["Every rhombus is a parallelogram.",true,"A rhombus has 2 pairs of parallel sides."],["Every quadrilateral is a parallelogram.",false,"A quadrilateral only needs 4 sides. Its sides don't have to be parallel."],["A triangle can have two right angles.",false,"Two right angles already make 180°, the whole total for a triangle."],["An equilateral triangle is also isosceles.",true,"Isosceles means at least 2 equal sides. Equilateral has 3."],["A right triangle can also be isosceles.",true,"Example: legs of 5 cm and 5 cm with a right angle between them."],["A scalene triangle has no equal sides.",true,"That is the definition of scalene."],["An obtuse triangle has one angle greater than 90°.",true,"That is the definition of obtuse."],["A triangle can have two obtuse angles.",false,"Two obtuse angles add up to more than 180°."],["A square is a parallelogram.",true,"A square has 2 pairs of parallel sides."]];
G.g_classify=T=>{if(T.r()<.5){const [s,t,why]=T.pick(CLASS_BANK);return {prompt:`True or false? <b>${s}</b>`,type:"mc",opts:["True","False"],key:t?"0":"1",explain:steps([`<b>${t?"True":"False"}.</b> ${why}`])}}
  const kind=T.pick(["square","rectangle","rhombus","parallelogram"]),names=["square","rectangle","rhombus","parallelogram"],opts=T.shuffle(names);
  const why={square:"4 equal sides (same tick marks) and 4 right angles.",rectangle:"4 right angles, but only opposite sides are equal.",rhombus:"4 equal sides, but no right angles.",parallelogram:"Opposite sides are equal and parallel, with no right angles."};
  return {prompt:`Tick marks show equal sides. Small squares show right angles. What is the <b>most specific</b> name for this shape?`,vis:shapeSVG(kind),type:"mc",opts,key:String(opts.indexOf(kind)),explain:steps([`It has ${why[kind]}`,`Most specific name: <b>${kind}</b>.`])}};
G.g_poly=T=>{const x1=T.int(1,4),y1=T.int(1,4),w=T.int(2,5),h=T.int(2,5),x2=x1+w,y2=y1+h,k=T.int(0,2);
  const poly=[[x1,y1,"A"],[x2,y1,"B"],[x2,y2,"C"],[x1,y2,"D"]];
  if(k===0) return {prompt:`Rectangle ABCD is on the grid. What is the length of side AB?`,vis:gridSVG(0,10,{poly}),type:"num",key:String(w),unit:"units",explain:steps([`A = (${x1}, ${y1}) and B = (${x2}, ${y1}) have the same y.`,`Subtract the x-values: ${x2} − ${x1} = <b>${w}</b> units.`])};
  if(k===1) return {prompt:`What is the area of rectangle ABCD?`,vis:gridSVG(0,10,{poly}),type:"num",key:String(w*h),unit:"square units",explain:steps([`Length AB = ${x2} − ${x1} = ${w}. Height BC = ${y2} − ${y1} = ${h}.`,`Area = ${w} × ${h} = <b>${w*h}</b> square units.`])};
  return {prompt:`Points A, B and C are corners of a rectangle. Where is the fourth corner, D? Type it like (2, 3).`,vis:gridSVG(0,10,{poly:null,points:[[x1,y1,"A"],[x2,y1,"B"],[x2,y2,"C"]]}),type:"point",key:[x1,y2],explain:steps([`D is above A, so it has A's x-value: ${x1}.`,`D is level with C, so it has C's y-value: ${y2}.`,`D = <b>(${x1}, ${y2})</b>.`])}};

// Measurement & data
const ONE={feet:"foot",yards:"yard",pounds:"pound",gallons:"gallon",quarts:"quart",hours:"hour",meters:"meter",kilometers:"kilometer",kilograms:"kilogram",liters:"liter"};
const CONV=[["feet","inches",12],["yards","feet",3],["pounds","ounces",16],["gallons","quarts",4],["quarts","pints",2],["hours","minutes",60],["meters","centimeters",100],["kilometers","meters",1000],["kilograms","grams",1000],["liters","milliliters",1000]];
G.m_conv=T=>{const [big,small,f]=T.pick(CONV),k=T.int(0,2);
  if(k===0){const n=T.int(2,12);return {prompt:`${n} ${big} = ☐ ${small}`,type:"num",key:String(n*f),explain:steps([`1 ${ONE[big]} = ${f} ${small}.`,`Big unit → small unit: multiply. ${n} × ${f} = <b>${(n*f).toLocaleString("en-US")}</b>.`])}}
  if(k===1){const n=T.int(2,9)*f;return {prompt:`${n.toLocaleString("en-US")} ${small} = ☐ ${big}`,type:"num",key:String(n/f),explain:steps([`There are ${f} ${small} in each of the ${big}.`,`Small unit → big unit: divide. ${n.toLocaleString("en-US")} ÷ ${f} = <b>${n/f}</b>.`])}}
  const n=T.int(1,6),r=T.int(1,f-1);return {prompt:`${n} ${big} ${r} ${small} = ☐ ${small}`,type:"num",key:String(n*f+r),explain:steps([`${n} × ${f} = ${n*f} ${small}.`,`Add the extra ${r}: ${n*f} + ${r} = <b>${n*f+r}</b> ${small}.`])}};
G.m_vol=T=>{const l=T.int(2,9),w=T.int(2,6),h=T.int(2,7),u=T.pick(["cm","in","ft","m"]),k=T.int(0,2);
  if(k===0) return {prompt:`What is the volume of this box?`,vis:boxSVG(l,w,h,u),type:"num",key:String(l*w*h),unit:`cubic ${u}`,explain:steps([`Volume = length × width × height.`,`${l} × ${w} × ${h} = <b>${l*w*h}</b> cubic ${u}.`])};
  if(k===1) return {prompt:`A box has a volume of ${l*w*h} cubic ${u}. Its base is ${l} ${u} by ${w} ${u}. How tall is it?`,type:"num",key:String(h),unit:u,explain:steps([`Area of the base: ${l} × ${w} = ${l*w}.`,`Volume ÷ base: ${l*w*h} ÷ ${l*w} = <b>${h}</b> ${u}.`])};
  const l2=T.int(2,6),w2=T.int(2,5),h2=T.int(2,6);return {prompt:`A figure is made of two boxes stuck together. Box 1 is ${l} × ${w} × ${h} ${u}. Box 2 is ${l2} × ${w2} × ${h2} ${u}. What is the total volume?`,type:"num",key:String(l*w*h+l2*w2*h2),unit:`cubic ${u}`,explain:steps([`Box 1: ${l} × ${w} × ${h} = ${l*w*h}.`,`Box 2: ${l2} × ${w2} × ${h2} = ${l2*w2*h2}.`,`Add: ${l*w*h} + ${l2*w2*h2} = <b>${l*w*h+l2*w2*h2}</b> cubic ${u}.`])}};
G.m_lineplot=T=>{const den=T.pick([4,8]),n=T.int(6,9),vals=Array.from({length:n},()=>[T.int(1,den*1.5)]);const ks=vals.map(v=>v[0]),mx=Math.max(...ks),mn=Math.min(...ks);if(mx===mn)return G.m_lineplot(T);
  const what=T.pick(["leaves","pencils","shells"]);
  if(T.r()<.5){const r=F(mx-mn,den);return {prompt:`The line plot shows the lengths of ${n} ${what}, in inches. How much longer is the longest one than the shortest one?`,vis:linePlotSVG(vals,den),type:"num",key:key(r),unit:"inches",explain:steps([`Longest: ${fx(F(mx,den))}. Shortest: ${fx(F(mn,den))}.`,`Subtract: ${fx(F(mx,den))} − ${fx(F(mn,den))} = <b>${fx(r)}</b> inch${r.n===r.d?"":"es"}.`])}}
  const t=Math.floor(den/2),c=ks.filter(k=>k>t).length;return {prompt:`The line plot shows the lengths of ${n} ${what}, in inches. How many are longer than ${fr(1,2)} inch?`,vis:linePlotSVG(vals,den),type:"num",key:String(c),explain:steps([`Find ${fr(1,2)} on the line (${fr(t,den)}).`,`Count the × marks to the right of it: <b>${c}</b>.`])}};

// Grade 6: get ahead
G.g6_ratio=T=>{const a=T.int(2,6),p=T.int(2,9),c=a*p,n=T.int(a+1,12),k=T.int(0,1);const item=T.pick([["notebooks","$"],["bracelets","$"]]);
  if(k===0) return {prompt:`${a} ${item[0]} cost $${c}. At the same price, how much do ${n} ${item[0]} cost?`,type:"num",key:String(p*n),unit:"dollars",explain:steps([`Unit rate: $${c} ÷ ${a} = $${p} for 1.`,`${n} × $${p} = <b>$${p*n}</b>.`])};
  const r1=T.int(1,4),r2=T.int(r1+1,7),m=T.int(2,6);return {prompt:`A drink mix uses ${r1} scoop${r1>1?"s":""} of powder for every ${r2} cups of water. How many cups of water go with ${r1*m} scoops?`,type:"num",key:String(r2*m),unit:"cups",explain:steps([`${r1*m} scoops is ${m} times ${r1}.`,`Multiply the water by ${m} too: ${r2} × ${m} = <b>${r2*m}</b> cups.`])}};
G.g6_int=T=>{const k=T.int(0,2);
  if(k===0){let a=T.int(-12,12),b=T.int(-12,12);if(a===b)b++;const c=a>b?">":"<";return {prompt:`Choose &lt;, &gt; or =: &nbsp; <span class="numtxt">${String(a).replace("-","−")}</span> ☐ <span class="numtxt">${String(b).replace("-","−")}</span>`,type:"sym",key:c,opts:[">","<","="],explain:steps([`On a number line, numbers get bigger to the right.`,`${String(a).replace("-","−")} is to the ${a>b?"right":"left"} of ${String(b).replace("-","−")}, so the answer is <b>${c.replace("<","&lt;").replace(">","&gt;")}</b>.`])}}
  if(k===1){const a=T.int(-15,-1);return {prompt:`What is the absolute value? &nbsp; <span class="numtxt">|${String(a).replace("-","−")}|</span> =`,type:"num",key:String(-a),explain:steps([`Absolute value is the distance from 0. Distance is never negative.`,`${String(a).replace("-","−")} is <b>${-a}</b> units from 0.`])}}
  const a=T.int(-9,-1),b=T.int(1,9);return {prompt:`How far apart are <span class="numtxt">${String(a).replace("-","−")}</span> and <span class="numtxt">${b}</span> on a number line?`,type:"num",key:String(b-a),unit:"units",explain:steps([`From ${String(a).replace("-","−")} to 0 is ${-a} units. From 0 to ${b} is ${b} units.`,`${-a} + ${b} = <b>${b-a}</b> units.`])}};
G.g6_expr=T=>{const k=T.int(0,2);
  if(k===0){const a=T.int(2,9),b=T.int(1,15),x=T.int(2,10);return {prompt:`Evaluate <span class="numtxt">${a}x + ${b}</span> when <span class="numtxt">x = ${x}</span>.`,type:"num",key:String(a*x+b),explain:steps([`${a}x means ${a} × x.`,`${a} × ${x} + ${b} = ${a*x} + ${b} = <b>${a*x+b}</b>.`])}}
  if(k===1){const b=T.int(2,6),e=T.int(2,b<4?4:3);return {prompt:`Evaluate: &nbsp; <span class="numtxt">${b}<sup>${e}</sup></span> =`,type:"num",key:String(b**e),explain:steps([`${b}<sup>${e}</sup> means ${b} multiplied by itself ${e} times.`,`${Array(e).fill(b).join(" × ")} = <b>${b**e}</b>.`])}}
  const a=T.int(2,9),x=T.int(2,12),b=T.int(1,20);return {prompt:`Solve for <span class="numtxt">x</span>: &nbsp; <span class="numtxt">${a}x + ${b} = ${a*x+b}</span>`,type:"num",key:String(x),explain:steps([`Undo the + ${b}: ${a*x+b} − ${b} = ${a*x}.`,`Undo the × ${a}: ${a*x} ÷ ${a} = <b>${x}</b>.`])}};
G.g6_pct=T=>{const p=T.pick([10,20,25,50,75,5,40]),n=T.pick([20,40,60,80,100,120,200,360]);const r=p*n/100;if(r%1)return G.g6_pct(T);
  return {prompt:`What is ${p}% of ${n}?`,type:"num",key:String(r),explain:steps([`${p}% means ${p} out of 100, or ${fx(F(p,100),"frac")}.`,`${fx(F(p,100),"frac")} × ${n} = <b>${r}</b>.`])}};
G.g6_area=T=>{const b=T.int(3,14),h=T.int(2,12),k=T.int(0,1);
  if(k===0){if((b*h)%2)return G.g6_area(T);return {prompt:`A triangle has a base of ${b} cm and a height of ${h} cm. What is its area?`,type:"num",key:String(b*h/2),unit:"square cm",explain:steps([`Area of a triangle = ${fr(1,2)} × base × height.`,`${fr(1,2)} × ${b} × ${h} = <b>${b*h/2}</b> square cm.`])}}
  return {prompt:`A parallelogram has a base of ${b} m and a height of ${h} m. What is its area?`,type:"num",key:String(b*h),unit:"square m",explain:steps([`Area of a parallelogram = base × height.`,`${b} × ${h} = <b>${b*h}</b> square m.`])}};

// ---- polynomials: Map monomialKey -> {n,d}; monomialKey like "x2y1", "" for constants
const monKey=o=>Object.keys(o).filter(v=>o[v]>0).sort().map(v=>v+o[v]).join("");
const monObj=k=>{const o={};(k.match(/[a-z]\d+/g)||[]).forEach(t=>o[t[0]]=+t.slice(1));return o};
const pz=()=>new Map();
const pc=(n,d=1)=>{const m=pz();if(n!==0)m.set("",F(n,d));return m};
const pv=(v,c=1,e=1)=>{const m=pz();m.set(v+e,F(c));return m};
function padd(a,b,sign=1){const m=new Map(a);for(const [k,c] of b){const s=sign<0?F(-c.n,c.d):c;const o=m.get(k);const r=o?fAdd(o,s):s;if(r.n===0)m.delete(k);else m.set(k,r)}return m}
const psub=(a,b)=>padd(a,b,-1);

function ppow(a,n){let r=pc(1);for(let i=0;i<n;i++)r=pmul(r,a);return r}
function pdivMono(a,b){ // divide by a single-term polynomial; null if not exact
  if(b.size!==1)return null;const [[kb,cb]]=[...b];const ob=monObj(kb);const m=pz();
  for(const [k,c] of a){const o=monObj(k);for(const v in ob){o[v]=(o[v]||0)-ob[v];if(o[v]<0)return null}m.set(monKey(o),fDiv(c,cb))}return m}
const peq=(a,b)=>{if(a.size!==b.size)return false;for(const [k,c] of a){const o=b.get(k);if(!o||o.n!==c.n||o.d!==c.d)return false}return true};
const deg=k=>Object.values(monObj(k)).reduce((s,e)=>s+e,0);
const order=p=>[...p.entries()].sort((x,y)=>deg(y[0])-deg(x[0])||(x[0]<y[0]?-1:1));
function pstr(p){ // compact text, e.g. "3x^2 - 2xy + 5"
  if(!p.size)return"0";let s="";order(p).forEach(([k,c],i)=>{const neg=c.n<0,a=Math.abs(c.n),o=monObj(k);
    const vars=Object.keys(o).sort().map(v=>v+(o[v]>1?"^"+o[v]:"")).join("");
    let co=c.d===1?(a===1&&vars?"":String(a)):`${a}/${c.d}`;if(c.d!==1&&vars)co=`(${a}/${c.d})`;
    s+=(i===0?(neg?"-":""):(neg?" - ":" + "))+co+vars});return s}
// render compact algebra text to HTML: italic variables, superscripts, real minus signs
function E(s){let o="";for(let i=0;i<s.length;i++){const c=s[i];
  if(c==="^"){let j=i+1,d="";while(j<s.length&&/[0-9]/.test(s[j]))d+=s[j++];o+=`<sup>${d}</sup>`;i=j-1}

  return `<span class="alg">${o}</span>`}
const PH=p=>E(pstr(p));

// ---- expression parser (for typed answers and for building questions)
function tokenize(s){
  s=String(s).replace(/[−–]/g,"-").replace(/[×·]/g,"*").replace(/÷/g,"/").replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4").replace(/⁵/g,"^5").replace(/\s+/g,"");
  const t=[];let i=0;while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;t.push({t:"n",v:s.slice(i,j)});i=j}
    else if(/[a-zA-Z]/.test(c)){t.push({t:"v",v:c.toLowerCase()});i++}
    else if("+-*/^()".includes(c)){t.push({t:c});i++}else return null}
  const out=[];t.forEach((k,i)=>{const p=out[out.length-1];if(p&&(p.t==="n"||p.t==="v"||p.t===")")&&(k.t==="v"||k.t==="("||(k.t==="n"&&p.t!=="n")))out.push({t:"*",imp:true});out.push(k)});
  return out}
function parseExpr(str){
  const tk=tokenize(str);if(!tk||!tk.length)return null;let i=0;const peek=()=>tk[i],eat=t=>{if(tk[i]&&tk[i].t===t){i++;return true}return false};
  function expr(){let terms=[];let sign=1;if(eat("-"))sign=-1;else eat("+");let n=term();if(!n)throw 0;terms.push({sign,n});
    while(peek()&&(peek().t==="+"||peek().t==="-")){const s=peek().t==="-"?-1:1;i++;const m=term();if(!m)throw 0;terms.push({sign:s,n:m})}return{t:"sum",terms}}
  function term(){let f=[factor()];while(peek()&&(peek().t==="*"||peek().t==="/")){const op=peek().t;i++;if(op==="/")f.push({t:"div",a:factor()});else f.push(factor())}return{t:"prod",f}}
  function factor(){let b=base();if(eat("^")){const n=tk[i];if(!n||n.t!=="n"||n.v.includes("."))throw 0;i++;b={t:"pow",a:b,n:+n.v}}return b}
  function base(){const k=tk[i];if(!k)throw 0;
    if(k.t==="n"){i++;const p=parseNum(k.v);if(!p)throw 0;return{t:"num",v:F(p.n,p.d)}}
    if(k.t==="v"){i++;return{t:"var",v:k.v}}
    if(k.t==="("){i++;const e=expr();if(!eat(")"))throw 0;return{t:"par",a:e}}
    if(k.t==="-"){i++;return{t:"neg",a:factor()}}throw 0}
  try{const e=expr();if(i!==tk.length)return null;return e}catch(_){return null}
}
function evalP(n){switch(n.t){
  case "num":return n.v.n===0?pz():pc(n.v.n,n.v.d);case "var":return pv(n.v);case "par":return evalP(n.a);case "neg":return psub(pz(),evalP(n.a));
  case "pow":return ppow(evalP(n.a),n.n);
  case "sum":return n.terms.reduce((s,x)=>padd(s,evalP(x.n),x.sign),pz());
  case "prod":{let r=pc(1);for(const f of n.f){if(f.t==="div"){const d=evalP(f.a);const q=pdivMono(r,d);if(!q)throw 0;r=q}else r=pmul(r,evalP(f))}return r}}}
const hasParen=n=>!!n&&(n.t==="par"||(n.terms&&n.terms.some(x=>hasParen(x.n)))||(n.f&&n.f.some(hasParen))||(n.a&&hasParen(n.a)));
function polyOf(str){const n=parseExpr(str);if(!n)return null;try{return{node:n,p:evalP(n)}}catch(_){return null}}

// ---- judges for algebra answer types
function judgePoly(v,q){
  const r=polyOf(v);if(!r)return["no","I can't read that. Type it like 3x^2 - 2x + 5 (use ^ for powers)."];
  if(!peq(r.p,q.kp))return["no",/[a-z]\d/i.test(v)?"Use ^ for powers: type x^2, not x2.":null];
  if(hasParen(r.node))return["almost","Right value. Now multiply it out so there are no parentheses."];
  const keys=r.node.terms.map(t=>{try{const p=evalP(t.n);return p.size===1?[...p.keys()][0]:"*"}catch(_){return"*"}});
  if(keys.includes("*")||new Set(keys).size!==keys.length)return["almost","Right value. Combine the like terms."];
  return["ok",null];
}
function factorable2(p){ // single-variable quadratic with integer roots, or ax^2 - c with perfect squares
  const vars=new Set([...p.keys()].flatMap(k=>Object.keys(monObj(k))));if(vars.size!==1)return false;const v=[...vars][0];
  const c2=p.get(v+2),c1=p.get(v+1),c0=p.get("");if(!c2||[...p.keys()].some(k=>deg(k)>2))return false;
  const a=c2.n,b=c1?c1.n:0,c=c0?c0.n:0;if(c2.d!==1||(c1&&c1.d!==1)||(c0&&c0.d!==1))return false;const D=b*b-4*a*c;if(D<0)return false;const s=Math.round(Math.sqrt(D));return s*s===D}
function judgeFactor(v,q){
  const r=polyOf(v);if(!r)return["no","I can't read that. Type it like 3x(2x + 5) or (x + 2)(x - 3)."];
  if(!peq(r.p,q.kp))return["no",/[a-z]\d/i.test(v)?"Use ^ for powers: type x^2, not x2.":null];
  if(r.node.terms.length!==1)return["almost","That's equal, but it isn't factored. Write it as a product, like (x + 2)(x + 3)."];
  const fs=r.node.terms[0].n.f.map(f=>{try{return evalP(f.t==="pow"?f.a:f)}catch(_){return null}});
  for(const p of fs){if(!p||p.size<2)continue;const cs=[...p.values()];const g=cs.reduce((s,c)=>gcd(s,c.n),0);if(g>1&&cs.every(c=>c.d===1))return["almost","Almost. One factor still has a common number you can take out."];
    const ks=[...p.keys()].map(monObj);const common=Object.keys(ks[0]).filter(x=>ks.every(o=>o[x]>0));if(common.length)return["almost","Almost. One factor still has a common variable you can take out."];
    if(factorable2(p))return["almost","Almost. One factor can be factored more."]}

}
function parseIneq(s){s=String(s).replace(/[−–]/g,"-").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/\s+/g,"");
  let m=s.match(/^([a-z])(<=|>=|<|>)(.+)$/i);if(m){const n=parseNum(m[3]);return n?{op:m[2],v:F(n.n,n.d)}:null}

  if(u.op!==q.key.op)return["no",u.op[0]===q.key.op[0]?"The number is right. Check if the endpoint is included (< versus ≤).":"The number is right, but the sign points the wrong way. Did you divide by a negative?"];return["ok",null]}

const _judgeQ1=judgeQ;

G.alg_eval=T=>{const a=nz(T,-5,5),b=nz(T,-5,5),k=T.int(0,2);let ex,val,st;

  return {prompt:`Simplify: &nbsp; ${E(q).replace("/"," ÷ ")}`,type:"poly",kp,key:pstr(kp),v:{k:"expand",e:q},explain:steps([...st,`Answer: <b>${PH(kp)}</b>.`])}};
G.alg_monomul=T=>{const m=pv("x",nz(T,-6,6),T.int(1,2)),P=randPoly(T,["x"],T.int(2,3),2);const kp=pmul(m,P);if(!kp.size)return G.alg_monomul(T);
  return {prompt:`Multiply: &nbsp; ${E(pstr(m))}(${E(pstr(P))})`,type:"poly",kp,key:pstr(kp),v:{k:"expand",e:`(${pstr(m)})*(${pstr(P)})`},explain:steps([`Multiply ${E(pstr(m))} by <b>each</b> term inside the parentheses (distributive property).`,`Multiply the numbers and add the exponents of x for each term.`,`Answer: <b>${PH(kp)}</b>.`])}};
G.alg_binmul=T=>{const a=T.pick([1,1,1,2,3]),b=nz(T,-9,9),c=T.pick([1,1,2]),d=nz(T,-9,9);const A=padd(pv("x",a),pc(b)),B=padd(pv("x",c),pc(d)),kp=pmul(A,B);
  return {prompt:`Multiply: &nbsp; (${E(pstr(A))})(${E(pstr(B))})`,type:"poly",kp,key:pstr(kp),v:{k:"expand",e:`(${pstr(A)})*(${pstr(B)})`},explain:steps([`Multiply each term of the first by each term of the second (First, Outer, Inner, Last).`,`${E(pstr(pmul(pv("x",a),pv("x",c))))} + ${E(pstr(pmul(pv("x",a),pc(d))))} + ${E(pstr(pmul(pc(b),pv("x",c))))} + ${E(String(b*d))}`.replace(/\+ <span class="alg">−/g,'− <span class="alg">'),`Combine like terms: <b>${PH(kp)}</b>.`])}};
G.alg_special=T=>{const a=T.int(1,9),c=T.pick([1,1,2,3]),k=T.int(0,2),X=pv("x",c),A=pc(a);let q,kp,st;
  if(k===0){q=`(${pstr(X)} + ${a})^2`;kp=ppow(padd(X,A),2);st=[`Square of a sum: (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>.`,`a = ${E(pstr(X))}, b = ${a}: ${E(pstr(pmul(X,X)))} + ${E(pstr(pmul(pc(2*a),X)))} + ${a*a}.`]}
  else if(k===1){q=`(${pstr(X)} - ${a})^2`;kp=ppow(psub(X,A),2);st=[`Square of a difference: (a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup>.`,`a = ${E(pstr(X))}, b = ${a}: ${E(pstr(pmul(X,X)))} − ${E(pstr(pmul(pc(2*a),X)))} + ${a*a}.`]}
  else{q=`(${pstr(X)} + ${a})(${pstr(X)} - ${a})`;kp=pmul(padd(X,A),psub(X,A));st=[`Sum times difference: (a + b)(a − b) = a<sup>2</sup> − b<sup>2</sup>. The middle terms cancel.`,`${E(pstr(pmul(X,X)))} − ${a*a}.`]}
  return {prompt:`Multiply using a special product: &nbsp; ${E(q)}`,type:"poly",kp,key:pstr(kp),v:{k:"expand",e:q},explain:steps([...st,`Answer: <b>${PH(kp)}</b>.`])}};
G.alg_div=T=>{const m=pv("x",T.pick([2,3,4,5,6]),T.int(1,2)),Q=randPoly(T,["x"],T.int(2,3),3);if([...Q.keys()].length<2)return G.alg_div(T);const P=pmul(m,Q);
  return {prompt:`Divide: &nbsp; (${E(pstr(P))}) ÷ ${E(pstr(m))}`,type:"poly",kp:Q,key:pstr(Q),v:{k:"expand",e:`(${pstr(P)})/(${pstr(m)})`},explain:steps([`Divide <b>each</b> term by ${E(pstr(m))}.`,`Divide the numbers and subtract the exponents of x.`,`Answer: <b>${PH(Q)}</b>.`])}};

// ---- equations (ecuaciones de primer grado)
const eqv=(l,r)=>`${l} = ${r}`;
G.eq_1step=T=>{const x=T.int(-12,15),k=T.int(0,3);let q,st;
  if(k===0){const a=nz(T,-15,15);q=eqv(lin(1,a),x+a);st=[`Undo ${a>0?"+ "+a:"− "+(-a)}: ${a>0?"subtract":"add"} ${Math.abs(a)} on both sides.`]}
  else if(k===1){const a=nz(T,2,12)*(T.r()<.3?-1:1);q=eqv(pstr(pv("x",a)),a*x);st=[`Undo × ${sn(a)}: divide both sides by ${sn(a)}.`]}
  else if(k===2){const a=T.int(2,9);q=`x/${a} = ${sn(x)}`;st=[`Undo ÷ ${a}: multiply both sides by ${a}.`];return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x*a),v:{k:"solve",e:`x/${a}=${x}`},explain:steps([...st,`<i>x</i> = ${sn(x)} × ${a} = <b>${sn(x*a)}</b>.`])}}
  else{const a=T.int(1,20);q=eqv(`${a} - x`,a-x);st=[`Subtract ${a} from both sides: −x = ${sn(-x)}.`,`Multiply both sides by −1.`]}
  return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:q.replace(/ = /,"=").replace(/(\d)x/g,"$1*x")},explain:steps([...st,`<i>x</i> = <b>${sn(x)}</b>. Check by putting it back in.`])}};
G.eq_2step=T=>{const x=T.int(-10,12),a=nz(T,-9,9),b=nz(T,-20,20);if(Math.abs(a)===1)return G.eq_2step(T);const q=eqv(lin(a,b),a*x+b);
  return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`${a}*x+(${b})=${a*x+b}`},explain:steps([`Undo the ${b>0?"+ "+b:"− "+(-b)} first: ${a*x+b} ${b>0?"−":"+"} ${Math.abs(b)} = ${a*x}. Now ${E(pstr(pv("x",a)))} = ${sn(a*x)}.`,`Divide both sides by ${sn(a)}: <i>x</i> = <b>${sn(x)}</b>.`,`Check: ${sn(a)}·${sg(x)} ${b>0?"+":"−"} ${Math.abs(b)} = ${sn(a*x+b)}. ✓`])}};
G.eq_both=T=>{const x=T.int(-9,10);if(T.r()<.5){const a=nz(T,-9,9),c=nz(T,-9,9);if(a===c)return G.eq_both(T);const b=T.int(-15,15),d=(a-c)*x+b;const q=eqv(lin(a,b),lin(c,d));
    return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`${a}*x+(${b})=${c}*x+(${d})`},explain:steps([`Move the x-terms to one side: subtract ${E(pstr(pv("x",c)))} from both sides → ${E(lin(a-c,b))} = ${sn(d)}.`,`Move the numbers: ${E(pstr(pv("x",a-c)))} = ${sn(d-b)}.`,`Divide: <i>x</i> = <b>${sn(x)}</b>.`])}}
  const a=T.int(2,7),b=nz(T,-8,8),c=T.int(-10,10),r=a*(x+b)+c;const q=`${a}(x ${b<0?"-":"+"} ${Math.abs(b)}) ${c<0?"-":"+"} ${Math.abs(c)} = ${sn(r)}`;
  return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`${a}*(x+(${b}))+(${c})=${r}`},explain:steps([`Distribute: ${E(lin(a,a*b))} ${c<0?"−":"+"} ${Math.abs(c)} = ${sn(r)}, so ${E(lin(a,a*b+c))} = ${sn(r)}.`,`Subtract ${sg(a*b+c)}: ${E(pstr(pv("x",a)))} = ${sn(r-a*b-c)}.`,`Divide by ${a}: <i>x</i> = <b>${sn(x)}</b>.`])}};
G.eq_frac=T=>{const k=T.int(0,2);
  if(k===0){const a=T.int(2,8),y=T.int(-6,9),b=T.int(-9,9),x=a*y;const q=`x/${a} ${b<0?"-":"+"} ${Math.abs(b)} = ${sn(y+b)}`;return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`x/${a}+(${b})=${y+b}`},explain:steps([`Undo the ${b<0?"− "+(-b):"+ "+b}: x/${a} = ${sn(y)}.`,`Multiply both sides by ${a}: <i>x</i> = <b>${sn(x)}</b>.`])}}
  if(k===1){const b=T.int(2,6),c=T.int(-5,8),a=T.int(-9,9),x=b*c-a;const q=`(x ${a<0?"-":"+"} ${Math.abs(a)})/${b} = ${sn(c)}`;return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`(x+(${a}))/${b}=${c}`},explain:steps([`Multiply both sides by ${b}: ${E(lin(1,a))} = ${sn(b*c)}.`,`${a<0?"Add":"Subtract"} ${Math.abs(a)}: <i>x</i> = <b>${sn(x)}</b>.`])}}
  const a=T.pick([0.5,1.5,2.5,0.2,0.4,1.2]),x=T.int(-4,10)*(a===0.2||a===0.4?5:2),b=T.int(-30,30)/10,r=Math.round((a*x+b)*100)/100;const q=`${a}x ${b<0?"-":"+"} ${Math.abs(b)} = ${sn(r)}`;
  return {prompt:`Solve: &nbsp; ${E(q)}`,type:"num",key:ival(x),v:{k:"solve",e:`${a}*x+(${b})=${r}`},explain:steps([`Undo the ${b<0?"− "+(-b):"+ "+b}: ${E(a+"x")} = ${sn(Math.round((r-b)*100)/100)}.`,`Divide by ${a}: <i>x</i> = <b>${sn(x)}</b>.`])}};
G.eq_word=T=>{const k=T.int(0,4);
  if(k===0){const n=T.int(5,60),c=T.pick([2,3]),s=c===2?2*n+1:3*n+3;return {prompt:`The sum of ${c} consecutive whole numbers is ${s}. What is the smallest number?`,type:"num",key:ival(n),v:{k:"solve",e:c===2?`x+(x+1)=${s}`:`x+(x+1)+(x+2)=${s}`},explain:steps([`Let the smallest be <i>n</i>. The numbers are ${c===2?"<i>n</i> and <i>n</i> + 1":"<i>n</i>, <i>n</i> + 1 and <i>n</i> + 2"}.`,`Equation: ${c===2?"2<i>n</i> + 1":"3<i>n</i> + 3"} = ${s}.`,`Solve: <i>n</i> = <b>${n}</b>.`])}}
  if(k===1){const kid=T.int(6,14),diff=T.int(20,35),yrs=T.int(3,10),parent=kid+diff;return {prompt:`Ana's mother is ${diff} years older than Ana. In ${yrs} years, the sum of their ages will be ${kid+parent+2*yrs}. How old is Ana now?`,type:"num",key:ival(kid),unit:"years",v:{k:"solve",e:`(x+${yrs})+(x+${diff}+${yrs})=${kid+parent+2*yrs}`},explain:steps([`Let Ana's age be <i>a</i>. Her mother is <i>a</i> + ${diff}.`,`In ${yrs} years: (<i>a</i> + ${yrs}) + (<i>a</i> + ${diff} + ${yrs}) = ${kid+parent+2*yrs}, so 2<i>a</i> + ${diff+2*yrs} = ${kid+parent+2*yrs}.`,`2<i>a</i> = ${2*kid}, so <i>a</i> = <b>${kid}</b>.`])}}
  if(k===2){const w=T.int(3,20),d=T.int(2,10),P=2*(w+w+d);return {prompt:`A rectangle is ${d} cm longer than it is wide. Its perimeter is ${P} cm. What is its width?`,type:"num",key:ival(w),unit:"cm",v:{k:"solve",e:`2*(x+x+${d})=${P}`},explain:steps([`Let the width be <i>w</i>. The length is <i>w</i> + ${d}.`,`Perimeter: 2(<i>w</i> + <i>w</i> + ${d}) = ${P}, so 4<i>w</i> + ${2*d} = ${P}.`,`4<i>w</i> = ${P-2*d}, so <i>w</i> = <b>${w}</b> cm.`])}}
  if(k===3){const a=T.int(10,60),b=T.int(3,a-1);return {prompt:`Two numbers add up to ${a+b}. One number is ${a-b} more than the other. What is the larger number?`,type:"num",key:ival(a),v:{k:"solve",e:`x+(x-${a-b})=${a+b}`},explain:steps([`Let the larger be <i>x</i>. The smaller is <i>x</i> − ${a-b}.`,`<i>x</i> + (<i>x</i> − ${a-b}) = ${a+b}, so 2<i>x</i> = ${2*a}.`,`<i>x</i> = <b>${a}</b>.`])}}
  const p=T.pick([2,3,4,5]),q=T.int(1,6),n=T.int(3,12),fee=T.int(5,25);return {prompt:`A gym charges a $${fee} sign-up fee plus $${p} per visit. Leo paid $${fee+p*n} in total. How many times did he visit?`,type:"num",key:ival(n),unit:"visits",v:{k:"solve",e:`${fee}+${p}*x=${fee+p*n}`},explain:steps([`Let <i>v</i> be the visits: ${fee} + ${p}<i>v</i> = ${fee+p*n}.`,`${p}<i>v</i> = ${p*n}, so <i>v</i> = <b>${n}</b>.`])}};
G.ineq=T=>{const a=nz(T,-6,6),b=T.int(-12,12),x=T.int(-8,10),op=T.pick(["<",">","<=",">="]),c=a*x+b;const flip={"<":">",">":"<","<=":">=",">=":"<="};const fop=a<0?flip[op]:op;
  const sym=o=>o.replace("<=","≤").replace(">=","≥");
  return {prompt:`Solve the inequality: &nbsp; ${E(lin(a,b))} ${sym(op).replace("<","&lt;").replace(">","&gt;")} ${sn(c)}<br><span class="small muted">Type it like x &gt; 3 or x &lt;= -2.</span>`,type:"ineq",key:{op:fop,v:F(x)},v:{k:"ineq",e:`${a}*x+(${b})${op}${c}`},explain:steps([`Solve it like an equation: ${E(pstr(pv("x",a)))} ${sym(op).replace("<","&lt;").replace(">","&gt;")} ${sn(c-b)}.`,`Divide by ${sn(a)}.${a<0?" <b>Dividing by a negative flips the sign.</b>":""}`,`Answer: <b>${E("x")} ${sym(fop).replace("<","&lt;").replace(">","&gt;")} ${sn(x)}</b>.`])}};

// ---- factoring (factorización)
G.fac_common=T=>{const g=T.pick([1,2,3,4,5,6]),e=T.int(0,2);if(g===1&&e===0)return G.fac_common(T);
  const c2=T.r()<.6?nz(T,-6,6):0,c1=nz(T,-7,7),c0=nz(T,-9,9);const inner=padd(padd(c2?pv("x",c2,2):pz(),pv("x",c1)),pc(c0));
  if([c2,c1,c0].reduce((s,c)=>gcd(s,c),0)!==1||(c2&&factorable2(inner)))return G.fac_common(T);
  const m=e>0?pv("x",g,e):pc(g);const P=pmul(m,inner);
  return {prompt:`Factor completely: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`${pstr(m)}(${pstr(inner)})`,v:{k:"factor",e:pstr(P)},explain:steps([`Find the greatest common factor of all the terms: the biggest number that divides every coefficient${e?", times the lowest power of x in every term":""}. It is <b>${PH(m)}</b>.`,`Divide each term by ${PH(m)} to get what goes inside the parentheses.`,`Answer: <b>${E(pstr(m)+"("+pstr(inner)+")")}</b>.`])}};
G.fac_diffsq=T=>{const a=T.int(1,10),c=T.pick([1,1,1,2,3]);if(gcd(a,c)>1)return G.fac_diffsq(T);const X=pv("x",c),P=psub(pmul(X,X),pc(a*a));
  return {prompt:`Factor: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`(${pstr(X)} + ${a})(${pstr(X)} - ${a})`,v:{k:"factor",e:pstr(P)},explain:steps([`This is a difference of squares: a<sup>2</sup> − b<sup>2</sup> = (a + b)(a − b).`,`${PH(pmul(X,X))} = (${PH(X)})<sup>2</sup> and ${a*a} = ${a}<sup>2</sup>.`,`Answer: <b>${E("("+pstr(X)+" + "+a+")("+pstr(X)+" - "+a+")")}</b>.`])}};
G.fac_trin=T=>{const p=nz(T,-9,9),q=nz(T,-9,9);const P=pmul(padd(pv("x"),pc(p)),padd(pv("x"),pc(q)));if(!P.get("x1"))return G.fac_trin(T);
  const b=p+q,c=p*q;const f=n=>n<0?` - ${-n}`:` + ${n}`;
  return {prompt:`Factor: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`(x${f(p)})(x${f(q)})`,v:{k:"factor",e:pstr(P)},explain:steps([`Find two numbers that <b>multiply</b> to ${sn(c)} and <b>add</b> to ${sn(b)}.`,`They are ${sn(p)} and ${sn(q)}: ${sg(p)} × ${sg(q)} = ${sn(c)} and ${sg(p)} + ${sg(q)} = ${sn(b)}.`,`Answer: <b>${E("(x"+f(p)+")(x"+f(q)+")")}</b>.`])}};
G.fac_perfect=T=>{const a=T.int(1,10),neg=T.r()<.5;const B=neg?psub(pv("x"),pc(a)):padd(pv("x"),pc(a)),P=pmul(B,B);
  return {prompt:`Factor: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`(${pstr(B)})^2`,v:{k:"factor",e:pstr(P)},explain:steps([`First and last terms are squares: x<sup>2</sup> and ${a*a} = ${a}<sup>2</sup>. The middle term is 2 · x · ${a} = ${2*a}x.`,`It is a perfect square trinomial: a<sup>2</sup> ${neg?"−":"+"} 2ab + b<sup>2</sup> = (a ${neg?"−":"+"} b)<sup>2</sup>.`,`Answer: <b>${E("("+pstr(B)+")^2")}</b>.`])}};

// ---- linear functions and systems
G.lin_slope=T=>{const x1=T.int(-6,6),x2=T.int(-6,6),y1=T.int(-8,8),y2=T.int(-8,8);if(x1===x2)return G.lin_slope(T);const m=F(y2-y1,x2-x1);
  return {prompt:`Find the slope of the line through (${sn(x1)}, ${sn(y1)}) and (${sn(x2)}, ${sn(y2)}).`,type:"num",anyform:true,key:key(m,"frac"),v:{k:"num",e:`(${y2}-(${y1}))/(${x2}-(${x1}))`},explain:steps([`Slope = (change in y) ÷ (change in x) = (y<sub>2</sub> − y<sub>1</sub>) ÷ (x<sub>2</sub> − x<sub>1</sub>).`,`(${sn(y2)} − ${sg(y1)}) ÷ (${sn(x2)} − ${sg(x1)}) = ${sn(y2-y1)} ÷ ${sn(x2-x1)}.`,`Simplify: <b>${fx(m,"frac")}</b>.`])}};
G.lin_eval=T=>{const m=nz(T,-5,5),b=T.int(-10,10),x=T.int(-6,8);if(T.r()<.5)return {prompt:`For the line ${E("y = "+lin(m,b))}, what is <i>y</i> when <i>x</i> = ${sn(x)}?`,type:"num",key:ival(m*x+b),v:{k:"num",e:`${m}*(${x})+(${b})`},explain:steps([`Replace x: y = ${sn(m)}·${sg(x)} ${b<0?"−":"+"} ${Math.abs(b)}.`,`y = <b>${sn(m*x+b)}</b>.`])};
  return {prompt:`For the line ${E("y = "+lin(m,b))}, what is <i>x</i> when <i>y</i> = ${sn(m*x+b)}?`,type:"num",key:ival(x),v:{k:"solve",e:`${m}*x+(${b})=${m*x+b}`},explain:steps([`Set up the equation: ${sn(m*x+b)} = ${E(lin(m,b))}.`,`Solve: <i>x</i> = <b>${sn(x)}</b>.`])}};
G.sys_solve=T=>{const x=T.int(-6,8),y=T.int(-6,8);let a1,b1,a2,b2;const sub=T.r()<.5;do{a1=sub?1:nz(T,-5,5);b1=sub?nz(T,-3,3):nz(T,-5,5);a2=nz(T,-5,5);b2=nz(T,-5,5)}while(a1*b2-a2*b1===0);
  const c1=a1*x+b1*y,c2=a2*x+b2*y,eq=(a,b,c)=>E(pstr(padd(pv("x",a),pv("y",b)))+" = "+sn(c).replace("−","-"));
  return {prompt:`Solve the system. Type the answer as (x, y).<br>${eq(a1,b1,c1)}<br>${eq(a2,b2,c2)}`,type:"point",key:[x,y],v:{k:"sys",e:[`${a1}*x+(${b1})*y=${c1}`,`${a2}*x+(${b2})*y=${c2}`]},explain:steps([a1===1?`Substitution: from the first equation, x = ${sn(c1)} − ${sg(b1)}y. Put it into the second.`:`Elimination: multiply the equations so the x-terms (or y-terms) cancel, then add them.`,`Solve for one variable, then put it back in to find the other.`,`Answer: <b>(${sn(x)}, ${sn(y)})</b>. Check it in both equations.`])}};

// ---- later algebra
G.frac_simplify=T=>{const p=nz(T,-9,9),q=nz(T,-9,9);if(p===q)return G.frac_simplify(T);const A=padd(pv("x"),pc(p)),B=padd(pv("x"),pc(q)),N=pmul(A,B);
  return {prompt:`Simplify (assume the bottom isn't 0): &nbsp; <span class="fr"><span class="nu">${PH(N)}</span><span class="de">${PH(A)}</span></span>`,type:"poly",kp:B,key:pstr(B),v:{k:"cancel",e:`(${pstr(N)})/(${pstr(A)})`},explain:steps([`Factor the top: ${PH(N)} = (${PH(A)})(${PH(B)}).`,`Cancel the common factor (${PH(A)}).`,`Answer: <b>${PH(B)}</b>.`])}};
G.quad_solve=T=>{const r1=T.int(-9,9),r2=T.int(-9,9);if(r1===r2)return G.quad_solve(T);const P=pmul(psub(pv("x"),pc(r1)),psub(pv("x"),pc(r2)));
  return {prompt:`Solve by factoring: &nbsp; ${PH(P)} = 0<br><span class="small muted">Type both answers, like x = 2, x = −5.</span>`,type:"roots",key:[r1,r2],v:{k:"roots",e:pstr(P)},explain:steps([`Factor: ${PH(P)} = (${PH(psub(pv("x"),pc(r1)))})(${PH(psub(pv("x"),pc(r2)))}).`,`If a product is 0, one of the factors is 0.`,`So <i>x</i> = <b>${sn(r1)}</b> or <i>x</i> = <b>${sn(r2)}</b>.`])}};
G.sci_not=T=>{const m=T.int(11,99)/10,e=T.int(-5,7);if(e===0)return G.sci_not(T);const val=+(m*10**e).toPrecision(6);const vs=e<0?val.toFixed(-e+1):String(Math.round(val));
  if(T.r()<.5)return {prompt:`Write in standard form: &nbsp; <span class="numtxt">${m} × 10<sup>${sn(e)}</sup></span>`,type:"num",key:vs,v:{k:"num",e:`${m}*10**(${e})`},explain:steps([`${e>0?"Positive":"Negative"} exponent: move the decimal point ${Math.abs(e)} place${Math.abs(e)>1?"s":""} to the ${e>0?"right":"left"}.`,`Answer: <b>${Number(vs).toLocaleString("en-US",{maximumFractionDigits:10})}</b>.`])};
  return {prompt:`Write <span class="numtxt">${Number(vs).toLocaleString("en-US",{maximumFractionDigits:10})}</span> in scientific notation. What is the exponent of 10?`,type:"num",key:ival(e),v:{k:"num",e:String(e)},explain:steps([`Move the decimal point until one non-zero digit is in front: ${m}.`,`You moved it ${Math.abs(e)} place${Math.abs(e)>1?"s":""} ${e>0?"left, so the exponent is positive":"right, so the exponent is negative"}: ${m} × 10<sup>${sn(e)}</sup>.`,`Exponent: <b>${sn(e)}</b>.`])}};
G.exp_neg=T=>{const b=T.int(2,5),e=T.int(-3,3);const r=e>=0?F(b**e):F(1,b**(-e));
  return {prompt:`Evaluate: &nbsp; <span class="numtxt">${b}<sup>${sn(e)}</sup></span> =`,type:"num",anyform:true,key:key(r,"frac"),v:{k:"num",e:`${b}**(${e})`},explain:steps([e===0?`Any non-zero number to the power 0 is 1.`:e<0?`A negative exponent means "one over": ${b}<sup>${sn(e)}</sup> = ${fr(1,`${b}<sup>${-e}</sup>`)}.`:`${b}<sup>${e}</sup> = ${Array(e).fill(b).join(" × ")}.`,`Answer: <b>${fx(r,"frac")}</b>.`])}};

G.f_impmix=T=>{const d=T.pick([2,3,4,5,6,8,10,12]),w=T.int(1,9),a=T.int(1,d-1);if(gcd(a,d)>1)return G.f_impmix(T);const n=w*d+a;
  if(T.r()<.5)return {prompt:`Write as a mixed number: &nbsp; ${fr(n,d)} =`,type:"num",key:`${w} ${a}/${d}`,v:{k:"num",e:`${n}/${d}`},explain:steps([`Divide: ${n} ÷ ${d} = ${w} remainder ${a}.`,`The quotient is the whole number, the remainder goes on top: <b>${mixHTML(w,a,d)}</b>.`])};
  return {prompt:`Write as an improper fraction: &nbsp; ${mixHTML(w,a,d)} =`,type:"num",key:`${n}/${d}`,v:{k:"num",e:`${w}+${a}/${d}`},explain:steps([`Multiply the whole number by the bottom: ${w} × ${d} = ${w*d}.`,`Add the top: ${w*d} + ${a} = ${n}. Keep the bottom: <b>${fr(n,d)}</b>.`])}};
G.stats=T=>{const n=T.pick([5,6,7]),L=Array.from({length:n},()=>T.int(1,20)).sort((a,b)=>a-b),k=T.int(0,2);const sum=L.reduce((a,b)=>a+b,0);
  if(k===0){if(sum%n)return G.stats(T);return {prompt:`Find the <b>mean</b> of: <span class="numtxt">${T.shuffle(L).join(", ")}</span>`,type:"num",key:ival(sum/n),v:{k:"num",e:`(${L.join("+")})/${n}`},explain:steps([`Add them: ${sum}.`,`Divide by how many there are (${n}): ${sum} ÷ ${n} = <b>${sum/n}</b>.`])}}
  if(k===1){const med=n%2?F(L[(n-1)/2]):F(L[n/2-1]+L[n/2],2);return {prompt:`Find the <b>median</b> of: <span class="numtxt">${T.shuffle(L).join(", ")}</span>`,type:"num",anyform:true,key:key(med),v:{k:"num",e:n%2?String(L[(n-1)/2]):`(${L[n/2-1]}+${L[n/2]})/2`},explain:steps([`Put them in order: ${L.join(", ")}.`,n%2?`The middle number is <b>${L[(n-1)/2]}</b>.`:`Two middle numbers: ${L[n/2-1]} and ${L[n/2]}. Their mean is <b>${fx(med)}</b>.`])}}
  return {prompt:`Find the <b>range</b> of: <span class="numtxt">${T.shuffle(L).join(", ")}</span>`,type:"num",key:ival(L[n-1]-L[0]),v:{k:"num",e:`${L[n-1]}-${L[0]}`},explain:steps([`Largest − smallest: ${L[n-1]} − ${L[0]} = <b>${L[n-1]-L[0]}</b>.`])}};
G.prob=T=>{const r=T.int(1,8),b=T.int(1,8),g=T.int(0,6),tot=r+b+g,c=T.pick(["red","blue",...(g?["green"]:[])]),n=c==="red"?r:c==="blue"?b:g,p=F(n,tot);
  return {prompt:`A bag has ${r} red, ${b} blue${g?` and ${g} green`:""} marbles. You pick one without looking. What is the probability it is ${c}? Write a fraction.`,type:"num",anyform:true,key:key(p,"frac"),v:{k:"num",e:`${n}/${tot}`},explain:steps([`Probability = (ways to get ${c}) ÷ (total marbles) = ${n} ÷ ${tot}.`,`Answer: <b>${fx(p,"frac")}</b>.`])}};
G.angles=T=>{const k=T.int(0,2),a=T.int(15,165);
  if(k===0){const x=T.int(10,80);return {prompt:`Two angles are <b>complementary</b>. One is ${x}°. What is the other?`,type:"num",key:ival(90-x),unit:"°",v:{k:"num",e:`90-${x}`},explain:steps([`Complementary angles add to 90°.`,`90 − ${x} = <b>${90-x}°</b>.`])}}
  if(k===1)return {prompt:`Two angles are <b>supplementary</b>. One is ${a}°. What is the other?`,type:"num",key:ival(180-a),unit:"°",v:{k:"num",e:`180-${a}`},explain:steps([`Supplementary angles add to 180°.`,`180 − ${a} = <b>${180-a}°</b>.`])};
  const b=T.int(20,120),c=180-a-b;if(c<=0)return G.angles(T);return {prompt:`A triangle has angles of ${a}° and ${b}°. What is the third angle?`,type:"num",key:ival(c),unit:"°",v:{k:"num",e:`180-${a}-${b}`},explain:steps([`The angles of a triangle add to 180°.`,`180 − ${a} − ${b} = <b>${c}°</b>.`])}};
G.circle=T=>{const r=T.int(1,12),k=T.int(0,2);const A=Math.round(3.14*r*r*100)/100,C=Math.round(2*3.14*r*100)/100;
  if(k===0)return {prompt:`A circle has a radius of ${r} cm. Find its <b>area</b>. Use π ≈ 3.14.`,type:"num",key:String(A),unit:"square cm",v:{k:"num",e:`314*${r}*${r}/100`},explain:steps([`Area = π × r × r.`,`3.14 × ${r} × ${r} = <b>${A}</b> square cm.`])};
  if(k===1)return {prompt:`A circle has a radius of ${r} cm. Find its <b>circumference</b>. Use π ≈ 3.14.`,type:"num",key:String(C),unit:"cm",v:{k:"num",e:`2*314*${r}/100`},explain:steps([`Circumference = 2 × π × r.`,`2 × 3.14 × ${r} = <b>${C}</b> cm.`])};
  const D=2*r,Cd=Math.round(3.14*D*100)/100;return {prompt:`A circle has a diameter of ${D} m. Find its circumference. Use π ≈ 3.14.`,type:"num",key:String(Cd),unit:"m",v:{k:"num",e:`314*${D}/100`},explain:steps([`Circumference = π × diameter.`,`3.14 × ${D} = <b>${Cd}</b> m.`])}};
G.pct_change=T=>{const p=T.pick([10,15,20,25,30,40,50]),n=T.pick([20,40,60,80,120,200,240]),k=T.int(0,2),c=p*n/100;if(c%1)return G.pct_change(T);
  if(k===0)return {prompt:`A $${n} jacket is on sale for ${p}% off. What is the sale price?`,type:"num",key:ival(n-c),unit:"dollars",v:{k:"num",e:`${n}-${p}*${n}/100`},explain:steps([`${p}% of $${n} = $${c}.`,`$${n} − $${c} = <b>$${n-c}</b>.`])};
  if(k===1)return {prompt:`A town had ${n} trees. The number grew by ${p}%. How many trees are there now?`,type:"num",key:ival(n+c),v:{k:"num",e:`${n}+${p}*${n}/100`},explain:steps([`${p}% of ${n} = ${c}.`,`${n} + ${c} = <b>${n+c}</b>.`])};
  return {prompt:`A price went from $${n} to $${n+c}. By what percent did it increase?`,type:"num",key:ival(p),unit:"%",v:{k:"num",e:`${c}/${n}*100`},explain:steps([`Change: $${n+c} − $${n} = $${c}.`,`Change ÷ original: ${c} ÷ ${n} = ${c/n} = <b>${p}%</b>.`])}};
G.proportion=T=>{const a=T.int(2,12),b=T.int(2,12),k=T.int(2,6);if(a===b)return G.proportion(T);const c=a*k;
  return {prompt:`Solve the proportion: &nbsp; ${fr(a,b)} = ${fr(c,"<i>x</i>")}`,type:"num",key:ival(b*k),v:{k:"solve",e:`${a}/${b}=${c}/x`},explain:steps([`Cross-multiply: ${a} · <i>x</i> = ${b} · ${c} = ${b*c}.`,`Divide by ${a}: <i>x</i> = <b>${b*k}</b>.`])}};
G.surf=T=>{const l=T.int(2,10),w=T.int(2,8),h=T.int(2,9),S=2*(l*w+l*h+w*h);
  return {prompt:`Find the <b>surface area</b> of this box.`,vis:boxSVG(l,w,h,"cm"),type:"num",key:ival(S),unit:"square cm",v:{k:"num",e:`2*(${l}*${w}+${l}*${h}+${w}*${h})`},explain:steps([`A box has 6 faces in 3 matching pairs.`,`Pairs: ${l}×${w} = ${l*w}, ${l}×${h} = ${l*h}, ${w}×${h} = ${w*h}.`,`2 × (${l*w} + ${l*h} + ${w*h}) = <b>${S}</b> square cm.`])}};

G.fac_ax2=T=>{const p=T.pick([2,3,5]),r=T.pick([1,2,3]),q=nz(T,-7,7),s=nz(T,-7,7);if(gcd(p,q)!==1||gcd(r,s)!==1||(p===1&&r===1))return G.fac_ax2(T);
  const A=padd(pv("x",p),pc(q)),B=padd(pv("x",r),pc(s)),P=pmul(A,B);if(!P.get("x1"))return G.fac_ax2(T);const a=p*r,c=q*s,b=p*s+q*r;
  return {prompt:`Factor: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`(${pstr(A)})(${pstr(B)})`,v:{k:"factor",e:pstr(P)},explain:steps([`Multiply a × c: ${a} × ${sg(c)} = ${sn(a*c)}. Find two numbers that multiply to ${sn(a*c)} and add to ${sn(b)}: ${sn(p*s)} and ${sn(q*r)}.`,`Split the middle term and group: ${E(`${a}x^2`)} ${p*s<0?"−":"+"} ${E(Math.abs(p*s)+"x")} ${q*r<0?"−":"+"} ${E(Math.abs(q*r)+"x")} ${c<0?"−":"+"} ${Math.abs(c)}.`,`Factor each group and take out the common binomial: <b>${E("("+pstr(A)+")("+pstr(B)+")")}</b>.`])}};
G.fac_group=T=>{const m=nz(T,-9,9),n=nz(T,-9,9);const A=padd(pv("x"),pc(m)),B=padd(pv("y"),pc(n)),P=pmul(A,B);
  return {prompt:`Factor by grouping: &nbsp; ${PH(P)}`,type:"factor",kp:P,key:`(${pstr(A)})(${pstr(B)})`,v:{k:"factor2",e:pstr(P)},explain:steps([`Group the terms in pairs that share a factor: (${E(pstr(padd(pmul(pv("x"),pv("y")),pmul(pc(n),pv("x")))))}) + (${E(pstr(padd(pmul(pc(m),pv("y")),pc(m*n))))}).`,`Factor each pair: ${E("x(y "+(n<0?"- ":"+ ")+Math.abs(n)+")")} ${m<0?"−":"+"} ${Math.abs(m)}${E("(y "+(n<0?"- ":"+ ")+Math.abs(n)+")")}.`,`Take out the common binomial: <b>${E("("+pstr(A)+")("+pstr(B)+")")}</b>.`])}};
G.fac_cubes=T=>{const a=T.int(1,5),plus=T.r()<.5;const L=plus?padd(pv("x"),pc(a)):psub(pv("x"),pc(a)),Q=padd(padd(pv("x",1,2),pv("x",plus?-a:a)),pc(a*a)),P=pmul(L,Q);

G.poly_trimul=T=>{const A=padd(pv("x"),pc(nz(T,-6,6))),B=padd(padd(pv("x",1,2),pv("x",nz(T,-6,6))),pc(nz(T,-9,9))),P=pmul(A,B);
  return {prompt:`Multiply: &nbsp; (${PH(A)})(${PH(B)})`,type:"poly",kp:P,key:pstr(P),v:{k:"expand",e:`(${pstr(A)})*(${pstr(B)})`},explain:steps([`Multiply each term of (${PH(A)}) by every term of (${PH(B)}): 2 × 3 = 6 products.`,`Line up like terms and add them.`,`Answer: <b>${PH(P)}</b>.`])}};
G.line_eq=T=>{const m=nz(T,-4,4),b=T.int(-9,9),x1=T.int(-5,3),x2=x1+T.int(1,4);const y1=m*x1+b,y2=m*x2+b,P=padd(pv("x",m),pc(b));
  return {prompt:`Write the equation of the line through (${sn(x1)}, ${sn(y1)}) and (${sn(x2)}, ${sn(y2)}) in the form <i>y</i> = <i>mx</i> + <i>b</i>.`,type:"poly",kp:P,key:pstr(P),yeq:true,v:{k:"expand",e:pstr(P)},explain:steps([`Slope: m = (${sn(y2)} − ${sg(y1)}) ÷ (${sn(x2)} − ${sg(x1)}) = ${sn(y2-y1)} ÷ ${x2-x1} = ${sn(m)}.`,`Find b with one point: ${sn(y1)} = ${sn(m)}·${sg(x1)} + b, so b = ${sn(b)}.`,`Answer: <b>${E("y = "+pstr(P))}</b>.`])}};
G.sys_word=T=>{const a=T.int(2,9),b=T.int(2,9),n1=T.int(1,5),m1=T.int(1,5),n2=T.int(1,5),m2=T.int(1,5);if(n1*m2-n2*m1===0)return G.sys_word(T);const [i1,i2]=T.pick([["notebooks","pens"],["apples","pears"],["tickets for kids","tickets for adults"]]);

G.quad_sq=T=>{if(T.r()<.5){const r=T.int(1,12);return {prompt:`Solve: &nbsp; ${E("x^2 = "+r*r)}<br><span class="small muted">Type both answers, like x = 4, x = −4.</span>`,type:"roots",key:[r,-r],v:{k:"roots",e:`x^2 - ${r*r}`},explain:steps([`Take the square root of both sides. Remember the negative root too.`,`<i>x</i> = <b>${r}</b> or <i>x</i> = <b>−${r}</b>.`])}}

G.quad_formula=T=>{const a=T.pick([2,3]),r1=T.int(-7,7),r2=T.int(-7,7);if(r1===r2)return G.quad_formula(T);const P=pmul(pc(a),pmul(psub(pv("x"),pc(r1)),psub(pv("x"),pc(r2))));

G.sci_ops=T=>{const a=T.int(11,39)/10,b=T.int(11,29)/10,m=T.int(-4,6),n=T.int(-4,6);const c=+(a*b).toFixed(4);const shift=c>=10?1:0;const e=m+n+shift;

function judgeRad(v,q){const m=String(v).replace(/\s+/g,"").match(/^(\d*)(?:√|sqrt)\(?(\d+)\)?$/i);if(!m)return["no","Type it like 3√2 or 3 sqrt 2."];const a=m[1]?+m[1]:1,b=+m[2];
