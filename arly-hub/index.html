{id:"tardigrade",title:"The Tiny Animal That Refuses to Die",topic:"Life Science",mins:4,
 gloss:{remarkable:["unusual in a way that surprises you","notable, asombroso"],radiation:["energy that travels as invisible rays; strong doses harm living things","radiación"],vacuum:["a space with no air at all","vacío"],invincible:["impossible to defeat or hurt","invencible"],fragile:["easily hurt or broken","frágil"]},
 paras:[
  ["If you look closely at a clump of wet moss, you might find one of the toughest animals on Earth.","It is called a tardigrade.","Most tardigrades are less than one millimeter long, so you need a microscope to see them clearly.","They have eight stubby legs with tiny claws, and because they look a little like chubby bears when they walk, people call them water bears."],
  ["Tardigrades need a thin film of water around their bodies to stay active.","When their home dries out, a tardigrade does something remarkable.","It pulls in its legs, loses almost all of the water in its body, and curls into a dry ball called a tun.","In this state, its body slows down so much that it almost stops working.","A tun can stay this way for years.","When water returns, the tardigrade soaks it up, uncurls, and walks away."],
  ["Scientists have tested how much tardigrades can survive.","Tuns have lived through temperatures far colder than any winter on Earth.","They have also survived levels of radiation that would kill a human.","In 2007, scientists sent tardigrades into space on a satellite, where the animals were exposed to the vacuum of space for ten days.","After they returned to Earth, some of them were still alive and later produced young."],
  ["Tardigrades are not invincible.","Active tardigrades are fragile, and even tuns can be harmed if harsh conditions last too long.","Still, scientists study them closely.","If we learn how tardigrades protect their bodies when they dry out, we may find better ways to store medicines and vaccines without keeping them cold."]],
 qs:[
  {t:"mc",q:"What is this article mainly about?",o:["Tardigrades survive extreme conditions by drying out and slowing their bodies down.","Tardigrades are a kind of tiny bear that lives in moss.","Scientists send many kinds of animals into space.","Medicines and vaccines must always be kept cold."],k:0,why:"Most paragraphs explain how tardigrades survive harsh conditions. The bear idea is only a nickname, and space and medicine are details."},
  {t:"mc",q:"In paragraph 2, what does the word <b>remarkable</b> mean?",o:["surprising and unusual","slow and careful","dangerous","ordinary"],k:0,why:"Drying into a ball and coming back to life later is surprising. The paragraph is setting up something amazing."},
  {t:"ebsr",q:"Part A: Which statement about a tun is supported by the article?",o:["It is a tardigrade with almost no water whose body has nearly stopped working.","It is a baby tardigrade that has just hatched.","It is a kind of moss where tardigrades live.","It is a satellite that carried tardigrades into space."],k:0,why:"Paragraph 2 explains that a tun is a dried-out tardigrade that has slowed down.",ev:["2.3","2.4"],evq:"Part B: Click the sentence that best supports your answer to Part A."},
  {t:"mc",q:"How is paragraph 3 organized?",o:["It describes tests scientists did and what happened.","It compares tardigrades with bears.","It tells the life of one tardigrade from birth to death.","It gives the author's opinion with reasons."],k:0,why:"Paragraph 3 lists tests (cold, radiation, space) and their results."},
  {t:"mc",q:"Why does the author begin paragraph 4 with \"Tardigrades are not invincible\"?",o:["To show that tardigrades are tough but still have limits","To prove that tardigrades cannot survive in space","To explain how tardigrades find food","To argue that scientists should stop studying them"],k:0,why:"The next sentence explains that active tardigrades are fragile and tuns can be harmed. The author balances the earlier amazing facts."},

{id:"bridge",title:"Why Engineers Break Things on Purpose",topic:"Technology and Engineering",mins:4,
 gloss:{deck:["the flat part of a bridge where cars drive","tablero (de un puente)"],criteria:["what a design must do to succeed","criterios"],constraints:["the limits on a design, like cost or materials","restricciones, límites"],prototype:["an early model built to test an idea","prototipo"],"wind tunnel":["a tube where fans blow air over a model to test it","túnel de viento"]},
 paras:[
  ["In November 1940, a new bridge in Washington State began to twist in the wind.","The Tacoma Narrows Bridge had been open for only four months.","On the morning of November 7, winds of about 40 miles per hour made its long, thin road deck swing and twist like a ribbon.","Later that morning, a large section of the bridge broke apart and fell into the water below.","No people died, but the bridge was gone."],
  ["Engineers studied what went wrong.","The deck was very narrow and thin for such a long bridge, so it was not stiff enough.","Wind pushing on the deck made it start to twist, and each twist made the next one bigger."],
  ["The disaster changed how bridges are designed.","Today, engineers build small models of new bridges and test them in wind tunnels before construction begins.","A wind tunnel blows air over the model so engineers can watch how it moves.","If the model shakes too much, they change the design and test it again."],
  ["This is how the engineering design process works.","First, engineers define the problem, including the criteria, which are what the design must do, and the constraints, which are its limits, such as cost and materials.","Next, they build a prototype, an early model of the solution.","Then they test it, look for failures, and improve the design.","Engineers often say that a failed test is not a waste.","Every failure shows them something to fix before people depend on the real thing."]],
 qs:[
  {t:"mc",q:"What is the central idea of the article?",o:["Engineers test and improve designs because failures teach them what to fix.","The Tacoma Narrows Bridge was the longest bridge in the world.","Wind tunnels are used only for airplanes.","Bridges in Washington State are unsafe."],k:0,why:"The article moves from one failure to how testing and redesign make bridges safer."},
  {t:"ebsr",q:"Part A: What caused the Tacoma Narrows Bridge to fall?",o:["Its deck was not stiff enough, so the wind made it twist more and more.","Too many cars drove on it at once.","An earthquake shook it apart.","It was built from wood that rotted."],k:0,why:"Paragraph 2 says the deck was not stiff enough and each twist made the next bigger.",ev:["2.2","2.3"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"In paragraph 4, what are <b>constraints</b>?",o:["the limits on a design, such as cost and materials","the steps for building a bridge","the people who use a bridge","the tests done in a wind tunnel"],k:0,why:"The sentence defines constraints right after the word: \"which are its limits, such as cost and materials.\""},
  {t:"mc",q:"In the design process, what do engineers do right after they build a prototype?",o:["Test it and look for failures","Define the problem","Choose the criteria","Open the bridge to cars"],k:0,why:"Paragraph 4: build a prototype, \"Then they test it, look for failures, and improve the design.\""},
  {t:"ebsr",q:"Part A: How did the bridge disaster change engineering?",o:["Engineers began testing models of bridges in wind tunnels before building them.","Engineers stopped building long bridges.","Bridges were built without road decks.","Engineers began building bridges only in places without wind."],k:0,why:"Paragraph 3 explains the change: models tested in wind tunnels before construction.",ev:["3.1","3.2"],evq:"Part B: Click the sentence that best supports your answer."},

{id:"mangroves",title:"Forests at the Edge of the Sea",topic:"Life Science",mins:4,
 gloss:{tropical:["from the hot parts of the world near the equator","tropical"],tide:["the daily rise and fall of the ocean's level","marea"],"prop roots":["roots that grow out of the trunk and down into the mud to hold a tree up","raíces zancudas"],predators:["animals that hunt other animals for food","depredadores"],nurseries:["places where young ones are protected while they grow","criaderos, guarderías"]},
 paras:[
  ["Most trees would die if their roots sat in salty seawater.","Mangroves are different.","These trees grow along warm, tropical coastlines, where the land meets the ocean.","In many places, the tide rises and covers their roots about twice a day, then falls and leaves them in the mud."],
  ["Mangroves have special ways to handle salt.","Some kinds block most of the salt at their roots.","Others take in salty water and push the extra salt out through their leaves.","Many mangroves also grow prop roots, which arch out of the trunk and down into the mud like the legs of a table.","These roots hold the tree steady in soft, shifting ground."],
  ["Under the water, the tangle of roots makes a safe hiding place.","Young fish, crabs, and shrimp live among the roots, where larger predators have trouble reaching them.","Birds nest in the branches above.","Because so many young animals grow up there, mangrove forests are often called nurseries of the sea."],
  ["Mangroves protect people, too.","Their roots slow down waves during storms and hold mud in place, which helps keep the coast from washing away.","Mexico has some of the largest mangrove forests in the Americas, along both of its coasts.","In some places, though, mangroves have been cut down to make room for shrimp farms, hotels, and roads.","Many communities are now planting new mangroves to bring these forests back."]],
 qs:[
  {t:"mc",q:"What is the main idea of the article?",o:["Mangroves are special trees that survive in salt water and protect animals and coasts.","Mangroves are trees that grow only in Mexico.","Shrimp farms are the best use of coastlines.","Birds build nests in many kinds of trees."],k:0,why:"The article explains how mangroves live in salt water and why they matter to animals and people."},
  {t:"mc",q:"Based on paragraph 2, what are <b>prop roots</b>?",o:["roots that arch out of the trunk to hold the tree steady","roots that pull salt out of the water","leaves that store extra salt","young mangrove trees"],k:0,why:"The paragraph compares them to the legs of a table and says they hold the tree steady."},
  {t:"ebsr",q:"Part A: Why are mangrove forests called \"nurseries of the sea\"?",o:["Many young sea animals grow up safely among the roots.","People plant baby mangroves there.","The water is warm, like a nursery room.","Mangroves are the youngest trees on Earth."],k:0,why:"Paragraph 3 explains that young fish, crabs, and shrimp hide from predators among the roots.",ev:["3.2","3.4"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"ebsr",q:"Part A: What would most likely happen to a coast if its mangroves were cut down?",o:["Storm waves would wash away more of the coast.","The tide would stop rising and falling.","More young fish would live there.","The water would become less salty."],k:0,why:"Paragraph 4 says mangrove roots slow waves and hold mud in place. Without them, the coast is less protected.",ev:["4.2"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"How is paragraph 2 organized?",o:["It names a problem (salt and soft mud) and explains how mangroves solve it.","It tells events in the order they happened.","It compares mangroves to animals.","It gives the author's opinion about hotels."],k:0,why:"Paragraph 2 opens with the problem of salt, then describes several solutions."}]},
{id:"anning",title:"The Girl Who Found a Sea Dragon",topic:"Earth Science · Biography",mins:4,
 gloss:{fossils:["hardened remains or traces of ancient living things","fósiles"],remains:["what is left of a body after it dies","restos"],reptile:["a cold-blooded animal with scales, such as a lizard","reptil"],"geological society":["a club of scientists who study rocks and Earth's history","sociedad geológica"],published:["printed and shared publicly","publicado"]},
 paras:[
  ["Mary Anning was born in 1799 in Lyme Regis, a small town on the southern coast of England.","The cliffs near her home were full of fossils, the hardened remains of ancient living things.","Her family was poor, so Mary and her brother Joseph searched the beaches for fossils and sold them to visitors."],
  ["Around 1811, Joseph found a strange skull sticking out of a cliff.","About a year later, Mary, who was only twelve or thirteen, found the rest of the skeleton.","It belonged to an ichthyosaur, a sea reptile that lived during the age of dinosaurs.","The skeleton was one of the most complete of its kind that anyone had found."],
  ["Mary kept searching for the rest of her life.","In 1823, she found the first complete skeleton of a plesiosaur, a sea reptile with a long neck and four flippers.","She also noticed that some stones on the beach were really fossilized animal droppings with bits of fish bone inside, which helped scientists learn what ancient animals ate."],
  ["Even so, Mary did not receive the credit she deserved during her lifetime.","At that time, women were not allowed to join the Geological Society of London, the most important group of scientists who studied rocks and fossils.","Men often bought her fossils and published papers about them without mentioning her name.","Today, she is honored as one of the most important fossil hunters in history."]],
 qs:[
  {t:"mc",q:"Which sentence best states a central idea of the article?",o:["Mary Anning made important fossil discoveries even though she was not treated fairly.","Mary Anning sold fossils so she could become rich.","Fossils are only found in England.","The Geological Society of London was founded in 1823."],k:0,why:"The article describes her discoveries and the unfair way she was treated, ending with how she is honored today."},
  {t:"ebsr",q:"Part A: Why did Mary and Joseph first start collecting fossils?",o:["Their family was poor, and they could sell the fossils.","They wanted to join the Geological Society.","A scientist hired them to dig.","They were studying sea reptiles in school."],k:0,why:"Paragraph 1 says the family was poor, so they collected fossils and sold them.",ev:["1.3"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"In paragraph 1, what does <b>remains</b> mean?",o:["what is left of a living thing after it dies","people who stay in a town","rocks that are very old","drawings of animals"],k:0,why:"Fossils are described as the hardened remains of living things: what is left of them."},
  {t:"mc",q:"Which event happened first?",o:["Joseph found a strange skull in the cliff.","Mary found a complete plesiosaur.","Mary was honored as a great fossil hunter.","Mary found the rest of the ichthyosaur skeleton."],k:0,why:"Joseph's skull (around 1811) came before Mary's ichthyosaur skeleton (about a year later), the plesiosaur (1823), and the honors (today)."},
  {t:"ebsr",q:"Part A: Which detail shows that Mary was treated unfairly?",o:["Men published papers about her fossils without using her name.","She found her first skeleton when she was young.","She lived in a small town by the sea.","She studied fossilized droppings."],k:0,why:"Paragraph 4 explains the unfair treatment.",ev:["4.2","4.3"],evq:"Part B: Click the sentence that best supports your answer."}]},
{id:"moon",title:"Why the Moon Changes Shape",topic:"Earth and Space Science",mins:3,
 gloss:{phases:["the different shapes of the lit part of the Moon we see","fases"],sliver:["a very thin piece","rodaja delgada, astilla"],crescent:["a curved shape like a thin banana","creciente, media luna"],cycle:["a set of events that repeats in the same order","ciclo"]},
 paras:[
  ["Some nights the Moon looks like a bright, round circle.","Other nights it is a thin curve, and some nights you cannot see it at all.","The Moon itself does not change shape.","What changes is how much of its lit side we can see from Earth."],
  ["The Moon does not make its own light.","Like Earth, it is lit by the Sun, so one half of the Moon is always in sunlight while the other half is dark.","As the Moon travels around Earth, we see different amounts of the sunlit half.","These different shapes are called phases."],
  ["When the Moon is between Earth and the Sun, its lit side faces away from us.","We see almost nothing, and this phase is called a new moon.","As the Moon moves along its path, a thin sliver of the lit side appears, called a crescent.","About a week after the new moon, we see half of the lit side, which is called a quarter moon.","When Earth is between the Sun and the Moon, we can see the whole lit side, and this is a full moon."],
  ["After the full moon, the lit part we see grows smaller again.","The whole cycle, from one new moon to the next, takes about 29.5 days.","People have used this steady pattern for thousands of years to keep track of time.","In fact, the word month comes from the word moon."]],
 qs:[
  {t:"ebsr",q:"Part A: According to the article, why does the Moon seem to change shape?",o:["We see different amounts of its sunlit half as it travels around Earth.","Earth's shadow covers a different part of it each night.","The Moon grows and shrinks during the month.","Clouds block parts of the Moon."],k:0,why:"Paragraph 2 explains that we see different amounts of the sunlit half. Earth's shadow is a common wrong idea.",ev:["2.3","1.4"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"What is a <b>phase</b> of the Moon?",o:["one of the shapes of the lit part we see","a kind of shadow from Earth","the dark side of the Moon","a full trip around the Sun"],k:0,why:"Paragraph 2: \"These different shapes are called phases.\""},
  {t:"mc",q:"Which phase comes right after the new moon?",o:["a crescent","a full moon","a quarter moon","a second new moon"],k:0,why:"Paragraph 3: after the new moon, a thin sliver appears, called a crescent."},
  {t:"ebsr",q:"Part A: Where is Earth during a full moon?",o:["between the Sun and the Moon","behind the Sun","on the same side as the Moon's dark half","far away from both"],k:0,why:"The last sentence of paragraph 3 says when Earth is between the Sun and the Moon, we see a full moon.",ev:["3.5"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"Why does the author end with the fact about the word <i>month</i>?",o:["To show how important the Moon's cycle has been for keeping time","To explain how the Moon makes light","To prove that the cycle takes 29.5 days","To describe a crescent moon"],k:0,why:"The paragraph is about using the Moon's pattern to keep time. The word history is an example."}]},
{id:"pond",title:"Who Eats Whom in a Pond",topic:"Life Science",mins:4,
 gloss:{"food web":["a diagram that shows who eats whom in a place","red alimenticia, red trófica"],producers:["living things that make their own food","productores"],photosynthesis:["how plants use sunlight to make food","fotosíntesis"],organisms:["living things","organismos"],decomposers:["living things that break down dead plants and animals","descomponedores"],matter:["the stuff everything is made of","materia"]},
 paras:[
  ["A pond may look quiet, but it is full of living things that depend on one another for food.","Scientists show these connections with a food web, a diagram of who eats whom."],
  ["Every food web starts with producers.","In a pond, the producers are plants and tiny algae.","They use energy from sunlight to make their own food through a process called photosynthesis.","Without producers, no other living thing in the pond would have the energy to survive."],
  ["Consumers are living things that get energy by eating other organisms.","Tadpoles and snails eat algae.","Small fish eat insects and tadpoles.","A heron, a tall wading bird, eats fish and frogs.","Each time one living thing eats another, energy moves from one organism to the next."],
  ["When plants and animals die, decomposers go to work.","Bacteria and fungi break down dead matter into simple materials.","These materials return to the water and mud, where producers use them to grow.","In this way, matter moves through the pond in a cycle, while new energy keeps coming in from the Sun."],
  ["Because the living things are connected, a change to one can affect many others.","For example, if a disease killed most of the small fish, the insects they eat might increase.","The herons, with less to eat, might have to leave the pond to find food somewhere else."]],
 qs:[
  {t:"mc",q:"What is the article mainly about?",o:["How living things in a pond are connected by what they eat","How to build a pond in a backyard","Why herons are the most important pond animals","How fish get sick"],k:0,why:"Every paragraph explains part of the pond food web and how the living things are connected."},
  {t:"ebsr",q:"Part A: Where do producers get the energy to make food?",o:["from sunlight","from eating insects","from decomposers","from the mud"],k:0,why:"Paragraph 2 says producers use energy from sunlight (photosynthesis).",ev:["2.3"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"In paragraph 3, what are <b>organisms</b>?",o:["living things","kinds of food","parts of a pond","types of energy"],k:0,why:"Consumers get energy by eating other organisms, such as algae, insects, and fish: living things."},
  {t:"ebsr",q:"Part A: According to the article, what might happen if most of the small fish died?",o:["Insects might increase, and herons might leave to find food.","Algae would stop growing.","Decomposers would disappear.","Herons would eat more algae."],k:0,why:"Paragraph 5 gives this exact example of a chain of effects.",ev:["5.2","5.3"],evq:"Part B: Click the sentence that best supports your answer."},
  {t:"mc",q:"What is the difference between how matter and energy move in the pond?",o:["Matter is recycled, but new energy keeps coming from the Sun.","Energy is recycled, but matter comes from the Sun.","Both come only from the Sun.","Neither moves between organisms."],k:0,why:"The last sentence of paragraph 4 says matter moves in a cycle while new energy keeps coming from the Sun."},
  {t:"mc",q:"How is paragraph 5 organized?",o:["cause and effect","problem and solution","comparing two ponds","steps in time order"],k:0,why:"A cause (fish die) leads to effects (more insects, herons leave)."}]}

const SETS=[{"id":"s01-octopus","theme":"Octopus Intelligence","a":{"title":"Eight Arms, Many Minds","genre":"Informational","topic":"Life Science","gloss":{"neurons":["nerve cells that carry signals through the body","neuronas"],"independence":["the ability to act on its own without being controlled","independencia"],"chromatophores":["tiny skin cells filled with color that can open and close","cromatóforos"],"pigment":["a natural substance that gives something its color","pigmento"],"transforming":["completely changing the form or look of something","transformando"],"imitate":["to copy the look or actions of something else","imitar"],"portable":["able to be carried from place to place","portátil"],"predators":["animals that hunt and eat other animals","depredadores"]},"paras":[["Imagine trying to solve a puzzle while hiding from a shark, changing the color of your skin, and tasting the seafloor with your fingertips, all at the same time.","For an octopus, that might be an ordinary afternoon.","Octopuses are mollusks, which makes them relatives of snails and clams, yet they are among the most intelligent animals in the ocean."],["Part of the answer lies in the octopus's nervous system.","An octopus has more than 500 million neurons, the specialized cells that carry signals through an animal's body.","That is roughly the same number found in a dog.","What makes the octopus unusual is not how many neurons it has but where they are located.","Only about one-third of them are packed into the brain inside its head.","The other two-thirds are spread through its eight arms in thick cords of nerves."],["Because of this structure, each arm has a surprising amount of independence.","The brain can send a general command, such as “grab that crab,” and the arm works out the details of bending, twisting, and gripping on its own.","Each arm is lined with suckers that can both touch and taste, so an arm exploring a dark crack in a rock can identify a meal before the octopus ever sees it.","One way to picture an octopus is as a team of nine partners: one central brain and eight arms, all working toward the same goal."],["The octopus's skin is one of the most remarkable disguises in nature.","It is dotted with tiny color cells called chromatophores.","Each chromatophore is a small, stretchy sac of pigment, either yellow, orange, red, brown, or black, surrounded by tiny muscles.","When the muscles pull, the sac opens wide and its color spreads; when they relax, the sac shrinks to a dot almost too small to see.","Deeper layers of cells reflect light to produce shimmering blues, greens, and bright whites.","Muscles in the skin can even raise bumps and ridges, transforming smooth skin into something that looks like a rough rock or a clump of seaweed.","Many of these changes can happen in a fraction of a second."],["Octopuses use this skill in clever ways.","Most of the time, they blend into their surroundings to hide from predators such as sharks and eels, or to sneak up on prey.","The mimic octopus, found in warm Asian waters, goes even further.","By changing both its colors and its body shape, it can imitate more dangerous animals, including venomous lionfish and sea snakes.","Strangely, tests suggest that some common octopus species cannot see color the way people do, so scientists are still investigating how they match their surroundings so well."],["Octopuses are also skilled problem solvers.","In Indonesia, researchers watched veined octopuses collect coconut shell halves that people had thrown away, carry them across the seafloor, and later put them together as a portable shelter.","Carrying an object now in order to use it later is a kind of planning, and many scientists consider it a form of tool use.","In aquariums, giant Pacific octopuses have learned to unscrew the lids of jars to reach food inside, and one even learned to open a child-proof pill bottle.","With practice, they solve these puzzles faster, which shows that they learn from experience."],["Their talent for escape is legendary among aquarium workers.","Because an octopus has no bones, it can squeeze through almost any opening larger than its beak, the only hard part of its body.","In 2016, an octopus named Inky made headlines around the world when he escaped from the National Aquarium of New Zealand.","Workers believe he slipped out of his tank during the night, crept across the floor, and squeezed into a drainpipe about 50 meters long that led to the sea.","Many aquariums now use locks and heavy lids, because an octopus that wants to explore will often find a way."],["Why did such a soft, short-lived animal become so smart?","Many octopuses live only a year or two, and they never meet their parents, so they cannot learn from adults the way young chimpanzees or humans do.","One idea is that intelligence helped octopuses survive after their ancestors lost the hard, protective shells that some of their relatives, like the nautilus, still carry.","Without armor, an animal must outthink its enemies, finding food quickly and hiding even faster.","What fascinates researchers most is that octopus intelligence developed separately from our own: the last ancestor humans and octopuses shared was a tiny, simple creature that lived more than 500 million years ago."],["Studying octopuses is changing the way people think about intelligence.","A mind does not have to sit in one place, and it does not have to look like ours to be impressive.","Engineers have even designed soft robotic arms inspired by octopus arms, hoping to build machines that can bend, grip, and squeeze into tight spaces.","The next time you see an octopus, remember that you are looking at one of the ocean's great thinkers, one that does much of its thinking with its arms."]]},"b":{"title":"Eight of Something Better","genre":"Realistic fiction","gloss":{"enrichment":["activities that keep an animal's mind busy and interested","enriquecimiento"],"latches":["small bars or hooks that hold a lid or door shut","pestillos"],"doubtfully":["in a way that shows you are not sure something will work","con duda"],"deflated":["flat and saggy, like a balloon that lost its air","desinflado"],"rippled":["moved in small waves across a surface","ondulaba"],"curious":["wanting to know or learn about something","curiosa"]},"paras":[["Lucía had been volunteering at the Bayside Aquarium for three Saturdays, and so far her most exciting job had been folding T-shirts in the gift shop.","So when Ms. Okafor, the octopus keeper, asked if she wanted to help with enrichment, Lucía nearly dropped the stack of shirts she was carrying."],["“Enrichment means giving animals challenges so they don't get bored,” Ms. Okafor explained, holding up a clear plastic box.","Inside, a small crab clung to the bottom.","The lid was held shut by two sliding latches and a twist knob.","“This is for Clementine.”"],["Lucía looked doubtfully at the box, then at the giant Pacific octopus pressed against the glass like a deflated red balloon.","“Isn't that a little hard?” she asked.","“She doesn't even have hands.”","Ms. Okafor smiled.","“She has eight of something better.”"],["They lowered the box into the tank.","For a long moment, nothing happened.","Lucía checked the clock on the wall and shifted from one foot to the other.","“Maybe she's not hungry,” she whispered.","“Wait,” Ms. Okafor said.","“Watch her arms, not her eyes.”"],["Lucía watched.","One arm curled around the box, sliding over every corner and edge as if it were reading.","A second arm found a latch and tugged it sideways.","Then a third slipped beneath the knob.","Clementine's skin rippled from rusty red to a pale, freckled cream and back again, like a thought passing through her."],["The first latch clicked open.","Then the second.","The knob turned, slowly at first and then faster, and the lid floated away.","In one smooth motion, an arm reached inside, and the crab was gone."],["Lucía realized her mouth was hanging open.","“Four minutes,” Ms. Okafor said, checking her watch.","“Last month it took her twenty.”"],["Before Lucía could answer, a thin arm rose out of the water, curled over the edge of the tank, and wrapped gently around her wrist.","The suckers felt cool and sticky, like tape that tickled.","“She's tasting you,” Ms. Okafor said.","“She's curious about who's been watching her.”"],["Lucía held very still.","The tip of the arm explored her sleeve, her watchband, and her knuckles, and then it slid back into the water as if it had finished reading a page."],["That evening, Lucía's mother asked how the gift shop had been.","Lucía thought about the clock she had kept checking and the puzzle she had been so sure was impossible.","“I didn't fold a single shirt,” she said.","“I learned how to wait.”"]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["An octopus's unusual body and nervous system let it behave intelligently in many ways.","Octopuses can change the color and texture of their skin to hide from hungry predators.","Octopuses are clever hunters that are able to escape from almost any aquarium tank.","Octopuses are smarter than dogs because they have more neurons inside their brains."],"k":0,"why":"The whole article connects the octopus's body, especially its arm neurons and skin, to smart behavior like camouflage, tool use, and escapes. The other choices are single details, or they get a detail wrong (paragraph 2 says the number of neurons is about the same as a dog's)."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: Based on paragraph 3, what can the reader infer about how an octopus finds food?","o":["Its arms can find and recognize prey without waiting for the brain to see it.","It must see its prey clearly with its eyes before any of its arms can begin to move.","It depends mostly on its sense of smell to find crabs hiding in rocks.","It uses all eight arms together, following the brain's careful directions."],"k":0,"why":"Paragraph 3 says the suckers can taste, so an arm can identify a meal before the octopus ever sees it. That means the arms do some of the food-finding on their own.","ev":["a3.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this phrase from paragraph 4: “<b>transforming</b> smooth skin into something that looks like a rough rock.” The prefix trans- means “across” or “change.” What does <b>transforming</b> mean?","o":["completely changing the look of","slowly repairing the surface of","carefully protecting the shape of","partly covering up the color of"],"k":0,"why":"The prefix trans- signals change, and in paragraph 4 smooth skin turns into something that looks like a rock. Its whole form changes, so transforming means completely changing the look of something."},{"on":"a","t":"ms","skill":"key details","q":"Which details from paragraph 4 explain how an octopus changes its COLOR? Choose TWO answers.","o":["Muscles pull small sacs of pigment open so their color spreads out.","Deeper layers of cells reflect light to make blues, greens, and whites.","The octopus squirts a cloud of dark ink into the water around it.","The octopus swims to places that already match its own color.","Muscles in the skin raise bumps and ridges so the skin looks rough."],"ks":[0,1],"why":"Paragraph 4 says color comes from pigment sacs that muscles stretch open and from deeper cells that reflect light. The bumps and ridges change the skin's texture, not its color, and ink is never mentioned."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author develop the idea in paragraph 7 that octopuses are skilled at escaping?","o":["by explaining a body feature that allows escape and then giving a real example","by comparing Inky's escape with escapes made by other animals at different aquariums","by listing the steps aquarium workers follow to keep their octopuses safely inside","by describing a problem with old tanks and then explaining how workers fixed it"],"k":0,"why":"Paragraph 7 first explains that an octopus has no bones and can squeeze through small openings. Then it gives the true example of Inky escaping through a drainpipe."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 8, why do some scientists think octopuses became so intelligent?","o":["With no protective shell, they had to outsmart enemies to survive.","They learned survival skills by watching their parents for many years.","They live much longer than most of the other animals in the ocean.","They developed their brains from the same ancestor that humans had."],"k":0,"why":"Paragraph 8 explains that octopus ancestors lost their hard shells, and an animal without armor must outthink its enemies. The paragraph says the opposite of the other choices: octopuses never meet their parents and live only a short time.","ev":["a8.3","a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, octopuses put coconut shells together as a <b>portable</b> shelter. The root port means “carry.” What does <b>portable</b> mean?","o":["able to be carried from place to place","made from hard and natural materials","large enough to hide in completely","built to stay strong for a very long time"],"k":0,"why":"The root port means carry, and the suffix -able means able to be. Paragraph 6 says the octopuses carry the shells across the seafloor, so a portable shelter is one they can take with them."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: Which statement best describes the author's point of view about octopuses in paragraph 9?","o":["The author admires octopuses and thinks they change ideas about what a mind is.","The author worries that octopuses are too dangerous to be kept in public aquariums.","The author thinks octopuses are clever but less intelligent than most land animals.","The author believes scientists have already learned everything about octopuses."],"k":0,"why":"In paragraph 9 the author says a mind does not have to look like ours to be impressive and calls the octopus one of the ocean's great thinkers. These words show admiration and a new way of thinking about intelligence.","ev":["a9.2","a9.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"inference","q":"In paragraph 5, why are scientists “still investigating” how octopuses match their surroundings?","o":["Some octopuses seem unable to see color, yet they still blend in well.","Octopuses only change their color when they are hunting late at night.","The mimic octopus lives too far away for most scientists to study it.","Octopuses slowly lose their ability to change color as they grow much older."],"k":0,"why":"The last sentence of paragraph 5 says some octopuses cannot see color the way people do. That makes their color matching a puzzle, because it is hard to match colors you cannot see."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses a theme of “Eight of Something Better”?","o":["Patience and careful watching can reveal abilities we did not expect.","Hard work and practice will always earn a person a reward at the end.","Animals living in aquariums are much happier than animals in the sea.","It is important to follow every safety rule when working with animals."],"k":0,"why":"Lucía doubts the octopus and keeps checking the clock, but when she waits and watches, she sees Clementine solve the puzzle. In paragraph 10 she says she learned how to wait."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 5, Clementine's skin changes color “like a thought passing through her.” What does this comparison suggest?","o":["The octopus seems to be thinking hard as she works on the puzzle.","The octopus is becoming afraid of the people who are watching her.","The octopus is getting tired and is ready to give up on the box.","The octopus is trying to hide from the crab that is in the box."],"k":0,"why":"The writer compares the color change to a thought, which makes Clementine seem like she is concentrating. It happens right while her arms are working on the latches and knob in paragraph 5."},{"on":"b","t":"ebsr","skill":"character","q":"Part A: How does Lucía change from the beginning to the end of the story?","o":["She goes from doubtful and impatient to amazed and willing to wait.","She goes from excited about the octopus to bored with her volunteer job.","She goes from afraid of the octopus to wishing she had one as a pet.","She goes from proud of her own skills to unsure of herself."],"k":0,"why":"At first Lucía doubts the octopus and keeps checking the clock (paragraphs 3 and 4). By the end she is amazed and tells her mother, “I learned how to wait.”","ev":["b10.4","b10.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"In paragraph 3, what does Ms. Okafor most likely mean when she says Clementine has “eight of something better”?","o":["The octopus's arms will be even more useful for the puzzle than hands.","The keeper has hidden eight helpful tools inside the octopus's tank.","The octopus has caught eight crabs and does not need this one.","The octopus has solved eight harder puzzles earlier that same day."],"k":0,"why":"Lucía has just said the octopus has no hands. Ms. Okafor answers that she has eight of something better, which means her eight arms, and paragraph 5 shows those arms opening the box."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the way Text 2 presents octopuses different from the way Text 1 presents them?","o":["Text 2 shows one octopus through a character's eyes; Text 1 explains facts about many.","Text 2 gives more scientific facts about octopus neurons, while Text 1 mostly tells a personal story.","Text 2 argues that octopuses should be set free, while Text 1 argues that they belong in aquariums.","Text 2 describes octopuses in the wild, while Text 1 describes only octopuses living in aquariums."],"k":0,"why":"Text 2 is a story that lets us watch Clementine through Lucía's experience. Text 1 is an informational article that gives facts and examples about octopuses in general."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 is best shown by what happens in Text 2?","o":["Octopuses learn from experience and get faster at solving puzzles.","Octopuses can copy the shapes of dangerous animals to stay safe from enemies.","Octopuses often escape from their tanks by using drainpipes.","Octopuses lose interest in food when people are watching them."],"k":0,"why":"Text 1 says that with practice octopuses solve puzzles faster. In Text 2, Clementine opens the box in four minutes when it took her twenty minutes the month before.","ev":["b7.3","b7.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Explain how Text 1 and Text 2 each show that octopuses are intelligent. Use at least one detail from each text in your answer.","model":"Both texts show that octopuses are intelligent because they can solve problems and learn. In Text 1, the author explains that octopuses in aquariums have learned to unscrew jar lids to reach food, and that “with practice, they solve these puzzles faster.” This proves that octopuses remember what worked before and use it again. In Text 2, Clementine opens a box with two latches and a twist knob in only four minutes, even though it took her twenty minutes the month before. Her arms explore every edge “as if it were reading,” which shows she is studying the problem instead of just grabbing. Text 1 gives facts about many octopuses, and Text 2 lets the reader watch one octopus think. Together, they show that an octopus is a true problem solver.","need":["States a clear claim about octopus intelligence","Uses a detail from Text 1 (the article)","Uses a detail from Text 2 (Clementine's puzzle)","Explains how each detail proves the octopus is smart"]}},{"id":"s02-monarchs","theme":"The Monarch Migration","a":{"title":"The Great Monarch Relay","genre":"Informational","topic":"Life Science","gloss":{"migration":["a long journey animals make from one region to another, usually with the seasons","migración"],"generations":["groups of living things born at about the same time, like parents, children, and grandchildren","generaciones"],"overwinter":["to spend the winter in one place","pasar el invierno"],"dormant":["resting and not active for a period of time","inactivo, en reposo"],"compensate":["to make up for something by adjusting","compensar"],"circadian":["following a daily cycle of about 24 hours","circadiano"],"navigate":["to find the way from one place to another","orientarse, navegar"],"transport":["to carry from one place to another","transportar"]},"paras":[["Every autumn, a cloud of orange and black wings drifts south across North America.","Monarch butterflies from southern Canada and the eastern and central United States begin a journey that can stretch up to about 3,000 miles, or roughly 4,800 kilometers.","Their destination is a small group of mountain forests in central Mexico.","For an insect that weighs less than a paper clip, it is one of the most astonishing trips in the animal world."],["What makes the monarch migration truly unusual is that no single butterfly makes the whole round trip.","The journey is more like a relay race, in which each runner carries the baton for part of the course and then hands it to the next.","In the monarch's case, the “runners” are different generations of butterflies, and the baton is the journey itself."],["The relay begins in early spring in Mexico.","Butterflies that spent the winter there fly north into the southern United States, where the females lay eggs on milkweed, the only plant monarch caterpillars can eat.","Then those adults die.","Their offspring hatch, grow, form chrysalises, and emerge as butterflies that continue farther north.","During spring and summer, two or three generations follow one after another, each living only a few weeks as adults and each moving the population closer to Canada."],["Then something remarkable happens.","The butterflies that emerge in late summer are different from their parents and grandparents.","Shorter days and cooler temperatures change the hormones in their bodies, so instead of mating and laying eggs right away, they stay in a kind of pause.","Their reproductive systems remain dormant, and they save their energy for a single great purpose: flying south.","Scientists sometimes call this group the “super generation,” because these butterflies can live for around eight months, while summer monarchs usually live less than two."],["The super generation arrives in Mexico around the beginning of November, close to the time of Día de los Muertos.","In some communities, people have long connected the returning butterflies with the spirits of loved ones coming home for the holiday.","The monarchs gather in forests of oyamel fir trees high in the mountains of Michoacán and the State of Mexico, west of Mexico City.","There, millions of butterflies cluster so tightly on trunks and branches that the trees look as if they are covered in orange leaves, and some branches sag under the weight."],["Why travel so far to these particular mountains?","The oyamel forests provide a nearly perfect place to overwinter.","The air is cool enough that the butterflies' bodies slow down and use very little energy, but the thick forest acts like a blanket that usually protects them from freezing.","Huddling together in huge clusters also helps keep them warm and safe.","In late winter, as the days grow longer and warmer, the monarchs mate, and in March they begin flying north to start the relay all over again."],["Perhaps the greatest mystery is how the butterflies navigate.","None of the monarchs flying south has ever made the trip before, so they cannot be following memories or leaders.","Scientists have discovered that monarchs use the sun as a compass.","However, the sun moves across the sky during the day, so a butterfly that simply flew toward it would end up going in circles.","To compensate for this movement, monarchs rely on circadian clocks, internal timers that keep track of the time of day.","By combining the sun's position with the time, a monarch can keep flying in the same southern direction from morning until evening."],["Surprisingly, some of these clocks are located in the monarch's antennae.","In a 2009 experiment, researchers covered the antennae of migrating monarchs with black paint that blocked light.","Those butterflies flew in the wrong direction.","When the scientists used clear paint that let light through, the butterflies flew south correctly.","Other studies suggest that monarchs may also sense Earth's magnetic field, which could help them on cloudy days, although scientists are still investigating this idea."],["Today, the migration faces serious challenges.","Milkweed has disappeared from many fields and roadsides, and illegal logging and changing weather threaten the winter forests.","To protect the butterflies, Mexico created the Monarch Butterfly Biosphere Reserve, which UNESCO named a World Heritage Site in 2008.","People in all three countries also plant milkweed in gardens and schoolyards to support the butterflies as they pass through.","Each small garden becomes a rest stop on a highway thousands of miles long."],["The monarch migration reminds us that a long journey can be shared.","No single butterfly sees both the Canadian meadows and the Mexican mountains, yet together, generation after generation, the monarchs transport their species across a continent and back again."]]},"b":{"title":"Letter from the Oyamel Forest","genre":"Poem","poem":true,"gloss":{"pilgrim":["a traveler on a long, meaningful journey","peregrino"],"inherited":["received from a parent or ancestor","heredado"],"faithful":["loyal and steady; always doing what is expected","fiel"],"embers":["small glowing pieces of a fire that is going out","brasas"],"gathered":["collected or brought together in one place","reunidos"]},"paras":[["I never saw the meadow where my great-grandmother was born,","the milkweed by the river, the barn roof in the corn.","I only know a feeling, like a needle in my chest,","that pulled me through October and would not let me rest."],["I followed it past cities where the highways hummed all night,","I rode the warm air upward and I trusted in the light.","The sun stood in the morning on my left, then crossed the sky,","and something in my antennae kept the hours as I flew by."],["Now here I hang with millions on the shoulders of the firs,","a bright and folded blanket where no single wing stirs.","We are embers on the branches, we are letters left unread,","a quiet orange story that the mountain keeps instead."],["We came in with November, when the altars glow with light,","and marigolds in doorways turn the evening gold and bright.","The grandmothers looked upward and they whispered as we passed,","“The ones we love are coming home; they found the way at last.”"],["When March comes up the valley and the sunlight finds my wings,","I'll carry north this pilgrim map that no one ever brings.","My children's children's children won't remember where I've been,","but they will feel the needle when the autumn days grow thin."],["No one of us has traveled every mile of this long road,","yet the road is never broken, and we never drop the load.","It is an inherited direction, a faithful, folded song,","and we are gathered here because we carried it along."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Monarchs complete a long migration across several generations, guided by built-in navigation.","Monarch butterflies spend every winter in the oyamel fir forests found in the mountains of central Mexico.","Monarchs are in danger because farmers and builders have removed much of the milkweed.","A single monarch butterfly can fly about 3,000 miles in its lifetime without stopping."],"k":0,"why":"The article explains the relay of generations (paragraphs 2–4) and how monarchs find their way (paragraphs 7–8). The other choices are smaller details, or they are wrong: paragraph 2 says no single butterfly makes the whole trip."},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author compare the migration to a relay race in paragraph 2?","o":["to show that different generations each complete one part of the trip","to show that the monarchs race one another to see who reaches Mexico first","to explain why monarchs fly faster than most other kinds of insects","to explain how monarchs teach younger butterflies the route to follow"],"k":0,"why":"In a relay race, each runner carries the baton for part of the course. Paragraph 2 says the runners are different generations of butterflies, and each does part of the journey."},{"on":"a","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 4, how is the “super generation” different from the summer generations?","o":["It delays laying eggs and lives much longer so it can fly south.","It is born in Mexico and spends its whole life resting in the oyamel forests.","It lays more eggs on milkweed than any of the generations before it.","It flies north into Canada during the warmest weeks of the summer."],"k":0,"why":"Paragraph 4 says these butterflies stay in a pause instead of mating and laying eggs, and they live around eight months instead of less than two.","ev":["a4.4","a4.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 10, the monarchs <b>transport</b> their species across a continent. The prefix trans- means “across,” and the root port means “carry.” What does <b>transport</b> mean in this sentence?","o":["carry from one place to another","protect from danger and harm along the way","change into a different form","divide into separate groups"],"k":0,"why":"Trans- means across and port means carry, so transport means to carry across. Paragraph 10 says the monarchs carry their species across a continent and back."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: Based on paragraph 7, why do monarchs need circadian clocks to use the sun as a compass?","o":["The sun changes position during the day, so they must adjust for the time.","The sun is far too bright to look at, so they must use their antennae instead.","The sun sets early in autumn, so they must fly only in the early morning.","The sun is hidden in the forests, so they must remember where it was."],"k":0,"why":"Paragraph 7 explains that the sun moves across the sky, so monarchs use internal clocks to keep track of the time and keep flying south.","ev":["a7.4","a7.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What can the reader infer from the experiment described in paragraph 8?","o":["Monarchs need light to reach their antennae in order to find the right direction.","Monarchs cannot fly at all when anything is placed on their antennae.","Monarchs use their antennae mainly to smell the oyamel fir trees waiting for them in Mexico.","Monarchs fly correctly only when scientists guide them with a compass."],"k":0,"why":"In paragraph 8, black paint blocked light and the butterflies went the wrong way, but clear paint let light through and they flew south. So light reaching the antennae matters.","ev":["a8.3","a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"key details","q":"Which details from paragraph 6 explain why the oyamel forests are a good place to spend the winter? Choose TWO answers.","o":["The cool air slows the butterflies' bodies so they use little energy.","The thick forest usually protects the butterflies from freezing.","The forests have plenty of milkweed for caterpillars to eat.","The trees are tall enough to keep away hungry birds.","The days are long and sunny throughout the whole winter."],"ks":[0,1],"why":"Paragraph 6 says the cool air helps monarchs save energy and the forest works like a blanket against freezing. It never says there is milkweed there or that birds stay away."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, the butterflies' reproductive systems remain <b>dormant</b>. Which phrase in the paragraph best helps the reader understand <b>dormant</b>?","o":["“stay in a kind of pause”","“shorter days and cooler temperatures change the hormones”","“different from their parents”","“a single great purpose”"],"k":0,"why":"Dormant means resting and not active. Paragraph 4 says the butterflies stay in a kind of pause instead of mating, which is a clue to the meaning."},{"on":"a","t":"mc","skill":"author's purpose","q":"What is the author's main purpose in paragraph 9?","o":["to explain dangers to the migration and ways people are helping","to persuade readers to travel to Mexico and visit the butterfly reserve","to describe how milkweed plants grow along busy roadsides","to compare the monarch migration to a long, busy highway"],"k":0,"why":"Paragraph 9 names threats like losing milkweed and illegal logging, then describes protections such as the reserve and milkweed gardens. The highway is just one comparison, not the main purpose."},{"on":"b","t":"mc","skill":"theme","q":"Which statement best expresses the theme of the poem?","o":["A journey can connect many generations even when no one finishes it alone.","Traveling to faraway new places is the best way to discover who you really are.","It is better to stay in one safe place than to risk a long journey.","Every traveler must learn the way by following someone older."],"k":0,"why":"In the last stanza the speaker says no one has traveled every mile, yet the road is never broken. The direction is passed down, which connects generations."},{"on":"b","t":"mc","skill":"word choice","q":"In stanza 3, the speaker says the butterflies are “embers on the branches.” What does this phrase suggest?","o":["The orange butterflies glow quietly, as if they are resting but still alive.","The butterflies are in danger of being burned by a fire in the forest.","The butterflies are angry because they are stuck high up in the trees.","The butterflies are falling off the branches one by one because they are far too tired to hold on."],"k":0,"why":"Embers are glowing bits of a fire that are calm but still warm. The word makes the resting orange butterflies seem quiet but full of life."},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the speaker feel about not knowing the places their ancestors saw?","o":["The speaker accepts it and trusts an inner sense to show the way.","The speaker is upset and wishes to fly back to see the meadow.","The speaker is confused and worries about getting lost among the busy cities.","The speaker is proud of having explored every mile of the road."],"k":0,"why":"The speaker never saw the meadow but describes a feeling like a needle that pulls them south. In stanza 5 the speaker says future butterflies will feel it too, which shows trust, not worry.","ev":["b1.3","b5.4"],"evq":"Part B: Click the line in the poem that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"In stanza 5, what is the “pilgrim map that no one ever brings”?","o":["the sense of direction the butterflies are born with","a paper map that older butterflies give to younger ones","the path of milkweed plants that grows across the land","the memory of the long trip that the speaker made the year before"],"k":0,"why":"No butterfly carries a real map, and the speaker says their descendants won't remember where the speaker has been. The map must be the built-in sense of direction, the needle described in stanza 1."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the poem's point of view add to what readers learn from Text 1?","o":["It imagines the trip from inside a butterfly; Text 1 explains it from outside with facts.","It gives exact distances and dates that Text 1 leaves out of its explanation.","It argues that people should protect monarchs, while Text 1 only tells a story.","It describes the spring trip north, while Text 1 describes only the fall trip south."],"k":0,"why":"The poem is told by a butterfly (“I”), so readers imagine how the trip might feel. Text 1 is written by an outside author who explains the science."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: Which idea from Text 1 does the poem express in stanza 2?","o":["Monarchs keep track of time to follow the sun's movement across the sky.","Monarchs rest in huge clusters on oyamel trees to stay warm in winter.","Monarchs depend on milkweed plants that grow along rivers and fields.","Monarchs travel through cities because they like the warm air over busy highways."],"k":0,"why":"Text 1 explains that monarchs use the sun plus clocks in their antennae. Stanza 2 says the sun crossed the sky while “something in my antennae kept the hours.”","ev":["b2.4","b2.3"],"evq":"Part B: Click the line in the poem (Text 2) that best supports your answer to Part A."}],"write":{"prompt":"Both texts describe how monarch butterflies complete their migration even though no single butterfly makes the whole trip. Explain how each text shows this idea. Use at least one detail from each text.","model":"Both texts show that the monarch migration works because each generation does its part. In Text 1, the author compares the trip to a relay race in which “each runner carries the baton for part of the course.” Spring and summer generations move north a little at a time, and then the super generation flies all the way to Mexico. The poem shows the same idea through a butterfly's voice. The speaker says, “No one of us has traveled every mile of this long road, yet the road is never broken.” This means the journey continues even though each butterfly only knows its own piece. Text 1 explains the science, while the poem helps us feel it. Together they show that the migration is a team effort across time.","need":["States a claim about how the migration is shared across generations","Uses a detail from Text 1 (such as the relay race or super generation)","Uses a detail or line from the poem","Explains how each detail supports the claim"]}},{"id":"s03-mexia","theme":"Plants and the People Who Study Them","a":{"title":"Ynés Mexía: A Late Bloomer","genre":"Biography","topic":"History of Science","gloss":{"botanist":["a scientist who studies plants","botánica / botánico"],"specimens":["samples collected so they can be studied","especímenes, muestras"],"expedition":["a long trip taken for a special purpose, such as research","expedición"],"persistence":["the quality of continuing to try even when things are hard","persistencia, perseverancia"],"independent":["not controlled or led by others; on your own","independiente"],"genus":["a group of closely related species","género"],"remarkable":["unusual in a way that is worth noticing","notable, extraordinario"],"foreshadowed":["gave an early hint of something that would happen later","anticipó, presagió"]},"paras":[["Most people imagine that scientists discover their passion when they are young.","Ynés Mexía did not even take her first botany class until she was past fifty.","Yet in about thirteen years, she became one of the most productive plant collectors of her time, traveling from the mountains of Mexico to the snowfields of Alaska and the rivers of South America.","Her story shows that it is never too late to find the work you were meant to do."],["Ynés Mexía was born on May 24, 1870, in Washington, D.C.","Her father, Enrique Mexía, was a Mexican diplomat, and her mother, Sarah Wilmer, was American.","When Ynés was about three years old, her father returned to Mexico, and her mother moved the family to a ranch in Texas.","Her childhood was unsettled; she moved often and attended schools in several places.","She was a quiet girl who loved reading and spending time outdoors, a habit that foreshadowed her later life."],["In 1887, when she was a teenager, Ynés moved to Mexico to live with her father.","She stayed for many years, and after he died she managed the family property.","Her adult life in Mexico was difficult.","Her first husband died, and her second marriage ended after the family's money was lost.","In 1909, at the age of thirty-nine, she moved to San Francisco, California, to recover her health and begin a new life."],["In San Francisco, Mexía found work as a social worker, helping families in need.","She also joined the Sierra Club, an organization that led hikes and camping trips in the wilderness of Northern California.","On these trips, she grew fascinated by the plants she saw and by the people who could name and explain them.","In 1921, at the age of fifty-one, she enrolled in classes at the University of California, Berkeley, where she studied natural science.","She never finished a degree, but the classes changed her life."],["In 1922, Mexía joined a university collecting trip led by a Berkeley paleontologist, and she discovered how much she loved gathering specimens in the field.","In 1925, she traveled to western Mexico with a group led by a botanist from Stanford University.","The expedition did not go smoothly.","Mexía fell from a cliff and broke several ribs and injured her hand.","Many people would have gone home for good.","Instead, Mexía recovered and soon began planning trips of her own."],["Over the next few years, Mexía became an independent collector.","She paid for much of the work herself, and she sent extra sets of the plants she gathered to museums and universities, which wanted them for their research collections.","Collecting was hard, careful work.","For each plant, she had to dig or cut a good sample, press it flat between sheets of paper, dry it, and record exactly where and when she found it.","In December 1926, near Puerto Vallarta, she collected a flowering plant so unusual that scientists later named a whole new genus after her: Mexianthus."],["Her adventures grew bolder.","In 1928, she spent a summer collecting in Mount McKinley National Park in Alaska, the area now known as Denali National Park.","The next year, she began her most famous expedition, a journey across South America that lasted about two and a half years.","She traveled roughly 3,000 miles, much of it by canoe along the Amazon River, all the way to its source in the Andes Mountains.","Along the way she slept in rough camps, crossed rushing rivers, and gathered tens of thousands of specimens."],["Mexía's persistence produced remarkable results.","During her short career, she collected about 145,000 plant specimens.","Scientists have identified about 500 new species among her collections, and around 50 species have been named in her honor.","Her specimens are still stored in museums and herbaria around the world, where researchers continue to study them today."],["In 1938, while collecting in the Mexican state of Oaxaca, Mexía became ill.","She returned to California and was diagnosed with lung cancer.","She died in Berkeley on July 12, 1938, at the age of sixty-eight.","In her will, she left money to the Sierra Club and to the Save the Redwoods League, which used the gift to protect a forest canyon full of ferns."],["Ynés Mexía did not follow the usual path to becoming a scientist.","She started late, faced serious setbacks, and worked in a field where few women were welcome.","Still, she followed her curiosity across mountains, glaciers, and jungles.","Today, every pressed flower she left behind is a small reminder that a person can bloom at any age."]]},"b":{"title":"Every School Should Have a Garden","genre":"Opinion essay","gloss":{"audience":["a group of people who watch or listen","público, audiencia"],"observant":["good at noticing things","observador"],"evidence":["facts or information that show whether something is true","evidencia, pruebas"],"maintenance":["the work needed to keep something in good condition","mantenimiento"],"inactive":["not doing anything; not in use","inactivo"],"underestimate":["to think something is smaller or less important than it really is","subestimar"]},"paras":[["Last spring, my science class planted bean seeds in paper cups on the windowsill.","Most of them died within two weeks, and by the end of the unit, nobody cared.","I think that is because a cup on a windowsill is not a real place.","Every school should have a garden, because a garden turns science from something we read about into something we do."],["First, a garden makes learning hands-on.","In a garden, students can measure how tall plants grow each week, test which spot gets the most sunlight, and keep data in a notebook just like real scientists.","They can see insects pollinating flowers instead of watching a video about it.","When you are part of the experiment instead of the audience, you become more observant, and you remember what you learn."],["Second, a garden teaches responsibility and teamwork.","Plants do not wait for you to feel like watering them.","If a class forgets for a week in June, the whole bed of lettuce can wilt.","Students would have to make schedules, share jobs, and solve problems together.","Those are skills that matter in every subject and in every job."],["Third, a garden can change what students eat.","Many kids who refuse vegetables at dinner will try a tomato they grew themselves.","A school garden could even supply some fresh food for the cafeteria or for families in the neighborhood."],["Some people argue that schools do not have the space, money, or time for a garden.","They point out that gardens need maintenance and that the soil is inactive for much of the winter in places like Massachusetts.","These are fair concerns.","However, a garden does not have to be big.","A few raised beds or even large pots on a sunny patio would work.","Local garden clubs and families often donate seeds and tools, and the winter months can be used for planning, starting seeds indoors, and studying the evidence students collected in the fall."],["Ynés Mexía did not become a famous botanist by reading about plants in a classroom.","She went outside, got her hands dirty, and looked closely.","Students deserve the same chance.","Adults should not underestimate what kids can grow when they are given a little soil and a lot of trust.","Let's stop killing bean plants on windowsills and start building gardens where real learning can take root."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 1?","o":["Ynés Mexía began studying plants late in life but became an important botanist.","Ynés Mexía traveled to Alaska and South America to collect thousands of plants for museums.","Ynés Mexía had a difficult childhood because her family moved often between several places.","Ynés Mexía proved that scientists must earn a college degree before they can make discoveries."],"k":0,"why":"The biography follows Mexía from her late start (paragraphs 1 and 4) to her huge success as a collector (paragraph 8). The other choices are only parts of her story, or wrong: she never finished a degree."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author mainly organize the information in Text 1?","o":["in time order, from Mexía's birth through her career and death","by comparing Mexía's life to the lives of other famous scientists","by describing a problem in botany and explaining how Mexía solved it","by listing every plant Mexía found, from the oldest one to the newest one"],"k":0,"why":"The paragraphs move through dates in order: 1870, 1887, 1909, 1921, 1925, 1928, and 1938. This is chronological, or time-order, structure."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What does Mexía's reaction to her accident in paragraph 5 show about her?","o":["She was determined and did not let a setback stop her.","She was careless and often took dangerous risks without thinking first.","She was discouraged and decided to work only in a lab.","She was unsure whether botany was right for her."],"k":0,"why":"In paragraph 5, Mexía broke ribs and hurt her hand, but she recovered and planned trips of her own. That shows determination.","ev":["a5.6"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, Mexía became an <b>independent</b> collector. The prefix in- means “not.” What does <b>independent</b> mean?","o":["not led by a group; working on her own","not careful about where the plants came from","not interested in working with any museums","not trained in how to collect and press plants"],"k":0,"why":"In- means not, so independent means not depending on others. Paragraph 6 says she paid for her own trips and planned them herself."},{"on":"a","t":"ms","skill":"key details","q":"Which details from Text 1 show that plant collecting was difficult work? Choose TWO answers.","o":["Each plant had to be pressed, dried, and recorded with its exact location.","On her South American trip she slept in rough camps and crossed rushing rivers.","She sent extra sets of the plants she gathered to museums and universities.","Around 50 species have been named in her honor by other scientists.","She joined the Sierra Club and went on hikes in Northern California."],"ks":[0,1],"why":"Paragraph 6 describes the careful steps for each plant, and paragraph 7 describes rough camps and rushing rivers. The other details are true but do not show that the work was hard."},{"on":"a","t":"ebsr","skill":"cause and effect","q":"Part A: According to paragraph 4, what led Mexía to become interested in plants?","o":["Hiking trips with the Sierra Club made her curious about plants.","Her father taught her the names of all the plants on the family ranch in Texas.","Her work as a social worker required her to study medicines.","A Stanford botanist hired her to help collect in Mexico."],"k":0,"why":"Paragraph 4 says that on Sierra Club trips she grew fascinated by the plants she saw. The Stanford trip came later, after she was already interested.","ev":["a4.3","a4.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"Read this sentence from paragraph 2: “She was a quiet girl who loved reading and spending time outdoors, a habit that <b>foreshadowed</b> her later life.” The prefix fore- means “before.” What does <b>foreshadowed</b> mean?","o":["gave an early hint of","made more difficult","was hidden from","came at the end of"],"k":0,"why":"Fore- means before, so foreshadowed means showed a sign of something before it happened. Her love of the outdoors as a child hinted at her later life outdoors collecting plants."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author include the facts in paragraph 8?","o":["to show how much Mexía achieved and how her work still matters","to explain how scientists decide on names for newly found plants","to compare the number of specimens Mexía collected each year","to show that most of Mexía's specimens were lost or thrown away after she died"],"k":0,"why":"Paragraph 8 gives big numbers, about 145,000 specimens and about 500 new species, and says researchers still study them today. These facts show her achievement and lasting importance.","ev":["a8.2","a8.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"point of view","q":"Which phrase from paragraph 10 best shows the author's attitude toward Mexía?","o":["“a person can bloom at any age”","“did not follow the usual path”","“across mountains, glaciers, and jungles”","“she started late, faced serious setbacks”"],"k":0,"why":"The author ends by saying that Mexía's flowers remind us “a person can bloom at any age.” This shows the author admires her and sees her as an inspiring example."},{"on":"b","t":"mc","skill":"main idea","q":"What is the writer's central claim in Text 2?","o":["Schools should have gardens because they make science learning real and hands-on.","Schools should grow beans on windowsills so students can watch plants grow.","Schools should stop teaching science units that students do not care about.","Schools should give away all of the vegetables they grow to the families who live in the neighborhood."],"k":0,"why":"In paragraph 1 the writer says every school should have a garden because it turns science into something students do. The rest of the essay supports that claim."},{"on":"b","t":"ebsr","skill":"point of view","q":"Part A: How does the writer respond to people who say schools lack space or money for a garden?","o":["She agrees the concerns are fair but explains that a garden can be small and supported by the community.","She says the concerns are silly and that every school already has plenty of space and money.","She agrees that a garden would cost too much and suggests using paper cups instead.","She ignores the concerns completely and moves on to talk about cafeteria food and what students like to eat."],"k":0,"why":"In paragraph 5, the writer calls the concerns “fair,” then answers them: a few raised beds or pots would work, and clubs and families often donate seeds and tools.","ev":["b5.4","b5.5","b5.6"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In the last paragraph, the writer says gardens are places “where real learning can take root.” What does this phrase suggest?","o":["Learning in a garden will grow strong and last, like a healthy plant.","Students will spend most of their time digging up roots in the soil.","Learning about plants is harder than learning about other subjects.","Students will learn very slowly, the same way that roots can take many years to form underground."],"k":0,"why":"Roots hold a plant firmly so it can grow. Saying learning will “take root” suggests it will become strong and stay with students, which fits the writer's argument."},{"on":"b","t":"mc","skill":"author's purpose","q":"Why does the writer begin the essay with the story of the bean seeds?","o":["to show a problem with the usual way of teaching about plants","to prove that beans are too difficult for students to grow","to explain step by step how to plant seeds in paper cups","to show that her science teacher did not enjoy gardening at all"],"k":0,"why":"The dead beans in paragraph 1 show that a cup on a windowsill did not make students care. The writer uses this problem to introduce her solution: a real garden."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: How does the writer of Text 2 use Ynés Mexía's story?","o":["as an example that people learn about plants best by working outdoors","as proof that schools need botanists to teach their science classes","as a reason that students should wait until they are older to garden","as an example of someone who planted a garden at the school she attended"],"k":0,"why":"In the last paragraph of Text 2, the writer says Mexía did not become famous by reading in a classroom; she went outside and looked closely. Text 1 shows the same thing through her field trips.","ev":["b6.1","b6.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"ab","t":"mc","skill":"compare texts","q":"How a
