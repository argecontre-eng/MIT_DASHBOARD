seful tools for staying dry during a storm.","It is impossible to fix something once it has been damaged."],"k":0,"why":"The poem describes an unseen shield that protects us, admits \"we never thought to thank it,\" and ends by asking readers to remember it. The message is to value and protect what keeps us safe."},{"on":"b","t":"mc","skill":"word choice","q":"In stanza 2, the poet calls the Sun's harmful rays <b>arrows</b>. What does this word suggest about the rays?","o":["They are sharp and can hurt living things.","They are slow and gentle like a breeze.","They are beautiful and fun to watch.","They are weak and easy to ignore."],"k":0,"why":"Arrows are sharp weapons that can wound. In stanza 2, the poet says they are \"too sharp for us to bear,\" which suggests the rays are dangerous."},{"on":"b","t":"ebsr","skill":"inference","q":"Part A: What does stanza 4 suggest about how the problem was solved?","o":["People around the world worked together to repair the damage.","One person fixed the problem alone without any help.","The umbrella repaired itself without anyone noticing.","Nobody listened to the warning, so the damage got worse."],"k":0,"why":"Stanza 4 says \"the whole world stopped to listen\" and \"mended it as a team,\" which shows people working together.","ev":["b4.4"],"evq":"Part B: Click the line in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"point of view","q":"In stanza 3, the speaker says \"we sprayed our clouds of haze.\" Why does the speaker use the word <b>we</b>?","o":["to show that all people shared responsibility for the damage","to show that the speaker personally invented the first spray cans","to show that the speaker is talking to the umbrella","to show that only scientists caused the problem"],"k":0,"why":"By saying \"we\" in stanza 3, the speaker includes everyone, suggesting that people in general caused the harm, not just one group."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does the poem's way of describing the ozone layer differ from the biography's?","o":["The poem uses an image of an umbrella, while the biography explains the chemistry.","The poem gives exact dates, while the biography uses only comparisons.","The poem names Mario Molina, while the biography never mentions him.","The poem says the ozone layer cannot be saved, while the biography says it can."],"k":0,"why":"The poem compares the ozone layer to an \"unseen umbrella\" with \"silver fabric.\" The biography explains how CFCs, chlorine atoms, and ultraviolet light affect ozone."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In stanza 4 of the poem, \"someone looked up closely / and saw the thinning seam.\" Which event from the biography does this line most likely describe?","o":["scientists discovering that CFCs could damage the ozone layer","Molina earning his doctorate at the University of California","Molina winning the Nobel Prize in Chemistry in 1995","companies using CFCs to cool refrigerators and air conditioners"],"k":0,"why":"Seeing the \"thinning seam\" matches the moment when Molina and Rowland realized CFCs could make the ozone layer grow thin, which paragraph 5 of the biography describes.","ev":["a5.3"],"evq":"Part B: Click the sentence in Text 1 (the biography) that best supports your answer to Part A."}],"write":{"prompt":"Both texts describe the ozone layer as something that protects life on Earth. Explain how Text 1 and Text 2 each show the importance of the ozone layer. Use at least one detail from each text.","model":"Both texts show that the ozone layer is important because it shields life on Earth from harmful sunlight. In Text 1, the biography explains that ozone \"absorbs much of the Sun's harmful ultraviolet radiation,\" which can cause sunburn and skin cancer and damage plants and ocean life. This fact shows why Molina worked so hard to warn people about CFCs. In Text 2, the poem describes the ozone layer as an \"unseen umbrella\" that catches \"arrows from the Sun\" but lets gentle sunlight through. The image of an umbrella helps readers picture how the layer protects us. The biography explains the science, while the poem helps readers feel how valuable the shield is. Together, they show why the world needed to protect it.","need":["States a claim about why the ozone layer is important","Uses a detail from the biography about ultraviolet radiation or its effects","Uses a detail from the poem, such as the umbrella or arrows image","Explains how each text shows the ozone layer's importance"]}},{"id":"s26-dustbowl","theme":"The Dust Bowl","a":{"title":"Black Sunday","genre":"Historical fiction","topic":"Literature","gloss":{"rippled":["shaped into small waves or ridges","ondulado"],"inspected":["looked at closely and carefully","inspeccioné"],"thunderhead":["a very tall, dark storm cloud","nubarrón de tormenta"],"kerosene":["a kind of oil burned in old lamps for light","queroseno"],"gritty":["full of tiny bits of sand or dirt","arenoso"],"rearranged":["moved around and changed into a new order","reorganizado"],"stubborn":["refusing to give up or give in","tercos"]},"paras":[["The fourteenth of April, 1935, began as the finest day our corner of the Oklahoma Panhandle had seen in months.","After weeks of grit hissing against the windows, the sky was a clean, polished blue, and the air lay so still that the windmill blades hardly turned.","Mama threw open every door in the house.","\"Air it out, Ruthie,\" she told me, handing me a stack of quilts.","\"Shake every last speck of that dirt into the yard.\"","I was twelve that spring, and I believed a blue sky was a promise."],["All morning our neighbors seemed to share the same idea.","I could see the Petersons' laundry flapping two fields away, and Pa drove the truck to church for the first time since February.","Afterward he walked the north field with his hat pushed back, kicking at the loose soil.","Where wheat should have stood ankle-high, there were only a few pale shoots and long, rippled drifts of dust, shaped like waves on a dry brown sea.","\"It just needs one good rain,\" Pa said, the same words he had repeated every week for a year.","Each time he said them, they sounded a little thinner."],["Early in the afternoon, my little brother, Amos, noticed the birds first.","Flocks of them were streaming south across the yard, hundreds at a time, flying low and fast and silent.","Then our hens, who never went to roost before sundown, began crowding into the henhouse as if night had already come.","Our milk cow, Daisy, trotted in nervous circles at the far end of the pen.","I inspected the sky in every direction, searching for the trouble the animals seemed to feel, and saw nothing but blue."],["Then Amos tugged my sleeve and pointed north.","Along the edge of the world, a dark line had appeared, as if someone had drawn a pencil stroke across the bottom of the sky.","In the time it took me to breathe twice, the line grew into a wall.","It was taller than any thunderhead, rolling toward us and boiling at the top, black as the inside of a stove.","It did not look like weather.","It looked like the end of something."],["\"Inside!\" Mama shouted from the porch, and her voice cracked like a whip.","We ran.","Pa sprinted from the barn, and the four of us slammed the doors and windows just as the dust struck the house with a roar like a freight train passing an arm's length away.","The daylight vanished instantly.","I held my hand in front of my face and could not see my own fingers.","Amos started to cry, and I found him by his sound and pulled him close."],["Mama did not waste a moment on fear.","She lit the kerosene lamp, though it made only a weak brown glow in the gritty air, and she soaked bedsheets in the washtub and hung them over the windows to catch the dust.","She tied damp dish towels over our noses and mouths.","\"Breathe slow,\" she said calmly.","\"This house has stood through worse, and so will we.\"","I did not know whether she believed it, but her steady hands made me want to."],["The storm raged for hours.","Dust crept through every crack and keyhole, settling on the table, in our hair, and between our teeth.","Pa sat by the door without speaking.","Once, I heard him murmur to Mama, \"Maybe your sister is right about California.\"","Mama didn't answer, but I saw her reach over and squeeze his hand.","I understood then that the dust was trying to take more than our wheat."],["When the air finally cleared that night, we stepped outside into a world that had been rearranged.","Drifts of fine dirt were piled against the fence posts like snow, and the road had disappeared completely.","Pa's truck sat half-buried in a gray dune.","Daisy was coated in dust but alive, and the hens came out one by one, blinking and complaining."],["The next morning, I walked to the north field alone.","Most of it was a smooth, empty sheet of dust, but in the shelter of a fence row, where the wind had curled away from the ground, a small cluster of wheat shoots still stood, bent but green.","I knelt and brushed them clean with my fingertips.","Then I ran to get Pa.","He stood looking at those few stubborn shoots for a long time.","\"Well,\" he said at last, and something in his voice had grown strong again, \"I reckon we'll stay one more season.\""]]},"b":{"title":"Why the Plains Blew Away","genre":"Informational","gloss":{"anchored":["held firmly in place","anclado"],"drought":["a long period with little or no rain","sequía"],"topsoil":["the top layer of soil, where plants grow best","capa superior del suelo"],"erosion":["the wearing away of soil by wind or water","erosión"],"furrow":["a long, narrow ditch made in the ground by a plow","surco"],"shelterbelts":["rows of trees planted to block the wind","cortinas rompevientos"],"conservation":["the careful protection of nature so it is not used up or ruined","conservación"]},"paras":[["The dust storms of the 1930s were not caused by bad weather alone.","They were the result of a natural disaster and a human-made one striking the same place at the same time.","To understand the Dust Bowl, you have to look underground, at the roots of the prairie grass."],["For thousands of years, the southern Great Plains were covered with tough native grasses.","Their roots formed a thick, tangled mat beneath the surface that held the soil in place and trapped moisture, even during dry spells.","Fierce winds swept across the plains, but the grass kept the earth anchored."],["In the early 1900s, settlers and investors looked at the plains and saw a giant wheat field waiting to happen.","During World War I, the price of grain climbed to record highs, and farmers rushed to plant more.","New tractors made the work faster, so a farmer could plow in a few hours what once took days by hand.","Across the Great Plains, millions of acres of grassland were plowed under to grow wheat.","When grain prices crashed after the war, many farmers plowed even more land to try to earn the same income."],["Then, beginning in 1931, a severe drought struck.","The rain stopped, the wheat withered, and nothing was left to cover the bare, loose topsoil.","Without the grass roots to anchor it, the dry soil simply lifted into the wind.","Giant dust clouds called \"black blizzards\" rolled across the region.","On April 14, 1935, a day remembered as Black Sunday, one of the worst storms turned afternoon into darkness across parts of Oklahoma, Texas, and Kansas.","Experts estimated that in 1935 alone, about 850 million tons of topsoil blew off the southern plains."],["Less than two weeks after Black Sunday, on April 27, 1935, Congress created the Soil Conservation Service to fight erosion.","Its agents taught farmers new methods.","In contour plowing, farmers plow across a slope, following the natural curves of the land instead of plowing straight up and down.","Each furrow acts like a tiny dam, holding rainwater so it soaks in instead of washing the soil away.","Farmers also planted shelterbelts, long rows of trees that broke the force of the wind.","They rotated their crops and left plant stubble on the fields to cover and protect the soil."],["These methods worked.","By 1938, conservation efforts had cut the amount of blowing soil by about 65 percent, and the drought finally broke with the return of rain in the fall of 1939.","Today, the lesson of the Dust Bowl still guides farmers: land stays healthy only when people protect what holds it together."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes what the story is mostly about?","o":["A family lives through a terrible dust storm and finds a small reason to keep hoping.","A girl learns to protect a farmhouse by hanging wet sheets over the windows.","A farm family decides to move to California after a dust storm ruins their whole wheat crop.","Two children discover that farm animals can predict the weather before people can."],"k":0,"why":"The story follows Ruthie's family from the calm morning, through the storm, to the surviving wheat in paragraph 9 that makes Pa decide to stay. The other choices are small details or things that never happen."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: In paragraph 6, what do Mama's actions during the storm show about her?","o":["She stays calm and practical so her family will feel safe.","She is more frightened of the storm than anyone else in the family.","She is angry at Pa for not leaving the farm sooner.","She does not understand how dangerous the storm is."],"k":0,"why":"Paragraph 6 says Mama 'did not waste a moment on fear.' She gets to work with wet sheets and towels and speaks calmly, which shows she is steady and practical.","ev":["a6.1","a6.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"word choice","q":"Part A: In paragraph 2, Ruthie says that each time Pa repeats \"It just needs one good rain,\" the words sound \"a little thinner.\" What does this phrase suggest?","o":["Pa is slowly losing hope that the rain will save the farm.","Pa's voice is weak because the dust has made him sick.","Pa is speaking softly so the neighbors will not hear him.","Pa is becoming more certain that one rain will fix the farm."],"k":0,"why":"Words that sound 'thinner' have less strength behind them, so Pa believes them less each time. Later, in paragraph 7, he even wonders about moving to California.","ev":["a7.4"],"evq":"Part B: Click the sentence from a LATER paragraph of Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 3, Ruthie says she <b>inspected</b> the sky in every direction. The root <i>spect</i> means \"look.\" What does <b>inspected</b> mean?","o":["looked at closely and carefully","pointed at quickly and nervously","turned away from completely","described out loud to others"],"k":0,"why":"The root spect means 'look,' and in- here means 'into,' so inspected means looked into something closely. Ruthie is searching the whole sky for trouble."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 8, the family steps outside into \"a world that had been <b>rearranged</b>.\" What does <b>rearranged</b> suggest about the farm?","o":["Familiar things had been moved, buried, or changed by the dust.","The buildings had been put carefully back in their places.","The fields had been plowed and planted again in new, straight rows.","The animals had been moved to a different pen for safety."],"k":0,"why":"The prefix re- means 'again,' so rearranged means put in a new order. Paragraph 8 shows dirt piled like snow, a missing road, and a half-buried truck."},{"on":"a","t":"mc","skill":"text structure","q":"How does the author organize paragraphs 1 through 4?","o":["She describes a calm, hopeful morning and then builds toward the storm's sudden arrival.","She compares two different dust storms that the family lived through in two years.","She explains what caused the storm before showing how it damaged the farm.","She begins after the storm and then flashes back to tell how the day started."],"k":0,"why":"Paragraph 1 opens with a 'clean, polished blue' sky, paragraph 3 adds strange signs from the animals, and paragraph 4 shows the black wall. The calm first part makes the storm feel more shocking."},{"on":"a","t":"mc","skill":"point of view","q":"The story is told by Ruthie, using the words \"I\" and \"we.\" How does this point of view affect the story?","o":["Readers feel Ruthie's fear and confusion as the storm happens around her.","Readers learn exactly what every character secretly thinks, hopes, and plans.","Readers get scientific facts about how the dust storm formed.","Readers see the storm through Pa's eyes while he is in the barn."],"k":0,"why":"Because Ruthie tells the story, we see only what she sees and feels, such as not being able to see her own fingers in paragraph 5. We do not know for sure what Mama believes, because Ruthie doesn't know either."},{"on":"a","t":"ms","skill":"theme","q":"Which TWO statements express themes of the story? Choose TWO answers.","o":["Hope can survive even when things look hopeless.","A family's courage and care can carry people through hard times.","Farm animals understand the weather better than people do.","People should always move away when times become difficult.","A clear blue sky is a sign that bad luck has ended."],"ks":[0,1],"why":"The green shoots in paragraph 9 show that hope survives, and Mama's steady care in paragraph 6 shows how a family gets through hard times together. The animals and the blue sky are details, not lessons."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: What is the most likely reason Pa decides to stay \"one more season\" at the end of the story?","o":["The surviving wheat gives him new hope that the farm can recover.","The storm has proved that the farm is safe from future dust.","Mama's sister has written to say there are no jobs in California.","The neighbors have promised to help him replant the north field."],"k":0,"why":"In paragraph 9, Pa stares at the 'stubborn shoots' for a long time, and then his voice has 'grown strong again.' Seeing that some wheat survived gives him hope.","ev":["a9.5","a9.6"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["Drought struck land stripped of its grass, causing the Dust Bowl, and new farming methods helped heal it.","World War I raised the price of grain, so farmers bought tractors to plant more wheat.","Black Sunday was a terrible storm that turned afternoon into darkness across three states.","Droughts are the only real cause of dust storms, and farmers have never been able to do anything to prevent them."],"k":0,"why":"Text 2 explains both causes (plowing in paragraph 3 and drought in paragraph 4) and the solutions in paragraphs 5 and 6. The other choices are single details or the opposite of what the text says."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 3, the author says settlers saw the plains as \"a giant wheat field <b>waiting to happen</b>.\" What does this phrase suggest?","o":["People saw the grassland only as a place to grow crops, not as something worth protecting.","People thought the plains already had too much wheat growing on them.","People believed the wheat would plant itself without any human help.","People were worried that the grassland was too dry for any crops."],"k":0,"why":"Saying the plains were 'waiting to happen' as a wheat field suggests people thought the grass was useless and the land was only waiting to be plowed. Paragraph 2 shows the grass was actually holding the soil together."},{"on":"b","t":"ebsr","skill":"cause and effect","q":"Part A: According to Text 2, why did the soil blow away during the drought?","o":["The grass roots that once held the soil had been plowed up.","Tractors had packed the soil down too hard for any rain to soak in.","Rows of trees had blocked the rain clouds from the plains.","The wheat had grown so tall that it dried out the soil."],"k":0,"why":"Paragraph 2 explains that grass roots held the soil in place, and paragraph 4 says that without those roots the dry soil 'simply lifted into the wind.'","ev":["b4.3","b2.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"inference","q":"Based on paragraph 3, why did many farmers plow even MORE land after grain prices crashed?","o":["Each bushel earned less money, so they needed more bushels to earn the same amount.","The government paid farmers extra money for every new acre they plowed.","The drought had already started, and wheat grew better in dry weather.","Prices were still at record highs, so planting more land seemed like a sure way to get rich."],"k":0,"why":"Paragraph 3 says farmers plowed more land 'to try to earn the same income.' If each bushel is worth less, you have to sell more of them to make the same money."},{"on":"ab","t":"mc","skill":"compare texts","q":"How does Text 2 add to a reader's understanding of Text 1?","o":["It explains why the soil on farms like Ruthie's could blow away so easily.","It describes what happened to Ruthie's family in the years after the storm.","It proves that Ruthie's family made a mistake by not moving away.","It retells the events of Black Sunday from Pa's point of view."],"k":0,"why":"Text 1 shows what Black Sunday felt like for one family, while Text 2 gives the reasons behind it, such as plowed-up grass and drought. Text 2 never mentions Ruthie's family."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 1, a few wheat shoots survive \"in the shelter of a fence row.\" Which idea from Text 2 does this detail best connect to?","o":["Blocking the wind can help protect soil and plants.","Tractors made it possible to plow land very quickly.","High grain prices convinced farmers to plant more wheat.","Plowing across a slope helps rainwater soak into the soil."],"k":0,"why":"The fence row in Text 1 blocked the wind, just as the shelterbelts in Text 2, paragraph 5, 'broke the force of the wind.' Both show that a windbreak protects the land.","ev":["b5.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Both texts show people facing the dust storms of the 1930s. Explain how the people in Text 1 and the people in Text 2 each fought back against the dust. Use at least one detail from each text.","model":"In both texts, people refuse to let the dust win, but they fight it in different ways. In Text 1, Mama protects her family during Black Sunday. She hangs wet bedsheets over the windows and ties damp towels over the children's faces, and she tells them, \"This house has stood through worse, and so will we.\" In Text 2, people fight the dust by changing how they farm. The Soil Conservation Service taught contour plowing and planting shelterbelts, and by 1938 blowing soil had dropped by about 65 percent. Mama's fight lasts one afternoon and keeps her family safe, while the farmers' fight lasts for years and protects the whole region. Together, the texts show that people survived the Dust Bowl through both courage and smart solutions.","need":["States a claim about how people fought back against the dust","Uses a detail from Text 1, such as Mama's wet sheets or towels","Uses a detail from Text 2, such as contour plowing or shelterbelts","Explains how each detail shows people fighting back"]}},{"id":"s27-icarus","theme":"Flying Too High","a":{"title":"The Boy Who Flew Too High","genre":"Myth","topic":"Literature","gloss":{"Labyrinth":["a huge, confusing maze","laberinto"],"miser":["a greedy person who hoards money and hates to share","avaro"],"coaxed":["gently persuaded to come closer","atrajo con paciencia"],"quills":["the hard, hollow ends of feathers","cañones de las plumas"],"astonishment":["great surprise","asombro"],"weightless":["feeling as if you weigh nothing at all","ingrávido"],"glorious":["wonderfully bright and beautiful","glorioso"]},"paras":[["Long ago, on the island of Crete, there lived an inventor named Daedalus whose hands could make almost anything.","He had carved statues so lifelike that people swore they moved, and he had designed the Labyrinth, a maze so tangled that whoever entered it could never find the way out.","King Minos valued Daedalus the way a miser values gold: he refused to let it leave his sight.","When Daedalus asked permission to return home to Athens with his young son, Icarus, the king's answer was a tower with a locked door."],["From the tower window, Daedalus could see the endless blue sea and the ships of Minos guarding every harbor.","\"He controls the land and the water,\" Daedalus muttered, pacing the stone floor.","\"But he does not control the sky.\"","Icarus, who was perhaps twelve, looked up from the pebbles he was tossing.","\"Nobody can control the sky, Father,\" he said.","\"Nobody can travel through it, either.\"","Daedalus only smiled, because he had been watching the gulls."],["For weeks the inventor studied the birds that circled the tower.","He noticed how their wings were curved on top, how the long feathers overlapped like roof tiles, and how the birds tilted to ride the wind instead of fighting it.","He coaxed gulls to the windowsill with scraps of bread and gathered every feather that drifted into the room.","He arranged them in rows from the smallest to the largest, binding the quills with thread and sealing them with soft beeswax melted over a candle.","Icarus helped, though he was more interested in pressing his thumb into the warm wax and blowing feathers into the air than in following his father's careful pattern.","Slowly, two pairs of wings took shape, light and strong and gently curved."],["On the morning they were finished, Daedalus strapped the larger wings to his own shoulders and rose a little way above the floor, beating the air.","Icarus whooped with delight.","But when his father landed, his face was serious.","He fastened the smaller wings onto his son with trembling hands.","\"Listen to me carefully,\" he said.","\"Fly the middle path.","If you go too low, the spray of the sea will soak your feathers and drag you down.","If you go too high, the heat of the sun will soften the wax.","Stay close to me, and do not show off.\"","Icarus nodded, but his eyes were already on the open window."],["They leaped together.","For one terrible instant they dropped toward the rocks, and then the wings caught the wind, and the tower fell away beneath them.","Fishermen pulling in their nets looked up and dropped them in astonishment; a shepherd leaning on his staff decided he must be seeing gods.","Daedalus flew steadily, glancing back again and again to make sure his son was near."],["At first Icarus obeyed.","But the air was so smooth, and his body felt so weightless, that the warning began to seem like the worries of an old man who had forgotten how to have fun.","He swooped down until his toes almost skimmed the waves, then shot upward, laughing.","Each climb was a little higher than the last.","The sky seemed to pull him, and the sun grew brighter and more glorious above him, and Icarus wanted to reach it more than he had ever wanted anything.","Far below, his father's voice called his name, but the wind tore the sound to pieces."],["Then a single feather slipped loose and spun away.","Another followed, and another.","Icarus beat his arms harder, but bare arms cannot hold a body in the air.","He cried out for his father, and then the sea closed over him."],["Daedalus circled the spot again and again until he saw the feathers floating on the water.","He reached land alone.","People say he buried his son on a nearby island, which came to be called Icaria, and that he hung up his own wings in a temple and never flew again.","The sea where Icarus fell still carries his name, the Icarian Sea."],["For thousands of years, people have told this story as a warning about pride, about children who ignore their parents, and about wanting too much, too fast.","Yet some listeners notice something else.","It was Daedalus who first dreamed of the sky, and Icarus who believed the dream more completely than anyone.","Perhaps the story is not only about falling, but also about how dangerous, and how beautiful, it is to fly."]]},"b":{"title":"Why Icarus Would Have Frozen","genre":"Informational","gloss":{"atmosphere":["the layer of air that surrounds Earth","atmósfera"],"troposphere":["the lowest layer of the atmosphere, where weather happens","troposfera"],"lapse rate":["how fast air temperature drops as you go higher","gradiente térmico"],"expands":["spreads out and takes up more space","se expande"],"pressure":["the force of air pushing on something","presión"],"fraction":["a small part of a whole","fracción"]},"paras":[["In the myth of Icarus, a boy flies too close to the sun, and its heat melts the wax holding his wings together.","It is a powerful story, but it gets the science backward.","If Icarus had really climbed higher into the sky, he would have felt colder, not hotter."],["Earth's atmosphere is divided into layers.","The lowest layer, where we live and where almost all weather happens, is called the troposphere.","On average, it stretches about 12 kilometers (roughly 7 miles) above the surface, though it is thicker near the equator and thinner near the poles.","Within the troposphere, the air temperature usually drops as you go higher.","Scientists call this change the lapse rate.","The average lapse rate is about 6.5 degrees Celsius for every kilometer you climb, or about 3.6 degrees Fahrenheit for every 1,000 feet."],["Why does the air cool with height?","Most sunlight passes straight through the air without heating it much.","Instead, the sunlight warms the ground and the oceans, and they warm the air just above them, like a pot of water heated from the bottom.","The air closest to the surface is the warmest.","Higher up, the air is also under less pressure, so rising air expands, and expanding air cools down."],["These numbers add up quickly.","On a day when the temperature at sea level is a pleasant 15 degrees Celsius (59 degrees Fahrenheit), the air about 10 kilometers up, where passenger jets cruise, is typically around 50 degrees below zero.","That is why mountaintops can stay snowy all summer, and why airplane windows can feel icy cold to the touch even on a sunny flight."],["What about getting closer to the sun?","The sun is about 150 million kilometers away from Earth.","Climbing even a few kilometers higher brings you closer by only a tiny fraction of that distance, far too little to make the sunlight noticeably hotter.","Beeswax melts at roughly 62 to 64 degrees Celsius, which is far hotter than the air anywhere Icarus could have flown.","The real danger at great heights would have been freezing cold and thin air with too little oxygen to breathe."],["None of this ruins the myth.","The ancient Greeks were not writing a science lesson; they were warning about pride and the danger of ignoring good advice.","Still, if Daedalus had been a modern engineer, he might have given his son a different warning: \"Don't fly too high, or you'll freeze!\""]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"Which statement best describes what the myth is mostly about?","o":["A boy ignores his father's warning while escaping by air and falls to his death.","An inventor builds a maze so tangled that nobody can ever find the way out of it.","A king locks up an inventor because he wants to keep his inventions secret forever.","A father and son study gulls for weeks to learn how birds ride the wind."],"k":0,"why":"The main events are the escape on wings, Daedalus's warning in paragraph 4, and Icarus flying too high and falling in paragraphs 6 and 7. The other choices are details from the beginning of the story."},{"on":"a","t":"mc","skill":"word choice","q":"In paragraph 1, the author writes that King Minos valued Daedalus \"the way a <b>miser</b> values gold.\" What does this comparison suggest about the king?","o":["He sees Daedalus as a treasure to keep for himself, not as a free person.","He pays Daedalus a large amount of gold for every invention he makes.","He is a generous ruler who shares his riches with the people of Crete.","He respects Daedalus as a close friend and trusts him with all of his gold."],"k":0,"why":"A miser hoards gold and won't let it go. The comparison shows that Minos treats Daedalus like a possession, which is why he locks him in a tower."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: Based on paragraph 3, how is Icarus different from his father while the wings are being built?","o":["Icarus is playful, while Daedalus is patient and careful.","Icarus is careful, while Daedalus is rushed and sloppy.","Icarus is frightened, while Daedalus is bold and reckless.","Icarus is bored, while Daedalus is angry and impatient."],"k":0,"why":"In paragraph 3, Daedalus studies birds 'for weeks' and follows a 'careful pattern,' while Icarus presses his thumb into the wax and blows feathers into the air.","ev":["a3.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, Icarus feels <b>weightless</b>. The suffix <i>-less</i> means \"without.\" What does <b>weightless</b> mean?","o":["as if he had no weight at all","heavier than he had ever been","unable to carry any weight","worried about losing weight"],"k":0,"why":"The suffix -less means 'without,' so weightless means 'without weight.' Flying makes Icarus feel light, as if nothing is pulling him down."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, fishermen drop their nets in <b>astonishment</b>. The suffix <i>-ment</i> turns a verb into a noun. What does <b>astonishment</b> mean?","o":["a feeling of great surprise","a feeling of deep sadness","a strong wish to escape","a loud shout of warning"],"k":0,"why":"To astonish is to surprise greatly, and -ment makes it a noun, so astonishment is the feeling of being very surprised. The fishermen have never seen people fly."},{"on":"a","t":"ebsr","skill":"inference","q":"Part A: In paragraph 6, why does Icarus fly higher and higher?","o":["He is thrilled by flying and starts to think the warning doesn't matter.","He is trying to escape from the soldiers that King Minos sent to chase them.","He cannot hear his father, so he does not know which way to go.","He believes the sun will dry his feathers after he skims the waves."],"k":0,"why":"Paragraph 6 says the warning 'began to seem like the worries of an old man,' and Icarus wants to reach the sun 'more than he had ever wanted anything.' His joy makes him forget the danger.","ev":["a6.2","a6.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 7 connect to paragraph 4 of the myth?","o":["It shows the exact danger that Daedalus warned about coming true.","It explains how Daedalus first got the idea to build the wings.","It describes a second escape that Daedalus makes years later.","It shows that Daedalus's warning about the sea spray was wrong."],"k":0,"why":"In paragraph 4, Daedalus warns that the sun will soften the wax. In paragraph 7, the feathers slip loose and Icarus falls, so the warning comes true."},{"on":"a","t":"ms","skill":"theme","q":"Which TWO statements are themes the story presents? Choose TWO answers.","o":["Ignoring wise advice can lead to disaster.","Big dreams can be both beautiful and dangerous.","Inventors should never share their ideas with kings.","Children are always wiser than their parents.","Gulls are the best teachers for human inventors."],"ks":[0,1],"why":"Icarus falls after ignoring his father's warning, and paragraph 9 says flying is both 'dangerous' and 'beautiful.' The other choices are not lessons the story teaches."},{"on":"a","t":"ebsr","skill":"author's purpose","q":"Part A: Why does the author most likely include paragraph 9 at the end of the myth?","o":["to suggest the story can mean more than just a simple warning","to explain exactly how Daedalus escaped from the island of Crete","to prove that the myth really happened thousands of years ago","to tell readers that Icarus was right to ignore his father"],"k":0,"why":"Paragraph 9 first gives the usual warning about pride, then says 'some listeners notice something else' and calls flying both dangerous and beautiful. The author wants readers to think about a deeper meaning.","ev":["a9.2","a9.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["Air in the lower atmosphere gets colder as you climb, so the sun would not have melted Icarus's wax.","The troposphere is about 12 kilometers thick on average and is the layer where nearly all of Earth's weather happens.","Beeswax melts at a much higher temperature than most people realize it does.","The ancient Greeks told the myth of Icarus to warn people about the dangers of pride."],"k":0,"why":"Paragraphs 1 through 5 explain that air gets colder with height and that the sun's heat would not change much, so the wax would not melt. The other choices are details from single paragraphs."},{"on":"b","t":"ebsr","skill":"key details","q":"Part A: According to paragraph 3, why is the air near the ground usually warmer than the air high above it?","o":["The ground absorbs sunlight and warms the air right above it.","The sun shines more brightly on the ground than on the sky.","Clouds trap cold air high up so it cannot reach the ground.","Air near the ground is thinner, so it heats up much more quickly."],"k":0,"why":"Paragraph 3 explains that sunlight passes through the air and warms the ground, which then warms the air 'just above' it, like a pot heated from the bottom.","ev":["b3.3","b3.4"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 1, the author says the myth \"gets the science <b>backward</b>.\" What does this word choice suggest?","o":["The myth claims the opposite of what is actually true.","The myth tells its events in reverse order from end to start.","The myth was written so long ago that it is hard to read.","The myth leaves out important details about how Icarus flew."],"k":0,"why":"Backward here means turned the wrong way around. The myth says higher means hotter, but paragraph 2 shows that higher actually means colder."},{"on":"b","t":"mc","skill":"point of view","q":"What is the author's attitude toward the myth of Icarus in paragraph 6?","o":["The author respects the myth's lesson even though its science is wrong.","The author thinks the myth should no longer be taught because it is wrong.","The author believes the ancient Greeks understood the atmosphere well.","The author finds the myth boring compared with modern science facts."],"k":0,"why":"Paragraph 6 says 'None of this ruins the myth' and explains that the Greeks were teaching about pride, not science. The author enjoys both the story and the facts."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the purpose of Text 2 different from the purpose of Text 1?","o":["Text 2 explains real science, while Text 1 tells a story that teaches a lesson.","Text 2 tells a story about Icarus, while Text 1 explains how the atmosphere works.","Text 2 persuades readers to fly, while Text 1 warns readers never to fly.","Text 2 describes Greek history, while Text 1 explains the life cycle of gulls."],"k":0,"why":"Text 1 is a myth about pride and ignoring advice. Text 2 uses facts like the lapse rate to explain what would really happen if someone flew higher."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 1, Daedalus warns that \"the heat of the sun will soften the wax.\" Based on Text 2, what would a scientist say about this warning?","o":["It is mistaken, because the air gets colder, not hotter, as you fly higher.","It is correct, because flying higher brings you much closer to the sun.","It is correct, because beeswax melts at a very low temperature.","It is mistaken, because the sea spray would soften the wax long before the sun could."],"k":0,"why":"Text 2, paragraph 2, explains that temperature drops about 6.5 degrees Celsius for every kilometer you climb, so higher air is colder, not hotter.","ev":["b2.4","b2.6"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Both texts describe what happens when someone flies too high. Explain how Text 1 and Text 2 each describe the danger of flying too high, and how their ideas are different. Use at least one detail from each text.","model":"Both texts warn about flying too high, but they disagree about what the danger is. In Text 1, Daedalus tells Icarus, \"If you go too high, the heat of the sun will soften the wax.\" When Icarus flies toward the sun, his feathers slip loose and he falls into the sea. Text 2 explains that this is backward. In the troposphere, the air gets about 6.5 degrees Celsius colder for every kilometer you climb, so Icarus would have frozen instead of melting. Text 1 uses the sun's heat to teach a lesson about pride and ignoring advice, while Text 2 uses facts to show what would really happen. Together, the texts show that a story can teach a true lesson even when its science is wrong.","need":["States a claim about how the texts describe the danger of flying high","Uses a detail from Text 1, such as Daedalus's warning about the wax","Uses a detail from Text 2, such as the 6.5 degrees per kilometer lapse rate","Explains how the two texts' ideas are different"]}},{"id":"s28-sciencefair","theme":"When Experiments Surprise Us","a":{"title":"Not Supported","genre":"Realistic fiction","topic":"Literature","gloss":{"hypothesis":["a guess that can be tested by an experiment","hipótesis"],"shriveled":["dried up, shrunken, and wrinkled","marchitos"],"irritation":["a feeling of being annoyed","irritación"],"reluctantly":["in a way that shows you don't really want to","de mala gana"],"sterilized":["cleaned so that no germs or living things remain","esterilizada"],"biologist":["a scientist who studies living things","bióloga"],"data":["facts and measurements collected to study something","datos"]},"paras":[["At seven o'clock on the morning of the science fair, Maya Torres and Jonah Park stood in front of their trifold poster and stared at four paper cups of dirt.","According to their hypothesis, printed in large purple letters across the top of the poster, the bean plants watered with sugar water should have been the tallest.","Instead, those cups held nothing but a few gray, shriveled stems.","The plants that had received plain tap water stood tall and green, as if they were mocking the whole project."],["\"This is a disaster,\" Jonah said.","He was the kind of person who color-coded his notebooks and never turned anything in late.","\"We have to take it down.","We'll tell Ms. Okafor we got sick.\"","Maya picked up one of the drooping stems and turned it in her fingers.","\"We didn't get sick,\" she said.","\"We got an answer.","It just isn't the one we wanted.\""],["Jonah groaned and sat down hard on a folding chair.","For three weeks the two of them had measured the plants every afternoon with a ruler, recorded the heights in a shared spreadsheet, and argued about everything from the font on the poster to the exact amount of sugar to stir into each cup.","Jonah had wanted a project that would definitely work.","Maya had wanted one that was interesting.","Sugar water had seemed like both: plants make sugar, so surely extra sugar would give them a boost."],["\"Judges don't give ribbons for dead beans,\" Jonah said.","\"Everyone else has a volcano that actually erupts or a battery made from lemons that actually lights up a bulb.","We have a cemetery.\"","A few tables away, a boy was testing his baking-soda volcano, and pink foam bubbled cheerfully over the sides.","Maya felt a hot flash of irritation, though she couldn't tell whether it was aimed at Jonah, at the volcano, or at herself.","\"So you'd rather lie than show what really happened?\" she snapped.","Jonah's ears turned red, and neither of them spoke for a long, uncomfortable minute."],["Finally, Maya pulled out her phone and opened the spreadsheet.","Row after row of numbers marched down the screen.","She scrolled through them slowly, and as she did, her frown changed into something more curious.","\"Look at this,\" she said.","\"The sugar plants weren't just smaller.","They started dying on day six, right after we noticed that white fuzz on the soil.","Remember?","You said it looked like mold.\"","Jonah leaned over reluctantly.","\"So the sugar fed the mold instead of the plants,\" he said slowly.","\"Maybe,\" said Maya.","\"We'd need another test to know for sure.","But that's a real pattern, Jonah.","That's data.\""],["They had forty minutes before the judges arrived.","Jonah, whose panic always turned into planning sooner or later, grabbed a marker.","They taped a sheet of paper over the word CONFIRMED on the poster and wrote NOT SUPPORTED in its place.","Then they added a new section titled \"What Surprised Us,\" with a photograph of the fuzzy soil and a short list of new questions.","Did the sugar feed mold or bacteria in the soil?","Would the results be different if the soil were sterilized first?","Would a smaller amount of sugar help or hurt?","By the time they finished, the poster looked messier than before, but somehow more honest."],["The first judge was a tall woman with reading glasses who introduced herself as a biologist from the local university.","She listened to their explanation without interrupting, and then she studied the photograph of the mold for a long time.","\"Most students here are telling me what they already knew,\" she said finally.","\"You two are telling me something you didn't know.","That is what scientists actually do every day.\"","She tapped the list of new questions.","\"Which one would you test next?\"","Maya and Jonah answered at exactly the same moment, with two different questions, and the judge laughed."],["They did not win first place.","That ribbon went to a girl who had built a water filter out of sand and charcoal, and even Jonah admitted she deserved it.","But a yellow card for \"Best Scientific Thinking\" was clipped to the corner of their poster by the end of the day."],["On the bus ride home, Jonah opened his notebook to a clean page and wrote a heading in perfect block letters: Experiment Two.","\"This time,\" he said, \"we sterilize the soil.\"","Maya grinned and handed him a purple marker.","\"And this time,\" she said, \"we don't write CONFIRMED until we're done.\""]]},"b":{"title":"How to Design a Fair Test","genre":"Informational","gloss":{"variables":["things that can change in an experiment","variables"],"independent variable":["the one thing a scientist changes on purpose","variable independiente"],"dependent variable":["the thing a scientist measures to see what changed","variable dependiente"],"deliberately":["on purpose","deliberadamente"],"constants":["things kept the same in an experiment","constantes"],"trials":["repeated tries of the same test","ensayos"],"reliable":["able to be trusted","confiable"]},"paras":[["Scientists ask questions about the world, and an experiment is a way to get a trustworthy answer.","But not every experiment can be trusted.","To produce results that mean something, an experiment must be a fair test."],["A fair test begins with variables, the factors that can change in an experiment.","The independent variable is the one factor the scientist deliberately changes.","The dependent variable is what the scientist measures to see whether that change made a difference.","For example, suppose you want to know whether the amount of sunlight affects how tall bean plants grow.","The amount of sunlight is your independent variable, and the height of the plants is your dependent variable."],["Everything else must stay the same.","These factors are called controlled variables, or constants.","In the bean experiment, every plant should get the same kind of seed, the same soil, the same size pot, and the same amount of water at the same time each day.","If one group of plants also got more water, you would have no way of knowing whether the sunlight or the water caused the difference.","Changing only one variable at a time is the heart of a fair test."],["Many experiments also include a control group.","This group does not receive the change being tested, so it gives you something to compare against.","If you are testing whether plant food helps beans grow, the control group gets no plant food at all."],["Next, a fair test needs repeated trials.","One plant might grow poorly simply because its seed was weak, which has nothing to do with sunlight.","Testing several plants in each group, or running the whole experiment more than once, helps make sure a result is not just luck.","Scientists often average the results of several trials to get a more reliable answer."],["Finally, a good scientist records results honestly, even when they are surprising.","A result that does not support the hypothesis is not a failure.","It tells the scientist that the original idea was wrong or incomplete, and it often points toward a better question.","Some important discoveries in history began with results that nobody expected.","In science, an unexpected result is still data, and data is how we learn."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"What is the story mostly about?","o":["Two friends learn that an experiment that didn't go as planned can still teach them something.","Two friends win first place at a science fair with an experiment about bean plants.","A student discovers that sugar water makes bean plants grow taller than tap water.","Two friends argue so much about their science fair project that they decide to stop working together."],"k":0,"why":"The story shows Maya and Jonah's failed experiment turning into a lesson when they find a real pattern in paragraph 5 and earn 'Best Scientific Thinking.' They don't win first place, and the sugar plants died."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: How does Jonah first react when he sees the failed experiment?","o":["He wants to hide the results instead of showing them.","He wants to start a brand-new experiment right away.","He blames Maya for choosing a project about bean plants.","He is curious about why the sugar plants died."],"k":0,"why":"In paragraph 2, Jonah says 'We have to take it down' and suggests telling Ms. Okafor they got sick, which means hiding what happened.","ev":["a2.3","a2.4"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"word choice","q":"In paragraph 1, the healthy plants stand tall \"as if they were <b>mocking</b> the whole project.\" What feeling does the word <b>mocking</b> create?","o":["that the failed experiment feels embarrassing to Maya and Jonah","that the healthy plants are about to dry up and die like the others","that the experiment worked better than Maya and Jonah hoped","that the plants are growing so fast it seems funny"],"k":0,"why":"To mock is to make fun of someone. The word makes it seem as though the plants are laughing at the students, which shows how embarrassed they feel."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 6, the students wonder whether the results would be different if the soil were <b>sterilized</b>. Based on the story, what does <b>sterilized</b> mean?","o":["cleaned so that no mold or germs live in it","mixed with extra sugar to feed the plants","dried out completely in the hot sun","packed down very tightly into the paper cups"],"k":0,"why":"In paragraph 5, the students suspect that mold in the soil killed the plants. Sterilizing the soil would remove the mold and germs so they could test that idea."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 5, Jonah leans over <b>reluctantly</b>. The suffix <i>-ant</i> in <b>reluctant</b> describes a person who feels a certain way, and <i>-ly</i> tells how something is done. What does <b>reluctantly</b> mean?","o":["in a way that shows he doesn't really want to","in a way that shows he is very excited","in a quick, careless, and messy way","in a quiet and sneaky way"],"k":0,"why":"Reluctant (with the suffix -ant) describes someone who doesn't want to do something, and -ly turns it into a 'how' word. Jonah is still upset, so he leans over without wanting to."},{"on":"a","t":"ebsr","skill":"theme","q":"Part A: Which sentence states a theme of the story?","o":["Honest results can be valuable even when they are not what you hoped for.","Winning a ribbon is the most important reason to do a science project.","It is always better to choose an easy project that is sure to work.","Good friends always agree about how to solve a problem."],"k":0,"why":"In paragraph 8, their honest poster about a surprising result earns them a card for 'Best Scientific Thinking,' even though the plants died.","ev":["a8.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ms","skill":"inference","q":"Which TWO details show that Maya and Jonah's feelings about the project change during the story? Choose TWO answers.","o":["Jonah writes \"Experiment Two\" in his notebook on the bus.","Maya's frown changes into something more curious as she reads the data.","Jonah color-codes his notebooks and never turns anything in late.","A boy nearby tests a volcano that bubbles over with pink foam.","The two friends argued about the font on the poster for weeks."],"ks":[0,1],"why":"Maya's frown turns curious in paragraph 5, and Jonah eagerly plans a new experiment in paragraph 9. Both show they now care about learning more instead of hiding the project."},{"on":"a","t":"mc","skill":"text structure","q":"How does paragraph 5 change the direction of the story?","o":["Maya finds a pattern in the data that turns the failure into a discovery.","Maya and Jonah decide to give up and tell their teacher they were sick.","The judge arrives and asks which question the students would test next.","Jonah explains to Maya why sugar water should have made the plants grow much taller."],"k":0,"why":"Before paragraph 5, the friends are upset and arguing. In paragraph 5, Maya notices the mold in the data, and after that they start fixing their poster and making plans."},{"on":"a","t":"ebsr","skill":"point of view","q":"Part A: What does the biologist believe about Maya and Jonah's project?","o":["Their surprising result shows real scientific thinking.","Their project should have used a volcano instead of plants.","Their experiment was a mistake that they should not repeat.","Their poster was too messy to be judged fairly."],"k":0,"why":"In paragraph 7, the judge says that telling 'something you didn't know' is 'what scientists actually do every day,' and she asks what they would test next.","ev":["a7.4","a7.5"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["A fair test changes one variable, keeps others the same, repeats trials, and records results honestly.","Bean plants need the same soil, pot, seed, and amount of water to grow well in any science experiment.","The independent variable is the factor that a scientist changes on purpose in an experiment.","Most important discoveries in history were made by accident instead of through careful tests."],"k":0,"why":"Text 2 explains each part of a fair test across paragraphs 2 through 6. The other choices are single details or claims the text does not make."},{"on":"b","t":"ebsr","skill":"key details","q":"Part A: According to Text 2, why should an experiment include repeated trials?","o":["to make sure a result is not just caused by luck","to give the scientist more chances to prove the hypothesis","to make the experiment last long enough to finish","to change a different variable during each new trial"],"k":0,"why":"Paragraph 5 explains that one plant might grow poorly because of a weak seed, so testing several plants 'helps make sure a result is not just luck.'","ev":["b5.3"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 3, the author calls changing only one variable \"the <b>heart</b> of a fair test.\" What does the word <b>heart</b> suggest?","o":["It is the most important part of a fair test.","It is the part of a fair test that feels emotional.","It is the last step a scientist does in a fair test.","It is the hardest part of a fair test to understand."],"k":0,"why":"Just as the heart is the center of the body, the author means this is the central, most important rule. Paragraph 3 explains that without it you cannot tell what caused a result."},{"on":"b","t":"mc","skill":"inference","q":"A student gives one group of bean plants more sunlight AND more water than the other group. Based on Text 2, what is wrong with this experiment?","o":["The student cannot tell which change caused any difference in growth.","The student forgot to measure the height of the plants each day.","The student should have used plants other than beans for the test.","The student gave the plants far too much water for any of them to survive."],"k":0,"why":"Paragraph 3 says that if one group got more water, 'you would have no way of knowing whether the sunlight or the water caused the difference.'"},{"on":"ab","t":"mc","skill":"compare texts","q":"Which idea appears in BOTH texts?","o":["An unexpected result is still useful data.","Volcano projects usually win at science fairs.","Sugar water helps bean plants grow taller.","Experiments should only be done one time."],"k":0,"why":"Maya says 'That's data' in Text 1, paragraph 5, and Text 2 ends by saying 'an unexpected result is still data.' The other ideas are not supported by either text."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 1, Maya and Jonah plan to sterilize the soil in Experiment Two. Based on Text 2, why is this a good plan?","o":["It removes a factor that might have changed their results.","It gives the plants extra food so that the sugar water will finally work this time.","It lets them change two variables at once to save time.","It guarantees that their hypothesis will be supported next time."],"k":0,"why":"Text 2 says everything except the one factor being tested should stay the same. Mold in the soil was an extra factor, so removing it makes the test fairer.","ev":["b3.5","b3.1"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Both texts show that an unexpected result can still be useful. Explain how Text 1 and Text 2 each show this idea. Use at least one detail from each text.","model":"Both texts show that an experiment that surprises you is not really a failure. In Text 1, Maya and Jonah's sugar-water plants die, and Jonah wants to hide the project. Then Maya finds that the plants started dying right after mold appeared, and she says, \"That's a real pattern, Jonah. That's data.\" Their honest poster earns a card for \"Best Scientific Thinking.\" Text 2 makes the same point in a more direct way. It says a result that does not support the hypothesis \"is not a failure\" because it \"often points toward a better question.\" Text 1 shows this idea through characters who learn it, while Text 2 explains it as a rule. Both texts teach that honest, surprising results help scientists learn.","need":["States a claim about how unexpected results can be useful","Uses a detail from Text 1, such as Maya finding the mold pattern","Uses a detail from Text 2, such as 'an unexpected result is still data'","Explains how each detail supports the claim"]}},{"id":"s29-tornado","theme":"Taming the Wind","a":{"title":"Dottie Mae and the Biggest Twister in Texas","genre":"Tall tale","topic":"Literature","gloss":{"lassoed":["caught with a rope that has a loop at the end","lazó"],"mustangs":["wild horses of the American West","mustangos"],"bronco":["a wild horse that has not been trained","potro salvaje"],"gentle":["to calm and train an animal (used here as a verb)","amansar"],"plumb":["completely (an old-fashioned word)","completamente"],"whirlwind":["a small, spinning column of wind","remolino"],"chaff":["the dry husks separated from grain","paja"],"guidance":["help and direction","orientación"]},"paras":[["Out on the flattest part of the Texas Panhandle, where the land is so level you can watch your dog run away for three days, there lived a girl named Dottie Mae Pickens.","Dottie Mae was born during a hailstorm, and folks say she caught the first hailstone in her fist and asked for a second one.","By the age of four she could rope a jackrabbit from a quarter mile off.","By age nine she had lassoed a runaway train, two shooting stars, and the moon, though she let the moon go again because her mama said it wasn't polite to keep things that belonged to everybody."],["Dottie Mae's rope was famous all by itself.","She had braided it from the tail hairs of a thousand wild mustangs, and it was so long that when she coiled it up, the pile was taller than the barn.","Her daddy liked to say that rope could reach clear to Oklahoma and still have enough left over to tie a bow."],["One sticky afternoon in May, when Dottie Mae was eleven, the sky over the Pickens ranch turned the color of a bad bruise.","The air went still and heavy, the chickens stopped clucking, and the cows lay down flat as pancakes.","Then, out of the southwest, a tornado came tearing across the prairie, the biggest anybody had ever seen.","It was so wide that it blocked out half of Texas and so loud that it made thunder sound like a kitten's sneeze.","It slurped up a whole pond, fish and frogs included, and sucked the spots right off a herd of spotted cattle.","Three counties over, people found the spots lying on the grass like scattered pennies."],["Everybody on the ranch ran for the storm cellar.","Everybody, that is, except Dottie Mae.","She stood on the porch, squinted at that whirling monster, and said, \"Well, it's just a mean old bronco with a bad attitude, and I never met a bronco I couldn't gentle.\""],["She swung her rope around her head once, twice, three times, until it whistled loud enough to make the coyotes cover their ears.","Then she let it fly.","The loop sailed up and up and settled right over the top of the tornado, as neat as a hat on a hatrack.","Dottie Mae dug her boot heels into the dirt and pulled."],["That twister bucked and howled.","It spun so fast that it dragged Dottie Mae right off the porch, across the yard, and up into the sky, and she rode it the way other folks ride a merry-go-round.","For six hours she hung on while it zigzagged over Texas, New Mexico, and a little corner of Colorado.","It tried to shake her loose by spinning clockwise, and when that didn't work, it spun counterclockwise, and when that didn't work, it tried to sit down on her.","But Dottie Mae just hollered \"Yee-haw!\" and held tighter."],["Finally, somewhere over a dry riverbed, the tornado ran plumb out of breath.","It wheezed and puffed and shrank down smaller and smaller, until it was no bigger than a dust devil and about as fierce as a spinning top.","Dottie Mae dropped lightly to the ground with the little whirlwind still wrapped in her rope.","She leaned close and spoke to it in a soft, steady voice, the same way she talked to nervous colts.","\"You're not bad,\" she told it.","\"You just don't know what to do with all that energy.\""],["Dottie Mae led that tamed tornado home, and she found it a job.","On washdays it spun the laundry dry in thirty seconds flat.","In the fall it blew the chaff off the wheat and stacked the hay in tidy rows.","On the hottest summer afternoons, the whole town gathered on the Pickens porch while the little twister turned slow circles, fanning everybody cool as a mountain creek.","Some folks claim that's the true reason the Panhandle has such steady wind today."],["People still ask Dottie Mae how she found the nerve to rope the biggest storm in history.","She always shrugs and says the same thing.","\"Anything wild looks scary until you understand it.","Then it's just something that needs a little guidance and a good, long rope.\""]]},"b":{"title":"Inside a Tornado","genre":"Informational","gloss":{"rotating":["spinning around a center","giratoria"],"supercell":["a large, long-lasting thunderstorm with a spinning updraft","supercélula"],"wind shear":["a change in wind speed or direction with height","cizalladura del viento"],"updraft":["a current of air moving upward","corriente ascendente"],"mesocyclone":["a large area of spinning air inside a thunderstorm","mesociclón"],"indicators":["signs used to measure or judge something","indicadores"],"foundations":["the solid bases that buildings are built on","cimientos"]},"paras":[["A tornado is a violently rotating column of air that stretches from a thunderstorm down to the ground.","Tornadoes can strike in many parts of the world, but the United States has more than any other country, with about 1,200 in a typical year.","They are most common in the spring and early summer, from about April through June."],["Most strong tornadoes are born from a special kind of thunderstorm called a supercell.","The process begins with wind shear, which means the wind changes speed or direction as you go higher in the sky.","When winds near the ground blow gently while winds higher up blow much faster, the air between them can begin to roll, like a pencil rolling between your palms.","If a powerful updraft, a current of rising air inside the storm, pushes up on that rolling air, it can tip the spinning tube on its end.","The result is a rotating updraft called a mesocyclone, which can be several miles wide.","In some mesocyclones, the spinning air narrows and tightens, much as a figure skater spins faster by pulling in her arms.","When a narrow, rapidly spinning column reaches all the way to the ground, it becomes a tornado.","Scientists still do not fully understand why some mesocyclones produce tornadoes while most do not."],["Because wind speeds inside a tornado are nearly impossible to measure directly, scientists rate tornadoes by the damage they leave behind.","In 1971, the scientist Tetsuya Theodore Fujita created the Fujita scale for this purpose.","In 2007, the National Weather Service replaced it with the Enhanced Fujita scale, or EF scale, which uses 28 types of damage indicators, such as homes, schools, and trees, to estimate wind speeds more accurately."],["The EF scale has six levels.","An EF0 tornado has estimated wind gusts of 65 to 85 miles per hour and might peel shingles off a roof or snap tree branches.","An EF5, the most powerful, has winds over 200 miles per hour and can sweep well-built houses completely off their foundations.","Most tornadoes are weak, but the rare violent ones cause most of the damage."],["Today, radar and trained storm spotters help forecasters issue warnings, often several minutes before a tornado strikes.","When a warning is announced, the safest place to be is in a basement or a small interior room on the lowest floor, away from windows."]]},"qs":[{"on":"a","t":"mc","skill":"main idea","q":"What is the tall tale mostly about?","o":["A fearless ranch girl ropes a giant tornado, tames it, and puts it to work.","A ranch girl braids a famous rope from the hairs of a thousand wild horses.","A family hides in a storm cellar while a tornado destroys their whole ranch.","A tornado sucks up a pond and carries fish and frogs across three counties."],"k":0,"why":"The main events are Dottie Mae roping the tornado in paragraph 5, riding it in paragraph 6, and taming it in paragraphs 7 and 8. The other choices are small details, or things that don't happen."},{"on":"a","t":"ms","skill":"word choice","q":"A tall tale uses hyperbole, or extreme exaggeration. Which TWO sentences from the story are examples of hyperbole? Choose TWO answers.","o":["\"It was so wide that it blocked out half of Texas.\"","\"The land is so level you can watch your dog run away for three days.\"","\"Everybody on the ranch ran for the storm cellar.\"","\"She leaned close and spoke to it in a soft, steady voice.\"","\"Dottie Mae dug her boot heels into the dirt and pulled.\""],"ks":[0,1],"why":"No tornado could block out half of Texas, and no land is so flat you could watch a dog run for three days. The other sentences describe things that could really happen."},{"on":"a","t":"ebsr","skill":"character","q":"Part A: In paragraph 4, what does Dottie Mae's reaction to the tornado reveal about her?","o":["She is bold and sees the storm as a challenge she can handle.","She is too frightened to move and cannot reach the cellar in time.","She is careless and does not notice the tornado coming toward her.","She is angry that her family left her alone on the porch."],"k":0,"why":"While everyone else runs for the cellar, Dottie Mae calls the tornado 'a mean old bronco' and says she never met one she 'couldn't gentle.' She is brave and confident.","ev":["a4.3"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 4, Dottie Mae says she never met a bronco she couldn't <b>gentle</b>. What does <b>gentle</b> mean in this sentence?","o":["to calm down and train","to treat kindly and softly","to ride very fast","to sell for money"],"k":0,"why":"Here gentle is used as a verb, as ranchers say it about wild horses. Dottie Mae means she can calm and train any wild horse, and she plans to do the same with the storm."},{"on":"a","t":"mc","skill":"vocabulary","q":"In paragraph 9, Dottie Mae says a wild thing needs \"a little <b>guidance</b>.\" The suffix <i>-ance</i> turns a verb into a noun. What does <b>guidance</b> mean?","o":["help and direction","a long, strong rope","a feeling of fear","a place to live"],"k":0,"why":"To guide is to lead or direct, and -ance makes it a noun, so guidance means help and direction. Dottie Mae guided the tornado toward useful jobs."},{"on":"a","t":"ebsr","skill":"word choice","q":"Part A: In paragraph 7, the tornado \"wheezed and puffed.\" What effect do these words have on how the reader sees the tornado?","o":["They make the tornado seem like a tired creature instead of a terrifying storm.","They make the tornado seem stronger and more dangerous than before.","They show that the tornado is getting ready to grow bigger again.","They explain how real tornadoes lose their energy over dry riverbeds."],"k":0,"why":"Wheezing and puffing are things a worn-out person or animal does. These words, along with 'about as fierce as a spinning top,' make the tornado seem weak and almost funny.","ev":["a7.2"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"ebsr","skill":"theme","q":"Part A: Which statement best expresses the theme of the tall tale?","o":["Wild things seem less scary once you take time to understand them.","Tornadoes are not actually dangerous if you have a long enough rope.","Children should always do the opposite of what adults tell them.","Strong wind is the most useful tool a ranch can ever have."],"k":0,"why":"In paragraph 9, Dottie Mae says, 'Anything wild looks scary until you understand it.' In paragraph 7, she also realizes the tornado is not bad; it just doesn't know what to do with its energy.","ev":["a9.3","a7.6"],"evq":"Part B: Click the sentence in Text 1 that best supports your answer to Part A."},{"on":"a","t":"mc","skill":"text structure","q":"Why does the author describe Dottie Mae's earlier adventures in paragraphs 1 and 2 before the tornado arrives?","o":["to show she is skilled enough with a rope for the reader to expect a big feat","to explain why the tornado chose to strike the Pickens ranch that day","to show that Dottie Mae is afraid of the weather after the hailstorm","to describe how ranches in Texas trained horses in the old days"],"k":0,"why":"Paragraphs 1 and 2 say she roped a train and the moon and has a rope that reaches to Oklahoma. These details build her up so that roping a tornado seems like the next big challenge."},{"on":"a","t":"mc","skill":"inference","q":"In paragraph 8, the author says some folks claim the tamed tornado is \"the true reason the Panhandle has such steady wind today.\" What does this detail show about tall tales?","o":["They often give a funny, made-up explanation for something real in nature.","They always include true scientific facts about the weather.","They are written mainly to warn people about dangerous storms.","They usually end with the hero leaving home for a new adventure."],"k":0,"why":"The Panhandle really is windy, but the story gives a silly, impossible reason for it. Tall tales often 'explain' real things with exaggerated stories."},{"on":"b","t":"mc","skill":"main idea","q":"Which statement best expresses the central idea of Text 2?","o":["Tornadoes form from spinning air in strong storms, and scientists rate them by the damage they cause.","The United States has more tornadoes than any other country, with about 1,200 in a typical year.","Tetsuya Theodore Fujita was a scientist who created a scale for rating tornadoes in 1971.","Tornadoes cannot be predicted, so people never have any warning before one strikes."],"k":0,"why":"Paragraph 2 explains how tornadoes form, and paragraphs 3 and 4 explain how they are rated. The last choice is wrong because paragraph 5 says warnings often come several minutes ahead."},{"on":"b","t":"ebsr","skill":"sequence","q":"Part A: According to paragraph 2, what happens right after an updraft pushes up on the rolling air?","o":["The spinning tube tips on its end and forms a rotating updraft.","The wind near the ground starts blowing much faster than before.","The tornado immediately touches the ground and begins to spin.","The thunderstorm breaks apart and the rolling air disappears."],"k":0,"why":"Paragraph 2 says the updraft 'can tip the spinning tube on its end,' and 'the result is a rotating updraft called a mesocyclone.' The tornado comes later, only if the air tightens and reaches the ground.","ev":["b2.4","b2.5"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."},{"on":"b","t":"mc","skill":"word choice","q":"In paragraph 2, the author compares spinning air to \"a figure skater spins faster by pulling in her arms.\" Why does the author use this comparison?","o":["to help readers picture how narrowing makes the air spin faster","to show that tornadoes look graceful and beautiful from far away","to explain why tornadoes are most common in the winter months","to suggest that skaters can feel when a tornado is approaching"],"k":0,"why":"Most readers have seen a skater pull in her arms and spin faster. The comparison makes a hard idea, a narrowing column of air speeding up, easier to picture."},{"on":"b","t":"mc","skill":"inference","q":"Based on paragraph 3, why do scientists rate tornadoes by their damage instead of by measuring wind speed?","o":["Tornado winds are almost impossible to measure directly.","Damage is more interesting to report on the news.","Wind speed does not affect how much damage a tornado causes.","Fujita's scale was too new for scientists to trust it."],"k":0,"why":"Paragraph 3 begins by saying that wind speeds inside a tornado 'are nearly impossible to measure directly,' so scientists study the damage instead."},{"on":"ab","t":"mc","skill":"compare texts","q":"How is the way Text 1 presents tornadoes different from the way Text 2 presents them?","o":["Text 1 makes a tornado a creature that can be tamed, while Text 2 shows it as a real danger.","Text 1 explains how tornadoes form, while Text 2 tells a funny story about one.","Text 1 rates the tornado on the EF scale, while Text 2 ignores the scale.","Text 1 warns readers to hide in a basement, while Text 2 tells them to watch."],"k":0,"why":"Text 1 treats the tornado like a wild horse that Dottie Mae can rope and train. Text 2 explains real tornadoes that can sweep houses off their foundations and tells people how to stay safe."},{"on":"ab","t":"ebsr","skill":"compare texts","q":"Part A: In Text 1, Dottie Mae stands outside on the porch as the tornado approaches. Based on Text 2, what would a real person need to do instead?","o":["Go to a basement or small inner room on the lowest floor.","Climb to the highest floor so the wind cannot reach them.","Open all the windows so the air pressure stays balanced.","Stand outside so that they can watch which way it moves."],"k":0,"why":"Text 2, paragraph 5, says the safest place is 'a basement or a small interior room on the lowest floor, away from windows.' Dottie Mae's choice only works in a tall tale.","ev":["b5.2"],"evq":"Part B: Click the sentence in Text 2 that best supports your answer to Part A."}],"write":{"prompt":"Text 1 is a tall tale and Text 2 is an informational text, but both are about tornadoes. Explain how each text shows the power of a tornado. Use at least one detail from each text.","model":"Both texts show that tornadoes are extremely powerful, but they show it in very different ways. Text 1 uses exaggeration to make the tornado's power funny. It says the tornado \"blocked out half of Texas\" and \"sucked the spots right off a herd of spotted cattle.\" No real storm could do that, but the hyperbole makes the tornado seem enormous. Text 2 uses facts instead. It explains that an EF5 tornado has winds over 200 miles per hour and \"can sweep well-built houses completely off their foundations.\" Text 1 makes readers laugh at the tornado's power, while Text 2 makes readers respect it. Together, they show that tornadoes are mighty, whether the story is made up or true.","need":["States a claim about how both texts show a tornado's power","Uses an example of hyperbole from Text 1","Uses a fact from Text 2, such as the EF scale wind speeds","Explains how the two texts show power in different ways"]}},{"id":"s30-ants","theme":"Working Together","a":{"title":"The Ant, the Grasshopper, and the Long Winter","genre":"Fable","topic":"Literature","gloss":{"antennae":["the two long feelers on an insect's head","antenas"],"extraordinary":["very unusual and amazing","extraordinaria"],"staggered":["walked unsteadily, almost falling","se tambaleó"],"trudged":["walked slowly and heavily, as if tired","caminó con pesadez"],"brittle":["dry and easy to break","quebradizo"],"sneered":["spoke in a mean, mocking way","dijo con desprecio"],"hoisted":["lifted up with effort","levantó"]},"paras":[["All summer long, the meadow belonged to two kinds of creatures: those who worked and those who sang.","Tessa the ant belonged to the first kind.","From the moment the sun warmed the anthill until the last pink light faded, she marched back and forth along the narrow trail, hauling seeds twice her size into the storerooms below.","Her legs ached, her antennae drooped, and still she marched, because every ant knew the rule: whatever you gather in summer is all you will have in
